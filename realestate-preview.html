    const Row = ({ k, v, tone, sub }) => <div className="row-l"><span style={{ color: K.sub }}>{k}{sub && <span style={{ display: "block", fontSize: 12 }}>{sub}</span>}</span><span className="v" style={{ color: tone || K.text }}>{v}</span></div>;

    /* ---------- the app ---------- */
    function App() {
      // this page keeps its own working copy; the first time it starts from what you entered on the current page
      const [boot] = useState(() => { const own = readJSON(CUR_KEY); if (own) return { inp: own, from: "own" }; const main = readJSON(MAIN_KEY); return main ? { inp: main, from: "main" } : { inp: null, from: "defaults" }; });
      const [inp, setInp] = useState(() => ({ ...mergeRE(boot.inp || {}), asOf: reAsOfOf(boot.inp) }));
      const [banner, setBanner] = useState(boot.from === "main" ? "main" : null);
      const [termsNote, setTermsNote] = useState(() => reTermsNotice(boot.inp));
      reSetAsOf(inp.asOf);
      const EXPL = useMemo(() => reExpl(inp), [inp]);
      useEffect(() => { const id = setTimeout(() => { try { localStorage.setItem(CUR_KEY, JSON.stringify(inp)); } catch (e) {} }, 400); return () => clearTimeout(id); }, [inp]);
      const [step, setStep] = useState(0);
      const [editIdx, setEditIdx] = useState(-1);      // the plan whose editor is open
      const [focus, setFocus] = useState(-1);          // the plan shown in detail; -1 = the recommended one
      const [landWithBuild, setLandWithBuild] = useState(false);
      const [printAll, setPrintAll] = useState(false);
      const [saved, setSaved] = useState(loadStore);
      const [loadedName, setLoadedName] = useState(null);
      const [snap, setSnap] = useState(() => JSON.stringify(inp));   // your inputs as last saved or loaded
      const [showScen, setShowScen] = useState(false);
      const [undo, setUndo] = useState(null);
      const [openDis, setOpenDis] = useState({});
      const [measure, setMeasure] = useState("econ");
      const [loanTxt, setLoanTxt] = useState("");
      const [loanMore, setLoanMore] = useState(false);
      const [whatIf, setWhatIf] = useState({});
      const toggleDis = (id, open) => setOpenDis((s) => s[id] === open ? s : { ...s, [id]: open });
      const dirty = useMemo(() => JSON.stringify(inp) !== snap, [inp, snap]);

      const set = (k, v) => setInp((s) => ({ ...s, [k]: v }));
      const setMany = (o) => setInp((s) => ({ ...s, ...o }));
      const setPlan = (i, k, v) => setInp((s) => ({ ...s, plans: s.plans.map((o, j) => j === i ? { ...o, [k]: v } : o) }));
      const setPlanMany = (i, o2) => setInp((s) => ({ ...s, plans: s.plans.map((o, j) => j === i ? { ...o, ...o2 } : o) }));
      const setOpt = (i, k, v) => setInp((s) => ({ ...s, options: s.options.map((o, j) => j === i ? { ...o, [k]: v } : o) }));
      const setLoans = (l, replaced) => setInp((s) => ({ ...s, existingLoans: l, plans: replaced ? s.plans.map((o) => ({ ...o, refiPick: null })) : s.plans }));
      // anything that replaces your work can be undone for 10 seconds
      const withUndo = (label, apply) => {
        const before = { inp, saved, loadedName, snap };
        apply();
        setUndo({ label, id: Date.now(), restore: () => { setInp(before.inp); setSaved(before.saved); saveStore(before.saved); setLoadedName(before.loadedName); setSnap(before.snap); } });
      };
      useEffect(() => { if (!undo) return; const t = setTimeout(() => setUndo(null), 10000); return () => clearTimeout(t); }, [undo]);

      const m = useMemo(() => computeRE(inp), [inp]);
      const econIrr = useMemo(() => m.results.map((r) => r && m.p.mode === "home" ? reEconIRR(r) : null), [m]);
      const home = inp.mode === "home", build = inp.acquire === "build";
      const { prj, household } = m;
      const liveIdx = m.results.map((r, i) => r ? i : -1).filter((i) => i >= 0);
      const bestF = m.bestFeasible, best = m.best, lead = bestF || best;
      const recIdx = lead ? m.results.indexOf(lead) : -1;
      const focusIdx = focus >= 0 && m.results[focus] ? focus : recIdx;
      const focusRes = focusIdx >= 0 ? m.results[focusIdx] : null;
      const renting = inp.rentNow > 0, baseLbl = renting ? "renting" : build ? "not building" : "not buying";
      const H = Math.round((home ? inp.horizon : inp.exitYear) * 12), endDate = fCal(H);
      const netRet = lead && home ? lead.netReturn : inp.altReturn;
      const curStart = Math.max(inp.buildStart, inp.landMonth);
      const planName = (i) => home ? `Plan ${i + 1}` : `Option ${i + 1}`;

      /* steps */
      const steps = home
        ? [["money", "Your money"], ["loans", "Your loans"], ["home", build ? "The home" : "The property"], ["pay", "How to pay"], ["when", "When"], ["answer", "Your answer"]]
        : [["property", "The property"], ["letting", "Letting & you"], ["rfin", "Financing"], ["rres", "Results"]];
      const stepI = Math.min(step, steps.length - 1), cur = steps[stepI][0];
      const stepIdx = (id) => steps.findIndex((s) => s[0] === id);
      const stepRow = useRef(null);
      const go = (i) => { const j = typeof i === "string" ? stepIdx(i) : i; if (j < 0) return; setStep(Math.max(0, Math.min(steps.length - 1, j))); window.scrollTo({ top: 0, behavior: "smooth" }); };
      useEffect(() => { const row = stepRow.current; const b = row && row.querySelector(".st.on"); if (b && b.scrollIntoView) b.scrollIntoView({ block: "nearest", inline: "center" }); }, [stepI]);

      /* optimizer (debounced; a slice of 48 mixes per tick): the planned start always, every start on "When" */
      const [optInp, setOptInp] = useState(inp);
      useEffect(() => { const id = setTimeout(() => setOptInp(inp), 350); return () => clearTimeout(id); }, [inp]);
      const [opt, setOptPlanned] = useState(null);
      const [optRows, setOptRows] = useState({ rows: [], done: false, total: 0 });
      const optStale = !opt || opt.src !== inp, startsStale = !optRows.done || optRows.src !== inp;
      const SLICE = 48;
      const runSlices = (inp0, d, planned, onDone, isCancelled) => {
        const n = optimizeRE(inp0, { delays: [d], slice: [0, 0], planned, landWithBuild }).combos, parts = [];
        let a = 0, id = null;
        const tick = () => {
          if (isCancelled()) return;
          parts.push(optimizeRE(inp0, { delays: [d], slice: [a, Math.min(n, a + SLICE)], planned, landWithBuild }).part); a += SLICE;
          if (a < n) { id = setTimeout(tick, 0); return; }
          onDone(optimizeRE(inp0, { merge: { delay: d, planned, parts }, landWithBuild }));
        };
        id = setTimeout(tick, 0);
        return () => clearTimeout(id);
      };
      useEffect(() => {
        if (optInp.mode !== "home") { setOptPlanned(null); return; }
        let cancelled = false;
        const stop = runSlices(optInp, Math.max(optInp.buildStart, optInp.landMonth), true, (r) => { if (!cancelled) setOptPlanned({ planned: r.start, combos: r.combos, src: optInp }); }, () => cancelled);
        return () => { cancelled = true; stop(); };
      }, [optInp, landWithBuild]);
      const wantStarts = home && cur === "when";
      useEffect(() => {
        if (!wantStarts || optInp.mode !== "home") return;
        const delays = []; for (let d = 0; d <= 60; d += 3) delays.push(d);
        const cs = Math.max(optInp.buildStart, optInp.landMonth); if (!delays.includes(cs)) { delays.push(cs); delays.sort((a, b) => a - b); }
        let cancelled = false, k = 0, stop = () => {}; const rows = [];
        setOptRows({ rows: [], done: false, total: delays.length, src: optInp });
        const next = () => {
          if (cancelled) return;
          const d = delays[k];
          stop = runSlices(optInp, d, d === cs && !landWithBuild, (r) => {
            if (cancelled) return;
            rows.push(r.start); k++;
            setOptRows({ rows: rows.slice(), done: k >= delays.length, total: delays.length, combos: r.combos, src: optInp });
            if (k < delays.length) next();
          }, () => cancelled);
        };
        next();
        return () => { cancelled = true; stop(); };
      }, [optInp, landWithBuild, wantStarts]);
      // the recommended plan at every start date (and the plan you look at, on "When")
      const sweepRec = useMemo(() => home && optInp.mode === "home" && recIdx >= 0 ? timingSweepRE(optInp, recIdx, 60, 3, landWithBuild) : null, [optInp, recIdx, home, landWithBuild]);
      const sweep = useMemo(() => home && optInp.mode === "home" && focusIdx >= 0 && focusIdx !== recIdx && cur === "when" ? timingSweepRE(optInp, focusIdx, 60, 3, landWithBuild) : null, [optInp, focusIdx, recIdx, home, landWithBuild, cur]) || sweepRec;
      const tornado = useMemo(() => focusIdx >= 0 && openDis.sens && optInp.mode === inp.mode ? tornadoRE(optInp, focusIdx) : [], [optInp, focusIdx, openDis.sens, inp.mode]);
      const startBest = sweepRec && sweepRec.best, startNow = startBest && startBest.delay <= curStart;
      // copy a mix into Plan 1 (and move the start if it was found for another date)
      const useOptPlan = (st, label) => withUndo(label || `Copied "${st.best.name}" into Plan 1`, () => {
        setInp((s0) => {
          const plans = s0.plans.map((o, j) => j === 0 ? { ...(st.best.cleanPlan || st.best.plan), enabled: true, name: st.best.name } : o);
          const q = { ...s0, plans };
          if (st.delay !== Math.max(s0.buildStart, s0.landMonth)) { q.buildStart = st.delay; q.landMonth = landWithBuild ? st.delay : Math.min(s0.landMonth, st.delay); }
          return q;
        });
        setFocus(0);
      });
      // what each old-loan option does to the plan you are editing (three runs of that plan)
      const settleFx = useMemo(() => {
        if (!home || optInp.mode !== "home" || editIdx < 0 || !optInp.plans[editIdx] || !optInp.plans[editIdx].enabled) return null;
        const q = mergeRE(optInp);
        return ["asNeeded", "forMax", "none"].map((pol) => ({ pol, r: reRunOne({ ...q, plans: q.plans.map((o, j) => j === editIdx ? { ...o, settlePolicy: pol } : o) }, editIdx).r }));
      }, [optInp, editIdx, home]);
      // what-if panels: computed when opened, cached until the inputs or the plan change (break-evens one at a time)
      useEffect(() => {
        if (!home || optInp.mode !== "home" || focusIdx < 0) return;
        const want = ["stress", "breakeven", "ready", "worth", "liquid"].filter((k) => openDis[k]);
        let cancelled = false; const timers = [];
        const fresh = (id) => { const c = whatIf[id]; return c && c.src === optInp && c.idx === focusIdx && !c.partial; };
        want.forEach((id0) => {
          const id = id0 === "liquid" ? "stress" : id0;
          if (fresh(id)) return;
          if (id === "breakeven") {
            const keys = ["rent", "appreciation", "return", "uplift"], acc = [];
            const next = (k) => {
              if (cancelled) return;
              acc.push(...(breakEvenRE(optInp, focusIdx, [keys[k]]) || []));
              const done = k + 1 >= keys.length;
              setWhatIf((s) => ({ ...s, breakeven: { src: optInp, idx: focusIdx, data: acc.slice(), partial: !done } }));
              if (!done) timers.push(setTimeout(() => next(k + 1), 0));
            };
            timers.push(setTimeout(() => next(0), 30));
          } else timers.push(setTimeout(() => { if (cancelled) return; const data = id === "stress" ? stressRE(optInp, focusIdx) : id === "ready" ? readyBreakEvenRE(optInp, focusIdx) : loanWorthRE(optInp, focusIdx); setWhatIf((s) => ({ ...s, [id]: { src: optInp, idx: focusIdx, data } })); }, 30));
        });
        return () => { cancelled = true; timers.forEach(clearTimeout); };
      }, [openDis, optInp, focusIdx, home]);
      const wi = (id) => { const c = whatIf[id]; return c && c.idx === focusIdx ? c : null; };
      // print: a one-pager of the answer, once it is drawn
      useEffect(() => { if (!printAll) return; const t = setTimeout(() => { window.print(); setPrintAll(false); }, 400); return () => clearTimeout(t); }, [printAll]);

      /* scenarios (shared with the current page) */
      const persist = (o) => { setSaved(o); saveStore(o); };
      const saveAs = (n) => { const k = (n || "").trim(); if (!k) return; persist({ ...saved, [k]: { inp, savedAt: new Date().toISOString() } }); setLoadedName(k); setSnap(JSON.stringify(inp)); };
      const quickSave = () => { const n = window.prompt("Save this scenario as (the same name replaces it)", loadedName || "My scenario"); if (n) saveAs(n); };
      const doLoad = (n) => {
        const s0 = saved[n]; if (!s0) return;
        if (dirty && !window.confirm(`Load "${n}"? The changes you have not saved here are replaced (you can undo for 10 seconds).`)) return;
        withUndo(`Loaded "${n}"`, () => { const q = { ...mergeRE(s0.inp), asOf: reAsOfOf(s0.inp, s0.savedAt) }; setTermsNote(reTermsNotice(s0.inp)); setInp(q); setLoadedName(n); setSnap(JSON.stringify(q)); setFocus(-1); setEditIdx(-1); });
      };
      const doDelete = (n) => { if (!window.confirm(`Delete the saved scenario "${n}"?`)) return; withUndo(`Deleted "${n}"`, () => { const o = { ...saved }; delete o[n]; persist(o); if (loadedName === n) setLoadedName(null); }); };
      const resetAll = () => { if (!window.confirm("Start again from the tool's defaults? Your inputs here are replaced (you can undo for 10 seconds).")) return; withUndo("Started from the defaults", () => { const q = { ...mergeRE({}), asOf: reAsOfOf(null) }; setInp(q); setLoadedName(null); setSnap(JSON.stringify(q)); setFocus(-1); setEditIdx(-1); }); };
      const doExport = () => { const blob = new Blob([JSON.stringify({ scenarios: saved, current: inp }, null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "realestate-scenarios.json"; a.click(); };
      const doImport = (e) => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const j = JSON.parse(rd.result); const add = j.scenarios || (j.inp ? { [f.name]: j } : { [f.name]: { inp: j } }); withUndo(`Imported ${Object.keys(add).length} scenario(s)`, () => persist({ ...saved, ...add })); } catch (err) { alert("Could not read that file."); } }; rd.readAsText(f); e.target.value = ""; };
      const savedRows = useMemo(() => Object.entries(saved).map(([n, s]) => { try { const r = computeRE(s.inp); const b = r.bestFeasible || r.best; return { n, at: s.savedAt, home: r.p.mode === "home", total: r.prj.total, metric: b ? (r.p.mode === "home" ? b.econAdv : (b.irr == null ? null : b.irr * 100)) : null, verdict: r.verdict, vColor: r.vColor }; } catch (e) { return { n, at: s.savedAt, error: true }; } }), [saved]);

      /* ---------- small derived things ---------- */
      const tWhen = (w, mo) => w === "start" ? 0 : w === "land" ? prj.landMonth : w === "build" ? prj.start : w === "completion" ? prj.occupy : Math.max(0, Math.round(mo || 0));
      const loanEnds = (l) => l.settleAt != null && l.settleAt > 0 ? Math.min(Math.round(l.settleAt), Math.round(l.monthsLeft)) : Math.round(l.monthsLeft);
      const rateOf = (l) => `${l.rate}%${l.rateType === "flat" ? " flat" : ""}`;
      const sameResult = (a, b) => !!a && !!b && Math.abs(a.econAdv - b.econAdv) < 1 && ["lm", "eq", "pl", "co", "pl2"].every((k) => Math.abs((a[k] ? a[k].amount : 0) - (b[k] ? b[k].amount : 0)) < 1);
      const occOf = (r) => Math.min(r.months.length - 1, r.occupy);
      const cashAtMoveIn = (r) => fundingBridgeRows(r, occOf(r), inp, prj).total;

      /* ---------- left rail: your inputs at a glance ---------- */
      const InputsSummary = () => home ? (
        <>
          <RailGroup title="You" onEdit={() => go("money")}>
            <Row k="Income" v={`${fSAR(inp.income)}/mo`} />
            <Row k="Living costs" v={`${fSAR(inp.livingExpenses)}/mo`} />
            {inp.rentNow > 0 && <Row k="Rent today" v={`${fSAR(inp.rentNow)}/mo`} />}
            <Row k="Cash today" v={fM(inp.cashAvailable)} />
            <Row k="Safety cushion" v={fM(inp.cashBuffer)} />
            {inp.ownedValue > 0 && <Row k="Property you own" v={fM(inp.ownedValue)} sub={!renting && inp.ownHomePlan !== "keep" ? (inp.ownHomePlan === "let" ? `let at ${inp.ownHomeYield}% from move-in` : "sold at move-in") : null} />}
          </RailGroup>
          <RailGroup title={`Existing loans · ${household.existingDbr.toFixed(0)}% of income`} onEdit={() => go("loans")}>
            {inp.existingLoans.filter((l) => l.balance > 0).length === 0 ? <div style={{ fontSize: 12.5, color: K.sub }}>none</div> : inp.existingLoans.filter((l) => l.balance > 0).map((l, k) => (
              <div key={l.id || k} style={{ fontSize: 12.5, padding: "3px 0" }}><b>{l.name}</b> <span style={{ color: K.sub }}>({rateOf(l)})</span><div className="mono" style={{ fontSize: 12, color: K.sub }}>{fSAR(l.installment)}/mo · {fM(l.balance)} left · ends {fCal(loanEnds(l))}</div></div>
            ))}
          </RailGroup>
          <RailGroup title={build ? "The home" : "The property"} onEdit={() => go("home")}>
            {build ? <>
              <Row k={`Land ${inp.landArea} m² · ${fCal(prj.landMonth)}`} v={fM(prj.land)} />
              <Row k={`Build ${Math.round(prj.builtArea)} m² · ${prj.bm} mo`} v={fM(prj.hard)} />
            </> : <Row k={`Price · ${fCal(prj.landMonth)}`} v={fM(prj.price)} />}
            <Row k="All-in cost" v={fM(prj.total)} />
            <Row k="Value at move-in" v={fM(prj.value0)} />
            <Row k="Move in" v={fCal(prj.occupy)} />
          </RailGroup>
          <RailGroup title="Assumptions" onEdit={() => go("home")}>
            <Row k="Cash earns" v={`${(+netRet.toFixed(2))}%/yr`} sub={(inp.cashZakatPct || 0) > 0 ? `${inp.altReturn}% less ${inp.cashZakatPct}% zakat` : null} />
            <Row k="Home value grows" v={`${inp.appreciation}%/yr`} />
            <Row k="Compare until" v={endDate} />
            <Row k="Bank limit" v={`${inp.dbrCap}% of income`} />
          </RailGroup>
          <RailGroup title="Bank terms" onEdit={() => go("pay")}>
            {[["Land mortgage", "lmRate", "lmTenure"], ["Own-property mortgage", "eqRate", "eqTenure"], ["Personal loans", "plRate", "plTenure"], ["Cash-out", "coRate", "coTenure"]].filter(([, rk]) => rk !== "eqRate" || inp.ownedValue > 0).map(([l, rk, tk]) => <Row key={rk} k={l} v={`${inp[rk]}%${inp.rateQuote === "flat" ? " flat" : ""} · ${inp[tk]}y`} />)}
          </RailGroup>
        </>
      ) : (
        <>
          <RailGroup title="The property" onEdit={() => go("property")}><Row k="All-in cost" v={fM(prj.total)} /><Row k="Rent" v={`${fSAR(inp.rentMo)}/mo`} /><Row k="Sell in" v={fCal(H)} /></RailGroup>
          <RailGroup title="You" onEdit={() => go("letting")}><Row k="Income" v={`${fSAR(inp.income)}/mo`} /><Row k="Cash to commit" v={fM(inp.cashAvailable)} /></RailGroup>
        </>
      );
      const InputsRail = () => <div className="box" style={{ padding: "12px 16px" }}><div className="eyebrow" style={{ marginBottom: 2 }}>Your inputs</div>{InputsSummary()}</div>;

      /* ---------- right rail: what the bank will lend you, and your plans ---------- */
      const capRows = household.capTimeline.slice(0, 5);
      const capWhy = (c) => {
        if (c.t === 0) return "Today";
        const ended = inp.existingLoans.filter((l) => l.balance > 0 && loanEnds(l) === c.t).map((l) => l.name);
        return `From ${fCal(c.t)}${ended.length ? ` (${ended.join(" + ")} ${ended.length > 1 ? "end" : "ends"})` : (inp.incomeGrowth || 0) > 0 ? " (income steps up)" : ""}`;
      };
      const BankRail = () => {
        const used = household.existingInst, cap = inp.income * inp.dbrCap / 100;
        return (
          <div className="box" style={{ padding: "14px 16px" }}>
            <div className="eyebrow">What the bank will lend you<Hint text={EXPL.capacity} label="What the bank will lend you" /></div>
            <div style={{ fontSize: 12.5, color: K.sub, margin: "6px 0 8px", lineHeight: 1.45 }}>All instalments together may use {inp.dbrCap}% of your income: <b className="mono" style={{ color: K.text }}>{fSAR(cap)}/mo</b>.</div>
            <div style={{ height: 12, borderRadius: 6, background: "#E6EFEA", overflow: "hidden", border: `1px solid ${K.line}` }}><div style={{ width: `${Math.min(100, used / Math.max(1, cap) * 100)}%`, height: "100%", background: "#8C877D" }} /></div>
            <div style={{ fontSize: 12, color: K.sub, margin: "4px 0 8px" }}>today: old loans {fSAR(used)}/mo · free {fSAR(Math.max(0, cap - used))}/mo</div>
            {capRows.map((c) => (
              <div key={c.t} style={{ fontSize: 12.5, padding: "7px 0", borderTop: `1px solid ${K.line}`, lineHeight: 1.45 }}>
                <b>{capWhy(c)}</b>: free <span className="mono">{fSAR(c.room)}/mo</span> → a mortgage up to <b className="mono">{fM(c.maxMortgage)}</b>{c.maxOnePl > 0 ? <> or a personal loan up to <b className="mono">{fM(c.maxOnePl)}</b></> : null}
              </div>
            ))}
            {inp.existingLoans.filter((l) => l.balance > 0 && l.installment > 0).length > 0 && <div style={{ fontSize: 12, color: K.sub, borderTop: `1px solid ${K.line}`, paddingTop: 7, lineHeight: 1.45 }}>Paying off {inp.existingLoans.filter((l) => l.balance > 0 && l.installment > 0).map((l) => `${l.name} frees ${fSAR(l.installment)}/mo`).join("; ")}.</div>}
          </div>
        );
      };
      const PlansRail = () => !home ? (
        <div className="box" style={{ padding: "14px 16px" }}>
          <div className="eyebrow" style={{ marginBottom: 8 }}>Your options</div>
          {liveIdx.length === 0 ? <div style={{ fontSize: 13, color: K.sub }}>Tick at least one option in "Financing".</div> : liveIdx.map((i) => { const r = m.results[i], ok = r.affordable && r.cashOk && r.ltvOk; return (
            <div key={i} className="row-l"><span style={{ color: PLAN_TEXT[i], fontWeight: 700 }}>{planName(i)}{r === lead ? " ★" : ""}{!ok && <span style={{ color: K.neg, fontWeight: 400 }}> · doesn't fit</span>}</span><span className="v">{pct1(r.irr == null ? null : r.irr * 100)} return</span></div>); })}
          {lead && <div style={{ fontSize: 12.5, marginTop: 10, background: SOFT, borderRadius: 7, padding: "8px 10px" }}><b>Verdict:</b> <span style={{ color: m.vColor, fontWeight: 700 }}>{m.verdict}</span></div>}
        </div>
      ) : (
        <div className="box" style={{ padding: "14px 16px" }}>
          <div className="eyebrow" style={{ marginBottom: 8 }}>Your plans</div>
          {liveIdx.length === 0 ? <div style={{ fontSize: 13, color: K.sub }}>Tick at least one plan in "How to pay".</div> : (
            <table className="tbl" style={{ fontSize: 12 }}>
              <thead><tr><th style={{ background: "transparent", color: K.sub, padding: "4px 4px 4px 0" }}>Plan</th><th style={{ background: "transparent", color: K.sub, padding: 4 }}>At move-in</th><th style={{ background: "transparent", color: K.sub, padding: "4px 0 4px 4px" }}>vs {baseLbl}</th></tr></thead>
              <tbody>{liveIdx.map((i) => { const r = m.results[i]; return (
                <tr key={i} style={{ cursor: "pointer" }} onClick={() => { setFocus(i); }}>
                  <td className="l" style={{ padding: "6px 4px 6px 0", color: PLAN_TEXT[i], fontWeight: 700 }}>{planName(i)}{r === lead ? " ★" : ""}{!r.feasible && <span style={{ color: K.neg, fontWeight: 400 }}> · runs out</span>}</td>
                  <td style={{ padding: 4 }}>{fM(cashAtMoveIn(r))}</td>
                  <td style={{ padding: "4px 0 4px 4px", color: signCol(r.econAdv), fontWeight: 700 }}>{fM(r.econAdv)}</td>
                </tr>); })}</tbody>
            </table>
          )}
          {lead && <div style={{ fontSize: 12.5, marginTop: 10, background: lead.econAdv >= 0 ? SOFT_POS : SOFT_NEG, borderRadius: 7, padding: "8px 10px", lineHeight: 1.45 }}><b>So far:</b> {bestF ? <>best of your plans is {planName(recIdx)}, <b style={{ color: signCol(lead.econAdv) }}>{fM(lead.econAdv)}</b> vs {baseLbl} in {endDate} when everything grows.</> : "none of your plans works every month."}</div>}
          <div style={{ fontSize: 12, color: K.sub, marginTop: 6 }}>"At move-in": your own cash and the loans, after every cost, without salary or growth.</div>
          {cur === "answer" && <div className="grid no-print" style={{ gap: 8, marginTop: 12 }}>
            <button className="btn gold" onClick={quickSave}>{loadedName ? (dirty ? `Save changes to "${loadedName}"` : `Saved as "${loadedName}"`) : "Save this scenario"}</button>
            <button className="btn" onClick={() => setPrintAll(true)}>Print / PDF (one page)</button>
            <button className="btn" onClick={() => go("pay")}>Change an answer</button>
          </div>}
        </div>
      );

      /* ---------- step pieces ---------- */
      const Head = ({ id, title, sub }) => (
        <div style={{ marginBottom: 14 }}>
          <div className="eyebrow">Step {stepIdx(id) + 1} of {steps.length}</div>
          <h1 className="h1">{title}</h1>
          {sub && <p className="lead">{sub}</p>}
        </div>
      );
      const twoCol = { gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 300px), 1fr))", gap: 14 };
      const ownedAt = (t) => inp.ownedValue * Math.pow(1 + inp.appreciation / 100, t / 12);
      const lettingOut = (inp.rentOutFixed || 0) > 0 || (inp.rentOutPct || 0) > 0;

      /* ---------- step 1: your money ---------- */
      const StepMoney = () => (
        <div>
          <Head id="money" title="What do you earn, spend and have?" sub={`Your salary pays your living costs and every instalment; the bank tests all instalments together against ${inp.dbrCap}% of your income. Your cash pays whatever the loans don't.`} />
          <div className="grid" style={twoCol}>
            <Box title="Each month">
              <Field label="Income the bank recognises" value={inp.income} min={5000} max={250000} step={1000} unit="SAR/mo" onChange={(v) => set("income", v)} />
              <Field label="Living costs (not rent or loans)" value={inp.livingExpenses} min={2000} max={100000} step={500} unit="SAR/mo" onChange={(v) => set("livingExpenses", v)} />
              <Field label="Rent you pay today" value={inp.rentNow} min={0} max={40000} step={500} unit="SAR/mo" onChange={(v) => set("rentNow", v)} hint={inp.rentNow > 0 ? "paid until you move in; you are compared with renting on" : "0 = you live in a home you own; you are compared with not building"} />
              <div className="note" style={{ marginTop: 0 }}>Left each month today: <b className="mono" style={{ color: household.savings >= 0 ? K.text : K.neg }}>{fSARm(household.savings)}</b> after living costs, rent and your loans.<Hint text={EXPL.savings} /></div>
            </Box>
            <Box title="What you have">
              <Field label="Cash today" value={inp.cashAvailable} min={0} max={8000000} step={50000} unit="SAR" onChange={(v) => set("cashAvailable", v)} />
              <Field label="Safety cushion to keep" value={inp.cashBuffer} min={0} max={1500000} step={25000} unit="SAR" onChange={(v) => set("cashBuffer", v)} hint="a plan that dips below it is flagged; one that goes below zero does not work" help={EXPL.recovery} />
              <Field label="Property you already own — its value" value={inp.ownedValue} min={0} max={15000000} step={100000} unit="SAR" onChange={(v) => set("ownedValue", v)} hint={inp.ownedValue > 0 ? `a bank would lend up to ${fM(inp.ownedValue * inp.ownedLtv / 100)} against it (${inp.ownedLtv}%)` : "0 if none"} />
            </Box>
          </div>
          {!renting && inp.ownedValue > 0 && <Box title="The home you live in today — once you move" style={{ marginTop: 14 }} help="You live in a home you own today. When you move into the new one you can keep it, let it, or sell it. Letting: the rent (net of its own costs) arrives every month from the month after move-in and rises with its value. Selling: it is sold at move-in; the price less selling costs, after repaying any mortgage a plan took on it, goes into your cash — and because the not-building side still owns it, its value is taken off your side in both measures.">
            {lettingOut ? <div className="note" style={{ marginTop: 0 }}>Not used while the new home is let out — you would stay where you are.</div> : <>
              <Seg label="The home you live in today" value={inp.ownHomePlan || "keep"} onChange={(v) => set("ownHomePlan", v)} options={[["keep", "Keep it"], ["let", "Let it"], ["sell", "Sell it"]]} />
              <div style={{ marginTop: 12 }}>
                {(inp.ownHomePlan || "keep") === "keep" && <div className="note" style={{ marginTop: 0 }}>Nothing changes: you own it whether you build or not, so it doesn't move the comparison.</div>}
                {inp.ownHomePlan === "let" && <Field label="Rent you would get, net of its costs" value={inp.ownHomeYield} min={0} max={8} step={0.25} unit="% of its value a year" onChange={(v) => set("ownHomeYield", v)} hint={`≈ ${fSAR(ownedAt(prj.occupy) * inp.ownHomeYield / 100)} a year from ${fCal(prj.occupy + 1)} (it would be worth ${fM(ownedAt(prj.occupy))} then), rising with its value`} />}
                {inp.ownHomePlan === "sell" && <Field label="Selling costs" value={inp.ownHomeSellCostPct} min={0} max={10} step={0.5} unit="% of its value" onChange={(v) => set("ownHomeSellCostPct", v)} hint={`sold at move-in (${fCal(prj.occupy)}) for about ${fM(ownedAt(prj.occupy))}, less ${fM(ownedAt(prj.occupy) * inp.ownHomeSellCostPct / 100)}; broker 2.5%, add 5% if you pay the transfer tax. A mortgage a plan took on it is repaid from the sale.`} />}
              </div>
            </>}
          </Box>}
          <More title="More: growth of income and living costs, your recovery rule, dates">
            <div className="grid" style={twoCol}>
              <div>
                <Field label="Income growth" value={inp.incomeGrowth || 0} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("incomeGrowth", v)} hint={(inp.incomeGrowth || 0) > 0 ? `steps up once a year (${fSAR(inp.income * (1 + inp.incomeGrowth / 100))}/mo from ${fCal(13)}); the bank's limits follow your income` : "0 = your income stays as it is"} />
                <Field label="Living-cost growth" value={inp.livingGrowth || 0} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("livingGrowth", v)} hint="once a year, the same whether you build or not" />
              </div>
              <div>
                <Field label="Cash back at your cushion within" value={inp.recoveryMonths} min={0} max={60} step={6} unit="months after move-in" onChange={(v) => set("recoveryMonths", v)} hint="your rule: a plan that takes longer is marked slow to recover" />
                <div style={{ marginBottom: 12 }}>
                  <label className="lbl" style={{ display: "block", marginBottom: 4 }}>Month 0 of this scenario</label>
                  <input type="month" value={inp.asOf || ""} onChange={(e) => e.target.value && set("asOf", e.target.value)} />
                  <div className="note" style={{ marginTop: 3 }}>Every date counts from here. A saved scenario keeps its own month 0; changing it moves the dates only — bring your cash and loans up to date too.</div>
                </div>
              </div>
            </div>
          </More>
        </div>
      );

      /* ---------- step 2: your loans ---------- */
      const StepLoans = () => {
        const loans = inp.existingLoans;
        const upd = (i, k, v) => setLoans(loans.map((l, j) => j === i ? { ...l, [k]: v } : l));
        const inst = loans.reduce((a, l) => a + (l.balance > 0 ? +l.installment || 0 : 0), 0), bal = loans.reduce((a, l) => a + (+l.balance || 0), 0);
        const parsed = loanTxt.trim() ? parseLoans(loanTxt) : [];
        return (
          <div>
            <Head id="loans" title="What do you already owe?" sub={`The bank counts these instalments first; what is left of your ${inp.dbrCap}% limit decides how much it can lend. Paying one off, or the bank buying it out in a refinance, frees room.`} />
            <Box title={`Your loans · ${fSAR(inst)}/mo · ${inp.income > 0 ? (inst / inp.income * 100).toFixed(0) : 0}% of income`} right={<button className="lnk no-print" onClick={() => setLoanMore(!loanMore)}>{loanMore ? "Fewer columns" : "More: age, settle date, permissions"}</button>}>
              <div className="scroll-x">
                <table className="tbl">
                  <thead><tr><th>Loan</th><th>Balance</th><th>Monthly</th><th>Months left</th><th>Rate</th>{loanMore && <><th>Months since it started</th><th>Settle in month</th><th>May be paid off from cash?</th><th>May be refinanced?</th></>}<th className="no-print" style={{ width: 36 }}></th></tr></thead>
                  <tbody>
                    {loans.map((l, i) => (
                      <tr key={l.id || i}>
                        <td className="l"><input type="text" aria-label="Loan name" value={l.name} onChange={(e) => upd(i, "name", e.target.value)} style={{ width: "100%", minWidth: 120 }} /></td>
                        <td><NumIn v={l.balance} on={(v) => upd(i, "balance", v)} w={108} label={`${l.name}: balance`} /></td>
                        <td><NumIn v={l.installment} on={(v) => upd(i, "installment", v)} w={86} label={`${l.name}: monthly instalment`} /></td>
                        <td><NumIn v={l.monthsLeft} on={(v) => upd(i, "monthsLeft", Math.round(v))} w={56} label={`${l.name}: months left`} /><div style={{ fontSize: 12, color: K.sub }}>ends {fCal(loanEnds(l))}</div></td>
                        <td>
                          <span className="flex items-center" style={{ gap: 4, justifyContent: "flex-end" }}><NumIn v={l.rate} on={(v) => upd(i, "rate", v)} w={56} dec label={`${l.name}: rate`} /><select aria-label={`${l.name}: rate type`} value={l.rateType === "flat" ? "flat" : "apr"} onChange={(e) => upd(i, "rateType", e.target.value)} style={{ minHeight: 30, padding: "3px 4px", fontSize: 12 }}><option value="apr">APR</option><option value="flat">flat</option></select></span>
                          {l.rateType === "flat" && <div style={{ fontSize: 12, color: K.sub }}>≈ {reFlatToApr(l.rate, Math.max(1, Math.round((l.ageMonths || 0) + (l.monthsLeft || 0)))).toFixed(2)}% APR</div>}
                        </td>
                        {loanMore && <>
                          <td><NumIn v={l.ageMonths} nullable on={(v) => upd(i, "ageMonths", v == null ? null : Math.round(v))} w={56} placeholder="—" label={`${l.name}: months since it started`} /></td>
                          <td><NumIn v={l.settleAt} nullable on={(v) => upd(i, "settleAt", v == null ? null : Math.round(v))} w={56} placeholder="—" label={`${l.name}: settle in month`} />{l.settleAt != null && l.settleAt > 0 && <div style={{ fontSize: 12, color: K.sub }}>{fCal(l.settleAt)}</div>}</td>
                          <td><input type="checkbox" aria-label={`${l.name}: may be paid off from cash`} checked={l.canSettle !== false} onChange={(e) => upd(i, "canSettle", e.target.checked)} /></td>
                          <td><input type="checkbox" aria-label={`${l.name}: may be refinanced`} checked={l.canRefi !== false} onChange={(e) => upd(i, "canRefi", e.target.checked)} /></td>
                        </>}
                        <td className="no-print"><button aria-label={`Remove ${l.name}`} title="Remove" onClick={() => withUndo(`Removed ${l.name}`, () => setLoans(loans.filter((_, j) => j !== i)))} style={{ ...iconBtn, padding: 6 }}><Trash2 size={16} color={K.neg} /></button></td>
                      </tr>
                    ))}
                    <tr style={{ background: SOFT, fontWeight: 700 }}><td className="l">Total ({loans.length})</td><td>{fSAR(bal)}</td><td>{fSAR(inst)}</td><td></td><td></td>{loanMore && <><td></td><td></td><td></td><td></td></>}<td className="no-print"></td></tr>
                  </tbody>
                </table>
              </div>
              <div className="flex flex-wrap no-print" style={{ gap: 8, marginTop: 10 }}>
                <button className="btn small" onClick={() => setLoans([...loans, { id: Date.now(), name: `Loan ${loans.length + 1}`, balance: 100000, installment: 2500, monthsLeft: 48, rate: 6 }])}>+ Add a loan</button>
                {loans.length > 0 && <button className="btn small" onClick={() => withUndo("Removed all loans", () => setLoans([], true))}>Remove all</button>}
              </div>
              {household.warnings.length > 0 && <div style={{ background: SOFT_AMB, borderRadius: 8, padding: "8px 12px", marginTop: 10, fontSize: 12.5, lineHeight: 1.5 }}>{household.warnings.map((w, k) => <div key={k} className="flex items-start" style={{ gap: 6 }}><AlertTriangle size={14} color={K.brassTx} style={{ flex: "none", marginTop: 3 }} /><span>{w}</span></div>)}</div>}
              <div className="note">"May be paid off from cash" unticked: no plan pays it off early (keep cheap debt). "May be refinanced" unticked: no bank buy-out includes it. "Settle in month": you clear it from your cash then — whether you build or not. A personal loan can be refinanced once it is {inp.refiMinMonths} months old. A flat rate is converted to the APR it amortises at, over its whole term (months since it started + months left).</div>
              <More title="Import or paste loans (Qist export, or one per line: name, balance, instalment, months, rate)">
                <textarea rows={4} value={loanTxt} onChange={(e) => setLoanTxt(e.target.value)} placeholder={'[{"name":"Personal loan","balance":350000,"installment":7900,"monthsLeft":54,"rate":6.5}]\nor\nCar finance; 95000; 2950; 36; 5'} aria-label="Loans to import" />
                {parsed.length > 0 ? <div style={{ marginTop: 8 }}>
                  <div style={{ fontSize: 12.5, marginBottom: 4 }}>Found {parsed.length} loan{parsed.length > 1 ? "s" : ""}:</div>
                  {parsed.map((l, k) => <div key={k} className="mono" style={{ fontSize: 12 }}>{l.name} · {fSAR(l.balance)} · {fSAR(l.installment)}/mo · {l.monthsLeft} months · {l.rate}%</div>)}
                  <div className="flex flex-wrap" style={{ gap: 8, marginTop: 8 }}>
                    <button className="btn gold small" onClick={() => withUndo(`Replaced your loans with ${parsed.length} imported`, () => { setLoans(parsed, true); setLoanTxt(""); })}>Replace my loans with these</button>
                    <button className="btn small" onClick={() => { setLoans([...loans, ...parsed]); setLoanTxt(""); }}>Add them to my loans</button>
                  </div>
                </div> : loanTxt.trim() ? <div className="note" style={{ color: K.neg }}>Nothing recognisable yet — check the format (separate columns with tabs or semicolons if your numbers contain commas).</div> : null}
              </More>
            </Box>
            <Box title="When borrowing room opens up" style={{ marginTop: 14 }} help={EXPL.capacity}>
              <div className="scroll-x"><table className="tbl">
                <thead><tr>{["From", ...((inp.incomeGrowth || 0) > 0 ? ["Income"] : []), "Instalments running", `Free room in your ${inp.dbrCap}%`, `All mortgages (≤ ${inp.mortgageCap}%)`, `One personal loan (≤ ${inp.perLoanCap}%)`, "Two personal loans"].map((h) => <th key={h}>{h}</th>)}</tr></thead>
                <tbody>{household.capTimeline.map((c) => <tr key={c.t}><td className="l">{capWhy(c)}</td>{(inp.incomeGrowth || 0) > 0 && <td>{fSAR(c.income)}</td>}<td>{fSAR(c.inst)} <span style={{ color: K.sub }}>({(c.inst / c.income * 100).toFixed(0)}%)</span></td><td style={{ color: c.room > 0 ? K.text : K.neg }}>{fSAR(c.room)}/mo</td><td>{fM(c.maxMortgage)}</td><td>{fM(c.maxOnePl)}</td><td>{fM(c.maxTwoPl)}</td></tr>)}</tbody>
              </table></div>
              <div className="note">What the free room converts to at your Bank terms (step 4), before any loan-to-value limit. Mortgages and personal loans share the same room — alternatives, not added together. Never more than two personal loans at once (your old ones count); a plan can still borrow earlier by having the bank buy an old loan out.</div>
            </Box>
            <More title="The bank's rules: limits, loan-to-value, refinancing, settlement fee">
              <div className="grid" style={twoCol}>
                <div>
                  <Field label="All instalments together may use" value={inp.dbrCap} min={30} max={70} step={1} unit="% of income" onChange={(v) => set("dbrCap", v)} />
                  <Field label="All mortgages together may use" value={inp.mortgageCap} min={20} max={70} step={1} unit="% of income" onChange={(v) => set("mortgageCap", v)} />
                  <Field label="One personal loan may use" value={inp.perLoanCap} min={15} max={65} step={1} unit="% of income" onChange={(v) => set("perLoanCap", v)} hint="a second personal loan may use what is left" />
                  <Field label="Bank's ceiling on one personal loan" value={inp.plCap} min={100000} max={3000000} step={50000} unit="SAR" onChange={(v) => set("plCap", v)} />
                </div>
                <div>
                  <Field label="Loan-to-value when the bank finances the land" value={inp.landLtv} min={30} max={95} step={5} unit="%" onChange={(v) => set("landLtv", v)} />
                  <Field label="…against the property you own" value={inp.ownedLtv} min={30} max={90} step={5} unit="%" onChange={(v) => set("ownedLtv", v)} />
                  <Field label="…cash-out on the finished home" value={inp.cashoutLtv} min={30} max={90} step={5} unit="%" onChange={(v) => set("cashoutLtv", v)} />
                  <Field label="A personal loan can be refinanced after" value={inp.refiMinMonths} min={0} max={36} step={1} unit="months" onChange={(v) => set("refiMinMonths", v)} />
                  <Field label="Early-settlement fee" value={inp.settleFeeMonths} min={0} max={3} step={1} unit="months of profit" onChange={(v) => set("settleFeeMonths", v)} hint="SAMA cap: the next 3 months' profit on the declining balance" />
                </div>
              </div>
            </More>
          </div>
        );
      };

      /* ---------- step 3: the home ---------- */
      const costRows = build
        ? [["Land", prj.land], [`Transfer tax on the land (${inp.rettPct}%)${prj.rettExempt > 0 ? ", first-home relief applied" : ""}`, prj.rett], [`Broker's fee on the land (${inp.landBrokerPct}%)`, prj.landBroker], ["Construction", prj.hard], ["Design, permits, supervision", prj.soft], ["Contingency", prj.cont], ["Kitchen, AC, landscape", prj.finish], [`Cost overrun (${inp.overrunPct}%)`, prj.overrun], [`VAT ${inp.vatPct}%`, prj.vat]].filter(([, v], k) => v > 0.5 || ![2, 7].includes(k))
        : [["Purchase price", prj.price], [`Transfer tax (${inp.rettPct}%)${prj.rettExempt > 0 ? ", first-home relief applied" : ""}`, prj.rett], ["Broker", prj.broker], ["Finishing, furnishing", prj.finish], [`VAT ${inp.vatPct}% on finishing`, prj.vat]];
      const StepHome = () => (
        <div>
          <Head id="home" title={build ? "What will you build, and when?" : "What will you buy, and when?"} sub="All amounts in SAR. Land carries no VAT; construction and finishing do. The home's value grows with the market from the month you buy." />
          <div className="no-print" style={{ marginBottom: 14 }}><Seg label="Build or buy" value={inp.acquire} onChange={(v) => set("acquire", v)} options={[["build", "Buy land and build"], ["buy", "Buy a ready home"]]} /></div>
          <div className="grid" style={twoCol}>
            <Box title={build ? "Land and construction" : "The purchase"}>
              {build ? <>
                <Field label="Land area" value={inp.landArea} min={150} max={2500} step={25} unit="m²" onChange={(v) => set("landArea", v)} />
                <Field label="Land price" value={inp.landPrice} min={300} max={15000} step={100} unit="SAR/m²" onChange={(v) => set("landPrice", v)} hint={`land ${fM(prj.land)}${prj.landMonth > 0 ? ` in ${fCal(prj.landMonth)}` : ""}`} />
                <Field label="Ground floor, as % of the land" value={inp.builtPct} min={0} max={100} step={5} unit="%" onChange={(v) => set("builtPct", v)} hint={inp.builtPct > 0 ? `${Math.round(inp.landArea * inp.builtPct / 100)} m² per floor · 0 = type the total area instead` : "0 = type the total built-up area below"} />
                {inp.builtPct > 0 ? <Field label="Floors" value={inp.floors} min={1} max={4} step={0.5} unit="floors" onChange={(v) => set("floors", v)} hint={`built-up ${Math.round(prj.builtArea)} m²`} /> : <Field label="Total built-up area" value={inp.builtArea} min={100} max={2500} step={10} unit="m²" onChange={(v) => set("builtArea", v)} />}
                <Field label="Construction cost, turnkey" value={inp.buildCost} min={1000} max={7000} step={50} unit="SAR/m²" onChange={(v) => set("buildCost", v)} hint={`${fM(prj.hard)} before VAT${prj.inflate > 1 ? `, incl. ${((prj.inflate - 1) * 100).toFixed(0)}% price rises to the start` : ""}`} />
                <Field label="Construction takes" value={inp.buildMonths} min={6} max={36} step={1} unit="months" onChange={(v) => set("buildMonths", v)} />
                <More title="More: design and permits, contingency, overrun, extras, price rises, value uplift, broker, VAT, transfer tax">
                  <Field label="Design, permits, supervision" value={inp.softPct} min={0} max={20} step={0.5} unit="% of construction" onChange={(v) => set("softPct", v)} />
                  <Field label="Contingency" value={inp.contPct} min={0} max={25} step={1} unit="%" onChange={(v) => set("contPct", v)} hint="overruns are the norm — keep at least 5%" />
                  <Field label="Cost overrun (a stress test)" value={inp.overrunPct || 0} min={0} max={30} step={1} unit="%" onChange={(v) => set("overrunPct", v)} hint="extra cost on construction, design, contingency and extras — it adds no value" />
                  <Field label="Kitchen, AC, landscape" value={inp.finishExtra} min={0} max={800000} step={10000} unit="SAR" onChange={(v) => set("finishExtra", v)} />
                  <Field label="Construction price rises" value={inp.costInflation} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("costInflation", v)} />
                  <Field label="Value uplift of building it yourself" value={inp.devMarginPct} min={-20} max={40} step={1} unit="%" onChange={(v) => set("devMarginPct", v)} hint="on what you build, not the land: value = land + construction × (1 + uplift)" help={EXPL.value} />
                  <Field label="Broker's fee on the land" value={inp.landBrokerPct == null ? 2.5 : inp.landBrokerPct} min={0} max={5} step={0.25} unit="%" onChange={(v) => set("landBrokerPct", v)} />
                  <Field label="VAT" value={inp.vatPct} min={0} max={20} step={1} unit="%" onChange={(v) => set("vatPct", v)} />
                  <Field label="Real-estate transfer tax" value={inp.rettPct} min={0} max={10} step={0.5} unit="%" onChange={(v) => set("rettPct", v)} />
                  <Tick checked={inp.firstHomeExempt} onChange={(v) => set("firstHomeExempt", v)} label={`First-home relief (the state pays the tax on the first ${fM(inp.rettExemptCap)})`} />
                </More>
              </> : <>
                <Field label="Price" value={inp.propertyPrice} min={300000} max={15000000} step={50000} unit="SAR" onChange={(v) => set("propertyPrice", v)} />
                <Field label="Finishing, furnishing" value={inp.finishExtra} min={0} max={800000} step={10000} unit="SAR" onChange={(v) => set("finishExtra", v)} />
                <More title="More: broker, VAT, transfer tax">
                  <Field label="Broker" value={inp.brokerPct} min={0} max={5} step={0.5} unit="%" onChange={(v) => set("brokerPct", v)} />
                  <Field label="VAT on finishing" value={inp.vatPct} min={0} max={20} step={1} unit="%" onChange={(v) => set("vatPct", v)} />
                  <Field label="Real-estate transfer tax" value={inp.rettPct} min={0} max={10} step={0.5} unit="%" onChange={(v) => set("rettPct", v)} />
                  <Tick checked={inp.firstHomeExempt} onChange={(v) => set("firstHomeExempt", v)} label={`First-home relief (the state pays the tax on the first ${fM(inp.rettExemptCap)})`} />
                </More>
              </>}
            </Box>
            <div className="grid" style={{ gap: 14, alignContent: "start" }}>
              <Box title="When">
                <MonthField label={build ? "Buy the land in" : "Buy in"} value={inp.landMonth} min={0} max={72} onChange={(v) => setInp((s) => ({ ...s, landMonth: v, buildStart: Math.max(s.buildStart, v) }))} hint={`today's price grown ${inp.appreciation}%/yr until then`} />
                {build && <MonthField label="Start building in" value={curStart} min={0} max={72} onChange={(v) => setInp((s) => ({ ...s, buildStart: Math.max(v, s.landMonth) }))} hint={`you move in ${fCal(prj.occupy)}${prj.inflate > 1 ? ` · construction ${((prj.inflate - 1) * 100).toFixed(0)}% dearer than today` : ""} · not sure? Step 5 tests every start`} />}
              </Box>
              <Box title="Living in it — or letting it" help={EXPL.rentOut}>
                <Seg label="Living in it or letting it" value={lettingOut ? "all" : (inp.partRentAnnual || 0) > 0 ? "part" : "live"} onChange={(v) => setInp((s) => v === "live" ? { ...s, partRentAnnual: 0, rentOutPct: 0, rentOutFixed: 0 } : v === "part" ? { ...s, rentOutPct: 0, rentOutFixed: 0, partRentAnnual: s.partRentAnnual > 0 ? s.partRentAnnual : 60000 } : { ...s, partRentAnnual: 0, rentOutPct: s.rentOutPct > 0 || s.rentOutFixed > 0 ? s.rentOutPct : 5 })} options={[["live", "Live in it"], ["part", "Live in it, let part"], ["all", "Let all of it"]]} />
                <div style={{ marginTop: 12 }}>
                  {!lettingOut && (inp.partRentAnnual || 0) > 0 && <Field label="Rent for the part you let (annex, floor)" value={inp.partRentAnnual} min={0} max={400000} step={5000} unit="SAR/yr" onChange={(v) => set("partRentAnnual", v)} hint={`from ${fCal(prj.occupy + 1)}, rising with rent growth (${inp.rentGrowth}%/yr) · net of its own costs`} />}
                  {lettingOut && <>
                    <Field label="Rent, as % of the all-in cost" value={inp.rentOutPct || 0} min={0} max={12} step={0.25} unit="%/yr" onChange={(v) => set("rentOutPct", v)} hint={(inp.rentOutFixed || 0) > 0 ? "not used — the fixed rent below is set" : `= ${fSAR(prj.total * (inp.rentOutPct || 0) / 100)} a year from ${fCal(prj.occupy + 1)}`} />
                    <Field label="…or a fixed rent" value={inp.rentOutFixed || 0} min={0} max={1000000} step={5000} unit="SAR/yr" onChange={(v) => set("rentOutFixed", v)} hint={(inp.rentOutFixed || 0) > 0 ? "overrides the %" : "0 = use the % above"} />
                  </>}
                  <Field label="Rent growth" value={inp.rentGrowth} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("rentGrowth", v)} hint={renting ? "also raises the rent you pay today" : null} />
                </div>
              </Box>
              <Box title="Market and the comparison">
                <Field label="Home values grow" value={inp.appreciation} min={-5} max={12} step={0.5} unit="%/yr" onChange={(v) => set("appreciation", v)} />
                <Field label="Your cash earns" value={inp.altReturn} min={0} max={15} step={0.5} unit="%/yr" onChange={(v) => set("altReturn", v)} hint="on both sides: what your cash would earn if you didn't build" />
                <Field label="Zakat on invested cash" value={inp.cashZakatPct || 0} min={0} max={2.5} step={0.5} unit="%/yr" onChange={(v) => set("cashZakatPct", v)} hint={(inp.cashZakatPct || 0) > 0 ? `cash then grows ${((1 + inp.altReturn / 100) * (1 - inp.cashZakatPct / 100) * 100 - 100).toFixed(2)}% a year, on both sides; a home you live in is exempt` : "0 = not counted"} />
                <MonthField label="Compare until" value={inp.horizon * 12} min={60} max={360} onChange={(v) => set("horizon", Math.max(5, Math.min(30, Math.round(v / 12))))} hint={`${inp.horizon} years`} />
                <More title="More: upkeep">
                  <Field label="Maintenance" value={inp.maintPct} min={0} max={3} step={0.1} unit="% of value a year" onChange={(v) => set("maintPct", v)} />
                  <Field label="Insurance and fees" value={inp.insurance} min={0} max={20000} step={500} unit="SAR/yr" onChange={(v) => set("insurance", v)} />
                </More>
              </Box>
            </div>
            <Box title="What it costs, and what it is worth" help={EXPL.cost}>
              <table className="bridge"><tbody>
                {costRows.map(([l, v]) => <tr key={l}><td>{l}</td><td className="v">{fSAR(v)}</td></tr>)}
                <tr className="tot"><td>All-in cost</td><td className="v">{fSAR(prj.total)}</td></tr>
                <tr><td>Value when you move in ({fCal(prj.occupy)})<Hint text={EXPL.value} /></td><td className="v" style={{ color: prj.value0 >= prj.total ? K.pos : K.neg }}>{fSAR(prj.value0)}</td></tr>
                {build && prj.builtArea > 0 && <tr><td>Cost per m² built (without the land)</td><td className="v">{fSAR(prj.costPerSqm)}</td></tr>}
              </tbody></table>
              <div className="note">{build ? `The land (with tax${prj.landBroker > 0 ? " and broker" : ""}) is paid in ${fCal(prj.landMonth)}; construction${prj.overrun > 0 ? " and the overrun" : ""} evenly from ${fCal(prj.start + 1)} to ${fCal(prj.start + prj.bm)}; the extras in the last month.` : `Everything is paid in ${fCal(prj.landMonth)}.`} Your cash and the loans pay each bill as it falls due — there is no construction mortgage.</div>
            </Box>
          </div>
        </div>
      );

      /* ---------- step 4: how to pay ---------- */
      const TERM_ROWS = [["lm", build ? "Land mortgage" : "Purchase mortgage", "lmRate", "lmTenure", "lmFeesPct", 30, 12], ["eq", "Mortgage on the property you own", "eqRate", "eqTenure", "eqFeesPct", 30, 12], ["co", "Cash-out mortgage on the new home", "coRate", "coTenure", "coFeesPct", 30, 12], ["pl", "Personal loans", "plRate", "plTenure", null, 7, 15]];
      const aprOf = (rk, tk) => reEffRate(inp, inp[rk], Math.max(1, Math.round(inp[tk] * 12)));
      const TermsBox = () => {
        const showEq = inp.ownedValue > 0 || inp.plans.some((o) => o.enabled && o.eqWhen !== "none");
        return (
          <More title={`Bank terms for every plan and for the tool: ${TERM_ROWS.filter(([k]) => k !== "eq" || showEq).map(([k, , rk, tk]) => `${{ lm: build ? "land" : "purchase", eq: "own property", co: "cash-out", pl: "personal" }[k]} ${inp[rk]}%${inp.rateQuote === "flat" ? " flat" : ""}/${inp[tk]}y`).join(" · ")}`}>
            <div className="flex items-center flex-wrap" style={{ gap: 10, marginBottom: 10 }}>
              <Seg label="How your bank quotes rates" value={inp.rateQuote} onChange={(v) => set("rateQuote", v)} options={[["apr", "Rates as APR"], ["flat", "Rates as flat (hamish)"]]} />
              <Hint text={EXPL.terms} label="Bank terms" />
            </div>
            <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 230px), 1fr))", gap: "4px 20px" }}>
              {TERM_ROWS.filter(([k]) => k !== "eq" || showEq).map(([k, label, rk, tk, fk, maxT, maxR]) => { const apr = aprOf(rk, tk); return (
                <div key={k} style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, margin: "4px 0 8px" }}>{label}</div>
                  <Field label="Profit rate" value={inp[rk]} min={0} max={maxR} step={k === "pl" ? 0.25 : 0.05} unit="%" onChange={(v) => set(rk, v)} hint={`${inp.rateQuote === "flat" ? `= ${apr.toFixed(2)}% APR · ` : ""}costs ${reEffYear(apr).toFixed(2)}% a year (vs ${(+netRet.toFixed(2))}% your cash earns)`} />
                  <Field label="Years" value={inp[tk]} min={1} max={maxT} step={1} unit="yrs" onChange={(v) => set(tk, v)} />
                  {fk && <Field label="Bank fee" value={inp[fk]} min={0} max={3} step={0.25} unit="% of the loan" onChange={(v) => set(fk, v)} />}
                </div>); })}
            </div>
          </More>
        );
      };
      const RefiPicks = ({ o, i }) => {
        const r = m.results[i], minAge = inp.refiMinMonths == null ? 12 : inp.refiMinMonths, pick = o.refiPick || {};
        const loans = inp.existingLoans.filter((l) => l.balance > 0 && l.installment > 0 && l.canRefi !== false);
        const stepsP = [];
        if (o.plWhen !== "none") stepsP.push(["pl", `Personal loans ${whenTxt(o.plWhen, o.plMonth, prj)}`, tWhen(o.plWhen, o.plMonth)]);
        if (o.pl2Use) stepsP.push(["pl2", `Personal loans at move-in (${fCal(prj.occupy)})`, prj.occupy]);
        const toggle = (key, id, on) => { const cur0 = (pick[key] || []).map(String).filter((x) => x !== id); setPlan(i, "refiPick", { ...pick, [key]: on ? [...cur0, id] : cur0 }); };
        return (
          <div style={{ background: SOFT, borderRadius: 8, padding: "8px 12px", marginBottom: 10 }}>
            {stepsP.map(([key, label, t]) => {
              const items = loans.map((l) => { const age = l.ageMonths == null ? null : l.ageMonths + t, end = r && r.loansEnd.find((x) => String(x.id) === String(l.id)); return { id: String(l.id), name: l.name, why: l.settleAt != null && l.settleAt > 0 && l.settleAt <= t ? "settled by then (your date)" : end && end.settledAt != null && end.settledAt < t ? "paid off earlier in this plan" : Math.round(l.monthsLeft) < t ? "ended by then" : age != null && age < minAge ? `only ${age} months old then (needs ${minAge})` : "" }; });
              if (key === "pl2" && o.plWhen !== "none") { const age = t - tWhen(o.plWhen, o.plMonth); items.push({ id: "pl", name: "this plan's earlier personal loan(s)", why: age < minAge ? `only ${age} months old then (needs ${minAge})` : "" }); }
              return (
                <div key={key} style={{ marginBottom: 6 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 3 }}>{label} — buy out:</div>
                  {items.length === 0 ? <div style={{ fontSize: 12.5, color: K.sub }}>no old loan may be refinanced (see "May be refinanced" in step 2)</div>
                    : items.map((x) => <Tick key={x.id} checked={(pick[key] || []).map(String).includes(x.id)} onChange={(on) => toggle(key, x.id, on)} label={x.name} sub={x.why || null} />)}
                </div>
              );
            })}
            <div style={{ fontSize: 12, color: K.sub }}>Nothing ticked = no buy-out. A loan that has ended, is too young, or can't be cleared in full by the new loan is not bought out — the timeline says so.</div>
          </div>
        );
      };
      const fxTxt = (x) => {
        if (!x) return "working it out…";
        const planned = (p) => inp.existingLoans.some((l) => l.name === p.name && l.settleAt != null && Math.round(l.settleAt) === p.t);
        const paid = x.payoffs.filter((p) => !planned(p)), mort = x.lm.amount + x.eq.amount + x.co.amount;
        const parts = [paid.length ? `pays off ${paid.map((p) => p.name).join(" + ")} (${fM(paid.reduce((a, p) => a + p.cost, 0))})` : "pays nothing off", `mortgage${x.lm.amount + x.eq.amount > 0 && x.co.amount > 0 ? "s" : ""} ${fM(mort)}`];
        return x.feasible ? `${parts.join(" · ")} · ${fM(x.econAdv)} vs ${baseLbl}${x.recoveryOk ? "" : " · slow to recover"}` : `${parts.join(" · ")} · cash runs out: ${fM(x.minCash)} in ${fCal(x.minCashT)} ✗`;
      };
      const PlanCard = ({ o, i }) => {
        const r = m.results[i];
        if (!o.enabled) return (
          <div className="plan off flex items-center flex-wrap" style={{ borderLeftColor: K.line, gap: 10 }}>
            <input type="checkbox" checked={false} onChange={(e) => setPlan(i, "enabled", e.target.checked)} aria-label={`Compare plan ${i + 1}`} />
            <span style={{ fontSize: 12, fontWeight: 700, color: K.sub, letterSpacing: ".06em" }}>PLAN {i + 1}</span>
            <span style={{ fontSize: 13, color: K.sub, minWidth: 0, flex: 1 }}>{planTitle(o, build)} — not compared</span>

        return (
          <div className="plan" style={{ borderLeftColor: PLAN_FILL[i], boxShadow: editIdx === i ? `0 0 0 2px ${PLAN_FILL[i]}` : "none" }}>
