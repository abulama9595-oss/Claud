              <input type="checkbox" checked={o.enabled} onChange={(e) => setPlan(i, "enabled", e.target.checked)} aria-label={`Compare plan ${i + 1}`} style={{ marginTop: 3 }} />
              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{ fontSize: 15, fontWeight: 700, lineHeight: 1.35 }}><span style={{ color: PLAN_TEXT[i], fontSize: 12, letterSpacing: ".06em", marginRight: 6 }}>PLAN {i + 1}{r && r === lead ? " · ★ BEST OF YOUR PLANS" : ""}</span>{planTitle(o, build)}</div>
                <div style={{ fontSize: 12.5, color: K.sub }}>your name: "{o.name}"</div>
                <div className="flex flex-wrap" style={{ gap: 6, margin: "8px 0" }}>{st.length ? st.map((s, k) => <span key={k} className="chip"><b>{s.label} {fM(s.amount)}</b><span style={{ color: K.sub }}>{fCal(s.t)}</span></span>) : <span className="chip">no new loans — paid from your cash</span>}</div>
                {r && <div className="flex flex-wrap items-center" style={{ gap: "6px 14px", fontSize: 13 }}>
                  <Status r={r} />
                  <span>cash at move-in <b className="mono">{fM(cashAtMoveIn(r))}</b></span>
                  <span>vs {baseLbl} <b className="mono" style={{ color: signCol(r.econAdv) }}>{fM(r.econAdv)}</b><Hint text={EXPL.econ} label="vs not building" /> <span style={{ color: K.sub, fontSize: 12 }}>rule 7: {fM(r.advantage)}</span></span>
                </div>}
                {r && r.flags.length > 0 && <div style={{ fontSize: 12.5, color: r.feasible ? "#7A4F12" : K.neg, marginTop: 6, lineHeight: 1.45 }}>{calText(r.flags[0])}</div>}
                {r && <details style={{ marginTop: 6 }}><summary style={{ cursor: "pointer", fontSize: 12.5, color: K.brassTx, fontWeight: 600 }}>In words</summary><div style={{ fontSize: 12.5, color: K.sub, lineHeight: 1.5, marginTop: 4 }}>{describePlan(o, inp, prj, build)}</div></details>}
              </div>
              <button className="btn small no-print" onClick={() => setEditIdx(editIdx === i ? -1 : i)} aria-expanded={editIdx === i}>{editIdx === i ? "Done" : "Edit"}</button>
            </div>
          </div>
        );
      };
      const PlanEditor = ({ o, i }) => {
        const r = m.results[i], plT = plTimingOf(o), prepayOn = o.prepayAfter != null && o.prepayAfter !== "";
        const pol = o.settlePolicy === "forMax" || o.settlePolicy === "none" ? o.settlePolicy : "asNeeded";
        const plZero = r && (o.plWhen !== "none" && r.pl.amount < 1 ? r.pl : o.pl2Use && r.pl2.amount < 1 ? r.pl2 : null);
        return (
          <div className="box no-print" style={{ border: `2px solid ${PLAN_FILL[i]}`, marginTop: -2 }}>
            <div className="flex justify-between items-center flex-wrap" style={{ gap: 8, marginBottom: 10 }}>
              <b style={{ fontSize: 14 }}>Edit Plan {i + 1}</b>
              <select value="" aria-label="Start this plan from a template" onChange={(e) => { const k = e.target.value; if (k) withUndo(`Plan ${i + 1} started from a template`, () => setInp((s) => ({ ...s, plans: s.plans.map((x, j) => j === i ? { enabled: true, ...RE_PLAN_PRESETS[k] } : x) }))); }}>
                <option value="">Start from a template…</option>
                {Object.entries(RE_PLAN_PRESETS).map(([k, pr]) => <option key={k} value={k}>{pr.name}</option>)}
              </select>
            </div>
            <label className="lbl" style={{ display: "block", marginBottom: 4 }}>Your name for it</label>
            <input type="text" value={o.name} onChange={(e) => setPlan(i, "name", e.target.value)} style={{ width: "100%", marginBottom: 12 }} aria-label="Plan name" />
            <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 250px), 1fr))", gap: "0 18px" }}>
              <Pick label={`${build ? "Mortgage the land" : "Mortgage the purchase"} (${fCal(prj.landMonth)})`} value={o.lmUse ? "yes" : "no"} onChange={(v) => setPlan(i, "lmUse", v === "yes")} options={[["no", "No — pay in cash"], ["yes", `Yes — up to ${inp.landLtv}% of the price`]]} />
              <Pick label="Mortgage the property you own" value={o.eqWhen} onChange={(v) => setPlan(i, "eqWhen", v)} options={[["none", "No"], ["start", "Now"], ["land", "When the land is bought"], ["build", "When construction starts"], ["completion", "At move-in"], ["month", "In a month I choose"]]} hint={inp.ownedValue > 0 ? `up to ${fM(inp.ownedValue * inp.ownedLtv / 100)} (${inp.ownedLtv}% of its value)${inp.ownHomePlan === "sell" && !renting ? " · not after you sell it" : ""}` : "set its value in step 1 first"} />
              {o.eqWhen === "month" && <MonthField label="…in" value={o.eqMonth} min={0} max={Math.round(inp.horizon * 12)} onChange={(v) => setPlan(i, "eqMonth", v)} />}
              <Pick label="Personal loans" value={plT} onChange={(v) => { const x = RE_PL_TIMING.find((y) => y[0] === v); if (x) setPlanMany(i, x[2]); }} options={RE_PL_TIMING.filter((x) => x[0] !== "completion" || plT === "completion").map(([k, l]) => [k, l])} help={EXPL.refi} hint={plZero ? `${plZero.label}: nothing — ${plZero.capacity ? plZero.capacity.limitedBy : "no room"}` : `the bank's maximum: one or two loans, each up to ${inp.perLoanCap}% of income; never more than two at once`} />
              {o.plWhen === "month" && <MonthField label="…in" value={o.plMonth} min={0} max={Math.round(inp.horizon * 12)} onChange={(v) => setPlan(i, "plMonth", v)} />}
              <Pick label={`Cash-out mortgage on the new home (${fCal(prj.occupy)})`} value={o.coUse ? "yes" : "no"} onChange={(v) => setPlan(i, "coUse", v === "yes")} options={[["no", "No"], ["yes", `Yes — up to ${inp.cashoutLtv}% of its value`]]} />
            </div>
            <div className="note" style={{ marginTop: 0 }}>Every loan is the bank's maximum that month: the smallest of its loan-to-value limit, what is left of your {inp.dbrCap}% (all mortgages together ≤ {inp.mortgageCap}%, each personal loan ≤ {inp.perLoanCap}%) and the bank's ceiling — priced with the Bank terms above.</div>

            <div style={{ marginTop: 16 }}>
              <div className="lbl" style={{ fontWeight: 700 }}>Old personal loans: pay some off from your cash so a mortgage fits?<Hint text={EXPL.settlePolicy} label="Old personal loans" /></div>
              <div className="note" style={{ marginTop: 2 }}>Paying an old loan off (from your own cash, before the mortgage is granted) frees room in your {inp.dbrCap}%, so the mortgage can be bigger. What each choice does to this plan:</div>
              <div className="grid" style={{ gap: 8, marginTop: 8 }} role="radiogroup" aria-label="Old personal loans">
                {[["asNeeded", "Only as much as the build needs"], ["forMax", "As much as it takes for the biggest mortgage the property allows"], ["none", "Don't pay them off"]].map(([k, l]) => { const x = settleFx && settleFx.find((y) => y.pol === k); const sel = pol === k; return (
                  <label key={k} className="flex items-start" style={{ gap: 10, border: `1.5px solid ${sel ? K.ink : K.line}`, borderRadius: 9, padding: "9px 12px", cursor: "pointer", background: "#fff" }}>
                    <input type="radio" name={`settle${i}`} checked={sel} onChange={() => setPlan(i, "settlePolicy", k)} style={{ marginTop: 2 }} />
                    <span><b style={{ fontSize: 13 }}>{l}</b><span style={{ display: "block", fontSize: 12.5, color: x && x.r && !x.r.feasible ? K.neg : K.sub, lineHeight: 1.45 }}>{x ? fxTxt(x.r) : "working it out…"}</span></span>
                  </label>); })}
              </div>
            </div>

            {(o.plWhen !== "none" || o.pl2Use) && <div style={{ marginTop: 16 }}>
              <Pick label="Which old loans the bank buys out when you take personal loans" value={o.refiMode || "auto"} onChange={(v) => setPlan(i, "refiMode", v)} help={EXPL.refi} options={[["auto", "Auto (recommended): best value, or most cash if the plan needs it"], ["value", "Best value: what leaves you richest"], ["cash", "Most cash: what puts the most in your hands now"], ["pick", "Choose them myself"]]} />
              {o.refiMode === "pick" && RefiPicks({ o, i })}
              {r && r.refiFallback && <div className="note" style={{ marginTop: 0 }}>Auto used "most cash" for this plan: the best-value choice would {r.feasible ? "miss your recovery rule" : "run your cash out"}.</div>}
            </div>}

            <div style={{ marginTop: 16 }}>
              <Pick label="Pay the new mortgages off early from your cash?" value={prepayOn ? "after" : "never"} onChange={(v) => setPlan(i, "prepayAfter", v === "never" ? null : 24)} help={EXPL.prepay} options={[["never", "No — they run to their end"], ["after", "Yes, some months after move-in"]]} />
              {prepayOn && <Field label="Months after move-in" value={+o.prepayAfter} min={0} max={120} step={3} unit="months" onChange={(v) => setPlan(i, "prepayAfter", v)} hint={`${fCal(prj.occupy + Math.round(+o.prepayAfter))} · whole mortgages, dearest first, while your cash${inp.cashBuffer > 0 ? ` above your ${fM(inp.cashBuffer)} cushion` : ""} covers the payoff + ${inp.settleFeeMonths} months' profit${r && r.prepaidTotal > 0 ? ` · this plan pays off ${fM(r.prepaidTotal)}` : r && prepayOn ? " · not enough cash then in this plan" : ""}`} />}
              {o.lmUse && <Field label="Extra monthly payment on the land mortgage" value={o.extraMo} min={0} max={30000} step={500} unit="SAR/mo" onChange={(v) => setPlan(i, "extraMo", v)} hint="voluntary — it shortens the mortgage; the bank doesn't count it in your limit" />}
            </div>
          </div>
        );
      };
      // the tool's own search: every mix of loans for your planned start, every loan at the bank's maximum
      const OptCard = () => {
        if (!opt) return <div className="plan" style={{ borderLeftColor: K.ink, fontSize: 13, color: K.sub }}>Let the tool choose: trying every mix of loans for a {fCal(curStart)} start…</div>;
        const st = opt.planned, b = st.best;
        const sameIdx = liveIdx.find((k) => { const r = m.results[k]; return Math.abs(r.econAdv - b.econAdv) < 1 && Math.abs(r.lm.amount - b.lm) < 1 && Math.abs(r.eq.amount - b.eq) < 1 && Math.abs(r.pl.amount - b.pl) < 1 && Math.abs(r.co.amount - b.co) < 1 && Math.abs(r.pl2.amount - b.pl2) < 1; });
        return (
          <div className="plan" style={{ borderLeftColor: K.ink }}>
            <div style={{ fontSize: 15, fontWeight: 700 }}><span style={{ fontSize: 12, letterSpacing: ".06em", marginRight: 6, color: K.sub }}>LET THE TOOL CHOOSE</span>The best mix for a {fCal(st.delay)} start{optStale && <span style={{ fontSize: 12, fontWeight: 400, color: K.sub }}> · updating…</span>}</div>
            <div style={{ fontSize: 12.5, color: K.sub, margin: "2px 0 8px" }}>tried {opt.combos} mixes · {st.nOk} work every month and recover in time<Hint text={EXPL.optimizer} label="Let the tool choose" /></div>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 6 }}>{planTitle(b.cleanPlan || b.plan, build)}</div>
            <div className="flex flex-wrap" style={{ gap: 6, marginBottom: 8 }}>{b.facilities.filter((f) => f.amount > 0 && f.key !== "rf").map((f) => <span key={f.key} className="chip"><b>{f.label} {fM(f.amount)}</b><span style={{ color: K.sub }}>{fCal(f.startedAt)}</span></span>)}{b.settled > 0 && <span className="chip"><b>Old loans paid off {fM(b.settled)}</b></span>}</div>
            <div className="flex flex-wrap items-center" style={{ gap: "6px 14px", fontSize: 13 }}>
              <Status r={b} />
              <span>lowest bank balance <b className="mono">{fM(b.minCash)}</b></span>
              <span>vs {baseLbl} <b className="mono" style={{ color: signCol(b.econAdv) }}>{fM(b.econAdv)}</b></span>
              {sameIdx != null ? <span className="tag" style={{ background: SOFT, color: K.sub }}>same result as {planName(sameIdx)}</span> : <button className="btn gold small no-print" onClick={() => useOptPlan(st)}>Use it as Plan 1</button>}
            </div>
          </div>
        );
      };
      const LIMIT_SERIES = [["existing", "Old loans", "#8C877D"], ["lm", build ? "Land mortgage" : "Purchase mortgage", "#2F6DB5"], ["eq", "Mortgage on your property", "#1F9A80"], ["pl", "Personal loans", "#A24FB8"], ["co", "Cash-out", "#6FA3E0"], ["rf", "Refinance", "#B4691F"]];
      const LimitChart = ({ r, i }) => {
        const rows = bucketOf(r), last = Math.min(rows.length - 1, r.occupy + 36);
        const data = rows.filter((x) => x.t <= last).map((x) => { const o = { t: x.t }; LIMIT_SERIES.forEach(([k]) => { o[k] = x.inc > 0 ? x[k] / x.inc * 100 : 0; }); return o; });
        const present = LIMIT_SERIES.filter(([k]) => data.some((d) => d[k] > 0.05));
        const top = Math.max(inp.dbrCap + 10, Math.ceil(Math.max(...data.map((d) => present.reduce((a, [k]) => a + d[k], 0))) / 10) * 10 + 10);
        const today = household.existingInst, free = Math.max(0, inp.income * inp.dbrCap / 100 - today);
        return (
          <Box title={`Why can't ${planName(i)} borrow more?`} style={{ marginTop: 14 }} help={EXPL.bucket} right={<span style={{ fontSize: 12.5, color: K.sub }}>instalments as % of income, each month</span>}>
            <div className="flex flex-wrap" style={{ gap: "4px 14px", fontSize: 12, marginBottom: 6 }}>
              {present.map(([k, l, c]) => <span key={k} className="flex items-center" style={{ gap: 5 }}><span style={{ width: 11, height: 11, background: c, borderRadius: 2, display: "inline-block" }} />{l}</span>)}
              <span className="flex items-center" style={{ gap: 5, color: K.neg }}><span style={{ width: 18, borderTop: `2px dashed ${K.neg}`, display: "inline-block" }} />bank limit {inp.dbrCap}% (all loans)</span>
              <span className="flex items-center" style={{ gap: 5, color: K.brassTx }}><span style={{ width: 18, borderTop: `2px dashed ${K.brass}`, display: "inline-block" }} />{inp.mortgageCap}% (all mortgages)</span>
            </div>
            <ResponsiveContainer width="100%" height={240}>
              <AreaChart data={data} margin={{ top: 6, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid stroke={K.line} vertical={false} />
                <XAxis dataKey="t" ticks={data.filter((d) => d.t % 12 === 0).map((d) => d.t)} tickFormatter={fCal} tick={axisS} tickLine={false} axisLine={{ stroke: K.line }} />
                <YAxis domain={[0, top]} ticks={Array.from({ length: Math.floor(top / 10) + 1 }, (_, k) => k * 10)} tick={axisT} tickFormatter={(v) => `${v}%`} tickLine={false} axisLine={false} width={40} />
                <Tooltip formatter={(v, n) => [`${(+v).toFixed(1)}%`, (LIMIT_SERIES.find((s) => s[0] === n) || [0, n])[1]]} labelFormatter={(t) => fCal(t)} contentStyle={tipStyle} />
                <ReferenceLine y={inp.dbrCap} stroke={K.neg} strokeDasharray="5 4" />
                <ReferenceLine y={inp.mortgageCap} stroke={K.brass} strokeDasharray="5 4" />
                {present.map(([k, , c]) => <Area key={k} type="stepAfter" stackId="b" dataKey={k} stroke={c} fill={c} fillOpacity={0.85} strokeWidth={1} isAnimationActive={false} />)}
              </AreaChart>
            </ResponsiveContainer>
            <div className="note">Today your old loans take {fSAR(today)}/mo ({household.existingDbr.toFixed(0)}% of income), leaving {fSAR(free)}/mo under the {inp.dbrCap}% limit. Space under the red line in a month is borrowing room this plan leaves unused. A voluntary extra payment is not counted. Shown to 3 years after move-in.</div>
          </Box>
        );
      };
      const StepPay = () => (
        <div>
          <Head id="pay" title="How do you want to pay for it?" sub="Tick the plans to compare. Every loan is taken at the bank's maximum at the moment it is taken; the result line under each plan updates as you change things." />
          {TermsBox()}
          <div className="grid" style={{ gap: 10, marginTop: 14 }}>
            {inp.plans.map((o, i) => <React.Fragment key={i}>{PlanCard({ o, i })}{editIdx === i && o.enabled && PlanEditor({ o, i })}</React.Fragment>)}
            {OptCard()}
          </div>
          {editIdx >= 0 && m.results[editIdx] ? LimitChart({ r: m.results[editIdx], i: editIdx }) : focusRes && LimitChart({ r: focusRes, i: focusIdx })}
        </div>
      );

      /* ---------- step 5: when ---------- */
      const StepWhen = () => {
        const rowsS = optRows.rows, sw = sweep;
        if (!sw || !focusRes) return <div><Head id="when" title="When can you start?" /><Box>Tick a plan in step 4 first.</Box></div>;
        const byT = new Map();
        sw.rows.forEach((x) => byT.set(x.delay, { t: x.delay, plan: x.feasible ? x.econAdv : null }));
        rowsS.forEach((s) => { const o = byT.get(s.delay) || { t: s.delay }; o.best = s.best.feasible ? s.best.econAdv : null; byT.set(s.delay, o); });
        const data = [...byT.values()].sort((a, b) => a.t - b.t);
        const earliest = sw.best, firstAhead = optRows.done ? rowsS.find((s) => s.best.ok && s.best.econAdv >= 0) : null, bestEarliest = optRows.done ? rowsS.find((s) => s.best.ok) : null;
        const planAtCur = sw.rows.find((x) => x.delay === curStart);
        return (
          <div>
            <Head id="when" title="When can you start?" sub={`Construction starting every 3 months from now to 5 years out. Waiting lets old loans run down (more room, less to pay off), but land grows ${inp.appreciation}%/yr and building ${inp.costInflation}%/yr. Both sides grow from today, so a later start gets no free growth.`} />
            <div className="flex items-center flex-wrap no-print" style={{ gap: 10, marginBottom: 12 }}>
              <span style={{ fontSize: 13, color: K.sub }}>The land:</span>
              <Seg label="When the land is bought" value={landWithBuild ? "with" : "now"} onChange={(v) => setLandWithBuild(v === "with")} options={[["now", `bought in ${fCal(inp.landMonth)} as planned`], ["with", "bought when you start building"]]} />
              <span style={{ fontSize: 13, color: K.sub }}>Plan shown:</span>
              <select value={focusIdx} onChange={(e) => setFocus(+e.target.value)} aria-label="Plan shown">{liveIdx.map((i) => <option key={i} value={i}>{planName(i)}{m.results[i] === lead ? " ★" : ""}</option>)}</select>
            </div>
            <Box title={`How much better or worse than ${baseLbl} you end up in ${endDate}, by the month you start building`} help={EXPL.econ}>
              <div className="flex flex-wrap" style={{ gap: "4px 16px", fontSize: 12.5, marginBottom: 6 }}>
                <span className="flex items-center" style={{ gap: 6 }}><span style={{ width: 18, borderTop: `3px solid ${PLAN_FILL[focusIdx]}`, display: "inline-block" }} />{planName(focusIdx)} as you set it</span>
                <span className="flex items-center" style={{ gap: 6 }}><span style={{ width: 18, borderTop: `3px dashed ${K.pos}`, display: "inline-block" }} />the best mix for that date{!optRows.done && <span style={{ color: K.sub }}> (working… {rowsS.length}/{optRows.total || "…"})</span>}</span>
                <span style={{ color: K.sub }}>above zero: building comes out ahead · a gap: that start runs out of cash</span>
              </div>
              <ResponsiveContainer width="100%" height={280}>
                <LineChart data={data} margin={{ top: 10, right: 12, left: 0, bottom: 0 }}>
                  <CartesianGrid stroke={K.line} vertical={false} />
                  <XAxis dataKey="t" type="number" domain={[0, "dataMax"]} ticks={data.filter((d) => d.t % 12 === 0).map((d) => d.t)} tickFormatter={fCal} tick={axisS} tickLine={false} axisLine={{ stroke: K.line }} />
                  <YAxis tick={axisT} tickFormatter={fM} tickLine={false} axisLine={false} width={58} />
                  <Tooltip formatter={(v, n) => [fM(v), n === "plan" ? `${planName(focusIdx)} as set` : "best mix"]} labelFormatter={(t) => `start ${fCal(t)}`} contentStyle={tipStyle} />
                  <ReferenceLine y={0} stroke={K.text} />
                  <Line dataKey="plan" stroke={PLAN_FILL[focusIdx]} strokeWidth={2.5} dot={{ r: 2.5 }} connectNulls={false} isAnimationActive={false} />
                  <Line dataKey="best" stroke={K.pos} strokeWidth={2} strokeDasharray="6 4" dot={{ r: 2 }} connectNulls={false} isAnimationActive={false} />
                  {planAtCur && planAtCur.feasible && <ReferenceDot x={curStart} y={planAtCur.econAdv} r={6} fill="#fff" stroke={K.ink} strokeWidth={2} label={{ value: `your plan · ${fCal(curStart)}`, position: "bottom", fontFamily: SANS, fontSize: 12, fill: K.text }} />}
                </LineChart>
              </ResponsiveContainer>
              <div style={{ fontSize: 13.5, lineHeight: 1.55, marginTop: 8 }}>
                {earliest ? <><b>Earliest start that works for {planName(focusIdx)}:</b> {fCal(earliest.delay)} (move in {fCal(earliest.occupy)}){earliest.delay === curStart ? " — as planned" : ""}. </> : <><b>No start within 5 years works for {planName(focusIdx)}</b> — change the plan, the home or the land timing. </>}
                {optRows.done ? (firstAhead ? <><b>Building comes out ahead from {fCal(firstAhead.delay)}</b> with the best mix for that date ({fM(firstAhead.best.econAdv)}).</> : <>No start in the next 5 years comes out ahead of {baseLbl}, even with the best mix{bestEarliest ? <> (the earliest workable best mix starts {fCal(bestEarliest.delay)}: {fM(bestEarliest.best.econAdv)})</> : null}.</>) : <span style={{ color: K.sub }}>Finding the best mix for every date…</span>}
              </div>
              <div className="flex flex-wrap no-print" style={{ gap: 8, marginTop: 10 }}>
                {earliest && earliest.delay !== curStart && <button className="btn small" onClick={() => withUndo(`Start moved to ${fCal(earliest.delay)}`, () => setInp((s0) => ({ ...s0, buildStart: earliest.delay, landMonth: landWithBuild ? earliest.delay : Math.min(s0.landMonth, earliest.delay) })))}>Start in {fCal(earliest.delay)}</button>}
                {firstAhead && <button className="btn gold small" onClick={() => useOptPlan(firstAhead, `Plan 1 now starts ${fCal(firstAhead.delay)} with its best mix`)}>Try {fCal(firstAhead.delay)} with its best mix as Plan 1</button>}
              </div>
            </Box>
            <div className="box" style={{ marginTop: 14, padding: "0 18px" }}>
              <Dis id="startsTable" title="The best mix for every start date" sub="table" open={!!openDis.startsTable} onToggle={toggleDis}>
                <div className="scroll-x"><table className="tbl">
                  <thead><tr>{["Start", "Move in", `vs ${baseLbl}`, "Works?", "Best mix", "Lowest balance", "Peak instalments", "New loans", "Profit + fees", ""].map((h, k) => <th key={k}>{h}</th>)}</tr></thead>
                  <tbody>{rowsS.map((st) => { const b = st.best; return (
                    <tr key={st.delay} style={{ background: st.delay === curStart ? SOFT : "transparent" }}>
                      <td className="l">{fCal(st.delay)}{st.delay === curStart ? " · planned" : ""}</td><td className="l">{fCal(st.occupy)}</td>
                      <td style={{ color: signCol(b.econAdv), fontWeight: 700 }}>{fM(b.econAdv)}</td>
                      <td style={{ color: b.ok ? K.pos : b.feasible ? "#7A4F12" : K.neg }}>{b.ok ? "yes" : b.feasible ? "slow" : "no"}</td>
                      <td className="l" style={{ minWidth: 220 }}>{planTitle(b.cleanPlan || b.plan, build)}</td>
                      <td>{fM(b.minCash)}</td><td>{fSAR(b.peakInst)}/mo</td><td>{fM(b.newDebt)}</td><td>{fM(b.newDebtInterest)}</td>
                      <td className="no-print"><button className="btn small" onClick={() => useOptPlan(st)}>Use</button></td>
                    </tr>); })}</tbody>
                </table></div>
              </Dis>
              <Dis id="planTable" title={`${planName(focusIdx)} at every start date`} sub="table" open={!!openDis.planTable} onToggle={toggleDis}>
                <div className="scroll-x"><table className="tbl">
                  <thead><tr>{["Start", "Move in", `vs ${baseLbl}`, "Works?", "Cost", "Lowest balance", "Peak instalments", "Land mortgage", "Own-property mortgage", "Personal loans", "Rule 7"].map((h, k) => <th key={k}>{h}</th>)}</tr></thead>
                  <tbody>{sw.rows.map((x) => <tr key={x.delay} style={{ background: x.delay === curStart ? SOFT : "transparent" }}>
                    <td className="l">{fCal(x.delay)}{x.delay === curStart ? " · planned" : ""}</td><td className="l">{fCal(x.occupy)}</td>
                    <td style={{ color: signCol(x.econAdv), fontWeight: 700 }}>{fM(x.econAdv)}</td>
                    <td style={{ color: x.recoveryOk ? K.pos : x.feasible ? "#7A4F12" : K.neg }}>{x.recoveryOk ? "yes" : x.feasible ? "slow" : "no"}</td>
                    <td>{fM(x.total)}</td><td>{fM(x.minCash)}</td><td>{fSAR(x.peakInst)}/mo</td><td>{fM(x.mortgage)}</td><td>{fM(x.eq)}</td><td>{fM(x.pl)}</td><td>{fM(x.advantage)}</td>
                  </tr>)}</tbody>
                </table></div>
              </Dis>
            </div>
          </div>
        );
      };

      /* ---------- step 6: your answer ---------- */
      const homeRows = [
        ["Works every month?", (r) => r.feasible ? (r.recoveryOk ? "yes" : "yes · slow to recover") : "no — runs out of cash", (r) => r.feasible ? (r.recoveryOk ? K.pos : "#7A4F12") : K.neg, EXPL.executable],
        [`Cash back at your cushion within ${inp.recoveryMonths} months of move-in?`, (r) => r.recoveryMonths == null ? "never" : r.recoveryMonths === 0 ? "at move-in" : `${r.recoveryMonths} months after`, (r) => r.recoveryOk ? K.pos : K.neg, EXPL.recovery],
        [`vs ${baseLbl} in ${endDate} — everything grows`, (r) => fM(r.econAdv), (r) => signCol(r.econAdv), EXPL.econ],
        ["…the same in today's money", (r) => fM(r.econPV), (r) => signCol(r.econPV), EXPL.econ],
        ["Return on the money building takes", (r) => { const v = econIrr[m.results.indexOf(r)]; return v == null ? "n/a" : `${(v * 100).toFixed(1)}% a year`; }, (r) => { const v = econIrr[m.results.indexOf(r)]; return v == null ? K.sub : v * 100 >= netRet ? K.pos : K.neg; }, EXPL.econIrr],
        [`Your rule-7 net worth in ${endDate}`, (r) => fM(r.netWorthEnd), null, EXPL.netWorth],
        [`…vs ${baseLbl} (rule 7)`, (r) => fM(r.advantage), (r) => signCol(r.advantage), EXPL.advantage],
        ["Cash at move-in (your cash + loans − costs)", (r) => fM(cashAtMoveIn(r)), null, EXPL.cashMoveIn],
        ["Bank balance at move-in (with salary)", (r) => fM(r.cashAtCompletion), null, EXPL.cashMoveIn],
        ["Lowest bank balance", (r) => `${fM(r.minCash)} · ${fCal(r.minCashT)}`, (r) => r.minCash < 0 ? K.neg : K.text, EXPL.cashLow],
        ["Months of costs the low point covers", (r) => r.reserveMonths == null ? "—" : r.reserveMonths.toFixed(1), null, "Lowest bank balance ÷ that month's living costs, rent, instalments and upkeep."],
        ["Highest monthly instalments", (r) => `${fSAR(r.peakInst)}/mo · ${pct1(r.peakDbr)}`, (r) => r.peakDbr > inp.dbrCap + 0.5 ? K.neg : K.text, EXPL.peakInst],
        ["New loans taken", (r) => fM(r.newDebtTotal), null, EXPL.newDebt],
        ["Profit and fees on the new loans", (r) => fM(r.newDebtInterest), () => K.neg, EXPL.newDebtCost],

          { label: `If you build (${planName(focusIdx)})`, parts: [{ label: "cash at move-in", v: fbC.total, color: "#5B6773" }, { label: "loans after move-in", v: fbH.total - fbC.total, color: "#7C8894" }, { label: `growth at ${(+netRet.toFixed(2))}%`, v: fbH.ret, color: "#9AA6B2" }, { label: "home value", v: end.value, color: "#2F6DB5" }, { label: "old instalments no longer paid", v: end.oldSavedCum, color: "#3C8A6E" }, { label: "rent received", v: end.rentInCum, color: "#1F9A80" }, { label: "rent no longer paid", v: end.rentSavedCum, color: "#5FA88A" }, { label: "old debt you no longer owe", v: end.oldDebtGap, color: "#86B9A2" }, { label: "instalments on new loans", v: -end.newInstCum, color: "#C0604B" }, { label: "upkeep", v: -end.upkeepCum, color: "#D59A7A" }, { label: "new debt still owed", v: -end.debtNew, color: "#A33D29" }, { label: "the home you sold", v: -end.ownGone, color: "#7A2E20" }].filter((p) => Math.abs(p.v) >= 1) },
          { label: `If you ${renting ? "keep renting" : "don't build"}`, parts: [{ label: "your own cash", v: r.cashStart, color: "#5B6773" }, { label: `growth at ${(+netRet.toFixed(2))}%`, v: bGrow, color: "#9AA6B2" }, { label: "planned settlements", v: -settle, color: "#C0604B" }].filter((p) => Math.abs(p.v) >= 1) },

      const econBars = (r) => {
        const end = r.months[r.months.length - 1];

                <Tile label={`Cash at move-in · ${fCal(occ)}`} value={fM(rc.onHand)} sub={<>your cash + loans − costs, no salary · <b>{fM(rc.bank)}</b> in the bank</>} help={EXPL.cashMoveIn} />
                <Tile label={`Lowest bank balance · ${fCal(r.minCashT)}`} value={fM(r.minCash)} tone={r.minCash < 0 ? K.neg : K.text} sub={r.minCash < 0 ? "runs short — this plan doesn't work" : inp.cashBuffer > 0 ? (r.minCash >= inp.cashBuffer ? `never below your ${fM(inp.cashBuffer)} cushion` : `below your ${fM(inp.cashBuffer)} cushion for ${r.belowBufferMonths} months; back ${r.recoveryMonths == null ? "never" : r.recoveryMonths === 0 ? "at move-in" : `${r.recoveryMonths} months after move-in`}`) : "never runs short"} help={EXPL.cashLow} />

              </div>
              <div className="note">In today's money: <b style={{ color: signCol(r.econPV) }}>{fM(r.econPV)}</b>. The money building takes earns {irr == null ? "a rate that can't be worked out here" : <b>{(irr * 100).toFixed(1)}% a year</b>}, against {(+netRet.toFixed(2))}% on cash. Your rule-7 measure: {fM(r.netWorthEnd)} vs {fM(r.renterEnd)} → <b style={{ color: signCol(r.advantage) }}>{fM(r.advantage)}</b>.</div>

              <div className="ev" style={{ borderBottom: "none", fontWeight: 600 }}><span className="d">{endDate}</span><span>Wealth {fM(r.econEnd)} vs {fM(r.econBaseEnd)} if you {renting ? "keep renting" : "don't build"}: <span style={{ color: signCol(r.econAdv) }}>{fM(r.econAdv)}</span>.</span></div>

      const whatIfFor = (id) => { const c = wi(id); return c && !c.partial ? c.data : c ? c.data : null; };
      const StepAnswer = () => {

      /* ---------- rental investment (kept simple here) ---------- */
      const OptionCard = ({ o, i }) => {
        const r = m.results[i], ok = r && r.affordable && r.cashOk && r.ltvOk;
        const flag = r ? (!r.ltvOk ? `${fM(r.fundingGap)} above the ${o.maxLtvPct}% loan-to-value limit` : !r.cashOk ? `needs ${fM(r.cashNeeded)} cash; you have ${fM(inp.cashAvailable)}` : !r.affordable ? `instalment is ${r.dbr.toFixed(0)}% of income (limit ${inp.dbrCap}%)` : null) : null;

              <div style={{ fontSize: 12.5, color: K.sub, lineHeight: 1.5 }}>{describeOption(o, inp, prj)}</div>
              {r && <div className="flex flex-wrap items-center" style={{ gap: "6px 14px", fontSize: 13, marginTop: 8 }}>
                <span className="tag" style={{ background: ok ? "#E2EFE9" : SOFT_NEG, color: ok ? K.pos : K.neg }}>{ok ? "✓ Works" : "✗ " + flag}</span>
                <span>levered return <b className="mono">{pct1(r.irr == null ? null : r.irr * 100)}</b></span>
                <span>NPV <b className="mono" style={{ color: signCol(r.npv) }}>{fM(r.npv)}</b></span>
                <span>instalment <b className="mono">{fSAR(r.monthlyPayment)}/mo</b></span>
              </div>}
              <More title="Edit this option">
                <Field label="Own cash" value={o.cashPct} min={0} max={100} step={1} unit="% of cost" onChange={(v) => setOpt(i, "cashPct", v)} hint={`= ${fM(prj.total * o.cashPct / 100)}`} />
                <Field label="Personal loan" value={o.plAmount} min={0} max={1500000} step={25000} unit="SAR" onChange={(v) => setOpt(i, "plAmount", v)} />
                {o.plAmount > 0 && <><Field label="Personal-loan rate" value={o.plRate} min={0} max={15} step={0.25} unit="%" onChange={(v) => setOpt(i, "plRate", v)} /><Field label="Personal-loan years" value={o.plTenure} min={1} max={7} step={1} unit="yrs" onChange={(v) => setOpt(i, "plTenure", v)} /></>}
                <Field label="Mortgage rate" value={o.rate} min={0} max={12} step={0.05} unit="%" onChange={(v) => setOpt(i, "rate", v)} />
                <Field label="Mortgage years" value={o.tenure} min={1} max={30} step={1} unit="yrs" onChange={(v) => setOpt(i, "tenure", v)} />
                <Field label="Grace period" value={o.graceMonths} min={0} max={36} step={1} unit="months" onChange={(v) => setOpt(i, "graceMonths", v)} />
                <Pick label="Profit during the grace period" value={o.graceMode} onChange={(v) => setOpt(i, "graceMode", v)} options={[["capitalize", "added to the loan"], ["interestOnly", "paid monthly"]]} />
                <Field label="Bank fee" value={o.feesPct} min={0} max={3} step={0.25} unit="% of loan" onChange={(v) => setOpt(i, "feesPct", v)} />
                <Field label="Bank's loan-to-value limit" value={o.maxLtvPct} min={50} max={100} step={5} unit="%" onChange={(v) => setOpt(i, "maxLtvPct", v)} />
              </More>
            </>}
          </div>
        );
      };
      const StepProperty = () => (
        <div>
          <Head id="property" title="The property" sub="What you buy or build to let, and what it costs." />
          <div className="no-print" style={{ marginBottom: 14 }}><Seg label="Build or buy" value={inp.acquire} onChange={(v) => set("acquire", v)} options={[["build", "Buy land and build"], ["buy", "Buy ready"]]} /></div>
          <div className="grid" style={twoCol}>
            <Box title={build ? "Land and construction" : "The purchase"}>
              {build ? <>
                <Field label="Land area" value={inp.landArea} min={150} max={2500} step={25} unit="m²" onChange={(v) => set("landArea", v)} />
                <Field label="Land price" value={inp.landPrice} min={300} max={15000} step={100} unit="SAR/m²" onChange={(v) => set("landPrice", v)} />
                <Field label="Total built-up area" value={inp.builtArea} min={100} max={2500} step={10} unit="m²" onChange={(v) => setMany({ builtArea: v, builtPct: 0 })} />
                <Field label="Construction cost" value={inp.buildCost} min={1000} max={7000} step={50} unit="SAR/m²" onChange={(v) => set("buildCost", v)} />
                <Field label="Construction takes" value={inp.buildMonths} min={6} max={36} step={1} unit="months" onChange={(v) => set("buildMonths", v)} />
              </> : <Field label="Price" value={inp.propertyPrice} min={300000} max={15000000} step={50000} unit="SAR" onChange={(v) => set("propertyPrice", v)} />}
              <Field label="Value growth" value={inp.appreciation} min={-5} max={12} step={0.5} unit="%/yr" onChange={(v) => set("appreciation", v)} />
              <Field label="Sell after" value={inp.exitYear} min={3} max={30} step={1} unit="yrs" onChange={(v) => set("exitYear", v)} />
              <Field label="Selling costs" value={inp.sellCostPct} min={0} max={12} step={0.5} unit="%" onChange={(v) => set("sellCostPct", v)} />
            </Box>
            <Box title="What it costs"><table className="bridge"><tbody>{costRows.map(([l, v]) => <tr key={l}><td>{l}</td><td className="v">{fSAR(v)}</td></tr>)}<tr className="tot"><td>All-in cost</td><td className="v">{fSAR(prj.total)}</td></tr></tbody></table></Box>
          </div>
        </div>
      );
      const StepLetting = () => (
        <div>
          <Head id="letting" title="Letting, and what the bank sees" />
          <div className="grid" style={twoCol}>
            <Box title="Letting">
              <Field label="Rent" value={inp.rentMo} min={2000} max={60000} step={500} unit="SAR/mo" onChange={(v) => set("rentMo", v)} hint={`gross yield ${pct1(inp.rentMo * 12 / prj.total * 100)} on the all-in cost`} />
              <Field label="Rent growth" value={inp.rentGrowth} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("rentGrowth", v)} />
              <Field label="Vacancy and collection loss" value={inp.vacancyPct} min={0} max={30} step={1} unit="%" onChange={(v) => set("vacancyPct", v)} />
              <Field label="Management" value={inp.mgmtPct} min={0} max={15} step={0.5} unit="% of rent" onChange={(v) => set("mgmtPct", v)} />
              <Field label="Zakat on net rent" value={inp.zakatPct} min={0} max={2.5} step={0.5} unit="%" onChange={(v) => set("zakatPct", v)} />
            </Box>
            <Box title="You">
              <Field label="Income" value={inp.income} min={5000} max={250000} step={1000} unit="SAR/mo" onChange={(v) => set("income", v)} />
              <Field label="Cash you can commit" value={inp.cashAvailable} min={0} max={8000000} step={50000} unit="SAR" onChange={(v) => set("cashAvailable", v)} />
              <Field label="Instalments may use" value={inp.dbrCap} min={30} max={70} step={1} unit="% of income" onChange={(v) => set("dbrCap", v)} />
              <Field label="Discount rate (NPV)" value={inp.discountRate} min={0} max={20} step={0.5} unit="%" onChange={(v) => set("discountRate", v)} />
              <Seg label="How rates are quoted" value={inp.rateQuote} onChange={(v) => set("rateQuote", v)} options={[["apr", "Rates as APR"], ["flat", "Rates as flat"]]} />
            </Box>
          </div>
        </div>
      );
      const StepRFin = () => <div><Head id="rfin" title="Four ways to fund it" sub="Own cash first, then a personal loan, then a mortgage for the rest." /><div className="grid" style={{ gap: 10 }}>{inp.options.map((o, i) => <React.Fragment key={i}>{OptionCard({ o, i })}</React.Fragment>)}</div></div>;
      const rentalRows = [["Works?", (r) => r.affordable && r.cashOk && r.ltvOk ? "yes" : "no"], ["Own cash in", (r) => fM(r.cash)], ["Personal loan", (r) => fM(r.pl)], ["Mortgage", (r) => fM(r.loanCommit)], ["Levered return (IRR)", (r) => pct1(r.irr == null ? null : r.irr * 100)], ["Property's own return", (r) => pct1(r.irrUnlev == null ? null : r.irrUnlev * 100)], [`NPV at ${inp.discountRate}%`, (r) => fM(r.npv)], ["Equity multiple", (r) => r.moic == null ? "—" : r.moic.toFixed(2) + "×"], ["Lowest debt-service cover", (r) => r.dscrMin == null ? "no debt" : r.dscrMin.toFixed(2) + "×"], ["Monthly instalment", (r) => `${fSAR(r.monthlyPayment)}/mo`], ["Profit paid to banks", (r) => fM(r.totalInterest)], ["Net sale proceeds", (r) => fM(r.exitProceeds)]];
      const StepRRes = () => (
        <div>
          <Head id="rres" title="Which capital stack earns the most?" sub={lead ? `${lead.opt.name}: ${pct1(lead.irr == null ? null : lead.irr * 100)} levered return vs ${pct1(lead.irrUnlev == null ? null : lead.irrUnlev * 100)} for the property itself. Verdict: ${m.verdict}.` : "Tick at least one option."} />
          <Box><div className="scroll-x"><table className="tbl">
            <thead><tr><th>Measure</th>{liveIdx.map((i) => <th key={i} style={{ borderTop: `4px solid ${PLAN_FILL[i]}` }}>{m.results[i].opt.name}</th>)}</tr></thead>
            <tbody>{rentalRows.map(([l, fn]) => <tr key={l}><td className="l">{l}</td>{liveIdx.map((i) => <td key={i}>{fn(m.results[i])}</td>)}</tr>)}</tbody>
          </table></div></Box>
        </div>
      );

      /* ---------- scenarios, footer, page ---------- */
      const ScenPanel = () => (
        <div className="no-print" style={{ maxWidth: 1480, margin: "12px auto 0", padding: "0 20px" }}>
          <Box title="Saved scenarios — shared with the current page" right={<span className="flex flex-wrap" style={{ gap: 8 }}><button className="btn small" onClick={doExport}>Export all</button><label className="btn small" style={{ cursor: "pointer" }}>Import<input type="file" accept="application/json" onChange={doImport} style={{ display: "none" }} /></label><button className="btn small" onClick={resetAll}>Start from the defaults</button><button className="btn small" onClick={() => setShowScen(false)}>Close</button></span>}>
            {savedRows.length === 0 ? <div style={{ fontSize: 13, color: K.sub }}>Nothing saved yet — use Save in the header.</div> : <div className="scroll-x"><table className="tbl">
              <thead><tr><th>Scenario</th><th>Saved</th><th>Cost</th><th>Result</th><th>Verdict</th><th></th></tr></thead>
              <tbody>{savedRows.map((s) => <tr key={s.n} style={{ background: s.n === loadedName ? SOFT : "transparent" }}>
                <td className="l"><b>{s.n}</b>{s.n === loadedName ? " · open" : ""}</td><td className="l">{s.at ? new Date(s.at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—"}</td>
                <td>{s.error ? "—" : fM(s.total)}</td><td style={{ color: s.metric == null ? K.sub : s.metric >= 0 ? K.pos : K.neg }}>{s.error ? "—" : s.metric == null ? "—" : s.home ? `${fM(s.metric)} vs not building` : `${pct1(s.metric)} IRR`}</td>
                <td style={{ color: s.vColor, fontWeight: 700 }}>{s.verdict || "—"}</td>
                <td><span className="flex" style={{ gap: 6, justifyContent: "flex-end" }}><button className="btn small" onClick={() => doLoad(s.n)}>Open</button><button className="btn small" aria-label={`Delete ${s.n}`} onClick={() => doDelete(s.n)}><Trash2 size={14} color={K.neg} /></button></span></td>
              </tr>)}</tbody>
            </table></div>}
          </Box>
        </div>
      );
      const StepFooter = () => (
        <div className="flex items-center justify-between no-print" style={{ gap: 10, marginTop: 22, paddingTop: 14, borderTop: `1px solid ${K.line}` }}>
          <button className="btn" onClick={() => go(stepI - 1)} disabled={stepI === 0}>← {stepI > 0 ? steps[stepI - 1][1] : "Back"}</button>
          <span style={{ fontSize: 12.5, color: K.sub }}>Step {stepI + 1} of {steps.length}</span>
          <button className="btn gold" onClick={() => go(stepI + 1)} disabled={stepI === steps.length - 1}>{stepI < steps.length - 1 ? `Next: ${steps[stepI + 1][1]}` : "Done"} →</button>
        </div>
      );
      const panels = home ? { money: StepMoney, loans: StepLoans, home: StepHome, pay: StepPay, when: StepWhen, answer: StepAnswer } : { property: StepProperty, letting: StepLetting, rfin: StepRFin, rres: StepRRes };
      const compactSummary = home ? `${fSAR(inp.income)}/mo income · ${fM(inp.cashAvailable)} cash · ${inp.existingLoans.filter((l) => l.balance > 0).length} old loans · ${build ? `${inp.landArea} m² land, ${Math.round(prj.builtArea)} m² build` : "ready home"} · ${fM(prj.total)} all-in` : `${fM(prj.total)} all-in · rent ${fSAR(inp.rentMo)}/mo`;

      return (
        <div>
          <header className="hdr">
            <div className="hdr-in">
              <div style={{ minWidth: 0, flex: "1 1 260px" }}>
                <div style={{ fontSize: 12, color: "#C8D3DF" }}><a href="index.html">All models</a> · <a href="realestate.html">current page</a></div>
                <div className="flex items-center flex-wrap" style={{ gap: 8, marginTop: 2 }}><b style={{ fontSize: 17 }}>Home financing</b><span className="pill">new layout · preview</span></div>
              </div>
              <div style={{ fontSize: 13, color: "#ECE4D3" }} title={dirty ? "changes not saved" : "saved"}>{loadedName ? <>“{loadedName}”{dirty && <span style={{ color: "#D9B36A" }} aria-label="unsaved changes"> ● unsaved</span>}</> : <span style={{ color: "#C8D3DF" }}>Working copy <span style={{ color: "#D9B36A" }}>● not saved</span></span>}</div>
              <div className="flex flex-wrap items-center no-print" style={{ gap: 8 }}>
                <Seg dark label="What are you deciding" value={inp.mode} onChange={(v) => { set("mode", v); setStep(0); setFocus(-1); setEditIdx(-1); }} options={[["home", "My home"], ["rental", "Rental"]]} />
                <button className="hbtn gold" onClick={quickSave}>Save</button>
                <button className="hbtn" onClick={() => setShowScen(!showScen)} aria-expanded={showScen}>Scenarios</button>
                <button className="hbtn" onClick={() => setPrintAll(true)}>Print / PDF</button>
              </div>
            </div>
          </header>
          {showScen && ScenPanel()}
          <nav className="stepper no-print" aria-label="Steps">
            <div className="stepper-in" ref={stepRow}>
              {steps.map(([id, label], i) => <button key={id} className={"st" + (i === stepI ? " on" : "") + (i < stepI ? " done" : "")} aria-current={i === stepI ? "step" : undefined} onClick={() => go(i)}><span className="n">{i < stepI ? "✓" : i + 1}</span>{label}</button>)}
            </div>
          </nav>
          <div className="shell">
            <aside className="rail rail-l" aria-label="Your inputs">{InputsRail()}</aside>
            <main style={{ minWidth: 0 }}>
              {banner === "main" && <div className="box no-print flex items-center flex-wrap" style={{ gap: 10, marginBottom: 12, padding: "10px 14px", fontSize: 13, background: SOFT_POS }}><span style={{ flex: "1 1 300px" }}>This preview started from the inputs on the current page. From now on it keeps its own copy; saved scenarios are shared between both pages.</span><button className="btn small" onClick={() => setBanner(null)}>Got it</button></div>}
              {termsNote && <div className="box no-print flex items-center flex-wrap" style={{ gap: 10, marginBottom: 12, padding: "10px 14px", fontSize: 13, background: SOFT_AMB }}><span style={{ flex: "1 1 300px" }}>{termsNote}</span><button className="btn small" onClick={() => setTermsNote(null)}>Got it</button></div>}
              <details className="box sum-compact no-print" style={{ marginBottom: 12, padding: "10px 14px" }}><summary style={{ cursor: "pointer", fontSize: 13 }}><b>Your inputs:</b> <span style={{ color: K.sub }}>{compactSummary}</span></summary>{InputsSummary()}</details>
              {printAll && home ? AnswerCore({ one: true }) : panels[cur]()}
              {!printAll && StepFooter()}
            </main>
            <aside className="rail rail-r" aria-label="What the bank will lend and your plans">{home && BankRail()}{PlansRail()}</aside>
          </div>
          {undo && <div className="toast no-print" role="status"><span>{undo.label}.</span><button onClick={() => { undo.restore(); setUndo(null); }}>Undo</button></div>}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
