<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Financing · New Layout (Preview)</title>
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script src="vendor/babel.js"></script>
  <script src="vendor/prop-types.js"></script>
  <script src="vendor/recharts.js"></script>
  <!-- shared palette / formatters / IRR from the flagship engine, the real-estate engine, then the page helpers -->
  <script src="engine.js"></script>
  <script src="re-engine.js"></script>
  <script src="re-ui.js"></script>
  <style>
    /* AA text colours for this page only (the shared palette also styles the clinic pages) */
    :root { --bg: #F1EDE4; --paper: #FBFAF6; --ink: #0E1A2B; --text: #1B2733; --sub: #56616C; --brass: #B0823A; --brassTx: #8A6427; --pos: #276B55; --neg: #A33D29; --line: #DBD4C5; --lineIn: #9C9381; --soft: #F3EFE6; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
    button { font-family: inherit; }
    .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
    .flex { display: flex; } .items-center { align-items: center; } .items-start { align-items: flex-start; } .justify-between { justify-content: space-between; } .flex-wrap { flex-wrap: wrap; } .grid { display: grid; }
    input[type=text], input[type=number], input[type=month], select, textarea { font-family: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--lineIn); border-radius: 6px; background: #fff; color: var(--text); max-width: 100%; min-height: 32px; }
    input[type=number] { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; text-align: right; }
    textarea { width: 100%; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; }
    input[type=checkbox], input[type=radio] { width: 18px; height: 18px; accent-color: #0E1A2B; flex: none; }
    :focus-visible { outline: 2px solid #2F6DB5; outline-offset: 2px; }
    /* sliders: 24-px touch height, visible track and thumb */
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; width: 100%; height: 24px; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: #CFC6B4; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; margin-top: -6px; background: #8A6427; border: 2px solid #fff; box-shadow: 0 0 0 1px #8A6427; }
    input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #CFC6B4; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #8A6427; border: 2px solid #fff; }
    /* header */
    .hdr { background: #0E1A2B; color: #ECE4D3; }
    .hdr-in { max-width: 1480px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .hdr a { color: #D9B36A; }
    .hbtn { background: transparent; color: #ECE4D3; border: 1px solid #3A4B62; border-radius: 7px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; min-height: 32px; }
    .hbtn.gold { background: #B0823A; border-color: #B0823A; color: #0E1A2B; }
    .hbtn:hover { border-color: #9DAEC0; }
    .pill { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: #D9B36A; color: #0E1A2B; }
    .seg { display: inline-flex; border: 1px solid var(--lineIn); border-radius: 8px; overflow: hidden; background: #fff; flex-wrap: wrap; }
    .seg button { border: none; background: transparent; padding: 6px 12px; font-size: 12.5px; font-weight: 600; color: var(--sub); cursor: pointer; min-height: 32px; }
    .seg button.on { background: #0E1A2B; color: #fff; }
    .seg.dark { border-color: #3A4B62; background: transparent; }
    .seg.dark button { color: #C8D3DF; }
    .seg.dark button.on { background: #B0823A; color: #0E1A2B; }
    /* step bar */
    .stepper { position: sticky; top: 0; z-index: 30; background: rgba(241,237,228,.97); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
    .stepper-in { max-width: 1480px; margin: 0 auto; padding: 8px 20px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .stepper-in::-webkit-scrollbar { display: none; }
    .st { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent; border-radius: 999px; padding: 6px 13px 6px 6px; font-size: 13px; font-weight: 600; color: var(--sub); cursor: pointer; white-space: nowrap; min-height: 34px; }
    .st .n { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #DBD4C5; color: #1B2733; }
    .st.done .n { background: #E2EFE9; color: var(--pos); }
    .st.on { background: #0E1A2B; color: #ECE4D3; }
    .st.on .n { background: #B0823A; color: #0E1A2B; }
    .st:hover:not(.on) { background: #E7E1D3; }
    @media (max-width: 820px) { .stepper { -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); } }
    /* three columns: inputs summary · the step · what the bank will lend and your plans */
    .shell { max-width: 1480px; margin: 0 auto; padding: 18px 20px 60px; display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
    .rail { position: sticky; top: 62px; max-height: calc(100vh - 74px); overflow: auto; scrollbar-width: thin; display: grid; gap: 14px; }
    .sum-compact { display: none; }
    @media (max-width: 1180px) { .shell { grid-template-columns: minmax(0, 1fr) 290px; } .rail-l { display: none; } .sum-compact { display: block; } }
    @media (max-width: 820px) { .shell { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 48px; } .rail { position: static; max-height: none; overflow: visible; } }
    /* cards and text */
    .box { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brassTx); }
    .h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; margin: 4px 0 6px; }
    .h2 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
    .lead { font-size: 13.5px; color: var(--sub); line-height: 1.55; max-width: 760px; }
    .note { font-size: 12px; color: var(--sub); line-height: 1.5; margin-top: 8px; }
    .lbl { font-size: 13px; color: var(--text); font-weight: 500; }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    .chip { display: inline-flex; gap: 6px; align-items: baseline; font-size: 12px; padding: 4px 9px; border-radius: 6px; background: #EFEAE0; color: var(--text); }
    .row-l { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; }
    .row-l .v { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; text-align: right; }
    .btn { display: inline-flex; align-items: center; gap: 6px; justify-content: center; border-radius: 8px; border: 1px solid var(--lineIn); background: #fff; color: var(--text); padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 34px; }
    .btn.gold { background: #B0823A; border-color: #B0823A; color: #0E1A2B; }
    .btn.ink { background: #0E1A2B; border-color: #0E1A2B; color: #fff; }
    .btn.small { padding: 4px 10px; font-size: 12.5px; min-height: 30px; }
    .btn:disabled { opacity: .55; cursor: default; }
    .lnk { background: none; border: none; color: var(--brassTx); font-weight: 600; font-size: 12.5px; cursor: pointer; padding: 4px 2px; min-height: 24px; text-decoration: underline; text-underline-offset: 2px; }
    /* help bubble: a real button; opens on tap, click, Enter; closes on Esc or a click elsewhere */
    .hint { position: relative; display: inline-flex; vertical-align: middle; margin-left: 4px; }
    .hint > button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid transparent; background: transparent; color: var(--sub); font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .hint > button span { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; line-height: 1; }
    .hint > button[aria-expanded=true] { color: var(--ink); }
    .hint .pop { position: absolute; z-index: 50; top: 26px; left: -8px; width: min(320px, 80vw); background: #0E1A2B; color: #ECE4D3; font-size: 12.5px; font-weight: 400; line-height: 1.5; letter-spacing: 0; text-transform: none; padding: 10px 12px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); text-align: left; white-space: normal; }
    /* disclosure */
    details.dis { border-top: 1px solid var(--line); }
    details.dis > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 2px; font-size: 14px; font-weight: 700; min-height: 44px; }
    details.dis > summary::-webkit-details-marker { display: none; }
    details.dis > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--brassTx); border-bottom: 2px solid var(--brassTx); transform: rotate(-45deg); transition: transform .15s; flex: none; margin: 0 4px; }
    details.dis[open] > summary::before { transform: rotate(45deg); }
    details.dis > summary .s { font-weight: 400; font-size: 12.5px; color: var(--sub); }
    details.dis > .body { padding: 2px 0 14px; }
    details.adv { border: 1px dashed var(--lineIn); border-radius: 9px; padding: 0 12px; margin-top: 10px; background: #FBFAF6; }
    details.adv > summary { list-style: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--sub); padding: 10px 0; min-height: 40px; display: flex; align-items: center; gap: 8px; }
    details.adv > summary::-webkit-details-marker { display: none; }
    details.adv > summary::before { content: "+"; font-weight: 700; color: var(--brassTx); width: 14px; }
    details.adv[open] > summary::before { content: "−"; }
    details.adv > .adv-body { padding: 2px 0 10px; }
    /* tables */
    .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .tbl th { text-align: right; font-size: 12px; font-weight: 700; color: #fff; background: #15263B; padding: 8px 10px; white-space: normal; vertical-align: bottom; }
    .tbl th:first-child, .tbl td.l { text-align: left; }
    .tbl td { padding: 6px 10px; border-bottom: 1px solid #E6E0D3; text-align: right; font-family: 'SF Mono', ui-monospace, Menlo, monospace; white-space: nowrap; }
    .tbl td.l { font-family: inherit; white-space: normal; }
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.bridge { border-collapse: collapse; font-size: 12.5px; width: 100%; }
    table.bridge td { padding: 4px 8px 4px 0; border-bottom: 1px dotted #E2DCCD; vertical-align: top; }
    table.bridge td.v { text-align: right; font-family: 'SF Mono', ui-monospace, Menlo, monospace; white-space: nowrap; }
    table.bridge tr.tot td { font-weight: 700; border-top: 1.5px solid #1B2430; border-bottom: none; }
    table.bridge .n { color: var(--sub); font-size: 12px; }
    /* timeline */
    .ev { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid #ECE7DA; font-size: 13px; line-height: 1.5; }
    .ev .d { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--sub); padding-top: 1px; }
    .ev.hi { background: #FBF6EA; }
    @media (max-width: 640px) { .ev { grid-template-columns: 1fr; gap: 2px; } }
    /* plan cards */
    .plan { background: var(--paper); border: 1px solid var(--line); border-left-width: 5px; border-radius: 10px; padding: 12px 14px; }
    .plan.off { padding: 8px 12px; }
    .toast { position: fixed; z-index: 60; left: 50%; bottom: 18px; transform: translateX(-50%); background: #0E1A2B; color: #ECE4D3; border-radius: 10px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: calc(100vw - 32px); }
    .toast button { background: #B0823A; color: #0E1A2B; border: none; border-radius: 7px; padding: 6px 12px; font-weight: 700; cursor: pointer; min-height: 32px; }
    .wf-row { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(120px, 2fr) 92px; gap: 10px; align-items: center; padding: 5px 0; font-size: 12.5px; }
    .wf-track { position: relative; height: 18px; }
    .wf-bar { position: absolute; top: 2px; height: 14px; border-radius: 3px; }
    @media (max-width: 640px) { .wf-row { grid-template-columns: 1fr 90px; } .wf-track { grid-column: 1 / -1; order: 3; } }
    @media print {
      @page { margin: 11mm; }
      body { background: #fff !important; }
      .no-print, .stepper, .rail-r .no-print, .toast { display: none !important; }
      .shell { display: block; padding: 0; max-width: none; }
      .rail { position: static; max-height: none; overflow: visible; }
      .rail-l { display: block !important; }
      .sum-compact { display: none !important; }
      .box, .plan { break-inside: avoid; }
      input[type=range] { display: none !important; }
      .scroll-x { overflow: visible; }
      .tbl { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.jsx" data-presets="react"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect, useRef } = React;
    const { LineChart, AreaChart, BarChart, Line, Area, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend, ReferenceLine, ReferenceDot } = window.Recharts;

    /* AA palette for this page; plan colours fixed per slot (fills) with darker text versions */
    const K = { text: "#1B2733", sub: "#56616C", brass: "#B0823A", brassTx: "#8A6427", pos: "#276B55", neg: "#A33D29", line: "#DBD4C5", ink: "#0E1A2B", paper: "#FBFAF6" };
    const PLAN_FILL = ["#2F6DB5", "#B0823A", "#1F9A80", "#A24FB8"], PLAN_TEXT = ["#245A99", "#8A6427", "#1A6E5C", "#87409B"];
    const STORE_KEY = "re_scenarios";            // shared with the current page
    const CUR_KEY = "re_preview_current";        // this page's own autosave
    const MAIN_KEY = "re_current";               // the current page's autosave (used once, to start from your inputs)
    const SOFT = "#F3EFE6", SOFT_NEG = "#F7E9E5", SOFT_POS = "#E6F0EC", SOFT_AMB = "#FBEFD9";
    const tipStyle = { fontFamily: SANS, fontSize: 12, border: `1px solid ${K.line}`, borderRadius: 6 };
    const axisT = { fontFamily: MONO, fontSize: 12, fill: K.sub };
    const axisS = { fontFamily: SANS, fontSize: 12, fill: K.sub };
    const signCol = (v) => v >= 0 ? K.pos : K.neg;
    const calText = (s) => String(s || "").replace(/\b(?:at |in )?month (\d+)\b/g, (_, n) => `in ${fCal(+n)}`);

    /* ---------- building blocks ---------- */
    // help bubble: a button that opens on tap / click / Enter and closes on Esc or a click elsewhere
    function Hint({ text, label }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        if (!open) return;
        const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        const esc = (e) => { if (e.key === "Escape") setOpen(false); };
        document.addEventListener("mousedown", close); document.addEventListener("touchstart", close); document.addEventListener("keydown", esc);
        return () => { document.removeEventListener("mousedown", close); document.removeEventListener("touchstart", close); document.removeEventListener("keydown", esc); };
      }, [open]);
      if (!text) return null;
      return <span className="hint no-print" ref={ref}><button type="button" aria-expanded={open} aria-label={label ? `How is "${label}" worked out?` : "How is this worked out?"} onClick={() => setOpen(!open)}><span>i</span></button>{open && <span className="pop" role="note">{text}</span>}</span>;
    }
    // slider with a number box (type a value) and a 24-px touch height
    function Field({ label, value, min, max, step, unit, onChange, hint, help, show }) {
      const [txt, setTxt] = useState(null);
      const v = value == null ? 0 : value;
      const commit = () => { if (txt == null) return; const n = parseFloat(String(txt).replace(/[^0-9.\-]/g, "")); if (!isNaN(n)) onChange(n); setTxt(null); };
      return (
        <div style={{ marginBottom: 14 }}>
          <div className="flex items-center justify-between" style={{ gap: 8 }}>
            <label className="lbl" style={{ minWidth: 0 }}>{label}<Hint text={help} label={label} /></label>
            <span className="flex items-center" style={{ gap: 4, flex: "none" }}>
              <input type="text" inputMode="decimal" aria-label={label} value={txt != null ? txt : (show ? show(v) : (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-US") : String(+v.toFixed(2))))} onChange={(e) => setTxt(e.target.value)} onFocus={(e) => { setTxt(String(v)); setTimeout(() => e.target.select(), 0); }} onBlur={commit} onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { setTxt(null); e.target.blur(); } }} style={{ width: Math.abs(v) >= 100000 ? 104 : 76, textAlign: "right", fontFamily: MONO, fontSize: 12.5, padding: "4px 6px", minHeight: 30 }} />
              {unit && <span style={{ fontSize: 12, color: K.sub, minWidth: 0 }}>{unit}</span>}
            </span>
          </div>
          <input type="range" aria-label={label} min={min} max={max} step={step} value={Math.min(max, Math.max(min, v))} onChange={(e) => onChange(parseFloat(e.target.value))} />
          {hint && <div style={{ fontSize: 12, color: K.sub, marginTop: 1, lineHeight: 1.45 }}>{hint}</div>}
        </div>
      );
    }
    function NumIn({ v, on, w, dec, label, nullable, placeholder }) {
      const [t, setT] = useState(null);
      const show = v == null || v === "" ? "" : dec ? String(v) : Math.round(v).toLocaleString("en-US");
      const commit = () => { if (t == null) return; const s = t.trim(); if (s === "") on(nullable ? null : 0); else { const n = parseFloat(s.replace(/[^0-9.\-]/g, "")); if (!isNaN(n)) on(n); } setT(null); };
      return <input type="text" inputMode="decimal" aria-label={label} placeholder={placeholder} value={t != null ? t : show} onChange={(e) => setT(e.target.value)} onFocus={() => setT(v == null ? "" : String(v))} onBlur={commit} onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }} style={{ width: w || 90, textAlign: "right", fontFamily: MONO, fontSize: 12.5, padding: "4px 6px", minHeight: 30 }} />;
    }
    // a month of the plan (0 = month 0 of the scenario) chosen as a calendar month
    const monthKeyOf = (idx) => reMonthKey(new Date(RE_T0.getFullYear(), RE_T0.getMonth() + Math.round(idx || 0), 1));
    const idxOfMonthKey = (k) => { const mm = /^(\d{4})-(\d{2})$/.exec(k || ""); return mm ? (+mm[1] - RE_T0.getFullYear()) * 12 + (+mm[2] - 1 - RE_T0.getMonth()) : null; };
    function MonthField({ label, value, min, max, onChange, hint, help }) {
      const v = Math.round(value || 0);
      return (
        <div style={{ marginBottom: 14 }}>
          <div className="flex items-center justify-between" style={{ gap: 8 }}>
            <label className="lbl">{label}<Hint text={help} label={label} /></label>
            <input type="month" aria-label={label} value={monthKeyOf(v)} min={monthKeyOf(min)} max={monthKeyOf(max)} onChange={(e) => { const i = idxOfMonthKey(e.target.value); if (i != null) onChange(Math.max(min, Math.min(max, i))); }} style={{ minHeight: 30, padding: "3px 6px", fontSize: 12.5 }} />
          </div>
          <input type="range" aria-label={label} min={min} max={max} step={1} value={Math.min(max, Math.max(min, v))} onChange={(e) => onChange(parseFloat(e.target.value))} />
          {hint && <div style={{ fontSize: 12, color: K.sub, marginTop: 1, lineHeight: 1.45 }}>{hint}</div>}
        </div>
      );
    }
    const Seg = ({ value, options, onChange, dark, label }) => (
      <div className={"seg" + (dark ? " dark" : "")} role="radiogroup" aria-label={label}>
        {options.map(([id, l]) => <button key={id} type="button" role="radio" aria-checked={value === id} className={value === id ? "on" : ""} onClick={() => onChange(id)}>{l}</button>)}
      </div>
    );
    const Pick = ({ label, value, onChange, options, hint, help }) => (
      <div style={{ marginBottom: 12 }}>
        {label && <label className="lbl" style={{ display: "block", marginBottom: 4 }}>{label}<Hint text={help} label={label} /></label>}
        <select value={value} onChange={(e) => onChange(e.target.value)} style={{ width: "100%" }}>{options.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>
        {hint && <div style={{ fontSize: 12, color: K.sub, marginTop: 3, lineHeight: 1.45 }}>{hint}</div>}
      </div>
    );
    const Tick = ({ checked, onChange, label, sub }) => (
      <label className="flex items-start" style={{ gap: 8, fontSize: 13, cursor: "pointer", margin: "4px 0 10px", lineHeight: 1.4 }}>
        <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} /> <span>{label}{sub && <span style={{ display: "block", fontSize: 12, color: K.sub }}>{sub}</span>}</span>
      </label>
    );
    const Box = ({ title, right, children, style, help }) => (
      <section className="box" style={style}>
        {(title || right) && <div className="flex items-center justify-between flex-wrap" style={{ gap: 8, marginBottom: 10 }}>{title && <h3 className="h2" style={{ margin: 0 }}>{title}<Hint text={help} label={typeof title === "string" ? title : null} /></h3>}{right}</div>}
        {children}
      </section>
    );
    const More = ({ title, children, open }) => <details className="adv" open={open}><summary>{title}</summary><div className="adv-body">{children}</div></details>;
    // a disclosure whose body is computed only once it is opened
    const Dis = ({ id, title, sub, open, onToggle, children }) => (
      <details className="dis" open={open} onToggle={(e) => onToggle(id, e.currentTarget.open)}>

    /* ---------- pictures (plain HTML/CSS bars: crisp, print well) ---------- */
    // how a figure adds up, as a waterfall: each step starts where the last one ended
    function Waterfall({ rows, totalLabel, total }) {
      let run = 0; const pts = rows.map((x) => { const a = run; run += x.v; return { ...x, a, b: run }; });
      const lo = Math.min(0, ...pts.map((x) => Math.min(x.a, x.b))), hi = Math.max(1, ...pts.map((x) => Math.max(x.a, x.b)), total);

            <div className="mono" style={{ textAlign: "right" }}>{fM(total)}</div>
          </div>
        </div>
      );
    }
    // two stacked bars on one scale: what you end up with if you build, and if you don't
    function WealthBars({ bars }) {
      const ends = bars.map((b) => b.parts.reduce((a, p) => a + p.v, 0));
      const tops = bars.map((b) => b.parts.filter((p) => p.v > 0).reduce((a, p) => a + p.v, 0));

                <div style={{ position: "relative", height: segs.some((s) => s.row) ? 48 : 24 }}>
                  {segs.map((s, k) => <div key={k} title={`${s.label}: ${fM(s.v)}`} style={{ position: "absolute", top: s.row ? 26 : 0, height: 22, left: `${pos(s.a)}%`, width: `${Math.max(0.4, pos(s.b) - pos(s.a))}%`, background: s.color, borderRight: "1px solid #fff", color: "#fff", fontSize: 12, lineHeight: "22px", paddingLeft: 5, overflow: "hidden", whiteSpace: "nowrap" }}>{pos(s.b) - pos(s.a) > 11 ? `${s.label} ${fS(Math.abs(s.v))}` : ""}</div>)}
                  <div style={{ position: "absolute", top: -2, bottom: -2, left: `${pos(ends[i])}%`, borderLeft: `2px solid ${K.ink}` }} />
                </div>
              </div>
            );
          })}

            {[...new Map(bars.flatMap((b) => b.parts).map((p) => [p.label, p.color])).entries()].map(([l, c]) => <span key={l} className="flex items-center" style={{ gap: 5 }}><span style={{ width: 11, height: 11, borderRadius: 2, background: c, display: "inline-block" }} />{l}</span>)}
          </div>
        </div>
      );
    }

    const RailGroup = ({ title, onEdit, children }) => (
      <div style={{ padding: "10px 0", borderTop: `1px solid ${K.line}` }}>
        <div className="flex justify-between items-center" style={{ marginBottom: 4 }}><b style={{ fontSize: 13 }}>{title}</b>{onEdit && <button className="lnk no-print" onClick={onEdit}>Edit</button>}</div>
