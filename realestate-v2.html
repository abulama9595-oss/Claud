  <style>
    /* AA text colours for this page only (the shared palette also styles the clinic pages) */
    :root { --bg: #F1EDE4; --paper: #FBFAF6; --ink: #0E1A2B; --text: #1B2733; --sub: #56616C; --brass: #B0823A; --brassTx: #8A6427; --pos: #276B55; --neg: #A33D29; --line: #DBD4C5; --lineIn: #9C9381; --soft: #F3EFE6; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
    body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
    button { font-family: inherit; }
    .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
    .flex { display: flex; } .items-center { align-items: center; } .items-start { align-items: flex-start; } .justify-between { justify-content: space-between; } .flex-wrap { flex-wrap: wrap; } .grid { display: grid; grid-template-columns: minmax(0, 1fr); }
    select { min-width: 0; }   /* a list with long choices must not widen its column (phones) */
    input[type=text], input[type=number], input[type=month], select, textarea { font-family: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--lineIn); border-radius: 6px; background: #fff; color: var(--text); max-width: 100%; min-height: 32px; }
    input[type=number] { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; text-align: right; }
    textarea { width: 100%; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; }
    input[type=checkbox], input[type=radio] { width: 18px; height: 18px; accent-color: #0E1A2B; flex: none; }
    :focus-visible { outline: 2px solid #2F6DB5; outline-offset: 2px; }

    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; width: 100%; height: 24px; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: #CFC6B4; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; margin-top: -6px; background: #8A6427; border: 2px solid #fff; box-shadow: 0 0 0 1px #8A6427; }

    /* disclosure */

    .ev.warn { background: #F7E9E5; font-weight: 600; }

    /* plan cards */
    .plan { background: var(--paper); border: 1px solid var(--line); border-left-width: 5px; border-radius: 10px; padding: 12px 14px; min-width: 0; }

<body>
  <div id="root"></div>

  <script type="text/babel" src="components.jsx" data-presets="react"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect, useRef } = React;
    const { LineChart, AreaChart, BarChart, Line, Area, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend, ReferenceLine, ReferenceDot } = window.Recharts;

    /* AA palette for this page; plan colours fixed per slot (fills) with darker text versions */
    const K = { text: "#1B2733", sub: "#56616C", brass: "#B0823A", brassTx: "#8A6427", pos: "#276B55", neg: "#A33D29", line: "#DBD4C5", ink: "#0E1A2B", paper: "#FBFAF6" };
    const PLAN_FILL = ["#2F6DB5", "#B0823A", "#1F9A80", "#A24FB8", "#C2569A", "#5B8C2A", "#C76B1F", "#4B5FC1"], PLAN_TEXT = ["#245A99", "#8A6427", "#1A6E5C", "#87409B", "#9A3A78", "#4A7022", "#9A5410", "#3D4EA3"];
    const MAX_PLANS = 8;                         // plans you can compare at once
    const STORE_KEY = "re2_scenarios";            // saved scenarios (on the studio site they sync to its server)
    const CUR_KEY = "re2_current";                // your working copy, autosaved in this browser
    const OPEN_KEY = "re2_current_name";          // the saved scenario your working copy belongs to (stays in this browser)
    const SOFT = "#F3EFE6", SOFT_NEG = "#F7E9E5", SOFT_POS = "#E6F0EC", SOFT_AMB = "#FBEFD9";
    const tipStyle = { fontFamily: SANS, fontSize: 12, border: `1px solid ${K.line}`, borderRadius: 6 };
    const axisT = { fontFamily: MONO, fontSize: 12, fill: K.sub };
    const axisS = { fontFamily: SANS, fontSize: 12, fill: K.sub };
    const signCol = (v) => v >= 0 ? K.pos : K.neg;

                <Field label="Your spouse's income growth" value={jt.incomeGrowth == null || jt.incomeGrowth === "" ? (inp.incomeGrowth || 0) : +jt.incomeGrowth} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => setJoint("incomeGrowth", v)} hint={jt.incomeGrowth == null || jt.incomeGrowth === "" ? "the same as yours until you change it" : "once a year; their limit follows their income"} />
              </div>
            </div>}
            {jointOn ? <div className="note">Your spouse's salary and their loans run through the household's money whether you {W.act.replace(/^(buy|build)ing/, "$1")} or not, so the comparison stays like for like. Add their loans in the next step.</div>
              : <div className="note" style={{ marginTop: 0 }}>Off: the bank tests your income alone.</div>}
          </Box>
          <More title="More: growth of income and living costs, your recovery rule, dates">
            <div className="grid" style={twoCol}>
              <div>
                <Field label="Income growth" value={inp.incomeGrowth || 0} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("incomeGrowth", v)} hint={(inp.incomeGrowth || 0) > 0 ? `steps up once a year (${fSAR(inp.income * (1 + inp.incomeGrowth / 100))}/mo from ${fCal(13)}); the bank's limits follow your income` : "0 = your income stays as it is"} />
                <Field label="Living-cost growth" value={inp.livingGrowth || 0} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("livingGrowth", v)} hint={`once a year, the same whether you ${W.act.replace(/^(buy|build)ing/, "$1")} or not`} />
              </div>
              <div>
                <Field label="Cash back at your cushion within" value={inp.recoveryMonths} min={0} max={60} step={6} unit={`months after ${W.doneShort}`} onChange={(v) => set("recoveryMonths", v)} hint="your rule: a plan that takes longer is marked slow to recover" />
                <div style={{ marginBottom: 12 }}>
                  <label className="lbl" style={{ display: "block", marginBottom: 4 }}>Month 0 of this scenario</label>
                  <input type="month" value={inp.asOf || ""} onChange={(e) => e.target.value && set("asOf", e.target.value)} />
                  <div className="note" style={{ marginTop: 3 }}>Every date counts from here. A saved scenario keeps its own month 0; changing it moves the dates only — bring your cash and loans up to date too.</div>
                </div>
              </div>
            </div>
          </More>
        </div>
      );

      /* ---------- step 2: your loans ---------- */
      // the settle-or-keep advisor's row for a loan (yours: owner A; your spouse's: B)
      const adviceFor = (l, spouse) => (household.settleAdvice || []).find((a) => String(a.id) === String(l.id) && a.owner === (spouse ? "B" : "A")) || null;
      const firstSentence = (s) => { const mm = /^(.*?[.!?])(\s|$)/.exec(String(s || "")); return mm ? mm[1] : String(s || ""); };
      const verdictCol = (v) => v === "keep" ? K.pos : v === "room" ? K.brassTx : K.text;
      // a list of existing loans (yours, or your spouse's under تضامن) as an editable table
      const loanTable = (loans, setList, spouse) => {
        const upd = (i, k, v) => setList(loans.map((l, j) => j === i ? { ...l, [k]: v } : l));
        const inst = loans.reduce((a, l) => a + (l.balance > 0 ? +l.installment || 0 : 0), 0), bal = loans.reduce((a, l) => a + (+l.balance || 0), 0);
        const word = spouse ? "Spouse's loan" : "Loan";
        const securedOnProp = (l) => props.find((P) => reSecuredOn(l, P)) || null;
        return <>
              <div className="scroll-x">
                <table className="tbl">
                  <thead><tr><th>Loan</th><th>Type</th><th>Balance</th><th>Monthly</th><th>Months left</th><th>Rate</th>{loanMore && <><th>Months since it started</th><th>Settle in month</th><th>May be paid off from cash?</th><th>May the bank buy it out?</th></>}<th style={{ minWidth: 190 }}>Keep or settle?<Hint text={EXPL.settleAdvice} label="Keep or settle?" /></th><th className="no-print" style={{ width: 36 }}></th></tr></thead>
                  <tbody>
                    {loans.map((l, i) => { const P = securedOnProp(l), a = l.balance > 0 && l.installment > 0 ? adviceFor(l, spouse) : null; return (
                      <tr key={l.id || i}>
                        <td className="l"><input type="text" dir="auto" aria-label={`${word} name`} value={l.name} onChange={(e) => upd(i, "name", e.target.value)} style={{ width: "100%", minWidth: 120 }} />{P && <div className="chip" style={{ marginTop: 4, fontSize: 11.5 }}>secured on <b dir="auto">{P.name}</b> — set in Your properties</div>}</td>
                        <td><select aria-label={`${l.name}: type`} value={P || l.type === "mortgage" ? "mortgage" : "personal"} disabled={!!P} onChange={(e) => upd(i, "type", e.target.value)} style={{ minHeight: 30, padding: "3px 4px", fontSize: 12 }}><option value="personal">Personal</option><option value="mortgage">Mortgage</option></select></td>
                        <td><NumIn v={l.balance} on={(v) => upd(i, "balance", v)} w={108} label={`${l.name}: balance`} /></td>
                        <td><NumIn v={l.installment} on={(v) => upd(i, "installment", v)} w={86} label={`${l.name}: monthly instalment`} /></td>
                        <td><NumIn v={l.monthsLeft} on={(v) => upd(i, "monthsLeft", Math.round(v))} w={56} label={`${l.name}: months left`} /><div style={{ fontSize: 12, color: K.sub }}>ends {fCal(loanEnds(l))}</div></td>
                        <td>
                          <span className="flex items-center" style={{ gap: 4, justifyContent: "flex-end" }}><NumIn v={l.rate} on={(v) => upd(i, "rate", v)} w={56} dec label={`${l.name}: rate`} /><select aria-label={`${l.name}: rate type`} value={l.rateType === "flat" ? "flat" : "apr"} onChange={(e) => upd(i, "rateType", e.target.value)} style={{ minHeight: 30, padding: "3px 4px", fontSize: 12 }}><option value="apr">APR</option><option value="flat">hamish</option></select></span>
                          {l.rateType === "flat" && <div style={{ fontSize: 12, color: K.sub }}>≈ {reFlatToApr(l.rate, Math.max(1, Math.round((l.ageMonths || 0) + (l.monthsLeft || 0)))).toFixed(2)}% APR</div>}
                        </td>
                        {loanMore && <>
                          <td><NumIn v={l.ageMonths} nullable on={(v) => upd(i, "ageMonths", v == null ? null : Math.round(v))} w={56} placeholder="—" label={`${l.name}: months since it started`} /></td>
                          <td><NumIn v={l.settleAt} nullable on={(v) => upd(i, "settleAt", v == null ? null : Math.round(v))} w={56} placeholder="—" label={`${l.name}: settle in month`} />{l.settleAt != null && l.settleAt > 0 && <div style={{ fontSize: 12, color: K.sub }}>{fCal(l.settleAt)}</div>}</td>
                          <td><input type="checkbox" aria-label={`${l.name}: may be paid off from cash`} checked={l.canSettle !== false} onChange={(e) => upd(i, "canSettle", e.target.checked)} /></td>
                          <td><input type="checkbox" aria-label={`${l.name}: the bank may buy it out`} checked={l.canRefi !== false} onChange={(e) => upd(i, "canRefi", e.target.checked)} /></td>
                        </>}
                        <td className="l" style={{ maxWidth: 300 }}>{a ? <><b style={{ color: verdictCol(a.verdict) }}>{RE_SETTLE_VERDICT[a.verdict]}</b><Hint text={a.why} label={`${l.name}: keep or settle?`} /><div style={{ fontSize: 12, color: K.sub, lineHeight: 1.4 }}>{firstSentence(a.why)}</div></> : <span style={{ color: K.sub }}>—</span>}</td>
                        <td className="no-print"><button aria-label={`Remove ${l.name}`} title="Remove" onClick={() => withUndo(`Removed ${l.name}`, () => setList(loans.filter((_, j) => j !== i)))} style={{ ...iconBtn, padding: 6 }}><Trash2 size={16} color={K.neg} /></button></td>
                      </tr>
                    ); })}
                    <tr style={{ background: SOFT, fontWeight: 700 }}><td className="l">Total ({loans.length})</td><td></td><td>{fSAR(bal)}</td><td>{fSAR(inst)}</td><td></td><td></td>{loanMore && <><td></td><td></td><td></td><td></td></>}<td></td><td className="no-print"></td></tr>
                  </tbody>
                </table>
              </div>
              {loans.length > 0 && <div style={{ fontSize: 12, color: K.sub, marginTop: 6, lineHeight: 1.45 }}>Type: a <b>personal</b> loan counts as one of the two personal loans the bank allows at once and may be bought out by a new personal loan or paid off to make room for a mortgage; a <b>mortgage</b> never does — it counts in the {inp.mortgageCap}% mortgage limit instead. "Keep or settle?" weighs each loan's yearly rate (APR) against the new money that would replace it and against what your cash earns.</div>}
              <div className="flex flex-wrap no-print" style={{ gap: 8, marginTop: 10 }}>
                <button className="btn small" onClick={() => setList([...loans, { id: spouse ? `s${Date.now()}` : Date.now(), name: `${word} ${loans.length + 1}`, balance: 100000, installment: 2500, monthsLeft: 48, rate: 6 }])}>+ Add a loan</button>
                {loans.length > 0 && <button className="btn small" onClick={() => withUndo(spouse ? "Removed all your spouse's loans" : "Removed all loans", () => setList([], true))}>Remove all</button>}
              </div>
        </>;
      };
      const StepLoans = () => {
        const loans = inp.existingLoans;
        const inst = loans.reduce((a, l) => a + (l.balance > 0 ? +l.installment || 0 : 0), 0);
        const instS = spouseLoans.reduce((a, l) => a + (l.balance > 0 ? +l.installment || 0 : 0), 0);
        const parsed = loanTxt.trim() ? parseLoans(loanTxt) : [];
        return (
          <div>
            <Head id="loans" title="What do you already owe?" sub={jointOn ? "The bank counts these instalments first, each against its owner's income; what is left of each of your limits decides how much it can lend (a joint mortgage may use both). Paying one off, or the bank buying one of yours out, frees room." : `The bank counts these instalments first; what is left of your ${inp.dbrCap}% limit decides how much it can lend. Paying one off, or the bank buying it out with a new personal loan, frees room.`} />
            <Box title={`Your loans · ${fSAR(inst)}/mo · ${inp.income > 0 ? (inst / inp.income * 100).toFixed(0) : 0}% of ${jointOn ? "your " : ""}income`} right={<button className="lnk no-print" onClick={() => setLoanMore(!loanMore)}>{loanMore ? "Fewer columns" : "More: age, settle date, permissions"}</button>}>
              {loanTable(loans, setLoans, false)}
              {household.warnings.filter((w) => !/^Plan \d+ mortgages/.test(w)).length > 0 && <div style={{ background: SOFT_AMB, borderRadius: 8, padding: "8px 12px", marginTop: 10, fontSize: 12.5, lineHeight: 1.5 }}>{household.warnings.filter((w) => !/^Plan \d+ mortgages/.test(w)).map((w, k) => <div key={k} className="flex items-start" style={{ gap: 6 }}><AlertTriangle size={14} color={K.brassTx} style={{ flex: "none", marginTop: 3 }} /><span>{w}</span></div>)}</div>}
              <div className="note">"May be paid off from cash" unticked: no plan pays it off early (keep cheap debt). "May the bank buy it out" unticked: no new personal loan clears it. "Settle in month": you clear it from your cash then — whether you {W.act.replace(/^(buy|build)ing/, "$1")} or not. The bank can buy a personal loan out once it is {inp.refiMinMonths} months old. A flat (hamish) rate is converted to the yearly rate (APR) it amortises at, over its whole term (months since it started + months left).</div>
              <More title="Import or paste loans (Qist export, or one per line: name, balance, instalment, months, rate)">
                <textarea rows={4} value={loanTxt} onChange={(e) => setLoanTxt(e.target.value)} placeholder={'[{"name":"Personal loan","balance":350000,"installment":7900,"monthsLeft":54,"rate":6.5}]\nor\nCar finance; 95000; 2950; 36; 5'} aria-label="Loans to import" />
                {parsed.length > 0 ? <div style={{ marginTop: 8 }}>
                  <div style={{ fontSize: 12.5, marginBottom: 4 }}>Found {parsed.length} loan{parsed.length > 1 ? "s" : ""}:</div>
                  {parsed.map((l, k) => <div key={k} className="mono" style={{ fontSize: 12 }}>{l.name} · {fSAR(l.balance)} · {fSAR(l.installment)}/mo · {l.monthsLeft} months · {l.rate}%</div>)}
                  <div className="flex flex-wrap" style={{ gap: 8, marginTop: 8 }}>
                    <button className="btn gold small" onClick={() => withUndo(`Replaced your loans with ${parsed.length} imported`, () => { setLoans(parsed, true); setLoanTxt(""); })}>Replace my loans with these</button>
                    <button className="btn small" onClick={() => { setLoans([...loans, ...parsed]); setLoanTxt(""); }}>Add them to my loans</button>
                    {jointOn && <button className="btn small" onClick={() => { setJoint("loans", [...spouseLoans, ...parsed.map((l, k) => ({ ...l, id: `s${Date.now()}${k}`, canRefi: false }))]); setLoanTxt(""); }}>Add them to my spouse's loans</button>}
                  </div>
                </div> : loanTxt.trim() ? <div className="note" style={{ color: K.neg }}>Nothing recognisable yet — check the format (separate columns with tabs or semicolons if your numbers contain commas).</div> : null}
              </More>
            </Box>
            {jointOn && <Box title={`Your spouse's loans · ${fSAR(instS)}/mo · ${hj && hj.income > 0 ? (instS / hj.income * 100).toFixed(0) : 0}% of their income`} style={{ marginTop: 14 }} help={EXPL.joint}>
              {loanTable(spouseLoans, (l) => setJoint("loans", l), true)}
              <div className="note"><AR />: these count against your spouse's income only (their limit is {hj ? hj.capPctB : "—"}%). The household pays them whether you {W.act.replace(/^(buy|build)ing/, "$1")} or not; a plan may pay one off from your cash only to make room for a joint mortgage, if you allow it ("More" columns). Their own personal loans may buy them out when a plan says your spouse takes personal loans.</div>
            </Box>}
            <Box title="When borrowing room opens up" style={{ marginTop: 14 }} help={EXPL.capacity}>
              <div className="scroll-x"><table className="tbl">
                <thead><tr>{["From", ...((inp.incomeGrowth || 0) > 0 ? [hj ? "Your income" : "Income"] : []), hj ? "Your instalments" : "Instalments running", hj ? `Your free room (${hj.capPctA}%)` : `Free room in your ${inp.dbrCap}%`, ...(hj ? [`Your spouse's free room (${hj.capPctB}%)`] : []), hj ? `Joint mortgages (each ≤ ${inp.mortgageCap}%)` : `All mortgages (≤ ${inp.mortgageCap}%)`, `One personal loan${hj ? ", yours" : ""} (≤ ${inp.perLoanCap}%)`, "Two personal loans"].map((h) => <th key={h}>{h}</th>)}</tr></thead>
                <tbody>{household.capTimeline.map((c) => <tr key={c.t}><td className="l">{capWhy(c)}</td>{(inp.incomeGrowth || 0) > 0 && <td>{fSAR(c.income)}</td>}<td>{fSAR(c.inst)} <span style={{ color: K.sub }}>({(c.inst / c.income * 100).toFixed(0)}%)</span></td><td style={{ color: c.room > 0 ? K.text : K.neg }}>{fSAR(c.room)}/mo</td>{hj && <td style={{ color: (c.roomB || 0) > 0 ? K.text : K.neg }}>{fSAR(c.roomB || 0)}/mo</td>}<td>{fM(c.maxMortgage)}</td><td>{fM(c.maxOnePl)}</td><td>{fM(c.maxTwoPl)}</td></tr>)}</tbody>
              </table></div>
              <div className="note">What the free room converts to at your Bank terms (How to pay), before the share of a property's value the bank lends against. Mortgages and personal loans share the same room — alternatives, not added together. Never more than two personal loans at once (your old ones count); a plan can still borrow earlier by having the bank buy an old loan out.</div>
            </Box>
            <More title="The bank's rules: limits, how much of a property's value it lends, buy-outs, settlement fee">
              <div className="grid" style={twoCol}>
                <div>
                  <Field label="All instalments together may use" value={inp.dbrCap} min={30} max={70} step={1} unit="% of income" onChange={(v) => set("dbrCap", v)} />
                  <Field label="All mortgages together may use" value={inp.mortgageCap} min={20} max={70} step={1} unit="% of income" onChange={(v) => set("mortgageCap", v)} />
                  <Field label="One personal loan may use" value={inp.perLoanCap} min={15} max={65} step={1} unit="% of income" onChange={(v) => set("perLoanCap", v)} hint="a second personal loan may use what is left" />
                  <Field label="Bank's ceiling on one personal loan" value={inp.plCap} min={100000} max={3000000} step={50000} unit="SAR" onChange={(v) => set("plCap", v)} />
                </div>
                <div>
                  {isLand ? <Field label="The bank lends up to — on land alone" value={inp.landOnlyLtv} min={30} max={90} step={5} unit="% of the price" onChange={(v) => set("landOnlyLtv", v)} hint="SAMA: 70% on land that is not built on" /> : <Field label={`The bank lends up to — on the ${build ? "land you buy" : "home you buy"}`} value={inp.landLtv} min={30} max={95} step={5} unit="% of the price" onChange={(v) => set("landLtv", v)} />}
                  <Field label="…on a property you already own" value={inp.ownedLtv} min={30} max={90} step={5} unit="% of its value" onChange={(v) => set("ownedLtv", v)} hint="the default for a property you add; each property can have its own" />
                  {!isLand && <Field label={`…as a cash-out on the finished ${isBuilding ? "building" : "home"}`} value={inp.cashoutLtv} min={30} max={90} step={5} unit="% of its value" onChange={(v) => set("cashoutLtv", v)} />}
                  <Pick label="When a plan takes personal loans and you have old ones" value={inp.refiStyle === "consolidate" ? "consolidate" : "topup"} onChange={(v) => set("refiStyle", v)} options={[["topup", "Top up each old loan with its own bank (recommended)"], ["consolidate", "Let a new bank buy several out into one or two new loans"]]} hint={inp.refiStyle === "consolidate" ? "the previous tool's way: old loans are combined into the new loans to free a slot" : "each old loan stays one loan: its bank refinances it at your personal-loan terms and pays you the rest; old loans are combined into a new loan only when the new loan is cheaper"} />
                  <Field label="The bank may buy a personal loan out after" value={inp.refiMinMonths} min={0} max={36} step={1} unit="months" onChange={(v) => set("refiMinMonths", v)} />
                  <Field label="Early-settlement fee" value={inp.settleFeeMonths} min={0} max={3} step={1} unit="months of profit" onChange={(v) => set("settleFeeMonths", v)} hint="SAMA cap: the next 3 months' profit on the declining balance" />
                </div>
              </div>
            </More>
          </div>
        );
      };

      /* ---------- step 0: your project — the picker, then the project's fields in shared blocks ---------- */
      const KIND_CARDS = [["landVilla", "Buy land and build a villa", "You buy a plot, build, and move in when it is finished."], ["land", "Buy land only", "You buy a plot and hold it — to sell later, or to build on later."], ["landBuilding", "Buy land and build a residential building", "You build units to let; you may live in one of them."], ["readyBuilding", "Buy a ready residential building", "You buy a finished building with units; you may live in one."], ["readyVilla", "Buy a ready villa", "You buy a finished home and move in after finishing it."]];
      const pickKind = (k) => setInp((s) => { const q = { ...s, kind: k, acquire: RE_KINDS[k] && RE_KINDS[k].acquire ? RE_KINDS[k].acquire : s.acquire }; if (/Building$/.test(k) && !(+s.unitCount > 0)) { q.unitCount = 4; q.unitRentBasis = "pct"; if (!(+s.unitRentPct > 0)) q.unitRentPct = 6; } if ((s.buildStart || 0) < (s.landMonth || 0)) q.buildStart = s.landMonth; return q; });
      // "Build later" is not a sixth kind: the villa, with construction 24 months after the land is bought
      const buildLater = () => setInp((s) => ({ ...s, kind: "landVilla", buildStart: (s.landMonth || 0) + 24 }));
      const laterGap = inp.kind === "landVilla" && prj.start > prj.landMonth ? prj.start - prj.landMonth : 0;
      const sellYearOpts = [["0", "never — hold it"], ...Array.from({ length: inp.horizon }, (_, k) => [String(k + 1), `year ${k + 1} (${fCal((k + 1) * 12)})`])];
      const kindLine = `${W.gerund}${isBuilding ? (letAll ? " — let out entirely" : " — you live in one unit, the rest is let") : isLand ? (inp.landSellYear > 0 ? ` — sold in year ${inp.landSellYear}` : " — held") : ""}`;
      const KindPicker = () => {
        if (!pickOpen) return <div className="box flex items-center flex-wrap" style={{ gap: 10, padding: "10px 14px", marginBottom: 14, fontSize: 13.5 }}><span>You are <b>{kindLine}</b>{laterGap > 0 ? <span className="chip" style={{ marginLeft: 8 }}>land first, construction {laterGap} months later</span> : null}</span><button className="lnk no-print" onClick={() => setPickOpen(true)}>change</button></div>;
        const focusCard = (el, j) => { const c = el && el.parentElement && el.parentElement.children[j]; if (c && c.focus) c.focus(); };
        const onKey = (e, k, i) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickKind(k); }
          else if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); const j = (i + 1) % KIND_CARDS.length; pickKind(KIND_CARDS[j][0]); focusCard(e.currentTarget, j); }
          else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); const j = (i + KIND_CARDS.length - 1) % KIND_CARDS.length; pickKind(KIND_CARDS[j][0]); focusCard(e.currentTarget, j); }
        };
        const stopIn = { onClick: (e) => e.stopPropagation(), onKeyDown: (e) => e.stopPropagation() };
        return (
          <div className="box" style={{ marginBottom: 14 }}>
            <div className="flex justify-between items-center flex-wrap" style={{ gap: 8, marginBottom: 10 }}><h3 className="h2" style={{ margin: 0 }}>What are you buying or building?</h3><button className="btn small no-print" onClick={() => setPickOpen(false)}>Done</button></div>
            <div className="kgrid" role="radiogroup" aria-label="Your project">
              {KIND_CARDS.map(([k, title, line], i) => { const on = inp.kind === k; return (
                <div key={k} role="radio" aria-checked={on} tabIndex={on ? 0 : -1} className={"kcard" + (on ? " on" : "")} onClick={() => pickKind(k)} onKeyDown={(e) => onKey(e, k, i)}>
                  <div className="flex items-start" style={{ gap: 8 }}><span className="kmark" aria-hidden="true">{on ? "✓" : ""}</span><div style={{ minWidth: 0 }}><div style={{ fontSize: 14, fontWeight: 700, lineHeight: 1.3 }}>{title}</div><div style={{ fontSize: 12.5, color: K.sub, lineHeight: 1.45, marginTop: 3 }}>{line}</div></div></div>
                  {on && /Building$/.test(k) && <div className="ksub" {...stopIn}>
                    <Seg label="Who lives in it" value={inp.occupancy === "let" ? "let" : "liveLet"} onChange={(v) => set("occupancy", v)} options={[["liveLet", "I live in one unit, the rest is let"], ["let", "Let out entirely"]]} />
                    <div className="note" style={{ marginTop: 6 }}>Live in one: you move in and the other units' rent comes in. Let entirely: you stay where you are.</div>
                  </div>}
                  {on && k === "land" && <div className="ksub" {...stopIn}>
                    <Seg label="Hold it or build later" value="hold" onChange={(v) => { if (v === "later") buildLater(); }} options={[["hold", `Hold it — sell in year ${inp.landSellYear > 0 ? inp.landSellYear : "…"}`], ["later", "Build later"]]} />
                    <div style={{ marginTop: 8, maxWidth: 320 }}><Pick label="Sell it in" value={String(inp.landSellYear || 0)} onChange={(v) => set("landSellYear", +v > 0 ? +v : null)} options={sellYearOpts} /></div>
                  </div>}
                </div>); })}
            </div>
            {laterGap > 0 && <div className="chip" style={{ marginTop: 10 }}>land first, construction {laterGap} months later — change the dates below</div>}
          </div>
        );
      };
      // taxes and relief: under the land or purchase box (first-home relief applies to the villa kinds only)
      const TaxFields = () => <>
        <Field label="VAT" value={inp.vatPct} min={0} max={20} step={1} unit="%" onChange={(v) => set("vatPct", v)} hint={isLand ? "land carries no VAT" : "on construction and finishing; land carries none"} />
        <Field label="Real-estate transfer tax" value={inp.rettPct} min={0} max={10} step={0.5} unit="%" onChange={(v) => set("rettPct", v)} />
        {!isLand && !isBuilding && <Tick checked={inp.firstHomeExempt} onChange={(v) => set("firstHomeExempt", v)} label={`First-home relief (REDF / Sakani support): the state pays the transfer tax on the first ${fM(inp.rettExemptCap)}; the rest is taxed`} />}
      </>;
      const LandFields = () => (
        <Box title="Land">
          <Field label="Land area" value={inp.landArea} min={150} max={isLand ? 20000 : 2500} step={isLand ? 50 : 25} unit="m²" onChange={(v) => set("landArea", v)} />
          <Field label="Land price" value={inp.landPrice} min={300} max={15000} step={100} unit="SAR/m²" onChange={(v) => set("landPrice", v)} hint={`land ${fM(prj.land)}${prj.landMonth > 0 ? ` in ${fCal(prj.landMonth)}` : ""}`} />
          <MonthField label="Buy the land in" value={inp.landMonth} min={0} max={72} onChange={(v) => setInp((s) => ({ ...s, landMonth: v, buildStart: Math.max(s.buildStart, v) }))} hint={`today's price grown ${inp.appreciation}%/yr until then${isLand ? ` · the land is paid for ${fCal(prj.occupy)}` : ""}`} />
          <More title="More: broker's fee, land values, taxes and relief">
            <Field label="Broker's fee on the land" value={inp.landBrokerPct == null ? 2.5 : inp.landBrokerPct} min={0} max={5} step={0.25} unit="%" onChange={(v) => set("landBrokerPct", v)} />
            <Field label="Land values grow" value={inp.appreciation} min={-5} max={12} step={0.5} unit="%/yr" onChange={(v) => set("appreciation", v)} hint={prj.construct ? `the land; the building ages instead (${dep}% a year — "Building loses value" under Construction › More)` : null} help={EXPL.value} />
            {TaxFields()}
          </More>
        </Box>
      );
      const BuildFields = () => (
        <Box title="Construction">
          <Field label="Ground floor, as % of the land" value={inp.builtPct} min={0} max={100} step={5} unit="%" onChange={(v) => set("builtPct", v)} hint={inp.builtPct > 0 ? `${Math.round(inp.landArea * inp.builtPct / 100)} m² per floor · 0 = type the total area instead` : "0 = type the total built-up area below"} />
          {inp.builtPct > 0 ? <Field label="Floors" value={inp.floors} min={1} max={isBuilding ? 8 : 4} step={0.5} unit="floors" onChange={(v) => set("floors", v)} hint={`built-up ${Math.round(prj.builtArea)} m²`} /> : <Field label="Total built-up area" value={inp.builtArea} min={100} max={isBuilding ? 6000 : 2500} step={10} unit="m²" onChange={(v) => set("builtArea", v)} />}
          <Field label="Construction cost, turnkey" value={inp.buildCost} min={1000} max={7000} step={50} unit="SAR/m²" onChange={(v) => set("buildCost", v)} hint={`${fM(prj.hard)} before VAT${prj.inflate > 1 ? `, incl. ${((prj.inflate - 1) * 100).toFixed(0)}% price rises to the start` : ""}`} />
          <Field label="Construction takes" value={inp.buildMonths} min={6} max={36} step={1} unit="months" onChange={(v) => set("buildMonths", v)} />
          <MonthField label="Start building in" value={curStart} min={0} max={72} onChange={(v) => setInp((s) => ({ ...s, buildStart: Math.max(v, s.landMonth) }))} hint={`${letAll ? "let from" : "you move in"} ${fCal(prj.occupy)}${prj.inflate > 1 ? ` · construction ${((prj.inflate - 1) * 100).toFixed(0)}% dearer than today` : ""} · not sure? the When step tests every start`} />
          <More title="More: design and permits, contingency, overrun, extras, price rises, value uplift, the building's ageing">
            <Field label="Design, permits, supervision" value={inp.softPct} min={0} max={20} step={0.5} unit="% of construction" onChange={(v) => set("softPct", v)} />
            <Field label="Contingency" value={inp.contPct} min={0} max={25} step={1} unit="%" onChange={(v) => set("contPct", v)} hint="overruns are the norm — keep at least 5%" />
            <Field label="Cost overrun (a stress test)" value={inp.overrunPct || 0} min={0} max={30} step={1} unit="%" onChange={(v) => set("overrunPct", v)} hint="extra cost on construction, design, contingency and extras — it adds no value" />
            <Field label="Kitchen, AC, landscape" value={inp.finishExtra} min={0} max={800000} step={10000} unit="SAR" onChange={(v) => set("finishExtra", v)} />
            <Field label="Construction price rises" value={inp.costInflation} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("costInflation", v)} />
            <Field label="Value uplift of building it yourself" value={inp.devMarginPct} min={-20} max={40} step={1} unit="%" onChange={(v) => set("devMarginPct", v)} hint={`on what you build, not the land: the building is worth ${fM(prj.buildValue)} when finished`} help={EXPL.value} />
            <Field label="Building loses value" value={dep} min={0} max={5} step={0.25} unit="% a year" onChange={(v) => set("buildDeprPct", v)} hint={dep > 0 ? `${fM(prj.buildValue * dep / 100)} a year from completion (straight-line); the land keeps growing ${inp.appreciation}% a year` : "0 = the building keeps its value; the land still grows"} help={EXPL.buildDepr} />
          </More>
        </Box>
      );
      const ReadyFields = () => { const split = inp.readyLandShare != null && inp.readyLandShare !== "" && !isNaN(+inp.readyLandShare); return (
        <Box title="The purchase">
          <Field label="Price" value={inp.propertyPrice} min={300000} max={isBuilding ? 40000000 : 15000000} step={50000} unit="SAR" onChange={(v) => set("propertyPrice", v)} />
          {!isBuilding && <Field label="Plot size" value={inp.landArea} min={100} max={5000} step={10} unit="m²" onChange={(v) => set("landArea", v)} hint="the land the villa stands on — for the listing; the price is what counts" />}
          <Field label={isBuilding ? "Built-up area" : "Villa size"} value={inp.builtArea} min={100} max={isBuilding ? 6000 : 2500} step={10} unit="m²" onChange={(v) => set("builtArea", v)} hint={isBuilding ? "for the rent per m² and the cost per m²" : "the villa's built-up area, for the cost per m²"} />
          <Field label="Finishing, furnishing" value={inp.finishExtra} min={0} max={800000} step={10000} unit="SAR" onChange={(v) => set("finishExtra", v)} />
          <MonthField label="Buy in" value={inp.landMonth} min={0} max={72} onChange={(v) => setInp((s) => ({ ...s, landMonth: v, buildStart: v }))} hint={`${letAll ? "let from" : "you move in"} ${fCal(prj.occupy)} · today's price grown ${inp.appreciation}%/yr until then`} />
          <More title="More: broker, the building's age and ageing, values, taxes and relief">
            <Field label="Broker" value={inp.brokerPct} min={0} max={5} step={0.5} unit="%" onChange={(v) => set("brokerPct", v)} />
            <Tick checked={split} onChange={(v) => setMany(v ? { readyLandShare: 40 } : { readyLandShare: null })} label="Value the land and the building apart" sub="the land grows with the market while the building ages; off = the whole price grows with the market" />
            {split && <Field label="Land's share of the price" value={+inp.readyLandShare} min={0} max={100} step={5} unit="%" onChange={(v) => set("readyLandShare", v)} />}
            {split && <Field label="Age of the building" value={+inp.readyAge || 0} min={0} max={40} step={1} unit="years" onChange={(v) => set("readyAge", v)} />}
            {split && <Field label="Building loses value" value={dep} min={0} max={5} step={0.25} unit="% a year" onChange={(v) => set("buildDeprPct", v)} help={EXPL.buildDepr} />}
            <Field label={isBuilding ? "Property values grow" : "Home values grow"} value={inp.appreciation} min={-5} max={12} step={0.5} unit="%/yr" onChange={(v) => set("appreciation", v)} help={EXPL.value} />
            {TaxFields()}
          </More>
        </Box>); };
      const UnitsFields = () => { const L = prj.letting, pct = inp.unitRentBasis !== "unit"; return (
        <Box title="The units" help={EXPL.letting}>
          <Field label="Number of units" value={inp.unitCount || 0} min={1} max={40} step={1} unit="units" onChange={(v) => set("unitCount", Math.round(v))} />
          <div style={{ marginBottom: 10 }}><Seg label="Rent entered as" value={pct ? "pct" : "unit"} onChange={(v) => setInp((s) => ({ ...s, unitRentBasis: v, ...(v === "pct" && !(+s.unitRentPct > 0) ? { unitRentPct: 6 } : {}), ...(v === "unit" && !(+s.unitRent > 0) ? { unitRent: Math.round(L.perUnit / 50) * 50 || 3500 } : {}) }))} options={[["pct", "% of the all-in cost a year"], ["unit", "Rent per unit a month"]]} /></div>
          {pct ? <Field label="Rent, as % of the all-in cost" value={+inp.unitRentPct || 0} min={0} max={15} step={0.25} unit="%/yr" onChange={(v) => set("unitRentPct", v)} hint={`the whole building's rent a year = ${fSAR(prj.total * (+inp.unitRentPct || 0) / 100)} on the all-in cost of ${fM(prj.total)} · ${fSAR(L.perUnit)} per unit a month`} />
            : <Field label="Rent per unit" value={inp.unitRent || 0} min={0} max={30000} step={250} unit="SAR/mo" onChange={(v) => set("unitRent", v)} hint={prj.total > 0 ? `= ${((L.perUnit * L.units * 12) / prj.total * 100).toFixed(2)}% of the all-in cost a year` : null} />}
          <div className="note" style={{ marginTop: 0, marginBottom: 10 }}><b>{L.letUnits} unit{L.letUnits === 1 ? "" : "s"} let</b>{letAll ? "" : " (you live in one)"} → <b className="mono">{fSAR(L.grossAnnual)}</b> a year, <b className="mono">{fSAR(L.netAnnual)}</b> after empty months and management · from {fCal(prj.occupy + 1)}{inp.rentFreezeUntil ? `, flat until ${inp.rentFreezeUntil} (rent freeze)` : ""}. The bank does not count this rent as income.</div>
          <Field label="Empty" value={inp.vacancyPct} min={0} max={30} step={1} unit="% of the year" onChange={(v) => set("vacancyPct", v)} />
          <Field label="Management" value={inp.mgmtPct} min={0} max={15} step={0.5} unit="% of rent" onChange={(v) => set("mgmtPct", v)} hint="+ VAT on the fee" />
          <Field label="Rent growth" value={inp.rentGrowth} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("rentGrowth", v)} hint={renting ? "also raises the rent you pay today" : null} />
        </Box>); };
      const LettingFields = () => (
        <Box title="Living in it — or letting it" help={EXPL.rentOut}>
          <Seg label="Living in it or letting it" value={lettingOut ? "all" : (inp.partRentAnnual || 0) > 0 || (inp.partRentPct || 0) > 0 ? "part" : "live"} onChange={(v) => setInp((s) => v === "live" ? { ...s, partRentAnnual: 0, partRentPct: 0, rentOutPct: 0, rentOutFixed: 0 } : v === "part" ? { ...s, rentOutPct: 0, rentOutFixed: 0, partRentPct: s.partRentPct > 0 || s.partRentAnnual > 0 ? s.partRentPct || 0 : 1.5 } : { ...s, partRentAnnual: 0, partRentPct: 0, rentOutPct: s.rentOutPct > 0 || s.rentOutFixed > 0 ? s.rentOutPct : 5 })} options={[["live", "Live in it"], ["part", "Live in it, let part"], ["all", "Let all of it"]]} />
          <div style={{ marginTop: 12 }}>
            {!lettingOut && ((inp.partRentAnnual || 0) > 0 || (inp.partRentPct || 0) > 0) && <>
              <Field label="Rent for the part you let (annex, floor), as % of the all-in cost" value={inp.partRentPct || 0} min={0} max={8} step={0.25} unit="%/yr" onChange={(v) => set("partRentPct", v)} hint={(inp.partRentAnnual || 0) > 0 ? "not used — the fixed rent below is set" : `= ${fSAR(prj.total * (inp.partRentPct || 0) / 100)} a year from ${fCal(prj.occupy + 1)}, rising with rent growth (${inp.rentGrowth}%/yr) · net of its own costs`} />
              <Field label="…or a fixed rent" value={inp.partRentAnnual || 0} min={0} max={400000} step={5000} unit="SAR/yr" onChange={(v) => set("partRentAnnual", v)} hint={(inp.partRentAnnual || 0) > 0 ? "overrides the %" : "0 = use the % above"} />
            </>}
            {lettingOut && <>
              <Field label="Rent, as % of the all-in cost" value={inp.rentOutPct || 0} min={0} max={12} step={0.25} unit="%/yr" onChange={(v) => set("rentOutPct", v)} hint={(inp.rentOutFixed || 0) > 0 ? "not used — the fixed rent below is set" : `= ${fSAR(prj.total * (inp.rentOutPct || 0) / 100)} a year from ${fCal(prj.occupy + 1)}`} />
              <Field label="…or a fixed rent" value={inp.rentOutFixed || 0} min={0} max={1000000} step={5000} unit="SAR/yr" onChange={(v) => set("rentOutFixed", v)} hint={(inp.rentOutFixed || 0) > 0 ? "overrides the %" : "0 = use the % above"} />
            </>}
            <Field label="Rent growth" value={inp.rentGrowth} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("rentGrowth", v)} hint={renting ? "also raises the rent you pay today" : null} />
          </div>
        </Box>
      );
      const HoldFields = () => (
        <Box title="While you hold it" help={EXPL.landSale}>
          <Pick label="Sell it in" value={String(inp.landSellYear || 0)} onChange={(v) => set("landSellYear", +v > 0 ? +v : null)} options={sellYearOpts} hint={prj.saleAt != null ? `sold ${fCal(prj.saleAt)} for about ${fM(prj.valueAt(prj.saleAt) * (1 - inp.landSellCostPct / 100))} after selling costs; a mortgage on the land is repaid from it` : "held to the end of the comparison; its value then counts as yours"} />
          {inp.landSellYear > 0 && <Field label="Selling costs" value={inp.landSellCostPct} min={0} max={12} step={0.5} unit="% of its value" onChange={(v) => set("landSellCostPct", v)} hint="broker 2.5% + transfer tax 5% as a rule" />}
          <More title="More: white-land fee, zakat">
            <div style={{ marginBottom: 12 }}><label className="lbl" style={{ display: "block", marginBottom: 4 }}>Zakat on the land<Hint text={EXPL.landZakat} label="Zakat on the land" /></label><Seg label="Zakat on the land" value={inp.landZakat === "trade" ? "trade" : "none"} onChange={(v) => set("landZakat", v)} options={[["none", "None — held for yourself"], ["trade", `Held to sell — ${RE_LAND_ZAKAT_PCT}% a year`]]} /></div>
            <Field label={<>White-land fee (<span lang="ar">رسوم الأراضي البيضاء</span>)</>} value={inp.whiteLandPct || 0} min={0} max={10} step={0.5} unit="% of value a year" onChange={(v) => set("whiteLandPct", v)} help={EXPL.whiteLand} hint={prj.holding && prj.holding.whitePct > 0 ? `charged from ${fCal(prj.holding.whiteFrom)} while your plots add up to ${fSAR(prj.holding.area)} m²` : (inp.whiteLandPct || 0) > 0 ? `not charged: your plots add up to ${fSAR((+inp.landArea || 0) + (+inp.whiteLandOtherArea || 0))} m², below ${fSAR(RE_WHITE_LAND_MIN_AREA)}` : "0 = outside the fee's zones"} />
            <Field label="Other undeveloped plots you own in the city" value={inp.whiteLandOtherArea || 0} min={0} max={20000} step={100} unit="m²" onChange={(v) => set("whiteLandOtherArea", v)} />
          </More>
        </Box>
      );
      const MarketFields = () => (
        <Box title="Market and the comparison">
          <Field label="Your cash earns" value={inp.altReturn} min={0} max={15} step={0.5} unit="%/yr" onChange={(v) => set("altReturn", v)} hint={`on both sides: what your cash would earn if you ${W.baseIf.replace(/^keep your cash invested$/, "kept it invested")}`} />
          <Field label="Zakat on invested cash" value={inp.cashZakatPct || 0} min={0} max={2.5} step={0.5} unit="%/yr" onChange={(v) => set("cashZakatPct", v)} hint={(inp.cashZakatPct || 0) > 0 ? `cash then grows ${((1 + inp.altReturn / 100) * (1 - inp.cashZakatPct / 100) * 100 - 100).toFixed(2)}% a year, on both sides; a home you live in is exempt` : "0 = not counted"} />
          <MonthField label="Compare until" value={inp.horizon * 12} min={60} max={360} onChange={(v) => set("horizon", Math.max(5, Math.min(30, Math.round(v / 12))))} hint={`${inp.horizon} years`} />
          <More title={isLand ? "More: rent freeze" : "More: upkeep, rent freeze"}>
            {!isLand && <Field label="Maintenance" value={inp.maintPct} min={0} max={3} step={0.1} unit="% of value a year" onChange={(v) => set("maintPct", v)} />}
            {!isLand && <Field label="Insurance and fees" value={inp.insurance} min={0} max={20000} step={500} unit="SAR/yr" onChange={(v) => set("insurance", v)} />}
            <div style={{ marginBottom: 12 }}>
              <label className="lbl" style={{ display: "block", marginBottom: 4 }}>Rent freeze until<Hint text={EXPL.rentFreeze} label="Rent freeze" /></label>
              <span className="flex items-center flex-wrap" style={{ gap: 8 }}><input type="month" aria-label="Rent freeze until" value={inp.rentFreezeUntil || ""} onChange={(e) => set("rentFreezeUntil", e.target.value || null)} />{inp.rentFreezeUntil ? <button className="lnk no-print" onClick={() => set("rentFreezeUntil", null)}>no freeze</button> : <span style={{ fontSize: 12, color: K.sub }}>blank = no freeze (a city other than Riyadh)</span>}</span>
            </div>
          </More>
        </Box>
      );
      // what it costs, and what it is worth — the rows branch on the kind
      const costRows = prj.construct
        ? [["Land", prj.land], [`Transfer tax on the land (${inp.rettPct}%)`, prj.rett, reRettNote(inp, prj)], [`Broker's fee on the land (${inp.landBrokerPct}%)`, prj.landBroker], ["Construction", prj.hard], ["Design, permits, supervision", prj.soft], ["Contingency", prj.cont], ["Kitchen, AC, landscape", prj.finish], [`Cost overrun (${inp.overrunPct}%)`, prj.overrun], [`VAT ${inp.vatPct}%`, prj.vat]].filter(([, v], k) => v > 0.5 || ![2, 7].includes(k))
        : isLand ? [["Land", prj.land], [`Transfer tax (${inp.rettPct}%)`, prj.rett, reRettNote(inp, prj)], [`Broker's fee (${inp.landBrokerPct}%)`, prj.landBroker]].filter(([, v], k) => v > 0.5 || k < 2)
        : [["Purchase price", prj.price], [`Transfer tax (${inp.rettPct}%)`, prj.rett, reRettNote(inp, prj)], [`Broker's fee (${inp.brokerPct}%)`, prj.broker, `${inp.brokerPct}% of ${fSAR(prj.price)}`], ["Finishing, furnishing", prj.finish], [`VAT ${inp.vatPct}% on finishing`, prj.vat]];
      const vw = (() => { const occ = prj.occupy - 1, landMove = prj.landValueAt(occ), end = prj.valueAt(H), landEnd = prj.landValueAt(H); return { landMove, end, landEnd, bldEnd: end - landEnd, yrs: Math.max(0, Math.round((H - occ) / 12)) }; })();
      const CostBox = () => (
        <Box title="What it costs, and what it is worth" help={EXPL.cost}>
          <table className="bridge"><tbody>
            {costRows.map(([l, v, n]) => <tr key={l}><td>{l}{n && <div className="n">{n}</div>}</td><td className="v">{fSAR(v)}</td></tr>)}
            <tr className="tot"><td>All-in cost</td><td className="v">{fSAR(prj.total)}</td></tr>
            {prj.construct && prj.builtArea > 0 && <tr><td>Cost per m² built (without the land)</td><td className="v">{fSAR(prj.costPerSqm)}</td></tr>}
            <tr><td colSpan={2} style={{ paddingTop: 12, fontWeight: 700 }}>What it is worth<Hint text={EXPL.value} label="What it is worth" /></td></tr>
            {prj.construct ? <>
              <tr><td>Land, grown {inp.appreciation}% a year to {fCal(prj.occupy)}</td><td className="v">{fSAR(vw.landMove)}</td></tr>
              <tr><td>Building: (construction + design + extras) × (1 + {inp.devMarginPct}% uplift)<div className="n">contingency, overrun, VAT, tax and fees add no value</div></td><td className="v">{fSAR(prj.buildValue)}</td></tr>
              <tr className="tot"><td>Value {letAll ? "when it is let" : "when you move in"} ({fCal(prj.occupy)})</td><td className="v" style={{ color: prj.value0 >= prj.total ? K.pos : K.neg }}>{fSAR(prj.value0)}</td></tr>
              <tr><td>Value in {endDate}<div className="n">land {fM(vw.landEnd)} (still growing) + building {fM(vw.bldEnd)} (after {vw.yrs} years at −{dep}% a year)</div></td><td className="v">{fSAR(vw.end)}</td></tr>
            </> : isLand ? <>
              <tr><td>Land, grown {inp.appreciation}% a year{prj.saleAt != null ? ` to ${fCal(prj.saleAt)}` : ` to ${endDate}`}<div className="n">tax and the broker's fee add no value{prj.holding && (prj.holding.whitePct > 0 || prj.holding.zakatPct > 0) ? `; holding it costs ${fSAR(prj.holdingAt(prj.landMonth + 13) * 12)} a year at first` : ""}</div></td><td className="v">{fSAR(prj.saleAt != null ? prj.valueAt(prj.saleAt) : vw.end)}</td></tr>
              {prj.saleAt != null && <tr className="tot"><td>Sold in {fCal(prj.saleAt)} for … after {inp.landSellCostPct}% selling costs</td><td className="v">{fSAR(prj.valueAt(prj.saleAt) * (1 - inp.landSellCostPct / 100))}</td></tr>}
            </> : <>
              <tr className="tot"><td>Value {letAll ? "when it is let" : "when you move in"} ({fCal(prj.occupy)})</td><td className="v" style={{ color: prj.value0 >= prj.total ? K.pos : K.neg }}>{fSAR(prj.value0)}</td></tr>
              <tr><td>Value in {endDate}<div className="n">{inp.readyLandShare != null && inp.readyLandShare !== "" ? `land ${fM(vw.landEnd)} (growing) + building ${fM(vw.bldEnd)} (ageing ${dep}% a year)` : `growing ${inp.appreciation}% a year`}</div></td><td className="v">{fSAR(vw.end)}</td></tr>
            </>}
          </tbody></table>
          <div className="note">{prj.construct ? `The land (with tax${prj.landBroker > 0 ? " and broker" : ""}) is paid in ${fCal(prj.landMonth)}; construction${prj.overrun > 0 ? " and the overrun" : ""} evenly from ${fCal(prj.start + 1)} to ${fCal(prj.start + prj.bm)}; the extras in the last month.` : `Everything is paid in ${fCal(prj.landMonth)}.`} Your cash and the loans pay each bill as it falls due — there is no construction mortgage.</div>
        </Box>
      );
      const StepProject = () => (
        <div>
          <Head id="project" title="What are you buying or building, and when?" sub={prj.construct ? `All amounts in SAR. Land carries no VAT; construction and finishing do. The land grows in value with the market; the building is worth what it costs to build (plus your uplift) and loses ${dep}% of that a year from completion.` : isLand ? "All amounts in SAR. The land carries no VAT; transfer tax and the broker's fee are paid with it. It grows in value with the market; holding it may cost a white-land fee and zakat." : "All amounts in SAR. Finishing carries VAT. The value grows with the market from the month you buy."} />
          {KindPicker()}
          <div className="grid" style={twoCol}>
            {build ? LandFields() : ReadyFields()}
            {prj.construct ? BuildFields() : isLand ? HoldFields() : isBuilding ? UnitsFields() : LettingFields()}

      const removeProp = (i) => { const P = (inp.properties || [])[i]; if (!P) return; withUndo(`Removed ${P.name}`, () => setInp((s) => ({ ...s, properties: (s.properties || []).filter((_, j) => j !== i), plans: dropMorts(s.plans, [P.id]) }))); };

      const setHome = (i) => setInp((s) => ({ ...s, properties: (s.properties || []).map((P, j) => ({ ...P, isHome: j === i, rentNow: j === i ? 0 : P.rentNow, letAfterMove: j === i ? P.letAfterMove : false })) }));
      // which of your loans is secured on a property: the property names it (existingLoanId); the loan says so too (securedOn)
      const setMortgagedBy = (i, id) => setInp((s) => { const P = s.properties[i]; const fix = (l) => { if (id && String(l.id) === id) return { ...l, securedOn: P.id, type: "mortgage" }; return l.securedOn != null && String(l.securedOn) === String(P.id) ? { ...l, securedOn: null } : l; }; return { ...s, properties: s.properties.map((Q, j) => j === i ? { ...Q, existingLoanId: id || null } : Q), existingLoans: s.existingLoans.map(fix), joint: s.joint ? { ...s.joint, loans: (s.joint.loans || []).map(fix) } : s.joint }; });

          <div className="flex flex-wrap no-print" style={{ gap: 8, marginTop: 10 }}>
            <button className="btn small" onClick={addProp} disabled={list.length >= RE_MAX_PROPS}>+ Add a property{list.length >= RE_MAX_PROPS ? ` (${RE_MAX_PROPS} at most)` : ""}</button>
            <button className="btn small" onClick={removeAllProps}>Remove all</button>
          </div>
          <div className="note">"Bank lends up to": the share of its value a mortgage may reach, less what you still owe on the loan secured on it ("Mortgaged by"); nothing once it is sold. "Plan": sell it at {W.doneShort} to pay for the project (only the {W.act} side sells it), or in a month you set (sold whether you {W.act.replace(/^(buy|build)ing/, "$1")} or not). The rent it earns today counts on both sides and is never the bank's income.</div>

              <div className="ev" style={{ borderBottom: "none", fontWeight: 600 }}><span className="d">{endDate}</span><span className="k"><EvTag kind="horizon" /></span><span>{works(r) ? "" : `Only if you find ${needOf(r) != null ? `the ${fS(needOf(r))} more this plan needs` : "the money you are short"}: `}{works(r) ? "Wealth" : "wealth"} {fM(r.econEnd)} vs {fM(r.econBaseEnd)} if you {W.baseIf}: <span style={{ color: signCol(r.econAdv) }}>{fM(r.econAdv)}</span>.</span></div>

      // one loan's whole story (opened from the step-by-step or the "What you take on" table)
      const LoanDetails = () => {
        const { i, key } = loanDlg, r = m.results[i], d = r ? reFacDetail(r, key, p2, prj) : null, close = () => setLoanDlg(null);
        if (!d) return null;

          : d.ended ? `${d.ended.how.charAt(0).toUpperCase() + d.ended.how.slice(1)} in ${fCal(d.ended.t)}.`
          : d.stillOwed > 0.5 ? `Still running in ${endDate}: ${fS(d.stillOwed)} owed then.` : `Runs to its end in ${fCal(d.lastT)}.`;

          <div className="dlg-back no-print" onClick={close}>

              <div className="flex justify-between items-start" style={{ gap: 10 }}>

                <Row k="Borrower" v={row.borrower || "you"} />

                <Row k="Rate" v={rate} sub={row.effective != null ? `effective yearly cost ${(+row.effective).toFixed(2)}%` : null} />
                <Row k="Tenure" v={`${f.tenure} years`} />
                <Row k="Instalment" v={`${fSAR(f.pmt)}/mo`} sub={r.plan && f.key === "lm" && r.plan.extraMo > 0 ? `+ ${fSAR(r.plan.extraMo)}/mo extra you chose to pay` : null} />
                <Row k="Taken – last payment" v={`${fCal(f.startedAt)} – ${fCal(d.lastT)}`} />

              </Sec>
              <Sec title="Why this size">
                <Row k="The bank's maximum then" v={fSAR(cap.cap || f.amount)} sub={cap.limitedBy ? `limited by ${cap.limitedBy}` : null} />
                {after != null && <Row k="Your instalments, % of income" v={`${(+before).toFixed(0)}% → ${(+after).toFixed(0)}%`} sub={`before and after this loan · your limit ${hj ? `${hj.capPctA}% (yours)` : `${inp.dbrCap}%`}`} />}
              </Sec>
              <Sec title="Where the money goes">
                {d.topups ? d.topups.map((x) => <Row key={x.id} k={`${x.name}: its own bank refinances it`} v={`${fSAR(x.net)} to you`} sub={`${fSAR(x.payoff)} clears the old loan (incl. the early-settlement fee) · new loan ${fSAR(x.amount)} at ${fSAR(x.inst)}/mo instead of ${fSAR(x.oldInst)}/mo${x.why ? ` · ${x.why}` : ""}`} />)
                  : d.refi ? d.refi.items.map((x) => <Row key={x.id} k={`Clears ${x.name}`} v={fSAR(x.cost)} sub={x.fee > 0.5 ? `incl. a ${fSAR(x.fee)} early-settlement fee` : null} />) : null}
                <Row k={f.key === "lm" ? "Paid to the seller for you" : "Lands in your cash"} v={fSAR(d.net)} tone={K.pos} sub={f.key === "lm" ? "the bank pays the seller directly; you pay the rest of the price from your cash" : null} />
              </Sec>
              <Sec title="What it costs">
                <Row k={d.stillOwed > 0.5 ? `Profit paid until ${endDate}` : "Profit paid in all"} v={fSAR(d.profit)} />
                {d.fees > 0.5 && <Row k="Bank fees" v={fSAR(d.fees)} />}
                {d.prepaid && <Row k="Early-settlement fee" v={fSAR(d.prepaid.fee)} />}
                <Row k={d.stillOwed > 0.5 ? `Repaid until ${endDate}` : "Repaid in all"} v={fSAR(d.paid + d.fees + (d.prepaid ? d.prepaid.fee : 0))} sub={d.stillOwed > 0.5 ? `${fSAR(d.stillOwed)} still owed then` : null} />
              </Sec>
              <Sec title="How it ends"><div style={{ fontSize: 13, lineHeight: 1.5 }}>{endTxt}</div></Sec>
              {d.events.length > 0 && <Sec title="The full description">{d.events.map((e, k) => <div key={k} style={{ fontSize: 12.5, lineHeight: 1.5, color: K.sub, marginBottom: 6 }}><b>{fCal(e.t)}</b> · {boldNums(calText(e.text))}</div>)}</Sec>}
              <Sec title="Year by year">
                <div className="scroll-x"><table className="tbl" style={{ fontSize: 12 }}>
                  <thead><tr><th>Year</th><th>Owed at the start</th><th>Paid</th><th>of which profit</th><th>Paid off</th><th>Owed at the end</th></tr></thead>
                  <tbody>{d.years.map((y) => <tr key={y.k}><td className="l">{y.k} · {fCal(y.from)}–{fCal(y.to)}</td><td>{fM(y.open)}</td><td>{fM(y.paid)}</td><td>{fM(y.int)}</td><td>{y.payoff > 0.5 ? fM(y.payoff) : "—"}</td><td>{fM(y.close)}</td></tr>)}</tbody>
                </table></div>
                <div style={{ fontSize: 12, color: K.sub, marginTop: 4 }}>Paid = the instalments of that year (profit + repayment); paid off = a lump sum that clears it early.</div>
              </Sec>
            </div>
          </div>
        );
      };
      // the side sheet the step-by-step's "Details ›" links open (not printed; Esc and × close it)
      const DlgShell = ({ eyebrow, title, children }) => {
        const close = () => setLoanDlg(null);
        return (
          <div className="dlg-back no-print" onClick={close}>
            <div className="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabIndex={-1} ref={(el) => { if (el && !el.contains(document.activeElement)) el.focus(); }} onClick={(e) => e.stopPropagation()} onKeyDown={(e) => { if (e.key === "Escape") close(); }}>
              <div className="flex justify-between items-start" style={{ gap: 10 }}>
                <div><div className="eyebrow">{eyebrow}</div><h3 id="dlg-t" style={{ margin: "2px 0 0", fontSize: 18 }}>{title}</h3></div>
                <button className="btn small" onClick={close} aria-label="Close">×</button>
              </div>
              {children}
            </div>
          </div>
        );
      };
      // how the cash at the project end adds up
      const CashEndDetails = () => {
        const { i } = loanDlg, r = m.results[i];
        if (!r) return null;
        const occ = occOf(r), mp = moveInParts(r);
        return DlgShell({ eyebrow: `${planName(i)} · cash at ${W.doneShort}`, title: mp.total >= 0 ? `${fM(mp.total)} in cash at ${W.doneShort}, ${fCal(occ)}` : `${fS(-mp.total)} short at ${W.doneShort}, ${fCal(occ)}`, children: <>
          <div style={{ fontSize: 12.5, color: K.sub, margin: "10px 0 4px" }}>Money in, what your salary saved, money out — in date order · no return on cash counted</div>
          {EndWaterfall({ r })}
          <div className="note">The purchase lines are paid in {fCal(prj.landMonth)}{prj.rettExempt > 0 ? "; the transfer tax is charged only on the part above the first-home relief" : ""}. The mortgage never passes through your hands: the bank pays the seller.</div>
        </> });
      };
      // where the cash for an early payoff comes from, the cash test, and the balance it clears
      const PayoffDetails = () => {
        const { i, key } = loanDlg, r = m.results[i], d = r ? rePrepayDetail(r, key, inp, prj) : null;
        if (!d) return null;
        const Sec = ({ title, children }) => <div style={{ marginTop: 14 }}><div className="eyebrow" style={{ marginBottom: 4 }}>{title}</div>{children}</div>;
        const nm = d.x.nameLc || d.x.name.toLowerCase();
        return DlgShell({ eyebrow: `${planName(i)} · early payoff`, title: `The ${nm} is paid off in ${fCal(d.t)}`, children: <>
          <Sec title={`Where the cash comes from · ${fCal(d.from)} → ${fCal(d.t)}`}>
            <Waterfall rows={[
              { label: d.from === occOf(r) ? `Cash at ${W.doneShort}, ${fCal(d.from)}` : `Cash in ${fCal(d.from)}`, v: d.start, note: d.from === occOf(r) ? "no return on cash counted" : null },
              ...d.flows.map((x) => ({ label: x.label, note: x.note, v: x.v })),
              { subtotal: true, label: "Cash before the payoff" },
              { label: `Balance left on the ${nm}`, v: -d.balance, note: "after this month's instalment" },
              { label: "Early-settlement fee", v: -d.fee, note: `the next ${inp.settleFeeMonths} months' profit at most (SAMA cap)` },
            ]} totalLabel={`Cash after the payoff, ${fCal(d.t)}`} total={d.after} />
          </Sec>
          <Sec title={d.asap ? "Why this month" : "The month you set"}>
            {d.asap ? <div style={{ fontSize: 13, lineHeight: 1.55 }}>
              The plan pays it off the first month the cash left after the payoff covers your safety cushion ({fSAR(inp.cashBuffer)}) plus three months' outgoings ({fSAR(d.reserve)}: living costs, rent and instalments).
              {" "}In {fCal(d.t)}: {fSAR(d.before)} − {fSAR(d.cost)} = <b>{fSAR(d.after)}</b>, at least {fSAR(d.need)} ✓.
              {d.earlier && <>{" "}A month earlier, in {fCal(d.earlier.t)}: {fSAR(d.earlier.cash)} − {fSAR(d.earlier.cost)} = {fSAR(d.earlier.left)}, below {fSAR(d.earlier.need)}.</>}
              {" "}It is paid off because at {d.f ? `${d.f.rate.toFixed(2)}% APR` : "its rate"} it costs more than your cash earns.
            </div> : <div style={{ fontSize: 13, lineHeight: 1.55 }}>You chose to pay the mortgages off in this month; the cash above your safety cushion ({fSAR(inp.cashBuffer)}) covers it: {fSAR(d.before)} − {fSAR(d.cost)} = <b>{fSAR(d.after)}</b>.</div>}
          </Sec>
          <Sec title="The loan">
            <Row k="Balance cleared" v={fSAR(d.balance)} />
            <Row k="Early-settlement fee" v={fSAR(d.fee)} />
            <Row k="Instalment you stop paying" v={`${fSAR(d.x.inst)}/mo`} />
            <div style={{ marginTop: 8 }}><button className="lnk" onClick={() => setLoanDlg({ i, key })}>The loan's full details ›</button></div>
          </Sec>
        </> });
      };
      // no plan works with your dates: find the earliest later dates at which each plan works (reFindDate), then the tool's best
      // mix at the earliest of them (the same sliced search as the planned start); "Use these dates" moves the start, with undo
      // the results stay while only the start dates change (so the options can be compared); any other change clears them
      const datesKey = (q, n) => JSON.stringify({ ...q, landMonth: 0, buildStart: 0, plans: (q.plans || []).slice(0, n) });
      useEffect(() => { if (dates && dates.key && datesKey(inp, dates.n) !== dates.key) setDates(null); }, [inp]);
      const shiftOf = (f) => { const q = reAtStart(inp, f.delay, f.landWithBuild); return prj.construct ? { buildStart: q.buildStart, landMonth: q.landMonth } : { landMonth: q.landMonth }; };
      const datesTxt = (f) => prj.construct ? `land ${fCal(f.landMonth)} · construction ${fCal(f.buildStart)} → project end ${fCal(f.occupy)}` : `${isLand ? "land bought" : "purchase"} ${fCal(f.landMonth)}${isLand ? "" : ` → project end ${fCal(f.occupy)}`}`;
      const findDates = () => {
        // every plan shown, the tool's pick included (its plan as the search found it)
        const tp = toolPlan, planOf = (i) => isTool(i) ? tp : src.plans[i];
        const src = inp, idxs = liveIdx.filter((i) => planOf(i)), meta = { src, key: datesKey(src, src.plans.length), n: src.plans.length, tool: tp ? { i: toolIdx, plan: tp } : null };
        setDates({ running: true, ...meta });
        const rows = []; let k = 0;
        const next = () => {
          if (k < idxs.length) { const i = idxs[k++]; const x = reFindDate(src, planOf(i)); rows.push({ i, ...x }); setTimeout(next, 0); return; }
          const ok = rows.filter((x) => x.found).sort((a, b) => a.found.occupy - b.found.occupy);
          if (!ok.length) {
            const near = rows.slice().sort((a, b) => (b.minCash || -Infinity) - (a.minCash || -Infinity))[0];
            const need = near ? reFindDate(src, planOf(near.i), { need: true }).need : null;
            setDates({ rows, best: null, near: near ? near.i : null, need, ...meta }); return;
          }
          const f = ok[0].found, shifted = { ...src, ...shiftOf(f) };
          setDates({ rows, best: null, bestRunning: true, ...meta });
          runSlices(shifted, reStartMonth(shifted), true, (r) => { const b = r.start && r.start.best; setDates({ rows, best: b && b.feasible ? { best: b, at: f } : null, ...meta }); }, () => false);
        };
        setTimeout(next, 0);
      };
      const useDates = (f, add) => withUndo(add ? "Moved the start and added the tool's plan" : "Moved the start to the dates that work", () => setInp((s0) => ({ ...s0, ...shiftOf(f), plans: add && s0.plans.length < MAX_PLANS ? [...s0.plans, { ...(add.cleanPlan || add.plan), enabled: true, name: add.name }] : s0.plans })));
      const FindDates = () => {
        const has = !!(dates && dates.rows);
        if (bestF && !has) return null;
        const ok = has ? dates.rows.filter((x) => x.found).sort((a, b) => a.found.occupy - b.found.occupy) : [];
        const sh = (f) => shiftOf(f), inUse = (f) => Object.entries(sh(f)).every(([k, v]) => inp[k] === v);
        const orig = has ? { landMonth: dates.src.landMonth, ...(prj.construct ? { buildStart: dates.src.buildStart } : {}) } : null;
        const moved = has && Object.entries(orig).some(([k, v]) => inp[k] !== v);
        const UseBtn = ({ f, add, label }) => inUse(f) && !add ? <span className="tag" style={{ background: SOFT, color: K.text }}>in use</span> : <button className="btn small" onClick={() => useDates(f, add)}>{label}</button>;
        return (
          <Box title={moved ? "Dates that work" : "No plan works with these dates"} style={{ marginTop: 14 }}>
            {moved && <div className="flex items-center flex-wrap" style={{ gap: 8, fontSize: 12.5, marginBottom: 8 }}>You are now using new dates. <button className="lnk" onClick={() => withUndo("Back to the dates you set", () => setInp((s0) => ({ ...s0, ...orig })))}>Back to the dates you set ({prj.construct ? `construction ${fCal(orig.buildStart)}` : fCal(orig.landMonth)})</button></div>}
            {!dates ? <div style={{ fontSize: 13, lineHeight: 1.55 }}>Your cash runs short with every plan at the dates you set. Starting later lets your savings build up. <button className="btn small" onClick={findDates}>Find dates that work</button></div>
              : dates.running ? <div className="note">Looking for the earliest dates that work…</div>
              : !ok.length ? <div style={{ fontSize: 13, lineHeight: 1.55, color: K.neg }}>No plan works, even starting up to {Math.round((dates.rows[0] ? dates.rows[0].maxWait : 48) / 12)} years later.{dates.near != null && dates.need != null ? ` The closest, ${planRef(dates.near)}, would still need ${fS(dates.need)} more cash in total.` : ""}</div>
              : <>
                <div style={{ fontSize: 12.5, color: K.sub, marginBottom: 6 }}>The earliest dates at which each plan works every month (your savings build up while you wait):</div>
                {dates.bestRunning && <div className="note">Looking for the tool's best plan at the earliest of these dates…</div>}
                {dates.best && <div className="ev" style={{ gridTemplateColumns: "1fr auto" }}><span><b>The tool's best plan at these dates ★</b> · {dates.best.best.name}<span style={{ display: "block", fontSize: 12.5, color: K.sub }}>{datesTxt(dates.best.at)} · cash at project end {fM(dates.best.best.onHand)} · {fM(dates.best.best.econAdv)} vs {baseLbl}{dates.best.best.late ? ` · ${lateTxt(dates.best.best)}` : ""}</span></span><UseBtn f={dates.best.at} add={dates.best.best} label="Use these dates and add this plan" /></div>}
                {ok.map((x) => { const tool = dates.tool && x.i === dates.tool.i && x.i >= dates.n; return <div key={x.i} className="ev" style={{ gridTemplateColumns: "1fr auto" }}><span><b>{tool ? "The tool's pick" : planName(x.i)}</b> works {x.found.wait} month{x.found.wait === 1 ? "" : "s"} later<span style={{ display: "block", fontSize: 12.5, color: K.sub }}>{datesTxt(x.found)} · cash at project end {fM(x.found.onHand)} · {fM(x.found.econAdv)} vs {baseLbl}{x.found.late ? ` · ${lateTxt(x.found)}` : ""}</span></span><UseBtn f={x.found} add={tool && inp.plans.length === dates.n ? { cleanPlan: dates.tool.plan, name: dates.tool.plan.name } : null} label={tool && inp.plans.length === dates.n ? "Use these dates and add this plan" : "Use these dates"} /></div>; })}
                {dates.rows.filter((x) => !x.found).map((x) => <div key={x.i} className="note" style={{ marginTop: 4 }}>{dates.tool && x.i === dates.tool.i && x.i >= dates.n ? "The tool's pick" : planName(x.i)}: no date within {Math.round(x.maxWait / 12)} years works.</div>)}
              </>}
          </Box>
        );
      };
      const StepAnswer = () => {
        if (!lead) return <div><Head id="answer" title="Your answer" /><Box>Tick at least one plan in How to pay.</Box></div>;
        const r = focusRes, i = focusIdx;
        return (
          <div>
            {AnswerLine({ one: false })}
            {FindDates()}
            <div style={{ marginTop: 14 }}>{LensCards({ print: false })}</div>
            {SaveAndBuy()}
            {StepByStep({ r, i })}
            {LiabilityCard({ r, i, print: false, part: "loans" })}
            {LiabilityCard({ r, i, print: false, part: "settle" })}
            {letAll && InvestmentView({ r, i })}
            {WatchOut({ items: watchOut(r) })}
            {DetailsBox({ r, i })}
            {loanDlg && (loanDlg.view === "end" ? CashEndDetails() : loanDlg.view === "payoff" ? PayoffDetails() : LoanDetails())}
          </div>
        );
      };
      // print: one page — the answer line, the three cards as narrow columns, the loan table and figures, keep or settle, watch out, your inputs
      const PrintAnswer = () => {
        if (!lead) return AnswerLine({ one: true });
        const r = focusRes, i = focusIdx;
        return (
          <div className="print-one">
            {AnswerLine({ one: true })}
            <div style={{ marginTop: 10 }}>{LensCards({ print: true })}</div>
            {LiabilityCard({ r, i, print: true })}
            {WatchOut({ items: watchOut(r) })}
            <div style={{ fontSize: 11, color: K.sub, marginTop: 10, lineHeight: 1.5, borderTop: `1px solid ${K.line}`, paddingTop: 6 }}>
              <b>Your inputs:</b> {compactSummary}.<br />
              {inp.existingLoans.filter((l) => l.balance > 0).length} old loan{inp.existingLoans.filter((l) => l.balance > 0).length === 1 ? "" : "s"} ({fSAR(household.existingInst)}/mo) · {props.length ? `${props.length} propert${props.length === 1 ? "y" : "ies"} worth ${fM(props.reduce((a, P) => a + P.value, 0))}` : "no property of yours"} · cash earns {(+netRet.toFixed(2))}% · bank terms {TERM_ROWS.filter(([k]) => k !== "eq" || showEqTerms).map(([k, , rk, tk]) => `${{ lm: isLand ? "land" : build ? "land" : "purchase", eq: "own property", co: "cash-out", pl: "personal" }[k]} ${quotedOf(rk)}%/${inp[tk]}y`).join(", ")} · compared until {endDate}{loadedName ? ` · scenario "${loadedName}"` : ""}.
            </div>
          </div>
        );
      };

      /* ---------- scenarios, footer, page ---------- */
      const ScenPanel = () => (
        <div className="no-print" style={{ maxWidth: 1480, margin: "12px auto 0", padding: "0 20px" }}>
          <Box title="Saved scenarios" right={<span className="flex flex-wrap" style={{ gap: 8 }}><button className="btn small" onClick={doExport}>Export all</button><label className="btn small" style={{ cursor: "pointer" }}>Import<input type="file" accept="application/json" onChange={doImport} style={{ display: "none" }} /></label><button className="btn small" onClick={importOld} disabled={!oldCount} title={oldCount ? `${oldCount} saved by the previous version on this browser` : "nothing saved in the previous version"}>Import from the previous version{oldCount ? ` (${oldCount})` : ""}</button><button className="btn small" onClick={resetAll}>Start from the defaults</button><button className="btn small" onClick={() => setShowScen(false)}>Close</button></span>}>
            <div style={{ fontSize: 12.5, color: K.sub, marginBottom: 8 }}>Save writes your changes to the scenario you have open{loadedName ? <> (<b style={{ color: K.text }}>{loadedName}</b>)</> : ""}; Save as… keeps a copy under a new name. "Import from the previous version" copies the scenarios the old tool saved on this browser{oldCount ? "" : " — nothing saved there"}; the originals stay where they are.</div>
            {savedRows.length === 0 ? <div style={{ fontSize: 13, color: K.sub }}>Nothing saved yet — use Save in the header.</div> : <div className="scroll-x"><table className="tbl">
              <thead><tr><th>Scenario</th><th>Project</th><th>Saved</th><th>Cost</th><th>Best of your plans</th><th>Result</th><th>Instalments at their highest</th><th>Verdict</th><th></th></tr></thead>
              <tbody>{savedRows.map((s) => <tr key={s.n} style={{ background: s.n === loadedName ? SOFT : "transparent" }}>
                <td className="l"><b dir="auto">{s.n}</b>{s.n === loadedName ? " · open" : ""}{s.fromOld ? <div className="chip" style={{ fontSize: 11.5, marginTop: 3 }}>from the previous version</div> : null}</td><td className="l">{s.error ? "—" : s.kind}</td><td className="l">{s.at ? new Date(s.at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—"}</td>
                <td>{s.error ? "—" : fM(s.total)}</td><td className="l" style={{ minWidth: 200 }}>{s.error ? "could not be read" : s.best}</td><td style={{ color: s.metric == null ? K.sub : s.metric >= 0 ? K.pos : K.neg }}>{s.error ? "—" : s.metric == null ? "—" : `${fM(s.metric)} vs ${s.base}`}</td><td>{s.pmt == null ? "—" : `${fSAR(s.pmt)}/mo`}</td>
                <td style={{ color: s.vColor, fontWeight: 700 }}>{s.verdict || "—"}</td>
                <td><span className="flex" style={{ gap: 6, justifyContent: "flex-end" }}><button className="btn small" onClick={() => doLoad(s.n)}>Open</button><button className="btn small" aria-label={`Delete ${s.n}`} onClick={() => doDelete(s.n)}><Trash2 size={14} color={K.neg} /></button></span></td>
              </tr>)}</tbody>
            </table></div>}
          </Box>
        </div>
      );
      // Back / Next: at the head of every step and again at its foot
      const StepNav = ({ top }) => (
        <nav className={"no-print " + (top ? "topnav" : "flex items-center justify-between")} aria-label={top ? "Step navigation" : "Step navigation (bottom)"} style={top ? null : { gap: 10, marginTop: 22, paddingTop: 14, borderTop: `1px solid ${K.line}` }}>
          <button className={"btn" + (top ? " small" : "")} onClick={() => go(stepI - 1)} disabled={stepI === 0}>← {stepI > 0 ? steps[stepI - 1][1] : "Back"}</button>
          {!top && <span style={{ fontSize: 12.5, color: K.sub }}>Step {stepI + 1} of {steps.length}</span>}
          <button className={"btn gold" + (top ? " small" : "")} onClick={() => go(stepI + 1)} disabled={stepI === steps.length - 1}>{stepI < steps.length - 1 ? `Next: ${steps[stepI + 1][1]}` : "Done"} →</button>
        </nav>
      );
      const panels = { project: StepProject, money: StepMoney, loans: StepLoans, props: StepProps, pay: StepPay, when: StepWhen, answer: StepAnswer };
      const compactSummary = `${W.label}${isBuilding ? ` (${letAll ? "let out entirely" : "you live in one unit"})` : ""} · ${fSAR(inp.income)}/mo income · ${fM(inp.cashAvailable)} cash · ${inp.existingLoans.filter((l) => l.balance > 0).length} old loans · ${props.length} propert${props.length === 1 ? "y" : "ies"} · ${build ? `${inp.landArea} m² land${prj.construct ? `, ${Math.round(prj.builtArea)} m² build` : ""}` : `${Math.round(prj.builtArea)} m² ready`} · ${fM(prj.total)} all-in`;

      return (
        <div>
          <header className="hdr">
            <div className="hdr-in">
              <div style={{ minWidth: 0, flex: "1 1 260px" }}>
                <div style={{ fontSize: 12, color: "#C8D3DF" }}><a href="index.html">All models</a> · Riyadh · SAR</div>
                <div className="flex items-center flex-wrap" style={{ gap: 8, marginTop: 2 }}><b style={{ fontSize: 17 }}>Property financing</b><span style={{ fontSize: 13, color: "#C8D3DF" }}>· {W.label}</span></div>
              </div>
              <div style={{ fontSize: 13, color: "#ECE4D3" }} title={dirty ? "changes not saved" : "saved"}>{loadedName ? <>“<span dir="auto">{loadedName}</span>”{dirty && <span style={{ color: "#D9B36A" }} aria-label="unsaved changes"> ● unsaved</span>}</> : <span style={{ color: "#C8D3DF" }}>Working copy <span style={{ color: "#D9B36A" }}>● not saved</span></span>}</div>
              <div className="flex flex-wrap items-center no-print" style={{ gap: 8 }}>
                <button className="hbtn gold" onClick={saveCurrent} disabled={clean} title={loadedName ? `Save your changes to "${loadedName}"` : "Save this scenario"}>{clean ? "Saved ✓" : "Save"}</button>
                <button className="hbtn" onClick={saveAsNew} title="Save under a new name">Save as…</button>
                <button className="hbtn" onClick={() => setShowScen(!showScen)} aria-expanded={showScen}>Scenarios</button>
                <button className="hbtn" onClick={() => setPrintAll(true)}>Print / PDF</button>
              </div>
            </div>
          </header>
          {showScen && ScenPanel()}
          <nav className="stepper no-print" aria-label="Steps">
            <div className="stepper-in" ref={stepRow}>
              {steps.map(([id, label], i) => <button key={id} className={"st" + (i === stepI ? " on" : "") + (i < stepI ? " done" : "")} aria-current={i === stepI ? "step" : undefined} onClick={() => go(i)}><span className="n">{i < stepI ? "✓" : i + 1}</span>{label}</button>)}
            </div>
          </nav>
          <div className="shell">
            <aside className="rail rail-l" aria-label="Your inputs">{InputsRail()}</aside>
            <main style={{ minWidth: 0 }}>
              <details className="box sum-compact no-print" style={{ marginBottom: 12, padding: "10px 14px" }}><summary style={{ cursor: "pointer", fontSize: 13 }}><b>Your inputs:</b> <span style={{ color: K.sub }}>{compactSummary}</span></summary>{InputsSummary()}</details>
              {!printAll && StepNav({ top: true })}
              {printAll ? PrintAnswer() : panels[cur]()}
              {!printAll && StepNav({})}
            </main>
            <aside className="rail rail-r" aria-label="What the bank will lend and your plans">{BankRail()}{PlansRail()}</aside>
          </div>
          {undo && <div className="toast no-print" role="status"><span>{undo.label}.</span><button onClick={() => { undo.restore(); setUndo(null); }}>Undo</button></div>}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
