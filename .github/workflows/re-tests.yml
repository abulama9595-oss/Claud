name: Real-estate engine tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine identities, bank limits, golden values, page compile
        run: node --test "tests/re/*.test.js"
      - name: The same for the new version (re2)
        run: node --test "tests/re2/*.test.js"
