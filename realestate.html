              </Dis>
              <Dis id="liquid" title="How tight does cash get?" sub="liquidity" open={!!openDis.liquid} onToggle={toggleDis}>
                <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 200px), 1fr))", gap: 10 }}>
                  <Tile label={rc.total >= 0 ? "Cash at move-in" : "Short at move-in"} value={rc.total >= 0 ? fM(rc.total) : fS(-rc.total)} tone={rc.total < 0 ? K.neg : K.text} sub="no growth counted" />
                  <Tile label={r.minCash < 0 ? (r.bridged ? `Most bridge money needed · ${fCal(r.minCashT)}` : `Most you are short · ${fCal(r.minCashT)}`) : `Lowest cash · ${fCal(r.minCashT)}`} value={r.minCash < 0 ? fS(-r.minCash) : fM(r.minCash)} tone={r.minCash < 0 ? K.neg : K.text} sub={needOf(r) != null ? `to carry the plan out you need ${fS(needOf(r))} more cash to start with` : r.reserveMonths == null ? null : `covers ${r.reserveMonths.toFixed(1)} months of that month's costs and instalments`} />
                  <Tile label="Tightest month" value={r.tightest ? fSARm(r.tightest.surplus) : "—"} sub={r.tightest ? `left from salary in ${fCal(r.tightest.t)} · ${r.thinMonths} months leave less than 5% of income` : null} tone={r.tightest && r.tightest.surplus < 0 ? K.neg : K.text} />
                  <Tile label="Debt-free" value={r.debtFreeT != null ? fCal(r.debtFreeT) : "later"} sub={st ? `survives ${st.filter((x) => x.key !== "base" && x.passes).length} of ${st.length - 1} stress tests` : "stress tests: working…"} />
                </div>
              </Dis>
              <Dis id="worth" title="Is each loan worth it?" sub="loan by loan" open={!!openDis.worth} onToggle={toggleDis}>
                {!lw ? <div className="note">Working it out…</div> : lw.length === 0 ? <div className="note">This plan takes no new loans.</div> : <>
                  <div className="scroll-x"><table className="tbl">
                    <thead><tr><th>Loan</th><th>Amount</th><th>It costs a year</th><th>Worth per 1M borrowed (today's money)</th><th>Without it</th></tr></thead>
                    <tbody>{lw.map((w) => <tr key={w.key}><td className="l">{w.label}</td><td>{fM(w.amount)}</td><td style={{ color: w.effYear > w.netReturn ? K.neg : K.pos }}>{w.effYear.toFixed(2)}% <span style={{ color: K.sub }}>vs {w.netReturn.toFixed(2)}%</span></td><td style={{ color: signCol(w.perMillionPV), fontWeight: 700 }}>{fM(w.perMillionPV)}</td><td className="l">{!works(w.without) ? <span style={{ color: K.neg }}>cash runs out — you need it</span> : w.without.bridged && !w.without.feasible ? <span style={{ color: "#7A4F12" }}>needs {fM(w.without.bridgePeak)} of bridge money — you need it</span> : `works · ${fM(w.without.econAdv)} vs ${baseLbl}`}</td></tr>)}</tbody>
                  </table></div>
                  <div className="note">Each loan against the same plan without it (the other loans may then grow to fill the room). A loan that costs more a year than your cash earns loses money unless you need it to pay for the build.</div>
                </>}
              </Dis>
              <Dis id="payoff" title="What it costs to pay a loan off early" sub="each loan, year by year" open={!!openDis.payoff} onToggle={toggleDis}>
                {PayoffPanel({ r })}
              </Dis>
              {build && <Dis id="ready" title="Or buy a ready villa instead?" sub="price that matches building" open={!!openDis.ready} onToggle={toggleDis}>
                {!rb ? <div className="note">Working it out…</div> : <div style={{ fontSize: 13.5, lineHeight: 1.6 }}>
                  A ready villa worth what your finished home would be ({fM(rb.value)} in {fCal(rb.buyAt)}), bought in {fCal(rb.buyAt)} and paid for the same way, does as well as building with {planRef(focusIdx)} up to a price of <b>{rb.price != null ? fM(rb.price) : "— (none: building is ahead even at a very low price)"}</b> when everything grows{rb.price7 != null ? <> ({fM(rb.price7)} on your rule 7)</> : null}. You would move in {fCal(rb.moveIn)} instead of {fCal(rb.buildMoveIn)}.
                  {rb.atPrice && <div className="note">At that price: {rb.atPrice.feasible ? `cash never runs out (lowest ${fM(rb.atPrice.minCash)})` : rb.atPrice.bridged ? `it needs ${fM(rb.atPrice.bridgePeak)} of bridge money until a loan lands` : `cash runs out (it needs ${fS(-rb.atPrice.minCash)} more)`}. Transfer tax and the broker's fee are paid on the price; its land grows like yours and its building loses {dep}% a year from the day you buy it.</div>}
                </div>}
              </Dis>}
              <Dis id="lines" title="Every line of the breakdown" sub={`both measures · ${planName(focusIdx)}`} open={!!openDis.lines} onToggle={toggleDis}>
                {Breakdown(r)}
              </Dis>
              <Dis id="allRows" title="All comparison rows" sub={`${homeRows.length} rows, every plan`} open={!!openDis.allRows} onToggle={toggleDis}>
                <div className="scroll-x"><table className="tbl">
                  <thead><tr><th>Measure</th>{liveIdx.map((i) => <th key={i} style={{ borderTop: `4px solid ${colF(i)}`, minWidth: 140, whiteSpace: "normal" }}>{planName(i)}{m.results[i] === lead ? " ★" : ""}</th>)}</tr></thead>
                  <tbody>{homeRows.map(([label, fn, col, help]) => <tr key={label}><td className="l" style={{ minWidth: 220 }}>{label}<Hint text={help} label={label} /></td>{liveIdx.map((i) => { const x = m.results[i]; return <td key={i} style={{ color: col ? col(x) : K.text, whiteSpace: "normal" }}>{fn(x)}</td>; })}</tr>)}</tbody>
                </table></div>
              </Dis>
              <Dis id="years" title="Year by year" sub={planName(focusIdx)} open={!!openDis.years} onToggle={toggleDis}>
                {YearTable(r)}
                <div className="note">Money in each year (in brackets: paid out), balances at each year end.</div>
              </Dis>
              <Dis id="sens" title="What moves the answer most" sub="each assumption ±20%" open={!!openDis.sens} onToggle={toggleDis}>
                <ResponsiveContainer width="100%" height={40 * Math.max(1, tornado.length) + 30}>
                  <BarChart data={tornado} layout="vertical" margin={{ top: 8, right: 24, left: 0, bottom: 0 }} stackOffset="sign">
                    <CartesianGrid stroke={K.line} horizontal={false} />
                    <XAxis type="number" tick={axisT} tickFormatter={fM} tickLine={false} axisLine={false} />
                    <YAxis type="category" dataKey="label" width={170} tick={{ fontFamily: SANS, fontSize: 12, fill: K.text }} tickLine={false} axisLine={false} />
                    <Tooltip formatter={(v, n) => [fM(v), n === "lo" ? "the worse of −20% / +20%" : "the better of −20% / +20%"]} contentStyle={tipStyle} />
                    <ReferenceLine x={0} stroke={K.text} />
                    <Bar dataKey="lo" stackId="t" fill={K.neg} maxBarSize={18} /><Bar dataKey="hi" stackId="t" fill={K.pos} maxBarSize={18} />
                  </BarChart>
                </ResponsiveContainer>
                <div className="note">Change in the "everything grows" result when one assumption moves 20% up or down; the longest bar is the one to firm up first.</div>
              </Dis>
            </div>
          </div>
        );
      };

      /* ---------- rental investment: the property, letting & you, financing (capital stacks), results ---------- */
      const addOption = (from) => {
        if (!from || inp.options.length >= MAX_PLANS) return;
        const k = inp.options.length, cp = from.startsWith("copy:"), src = cp ? inp.options[+from.slice(5)] : RE_OPTION_PRESETS[from.slice(4)];
        if (!src) return;
        withUndo(`Added Option ${k + 1}`, () => { setInp((s0) => ({ ...s0, options: [...s0.options, { ...src, enabled: true, name: cp ? `${src.name} (copy)` : src.name }] })); setEditIdx(k); });
      };
      const deleteOption = (i) => {
        if (inp.options.length <= 1) return;
        const shift = (x) => x === i ? -1 : x > i ? x - 1 : x;
        withUndo(`Deleted Option ${i + 1}`, () => { setInp((s0) => ({ ...s0, options: s0.options.filter((_, j) => j !== i) })); setFocus(shift(focus)); setEditIdx(shift(editIdx)); });
      };
      const okR = (r) => r && r.affordable && r.cashOk && r.ltvOk;
      const flagR = (r) => !r ? null : !r.ltvOk ? `${fM(r.fundingGap)} above the bank's ${r.opt.maxLtvPct}% loan-to-value limit` : !r.cashOk ? `needs ${fM(r.cashNeeded)} of cash; you can commit ${fM(inp.cashAvailable)}` : !r.affordable ? `the instalment is ${r.dbr.toFixed(0)}% of your income (the bank's limit is ${inp.dbrCap}%)` : null;
      const OptionCard = ({ o, i }) => {
        const r = m.results[i], ok = okR(r), ed = editIdx === i;
        const del = inp.options.length > 1 ? <button className="btn small" onClick={() => deleteOption(i)} aria-label={`Delete Option ${i + 1}`} title="Delete this option (you can undo for 10 seconds)"><Trash2 size={14} color={K.neg} /></button> : null;
        return (
          <div className="plan" style={{ borderLeftColor: o.enabled ? colF(i) : K.line, boxShadow: ed ? `0 0 0 2px ${colF(i)}` : "none" }}>

              <input type="checkbox" checked={o.enabled} onChange={(e) => setOpt(i, "enabled", e.target.checked)} aria-label={`Compare Option ${i + 1}`} style={{ marginTop: 3 }} />

                {o.enabled ? <>
                  <div style={{ fontSize: 12.5, color: K.sub, lineHeight: 1.5, marginTop: 2 }}>{describeOption(o, inp, prj)}</div>
                  {r && <div className="flex flex-wrap items-center" style={{ gap: "6px 14px", fontSize: 13, marginTop: 8 }}>
                    <span className="tag" style={{ background: ok ? "#E2EFE9" : SOFT_NEG, color: ok ? K.pos : K.neg, whiteSpace: "normal" }}>{ok ? "✓ Fits" : "✗ " + flagR(r)}</span>
                    <span>return <b className="mono" style={{ color: r.irr != null && r.irr * 100 >= inp.discountRate ? K.pos : K.neg }}>{pct1(r.irr == null ? null : r.irr * 100)}</b> <span style={{ color: K.sub, fontSize: 12 }}>property {pct1(r.irrUnlev == null ? null : r.irrUnlev * 100)}</span></span>
                    <span>NPV <b className="mono" style={{ color: signCol(r.npv) }}>{fM(r.npv)}</b></span>
                    <span>you bring <b className="mono" style={{ color: r.cashOk ? K.text : K.neg }}>{fM(r.cashNeeded)}</b></span>
                    <span>instalment <b className="mono" style={{ color: r.affordable ? K.text : K.neg }}>{fSAR(r.monthlyPayment)}/mo</b> <span style={{ color: K.sub, fontSize: 12 }}>{r.dbr.toFixed(0)}% of income</span></span>
                  </div>}
                </> : <div style={{ fontSize: 13, color: K.sub }}>not compared</div>}
              </div>
              <div className="grid no-print" style={{ gap: 6 }}>
                {o.enabled && <button className="btn small" onClick={() => setEditIdx(ed ? -1 : i)} aria-expanded={ed}>{ed ? "Done" : "Edit"}</button>}
                {del}
              </div>
            </div>
            {ed && o.enabled && <div className="no-print" style={{ marginTop: 12, borderTop: `1px solid ${K.line}`, paddingTop: 12 }}>
              <div className="flex justify-between items-center flex-wrap" style={{ gap: 8, marginBottom: 10 }}>
                <input type="text" value={o.name} onChange={(e) => setOpt(i, "name", e.target.value)} style={{ flex: "1 1 220px", fontWeight: 700 }} aria-label="Option name" />
                <select value="" aria-label="Start this option from a template" onChange={(e) => { const k = e.target.value; if (k) withUndo(`Option ${i + 1} started from a template`, () => setInp((s) => ({ ...s, options: s.options.map((x, j) => j === i ? { enabled: true, ...RE_OPTION_PRESETS[k] } : x) }))); }}>
                  <option value="">Start from a template…</option>
                  {Object.entries(RE_OPTION_PRESETS).map(([k, pr]) => <option key={k} value={k}>{pr.name}</option>)}
                </select>
              </div>
              <div className="grid" style={twoCol}>
                <div>
                  <div className="lbl" style={{ fontWeight: 700, marginBottom: 8 }}>Capital stack</div>
                  <Field label="Your own cash" value={o.cashPct} min={0} max={100} step={1} unit="% of the cost" onChange={(v) => setOpt(i, "cashPct", v)} hint={`= ${fM(prj.total * o.cashPct / 100)} of the ${fM(prj.total)} all-in cost`} />
                  <Field label="Personal loan" value={o.plAmount} min={0} max={1500000} step={25000} unit="SAR" onChange={(v) => setOpt(i, "plAmount", v)} hint="drawn at the start, repaid from month 1 (no grace)" />
                  {o.plAmount > 0 && <><Field label="Personal-loan profit rate" value={o.plRate} min={0} max={15} step={0.25} unit="%" onChange={(v) => setOpt(i, "plRate", v)} hint={inp.rateQuote === "flat" ? `flat · ≈${reFlatToApr(o.plRate, Math.round(o.plTenure * 12)).toFixed(2)}% APR` : null} /><Field label="Personal-loan years" value={o.plTenure} min={1} max={7} step={1} unit="yrs" onChange={(v) => setOpt(i, "plTenure", v)} /></>}
                </div>
                <div>

        if (!lead) return <div><Head id="rres" title="Which capital stack earns the most?" /><Box>Tick at least one option in "Financing".</Box></div>;
        const r = focusRes || lead, data = rSeries();
        const stack = liveIdx.map((i) => { const x = m.results[i]; return { name: planName(i), full: x.opt.name, cash: Math.round(x.cash), pl: Math.round(x.pl), mortgage: Math.round(x.loanCommit) }; });
        const rows = R_YEAR_ROWS.filter(([, k, kind]) => kind === "head" || kind === "plain" || kind === "ratio" || r.years.some((y) => Math.abs(y[k] || 0) >= 0.5));
        const chart = (title, kind, key, note, help) => (
          <Box title={title} help={help}>
            <RLegend />
            <ResponsiveContainer width="100%" height={230}>
              {kind === "bar" ? <BarChart data={data} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid stroke={K.line} vertical={false} />
                <XAxis dataKey="y" tickFormatter={yLblR} tick={axisS} tickLine={false} axisLine={{ stroke: K.line }} interval="preserveStartEnd" minTickGap={20} />
                <YAxis tick={axisT} tickFormatter={fM} tickLine={false} axisLine={false} width={56} />
                <Tooltip formatter={(v, k) => [fM(v), planName(+String(k).replace(/\D/g, ""))]} labelFormatter={(y) => `year to ${yLblR(y)}`} contentStyle={tipStyle} cursor={{ fill: SOFT }} />
                <ReferenceLine y={0} stroke={K.text} />
                {liveIdx.map((i) => <Bar key={i} dataKey={`${key}${i}`} fill={colF(i)} maxBarSize={22} isAnimationActive={false} />)}
              </BarChart> : <LineChart data={data} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid stroke={K.line} vertical={false} />
                <XAxis dataKey="y" tickFormatter={yLblR} tick={axisS} tickLine={false} axisLine={{ stroke: K.line }} interval="preserveStartEnd" minTickGap={20} />
                <YAxis tick={axisT} tickFormatter={fM} tickLine={false} axisLine={false} width={56} />
                <Tooltip formatter={(v, k) => [key === "out" ? `${fSAR(v)}/mo` : fM(v), planName(+String(k).replace(/\D/g, ""))]} labelFormatter={(y) => `year to ${yLblR(y)}`} contentStyle={tipStyle} />
                {liveIdx.map((i) => <Line key={i} dataKey={`${key}${i}`} stroke={colF(i)} strokeWidth={i === focusIdx ? 3 : 2} dot={false} isAnimationActive={false} />)}
              </LineChart>}
            </ResponsiveContainer>
            {note && <div className="note">{note}</div>}
          </Box>
        );
        return (
          <div>
            {RentalAnswer({ one: false })}
            <Box title="Every option, side by side" style={{ marginTop: 14 }} right={<span className="flex items-center no-print" style={{ gap: 6, fontSize: 12.5, color: K.sub }}>details for <select value={focusIdx} onChange={(e) => setFocus(+e.target.value)} aria-label="Option shown">{liveIdx.map((i) => <option key={i} value={i}>{planName(i)}{m.results[i] === lead ? " ★" : ""}</option>)}</select></span>}>
              <div className="scroll-x"><table className="tbl">
                <thead><tr><th>Measure</th>{liveIdx.map((i) => <th key={i} style={{ borderTop: `4px solid ${colF(i)}`, minWidth: 130, whiteSpace: "normal" }}>{planName(i)}{m.results[i] === lead ? " ★" : ""}<div style={{ fontWeight: 400 }}>{m.results[i].opt.name}</div></th>)}</tr></thead>
                <tbody>{rentalRows.map(([l, fn, col]) => <tr key={l}><td className="l" style={{ minWidth: 200 }}>{l}</td>{liveIdx.map((i) => { const x = m.results[i]; return <td key={i} style={{ color: col ? col(x) : K.text, whiteSpace: "normal" }}>{fn(x)}</td>; })}</tr>)}</tbody>
              </table></div>
              <div className="note">Ranked by the return on your cash (levered IRR). The property's own return is the same for every option; the difference is what the loans add or take away.</div>
            </Box>
            <div className="grid" style={{ ...twoCol, marginTop: 14 }}>
              <Box title="Capital stack per option">
                <div className="flex flex-wrap" style={{ gap: "4px 14px", fontSize: 12.5, marginBottom: 6 }}>{[["Own cash", "#1F9A80"], ["Personal loan", "#A24FB8"], ["Mortgage", "#2F6DB5"]].map(([l, c]) => <span key={l} className="flex items-center" style={{ gap: 6 }}><span style={{ width: 12, height: 12, background: c, borderRadius: 2, display: "inline-block" }} />{l}</span>)}</div>
                <ResponsiveContainer width="100%" height={230}>
                  <BarChart data={stack} margin={{ top: 8, right: 8, left: 0, bottom: 0 }} barCategoryGap="30%">
                    <CartesianGrid stroke={K.line} vertical={false} />
                    <XAxis dataKey="name" tick={axisS} interval={0} tickLine={false} axisLine={{ stroke: K.line }} />
                    <YAxis tick={axisT} tickFormatter={fM} tickLine={false} axisLine={false} width={56} />
                    <Tooltip formatter={(v, k) => [fM(v), { cash: "Own cash", pl: "Personal loan", mortgage: "Mortgage" }[k]]} labelFormatter={(l, pl) => pl && pl[0] ? `${l}: ${pl[0].payload.full}` : l} contentStyle={tipStyle} cursor={{ fill: SOFT }} />
                    <Bar dataKey="cash" stackId="s" fill="#1F9A80" maxBarSize={48} isAnimationActive={false} /><Bar dataKey="pl" stackId="s" fill="#A24FB8" maxBarSize={48} isAnimationActive={false} /><Bar dataKey="mortgage" stackId="s" fill="#2F6DB5" maxBarSize={48} isAnimationActive={false} />
                  </BarChart>
                </ResponsiveContainer>
              </Box>
              {chart("Instalments + upkeep, a month", "line", "out", "Average per month over each year: all instalments plus maintenance and insurance.")}
              {chart("Cash flow after instalments, each year", "bar", "cf", "Rent after vacancy, management, upkeep and zakat, less every instalment. Below zero: you top up from your pocket.")}
              {chart("Debt owed", "line", "bal", "Mortgage and personal loan still owed at each year end.")}
            </div>
            <div className="box" style={{ marginTop: 14, padding: "0 18px" }}>
              <div className="flex justify-between items-center flex-wrap" style={{ gap: 8, padding: "12px 0 4px" }}><b style={{ fontSize: 14 }}>Look deeper · {planName(focusIdx)}</b></div>
              <Dis id="ryears" title="Year by year" sub={`${planName(focusIdx)} · with debt-service cover`} open={!!openDis.ryears} onToggle={toggleDis}>
                <div className="scroll-x"><table className="tbl">
                  <thead><tr><th>Year ending</th>{r.years.map((y) => <th key={y.year}>{yLblR(y.year)}</th>)}</tr></thead>
                  <tbody>{rows.map(([l, k, kind]) => <tr key={k} style={{ background: kind === "head" ? SOFT : "transparent" }}>
                    <td className="l" style={{ fontWeight: kind === "head" ? 700 : 400, color: kind === "sub" ? K.sub : K.text, paddingLeft: l.startsWith("  ") ? 22 : 10, minWidth: 210 }}>{l.trim()}</td>
                    {r.years.map((y) => { const v = y[k]; return <td key={y.year} style={{ fontWeight: kind === "head" ? 700 : 400, color: kind === "ratio" ? (v != null && v < 1.2 ? K.neg : K.text) : kind === "neg" || kind === "sub" ? K.sub : v < 0 ? K.neg : K.text }}>{kind === "ratio" ? (v == null ? "—" : `${v.toFixed(2)}×`) : Math.abs(v || 0) < 0.5 ? "–" : kind === "neg" ? `(${fM(v)})` : fM(v)}</td>; })}
                  </tr>)}</tbody>
                </table></div>
                <div className="note">The first column is the signing month. Debt-service cover = net operating income ÷ instalments in the year; banks like 1.2× or more.</div>
              </Dis>
              <Dis id="sens" title="What moves the return most" sub="each assumption ±20%" open={!!openDis.sens} onToggle={toggleDis}>
                <ResponsiveContainer width="100%" height={40 * Math.max(1, tornado.length) + 30}>
                  <BarChart data={tornado} layout="vertical" margin={{ top: 8, right: 24, left: 0, bottom: 0 }} stackOffset="sign">
                    <CartesianGrid stroke={K.line} horizontal={false} />
                    <XAxis type="number" tick={axisT} tickFormatter={(v) => `${v.toFixed(1)}`} tickLine={false} axisLine={false} />
                    <YAxis type="category" dataKey="label" width={170} tick={{ fontFamily: SANS, fontSize: 12, fill: K.text }} tickLine={false} axisLine={false} />
                    <Tooltip formatter={(v, n) => [`${(+v).toFixed(2)} points`, n === "lo" ? "the worse of −20% / +20%" : "the better of −20% / +20%"]} contentStyle={tipStyle} />
                    <ReferenceLine x={0} stroke={K.text} />
                    <Bar dataKey="lo" stackId="t" fill={K.neg} maxBarSize={18} /><Bar dataKey="hi" stackId="t" fill={K.pos} maxBarSize={18} />
                  </BarChart>
                </ResponsiveContainer>
                <div className="note">Change in the return on your cash (percentage points) when one assumption moves 20% up or down; the longest bar is the one to firm up first.</div>
              </Dis>
            </div>
          </div>
        );
      };

      /* ---------- scenarios, footer, page ---------- */
      const ScenPanel = () => (
        <div className="no-print" style={{ maxWidth: 1480, margin: "12px auto 0", padding: "0 20px" }}>
          <Box title="Saved scenarios" right={<span className="flex flex-wrap" style={{ gap: 8 }}><button className="btn small" onClick={doExport}>Export all</button><label className="btn small" style={{ cursor: "pointer" }}>Import<input type="file" accept="application/json" onChange={doImport} style={{ display: "none" }} /></label><button className="btn small" onClick={resetAll}>Start from the defaults</button><button className="btn small" onClick={() => setShowScen(false)}>Close</button></span>}>
            <div style={{ fontSize: 12.5, color: K.sub, marginBottom: 8 }}>Save writes your changes to the scenario you have open{loadedName ? <> (<b style={{ color: K.text }}>{loadedName}</b>)</> : ""}; Save as… keeps a copy under a new name.</div>
            {savedRows.length === 0 ? <div style={{ fontSize: 13, color: K.sub }}>Nothing saved yet — use Save in the header.</div> : <div className="scroll-x"><table className="tbl">
              <thead><tr><th>Scenario</th><th>Saved</th><th>Cost</th><th>Best of your plans</th><th>Result</th><th>Peak instalments</th><th>Verdict</th><th></th></tr></thead>
              <tbody>{savedRows.map((s) => <tr key={s.n} style={{ background: s.n === loadedName ? SOFT : "transparent" }}>
                <td className="l"><b>{s.n}</b>{s.n === loadedName ? " · open" : ""}</td><td className="l">{s.at ? new Date(s.at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—"}</td>
                <td>{s.error ? "—" : fM(s.total)}</td><td className="l" style={{ minWidth: 200 }}>{s.error ? "could not be read" : s.best}</td><td style={{ color: s.metric == null ? K.sub : s.metric >= 0 ? K.pos : K.neg }}>{s.error ? "—" : s.metric == null ? "—" : s.home ? `${fM(s.metric)} vs not building` : `${pct1(s.metric)} IRR`}</td><td>{s.pmt == null ? "—" : `${fSAR(s.pmt)}/mo`}</td>
                <td style={{ color: s.vColor, fontWeight: 700 }}>{s.verdict || "—"}</td>
                <td><span className="flex" style={{ gap: 6, justifyContent: "flex-end" }}><button className="btn small" onClick={() => doLoad(s.n)}>Open</button><button className="btn small" aria-label={`Delete ${s.n}`} onClick={() => doDelete(s.n)}><Trash2 size={14} color={K.neg} /></button></span></td>
              </tr>)}</tbody>
            </table></div>}
          </Box>
        </div>
      );
      // Back / Next: at the head of every step and again at its foot
      const StepNav = ({ top }) => (
        <nav className={"no-print " + (top ? "topnav" : "flex items-center justify-between")} aria-label={top ? "Step navigation" : "Step navigation (bottom)"} style={top ? null : { gap: 10, marginTop: 22, paddingTop: 14, borderTop: `1px solid ${K.line}` }}>
          <button className={"btn" + (top ? " small" : "")} onClick={() => go(stepI - 1)} disabled={stepI === 0}>← {stepI > 0 ? steps[stepI - 1][1] : "Back"}</button>
          {!top && <span style={{ fontSize: 12.5, color: K.sub }}>Step {stepI + 1} of {steps.length}</span>}
          <button className={"btn gold" + (top ? " small" : "")} onClick={() => go(stepI + 1)} disabled={stepI === steps.length - 1}>{stepI < steps.length - 1 ? `Next: ${steps[stepI + 1][1]}` : "Done"} →</button>
        </nav>
      );
      const panels = home ? { money: StepMoney, loans: StepLoans, home: StepHome, pay: StepPay, when: StepWhen, answer: StepAnswer } : { property: StepProperty, letting: StepLetting, rfin: StepRFin, rres: StepRRes };
      const compactSummary = home ? `${fSAR(inp.income)}/mo income · ${fM(inp.cashAvailable)} cash · ${inp.existingLoans.filter((l) => l.balance > 0).length} old loans · ${build ? `${inp.landArea} m² land, ${Math.round(prj.builtArea)} m² build` : "ready home"} · ${fM(prj.total)} all-in` : `${fM(prj.total)} all-in · rent ${fSAR(inp.rentMo)}/mo`;

      return (
        <div>
          <header className="hdr">
            <div className="hdr-in">
              <div style={{ minWidth: 0, flex: "1 1 260px" }}>
                <div style={{ fontSize: 12, color: "#C8D3DF" }}><a href="index.html">All models</a> · Riyadh · SAR</div>
                <div className="flex items-center flex-wrap" style={{ gap: 8, marginTop: 2 }}><b style={{ fontSize: 17 }}>{home ? "Home financing" : "Rental investment"}</b></div>
              </div>
              <div style={{ fontSize: 13, color: "#ECE4D3" }} title={dirty ? "changes not saved" : "saved"}>{loadedName ? <>“{loadedName}”{dirty && <span style={{ color: "#D9B36A" }} aria-label="unsaved changes"> ● unsaved</span>}</> : <span style={{ color: "#C8D3DF" }}>Working copy <span style={{ color: "#D9B36A" }}>● not saved</span></span>}</div>
              <div className="flex flex-wrap items-center no-print" style={{ gap: 8 }}>
                <Seg dark label="What are you deciding" value={inp.mode} onChange={(v) => { set("mode", v); setStep(0); setFocus(-1); setEditIdx(-1); }} options={[["home", "My home"], ["rental", "Rental"]]} />
                <button className="hbtn gold" onClick={saveCurrent} disabled={clean} title={loadedName ? `Save your changes to "${loadedName}"` : "Save this scenario"}>{clean ? "Saved ✓" : "Save"}</button>
                <button className="hbtn" onClick={saveAsNew} title="Save under a new name">Save as…</button>
                <button className="hbtn" onClick={() => setShowScen(!showScen)} aria-expanded={showScen}>Scenarios</button>
                <button className="hbtn" onClick={() => setPrintAll(true)}>Print / PDF</button>
              </div>
            </div>
          </header>
          {showScen && ScenPanel()}
          <nav className="stepper no-print" aria-label="Steps">
            <div className="stepper-in" ref={stepRow}>
              {steps.map(([id, label], i) => <button key={id} className={"st" + (i === stepI ? " on" : "") + (i < stepI ? " done" : "")} aria-current={i === stepI ? "step" : undefined} onClick={() => go(i)}><span className="n">{i < stepI ? "✓" : i + 1}</span>{label}</button>)}
            </div>
          </nav>
          <div className="shell">
            <aside className="rail rail-l" aria-label="Your inputs">{InputsRail()}</aside>
            <main style={{ minWidth: 0 }}>
              {offer && <div className="box no-print flex items-center flex-wrap" style={{ gap: 10, marginBottom: 12, padding: "10px 14px", fontSize: 13, background: SOFT_AMB }}><span style={{ flex: "1 1 300px" }}>This page now has the new layout. You also have work from its preview page that differs from what is open here — open that instead?</span><button className="btn gold small" onClick={takePreview}>Open my preview work</button><button className="btn small" onClick={keepThis}>Keep this one</button></div>}
              {termsNote && <div className="box no-print flex items-center flex-wrap" style={{ gap: 10, marginBottom: 12, padding: "10px 14px", fontSize: 13, background: SOFT_AMB }}><span style={{ flex: "1 1 300px" }}>{termsNote}</span><button className="btn small" onClick={() => setTermsNote(null)}>Got it</button></div>}
              <details className="box sum-compact no-print" style={{ marginBottom: 12, padding: "10px 14px" }}><summary style={{ cursor: "pointer", fontSize: 13 }}><b>Your inputs:</b> <span style={{ color: K.sub }}>{compactSummary}</span></summary>{InputsSummary()}</details>
              {!printAll && StepNav({ top: true })}
              {printAll ? (home ? AnswerCore({ one: true }) : RentalAnswer({ one: true })) : panels[cur]()}
              {!printAll && StepNav({})}
            </main>
            <aside className="rail rail-r" aria-label="What the bank will lend and your plans">{home && BankRail()}{PlansRail()}</aside>
          </div>
          {undo && <div className="toast no-print" role="status"><span>{undo.label}.</span><button onClick={() => { undo.restore(); setUndo(null); }}>Undo</button></div>}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
