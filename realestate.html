<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home & Real-Estate Financing · Scenario Tool</title>
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script src="vendor/babel.js"></script>
  <script src="vendor/prop-types.js"></script>
  <script src="vendor/recharts.js"></script>
  <!-- shared palette / formatters / IRR from the flagship engine, the real-estate engine, then the page helpers -->
  <script src="engine.js?v=aed70f6607"></script>
  <script src="re-engine.js?v=aed70f6607"></script>
  <script src="re-ui.js?v=aed70f6607"></script>
  <style>
    /* AA text colours for this page only (the shared palette also styles the clinic pages) */
    :root { --bg: #F1EDE4; --paper: #FBFAF6; --ink: #0E1A2B; --text: #1B2733; --sub: #56616C; --brass: #B0823A; --brassTx: #8A6427; --pos: #276B55; --neg: #A33D29; --line: #DBD4C5; --lineIn: #9C9381; --soft: #F3EFE6; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
    button { font-family: inherit; }
    .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
    .flex { display: flex; } .items-center { align-items: center; } .items-start { align-items: flex-start; } .justify-between { justify-content: space-between; } .flex-wrap { flex-wrap: wrap; } .grid { display: grid; grid-template-columns: minmax(0, 1fr); }
    select { min-width: 0; }   /* a list with long choices must not widen its column (phones) */
    input[type=text], input[type=number], input[type=month], select, textarea { font-family: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--lineIn); border-radius: 6px; background: #fff; color: var(--text); max-width: 100%; min-height: 32px; }
    input[type=number] { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; text-align: right; }
    textarea { width: 100%; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; }
    input[type=checkbox], input[type=radio] { width: 18px; height: 18px; accent-color: #0E1A2B; flex: none; }
    :focus-visible { outline: 2px solid #2F6DB5; outline-offset: 2px; }
    /* sliders: 24-px touch height, visible track and thumb */
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; width: 100%; height: 24px; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: #CFC6B4; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; margin-top: -6px; background: #8A6427; border: 2px solid #fff; box-shadow: 0 0 0 1px #8A6427; }
    input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #CFC6B4; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #8A6427; border: 2px solid #fff; }
    /* header */
    .hdr { background: #0E1A2B; color: #ECE4D3; }
    .hdr-in { max-width: 1480px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .hdr a { color: #D9B36A; }
    .hbtn { background: transparent; color: #ECE4D3; border: 1px solid #3A4B62; border-radius: 7px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; min-height: 32px; }
    .hbtn.gold { background: #B0823A; border-color: #B0823A; color: #0E1A2B; }
    .hbtn:hover { border-color: #9DAEC0; }
    .hbtn:disabled { opacity: .6; cursor: default; }
    .pill { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: #D9B36A; color: #0E1A2B; }
    .seg { display: inline-flex; border: 1px solid var(--lineIn); border-radius: 8px; overflow: hidden; background: #fff; flex-wrap: wrap; }
    .seg button { border: none; background: transparent; padding: 6px 12px; font-size: 12.5px; font-weight: 600; color: var(--sub); cursor: pointer; min-height: 32px; }
    .seg button.on { background: #0E1A2B; color: #fff; }
    .seg.dark { border-color: #3A4B62; background: transparent; }
    .seg.dark button { color: #C8D3DF; }
    .seg.dark button.on { background: #B0823A; color: #0E1A2B; }
    /* step bar */
    .stepper { position: sticky; top: 0; z-index: 30; background: rgba(241,237,228,.97); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
    .stepper-in { max-width: 1480px; margin: 0 auto; padding: 8px 20px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .stepper-in::-webkit-scrollbar { display: none; }
    .st { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent; border-radius: 999px; padding: 6px 13px 6px 6px; font-size: 13px; font-weight: 600; color: var(--sub); cursor: pointer; white-space: nowrap; min-height: 34px; }
    .st .n { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #DBD4C5; color: #1B2733; }
    .st.done .n { background: #E2EFE9; color: var(--pos); }
    .st.on { background: #0E1A2B; color: #ECE4D3; }
    .st.on .n { background: #B0823A; color: #0E1A2B; }
    .st:hover:not(.on) { background: #E7E1D3; }
    @media (max-width: 820px) { .stepper { -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); } }
    /* three columns: inputs summary · the step · what the bank will lend and your plans */
    .shell { max-width: 1480px; margin: 0 auto; padding: 18px 20px 60px; display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
    .rail { position: sticky; top: 62px; max-height: calc(100vh - 74px); overflow: auto; scrollbar-width: thin; display: grid; gap: 14px; }
    .sum-compact { display: none; }
    @media (max-width: 1180px) { .shell { grid-template-columns: minmax(0, 1fr) 290px; } .rail-l { display: none; } .sum-compact { display: block; } }
    @media (max-width: 820px) { .shell { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 48px; } .rail { position: static; max-height: none; overflow: visible; } }
    /* cards and text */
    .box { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brassTx); }
    .h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; margin: 4px 0 6px; }
    .h2 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
    .lead { font-size: 13.5px; color: var(--sub); line-height: 1.55; max-width: 760px; }
    .note { font-size: 12px; color: var(--sub); line-height: 1.5; margin-top: 8px; }
    .lbl { font-size: 13px; color: var(--text); font-weight: 500; }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    .chip { display: inline-flex; gap: 6px; align-items: baseline; font-size: 12px; padding: 4px 9px; border-radius: 6px; background: #EFEAE0; color: var(--text); }
    .row-l { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; }
    .row-l .v { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; text-align: right; }
    .btn { display: inline-flex; align-items: center; gap: 6px; justify-content: center; border-radius: 8px; border: 1px solid var(--lineIn); background: #fff; color: var(--text); padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 34px; }
    .btn.gold { background: #B0823A; border-color: #B0823A; color: #0E1A2B; }
    .btn.ink { background: #0E1A2B; border-color: #0E1A2B; color: #fff; }
    .btn.small { padding: 4px 10px; font-size: 12.5px; min-height: 30px; }
    .btn:disabled { opacity: .55; cursor: default; }
    .lnk { background: none; border: none; color: var(--brassTx); font-weight: 600; font-size: 12.5px; cursor: pointer; padding: 4px 2px; min-height: 24px; text-decoration: underline; text-underline-offset: 2px; }
    /* help bubble: a real button; opens on tap, click, Enter; closes on Esc or a click elsewhere */
    .hint { position: relative; display: inline-flex; vertical-align: middle; margin-left: 4px; }
    .hint > button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid transparent; background: transparent; color: var(--sub); font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .hint > button span { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; line-height: 1; }
    .hint > button[aria-expanded=true] { color: var(--ink); }
    .hint .pop { position: absolute; z-index: 50; top: 26px; left: -8px; width: min(320px, 80vw); background: #0E1A2B; color: #ECE4D3; font-size: 12.5px; font-weight: 400; line-height: 1.5; letter-spacing: 0; text-transform: none; padding: 10px 12px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); text-align: left; white-space: normal; }
    /* disclosure */
    details.dis { border-top: 1px solid var(--line); }
    details.dis > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 2px; font-size: 14px; font-weight: 700; min-height: 44px; }
    details.dis > summary::-webkit-details-marker { display: none; }
    details.dis > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--brassTx); border-bottom: 2px solid var(--brassTx); transform: rotate(-45deg); transition: transform .15s; flex: none; margin: 0 4px; }
    details.dis[open] > summary::before { transform: rotate(45deg); }
    details.dis > summary .s { font-weight: 400; font-size: 12.5px; color: var(--sub); }
    details.dis > .body { padding: 2px 0 14px; }
    details.adv { border: 1px dashed var(--lineIn); border-radius: 9px; padding: 0 12px; margin-top: 10px; background: #FBFAF6; }
    details.adv > summary { list-style: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--sub); padding: 10px 0; min-height: 40px; display: flex; align-items: center; gap: 8px; }
    details.adv > summary::-webkit-details-marker { display: none; }
    details.adv > summary::before { content: "+"; font-weight: 700; color: var(--brassTx); width: 14px; }
    details.adv[open] > summary::before { content: "−"; }
    details.adv > .adv-body { padding: 2px 0 10px; }
    /* tables */
    .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .tbl th { text-align: right; font-size: 12px; font-weight: 700; color: #fff; background: #15263B; padding: 8px 10px; white-space: normal; vertical-align: bottom; }
    .tbl th:first-child, .tbl td.l { text-align: left; }
    .tbl td { padding: 6px 10px; border-bottom: 1px solid #E6E0D3; text-align: right; font-family: 'SF Mono', ui-monospace, Menlo, monospace; white-space: nowrap; }
    .tbl td.l { font-family: inherit; white-space: normal; }
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.bridge { border-collapse: collapse; font-size: 12.5px; width: 100%; }
    table.bridge td { padding: 4px 8px 4px 0; border-bottom: 1px dotted #E2DCCD; vertical-align: top; }
    table.bridge td.v { text-align: right; font-family: 'SF Mono', ui-monospace, Menlo, monospace; white-space: nowrap; }
    table.bridge tr.tot td { font-weight: 700; border-top: 1.5px solid #1B2430; border-bottom: none; }
    table.bridge .n { color: var(--sub); font-size: 12px; }
    /* timeline */
    .ev { display: grid; grid-template-columns: 84px 124px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid #ECE7DA; font-size: 13px; line-height: 1.5; align-items: start; }
    .ev .d { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--sub); padding-top: 2px; }
    .ev .k { padding-top: 1px; }
    .ev .k .tag { font-size: 11.5px; letter-spacing: .02em; }
    .ev.hi { background: #FBF6EA; }
    .ev.warn { background: #F7E9E5; font-weight: 600; }
    .ev.amber { background: #FBEFD9; }
    @media (max-width: 640px) { .ev { grid-template-columns: 1fr; gap: 3px; } .ev .d, .ev .k { padding-top: 0; } }
    /* plan cards */
    .plan { background: var(--paper); border: 1px solid var(--line); border-left-width: 5px; border-radius: 10px; padding: 12px 14px; }
    .plan.off { padding: 8px 12px; }
    .topnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .topnav .btn { min-height: 32px; padding: 5px 11px; font-size: 12.5px; }
    .why-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 4px 12px; padding: 8px 0; border-top: 1px solid #ECE7DA; font-size: 13px; line-height: 1.5; }
    .why-row .v { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; text-align: right; font-weight: 700; }
    .toast { position: fixed; z-index: 60; left: 50%; bottom: 18px; transform: translateX(-50%); background: #0E1A2B; color: #ECE4D3; border-radius: 10px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: calc(100vw - 32px); }
    .toast button { background: #B0823A; color: #0E1A2B; border: none; border-radius: 7px; padding: 6px 12px; font-weight: 700; cursor: pointer; min-height: 32px; }
    .wf-row { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(120px, 2fr) 92px; gap: 10px; align-items: center; padding: 5px 0; font-size: 12.5px; }
    .wf-head { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brassTx); padding: 10px 0 2px; }
    .wf-track { position: relative; height: 18px; }
    .wf-bar { position: absolute; top: 2px; height: 14px; border-radius: 3px; }
    @media (max-width: 640px) { .wf-row { grid-template-columns: 1fr 90px; } .wf-track { grid-column: 1 / -1; order: 3; } }
    @media print {
      @page { margin: 11mm; }
      body { background: #fff !important; }
      .no-print, .stepper, .rail-r .no-print, .toast { display: none !important; }
      .shell { display: block; padding: 0; max-width: none; }
      .rail { position: static; max-height: none; overflow: visible; }
      .rail-l { display: block !important; }
      .sum-compact { display: none !important; }
      .box, .plan { break-inside: avoid; }
      input[type=range] { display: none !important; }
      .scroll-x { overflow: visible; }
      .tbl { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.jsx" data-presets="react"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect, useRef } = React;
    const { LineChart, AreaChart, BarChart, Line, Area, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend, ReferenceLine, ReferenceDot } = window.Recharts;

    /* AA palette for this page; plan colours fixed per slot (fills) with darker text versions */
    const K = { text: "#1B2733", sub: "#56616C", brass: "#B0823A", brassTx: "#8A6427", pos: "#276B55", neg: "#A33D29", line: "#DBD4C5", ink: "#0E1A2B", paper: "#FBFAF6" };
    const PLAN_FILL = ["#2F6DB5", "#B0823A", "#1F9A80", "#A24FB8", "#C2569A", "#5B8C2A", "#C76B1F", "#4B5FC1"], PLAN_TEXT = ["#245A99", "#8A6427", "#1A6E5C", "#87409B", "#9A3A78", "#4A7022", "#9A5410", "#3D4EA3"];
    const MAX_PLANS = 8;                         // plans (home) and options (rental) you can compare at once
    const STORE_KEY = "re_scenarios";            // saved scenarios (on the studio site they sync to its server)
    const CUR_KEY = "re_current";                // your working copy, autosaved in this browser
    const OPEN_KEY = "re_current_name";          // the saved scenario your working copy belongs to (stays in this browser)
    const PREVIEW_KEY = "re_preview_current";    // the preview page's working copy: taken over once, then dropped
    const SOFT = "#F3EFE6", SOFT_NEG = "#F7E9E5", SOFT_POS = "#E6F0EC", SOFT_AMB = "#FBEFD9";
    const tipStyle = { fontFamily: SANS, fontSize: 12, border: `1px solid ${K.line}`, borderRadius: 6 };
    const axisT = { fontFamily: MONO, fontSize: 12, fill: K.sub };
    const axisS = { fontFamily: SANS, fontSize: 12, fill: K.sub };
    const signCol = (v) => v >= 0 ? K.pos : K.neg;
    const calText = (s) => String(s || "").replace(/\b(?:at |in )?month (\d+)\b/g, (_, n) => `in ${fCal(+n)}`);
    // amounts, monthly figures and percentages in bold (1.23M, (96K), 6,234/mo, 33%, 7.86%) — not years or counts
    const NUM_RE = /[−-]?(?:\(\d{1,3}(?:,\d{3})+(?:\.\d+)?\)|\d{1,3}(?:,\d{3})+(?:\.\d+)?|\(\d+(?:\.\d+)?[KM]\)|\d+(?:\.\d+)?[KM])(?:\/mo)?|\d+(?:\.\d+)?%|\d+(?:\.\d+)?\/mo/g;
    const boldNums = (t) => { const s = String(t || ""), out = []; let last = 0; s.replace(NUM_RE, (x, at) => { if (at > last) out.push(s.slice(last, at)); out.push(<b key={at}>{x}</b>); last = at + x.length; return x; }); if (last < s.length) out.push(s.slice(last)); return out; };
    // the coloured labels in "What happens, in order" (label, background, AA text colour)
    const EV_KIND = {
      today: ["Today", "#F6EFE1", "#8A6427"], settle: ["Pay off", "#F7E9E5", "#A33D29"], lm: ["Land mortgage", "#E4ECF6", "#245A99"], eq: ["Own property", "#E2F2EE", "#1A6E5C"],
      pl: ["Personal loan", "#F1E6F6", "#87409B"], pl2: ["Personal loan", "#F1E6F6", "#87409B"], spl: ["Spouse's personal loan", "#F1E6F6", "#87409B"], co: ["Cash-out", "#E4ECF6", "#245A99"], rf: ["Refinance", "#FBEFD9", "#7A4F12"],
      milestone: ["Milestone", "#EFEAE0", "#56616C"], cash: ["Cash", "#F6EFE1", "#8A6427"], low: ["Cash low", "#FBEFD9", "#7A4F12"], occ: ["Move in", "#0E1A2B", "#ECE4D3"],
      end: ["Debt-free", "#E6F0EC", "#276B55"], horizon: ["Horizon", "#E6F0EC", "#276B55"],
      cover: ["Covered by a loan", "#E6F0EC", "#276B55"], bridge: ["Bridge money", "#FBEFD9", "#7A4F12"], short: ["Cash runs out", "#A33D29", "#FFFFFF"], shortIn: ["Short at move-in", "#F7E9E5", "#A33D29"],
    };
    const EvTag = ({ kind, build }) => { const k = EV_KIND[kind] || EV_KIND.milestone; return <span className="tag" style={{ background: k[1], color: k[2] }}>{kind === "lm" && build === false ? "Mortgage" : k[0]}</span>; };

    /* ---------- building blocks ---------- */
    // help bubble: a button that opens on tap / click / Enter and closes on Esc or a click elsewhere
    function Hint({ text, label }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        if (!open) return;
        const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        const esc = (e) => { if (e.key === "Escape") setOpen(false); };
        document.addEventListener("mousedown", close); document.addEventListener("touchstart", close); document.addEventListener("keydown", esc);
        return () => { document.removeEventListener("mousedown", close); document.removeEventListener("touchstart", close); document.removeEventListener("keydown", esc); };
      }, [open]);
      if (!text) return null;
      return <span className="hint no-print" ref={ref}><button type="button" aria-expanded={open} aria-label={label ? `How is "${label}" worked out?` : "How is this worked out?"} onClick={() => setOpen(!open)}><span>i</span></button>{open && <span className="pop" role="note">{text}</span>}</span>;
    }
    // slider with a number box (type a value) and a 24-px touch height
    function Field({ label, value, min, max, step, unit, onChange, hint, help, show }) {
      const [txt, setTxt] = useState(null);
      const v = value == null ? 0 : value;
      const commit = () => { if (txt == null) return; const n = parseFloat(String(txt).replace(/[^0-9.\-]/g, "")); if (!isNaN(n)) onChange(n); setTxt(null); };
      return (
        <div style={{ marginBottom: 14 }}>
          <div className="flex items-center justify-between" style={{ gap: 8 }}>
            <label className="lbl" style={{ minWidth: 0 }}>{label}<Hint text={help} label={label} /></label>
            <span className="flex items-center" style={{ gap: 4, flex: "none" }}>
              <input type="text" inputMode="decimal" aria-label={label} value={txt != null ? txt : (show ? show(v) : (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-US") : String(+v.toFixed(2))))} onChange={(e) => setTxt(e.target.value)} onFocus={(e) => { setTxt(String(v)); setTimeout(() => e.target.select(), 0); }} onBlur={commit} onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { setTxt(null); e.target.blur(); } }} style={{ width: Math.abs(v) >= 100000 ? 104 : 76, textAlign: "right", fontFamily: MONO, fontSize: 12.5, padding: "4px 6px", minHeight: 30 }} />
              {unit && <span style={{ fontSize: 12, color: K.sub, minWidth: 0 }}>{unit}</span>}
            </span>
          </div>
          <input type="range" aria-label={label} min={min} max={max} step={step} value={Math.min(max, Math.max(min, v))} onChange={(e) => onChange(parseFloat(e.target.value))} />
          {hint && <div style={{ fontSize: 12, color: K.sub, marginTop: 1, lineHeight: 1.45 }}>{hint}</div>}
        </div>
      );
    }
    function NumIn({ v, on, w, dec, label, nullable, placeholder }) {
      const [t, setT] = useState(null);

            <Row k="Rent" v={`${fSAR(inp.rentMo)}/mo`} sub={`gross yield ${pct1(inp.rentMo * 12 / prj.total * 100)}`} />
            <Row k="Vacancy · management" v={`${inp.vacancyPct}% · ${inp.mgmtPct}%`} />
            <Row k="Rent growth" v={`${inp.rentGrowth}%/yr`} />
          </RailGroup>
          <RailGroup title="You" onEdit={() => go("letting")}>
            <Row k="Income" v={`${fSAR(inp.income)}/mo`} />
            <Row k="Cash to commit" v={fM(inp.cashAvailable)} />
            <Row k="Bank limit" v={`${inp.dbrCap}% of income`} />
          </RailGroup>
          <RailGroup title="Assumptions" onEdit={() => go("property")}>
            <Row k={build ? "Land value grows" : "Value grows"} v={`${inp.appreciation}%/yr`} sub={build ? `the building loses ${dep}% a year` : null} />
            <Row k="Discount rate" v={`${inp.discountRate}%/yr`} />
          </RailGroup>
        </>
      );
      const InputsRail = () => <div className="box" style={{ padding: "12px 16px" }}><div className="eyebrow" style={{ marginBottom: 2 }}>Your inputs</div>{InputsSummary()}</div>;

      /* ---------- right rail: what the bank will lend you, and your plans ---------- */
      const capRows = household.capTimeline.slice(0, 5);
      const capWhy = (c) => {
        if (c.t === 0) return "Today";
        const ended = inp.existingLoans.concat(spouseLoans).filter((l) => l.balance > 0 && loanEnds(l) === c.t).map((l) => l.name);
        return `From ${fCal(c.t)}${ended.length ? ` (${ended.join(" + ")} ${ended.length > 1 ? "end" : "ends"})` : (inp.incomeGrowth || 0) > 0 ? " (income steps up)" : ""}`;
      };
      const BankRail = () => {
        const capA = inp.income * (hj ? hj.capPctA : inp.dbrCap) / 100, capB = hj ? hj.income * hj.capPctB / 100 : 0;
        const used = household.existingInst, cap = capA + capB;
        return (
          <div className="box" style={{ padding: "14px 16px" }}>
            <div className="eyebrow">What the bank will lend you<Hint text={hj ? EXPL.joint : EXPL.capacity} label="What the bank will lend you" /></div>
            {hj ? <div style={{ fontSize: 12.5, color: K.sub, margin: "6px 0 8px", lineHeight: 1.45 }}>تضامن: all your instalments may use {hj.capPctA}% of your income (<b className="mono" style={{ color: K.text }}>{fSAR(capA)}/mo</b>) and your spouse's {hj.capPctB}% of theirs (<b className="mono" style={{ color: K.text }}>{fSAR(capB)}/mo</b>); a joint mortgage may use both.</div>
              : <div style={{ fontSize: 12.5, color: K.sub, margin: "6px 0 8px", lineHeight: 1.45 }}>All instalments together may use {inp.dbrCap}% of your income: <b className="mono" style={{ color: K.text }}>{fSAR(cap)}/mo</b>.</div>}
            <div style={{ height: 12, borderRadius: 6, background: "#E6EFEA", overflow: "hidden", border: `1px solid ${K.line}` }}><div style={{ width: `${Math.min(100, used / Math.max(1, cap) * 100)}%`, height: "100%", background: "#8C877D" }} /></div>
            <div style={{ fontSize: 12, color: K.sub, margin: "4px 0 8px" }}>today: old loans {fSAR(used)}/mo · free {fSAR(Math.max(0, cap - used))}/mo</div>
            {capRows.map((c) => (
              <div key={c.t} style={{ fontSize: 12.5, padding: "7px 0", borderTop: `1px solid ${K.line}`, lineHeight: 1.45 }}>
                <b>{capWhy(c)}</b>: free <span className="mono">{fSAR(c.room)}/mo</span>{hj ? <> + your spouse's <span className="mono">{fSAR(c.roomB || 0)}/mo</span></> : null} → a {hj ? "joint " : ""}mortgage up to <b className="mono">{fM(c.maxMortgage)}</b>{c.maxOnePl > 0 ? <> or a personal loan{hj ? " (yours)" : ""} up to <b className="mono">{fM(c.maxOnePl)}</b></> : null}
              </div>
            ))}
            {inp.existingLoans.concat(spouseLoans).filter((l) => l.balance > 0 && l.installment > 0).length > 0 && <div style={{ fontSize: 12, color: K.sub, borderTop: `1px solid ${K.line}`, paddingTop: 7, lineHeight: 1.45 }}>Paying off {inp.existingLoans.concat(spouseLoans).filter((l) => l.balance > 0 && l.installment > 0).map((l) => `${l.name} frees ${fSAR(l.installment)}/mo`).join("; ")}.</div>}
          </div>
        );
      };
      const PlansRail = () => !home ? (
        <div className="box" style={{ padding: "14px 16px" }}>
          <div className="eyebrow" style={{ marginBottom: 8 }}>Your options</div>
          {liveIdx.length === 0 ? <div style={{ fontSize: 13, color: K.sub }}>Tick at least one option in "Financing".</div> : (
            <table className="tbl" style={{ fontSize: 12 }}>
              <thead><tr><th style={{ background: "transparent", color: K.sub, padding: "4px 4px 4px 0" }}>Option</th><th style={{ background: "transparent", color: K.sub, padding: 4 }}>Return</th><th style={{ background: "transparent", color: K.sub, padding: "4px 0 4px 4px" }}>NPV</th></tr></thead>
              <tbody>{liveIdx.map((i) => { const r = m.results[i], ok = r.affordable && r.cashOk && r.ltvOk; return (
                <tr key={i} style={{ cursor: "pointer", background: i === focusIdx ? SOFT : "transparent" }} onClick={() => setFocus(i)}>
                  <td className="l" style={{ padding: "6px 4px 6px 0", color: colT(i), fontWeight: 700 }}>{planName(i)}{r === lead ? " ★" : ""}{!ok && <span style={{ color: K.neg, fontWeight: 400 }}> · doesn't fit</span>}</td>
                  <td style={{ padding: 4 }}>{pct1(r.irr == null ? null : r.irr * 100)}</td>
                  <td style={{ padding: "4px 0 4px 4px", color: signCol(r.npv), fontWeight: 700 }}>{fM(r.npv)}</td>
                </tr>); })}</tbody>
            </table>
          )}
          {lead && <div style={{ fontSize: 12.5, marginTop: 10, background: SOFT, borderRadius: 7, padding: "8px 10px", lineHeight: 1.45 }}><b>Verdict:</b> <span style={{ color: m.vColor, fontWeight: 700 }}>{m.verdict}</span>{bestF ? <> · best that fits: {planName(recIdx)}</> : " · no option fits your cash, the loan-to-value limit and the bank's limit"}</div>}
          <div style={{ fontSize: 12, color: K.sub, marginTop: 6 }}>"Return": the yearly return on the cash you put in (levered IRR); NPV at your {inp.discountRate}% discount rate.</div>
          {cur === "rres" && <div className="grid no-print" style={{ gap: 8, marginTop: 12 }}>
            <button className="btn gold" onClick={saveCurrent} disabled={clean}>{loadedName ? (dirty ? `Save changes to "${loadedName}"` : `Saved to "${loadedName}" ✓`) : "Save this scenario"}</button>
            <button className="btn" onClick={saveAsNew}>Save as a new scenario…</button>
            <button className="btn" onClick={() => setPrintAll(true)}>Print / PDF (one page)</button>
          </div>}
        </div>
      ) : (
        <div className="box" style={{ padding: "14px 16px" }}>
          <div className="eyebrow" style={{ marginBottom: 8 }}>Your plans{toolIdx >= 0 ? " and the tool's pick" : ""}</div>
          {liveIdx.length === 0 ? <div style={{ fontSize: 13, color: K.sub }}>Tick at least one plan in "How to pay".</div> : (
            <table className="tbl" style={{ fontSize: 12 }}>
              <thead><tr><th style={{ background: "transparent", color: K.sub, padding: "4px 4px 4px 0" }}>Plan</th><th style={{ background: "transparent", color: K.sub, padding: 4 }}>At move-in</th><th style={{ background: "transparent", color: K.sub, padding: "4px 0 4px 4px" }}>vs {baseLbl}</th></tr></thead>
              <tbody>{liveIdx.map((i) => { const r = m.results[i]; return (
                <tr key={i} style={{ cursor: "pointer", background: i === focusIdx ? SOFT : "transparent" }} onClick={() => { setFocus(i); }}>
                  <td className="l" style={{ padding: "6px 4px 6px 0", color: colT(i), fontWeight: 700 }}>{planName(i)}{r === lead ? " ★" : ""}{!works(r) && <span style={{ color: K.neg, fontWeight: 400 }}> · runs out{needOf(r) != null ? ` · needs ${fS(needOf(r))}` : ""}</span>}{r.bridged && !r.feasible && <span style={{ color: "#7A4F12", fontWeight: 400 }}> · bridge</span>}{isTool(i) && optStale && <span style={{ color: K.sub, fontWeight: 400 }}> · updating…</span>}</td>
                  <td style={{ padding: 4, color: r.moveInOk === false ? K.neg : K.text }}>{fCash(r.onHandAtMoveIn)}</td>
                  <td style={{ padding: "4px 0 4px 4px", color: signCol(r.econAdv), fontWeight: 700 }}>{fM(r.econAdv)}</td>
                </tr>); })}</tbody>
            </table>
          )}
          {lead && <div style={{ fontSize: 12.5, marginTop: 10, background: lead.econAdv >= 0 ? SOFT_POS : SOFT_NEG, borderRadius: 7, padding: "8px 10px", lineHeight: 1.45 }}><b>So far:</b> {bestF ? <>the best is {isTool(recIdx) ? "the tool's pick" : planName(recIdx)}, <b style={{ color: signCol(lead.econAdv) }}>{fM(lead.econAdv)}</b> vs {baseLbl} in {endDate} when everything grows.</> : "none of your plans works every month."}</div>}
          <div style={{ fontSize: 12, color: K.sub, marginTop: 6 }}>"At move-in": your cash, the loans and what your salary saved, less everything the project cost — no growth counted. Click a row to see that plan in detail.</div>
          {cur === "answer" && <div className="grid no-print" style={{ gap: 8, marginTop: 12 }}>
            <button className="btn gold" onClick={saveCurrent} disabled={clean}>{loadedName ? (dirty ? `Save changes to "${loadedName}"` : `Saved to "${loadedName}" ✓`) : "Save this scenario"}</button>
            <button className="btn" onClick={saveAsNew}>Save as a new scenario…</button>
            <button className="btn" onClick={() => setPrintAll(true)}>Print / PDF (one page)</button>
            <button className="btn" onClick={() => go("pay")}>Change an answer</button>
          </div>}
        </div>
      );

      /* ---------- step pieces ---------- */
      const Head = ({ id, title, sub }) => (
        <div style={{ marginBottom: 14 }}>
          <div className="eyebrow">Step {stepIdx(id) + 1} of {steps.length}</div>
          <h1 className="h1">{title}</h1>
          {sub && <p className="lead">{sub}</p>}
        </div>
      );
      const twoCol = { gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 300px), 1fr))", gap: 14 };
      const ownedAt = (t) => inp.ownedValue * Math.pow(1 + inp.appreciation / 100, t / 12);
      const lettingOut = (inp.rentOutFixed || 0) > 0 || (inp.rentOutPct || 0) > 0;

      /* ---------- step 1: your money ---------- */
      const StepMoney = () => (
        <div>
          <Head id="money" title="What do you earn, spend and have?" sub={jointOn ? "Your salaries pay the household's living costs and every instalment; the bank tests each of you against your own limit (تضامن). Your cash pays whatever the loans don't." : `Your salary pays your living costs and every instalment; the bank tests all instalments together against ${inp.dbrCap}% of your income. Your cash pays whatever the loans don't.`} />
          <div className="grid" style={twoCol}>
            <Box title="Each month">
              <Field label={jointOn ? "Your income the bank recognises" : "Income the bank recognises"} value={inp.income} min={5000} max={250000} step={1000} unit="SAR/mo" onChange={(v) => set("income", v)} />
              <Field label={jointOn ? "Living costs of the household (not rent or loans)" : "Living costs (not rent or loans)"} value={inp.livingExpenses} min={2000} max={100000} step={500} unit="SAR/mo" onChange={(v) => set("livingExpenses", v)} />
              <Field label="Rent you pay today" value={inp.rentNow} min={0} max={40000} step={500} unit="SAR/mo" onChange={(v) => set("rentNow", v)} hint={inp.rentNow > 0 ? "paid until you move in; you are compared with renting on" : "0 = you live in a home you own; you are compared with not building"} />
              <div className="note" style={{ marginTop: 0 }}>Left each month today: <b className="mono" style={{ color: household.savings >= 0 ? K.text : K.neg }}>{fSARm(household.savings)}</b> after living costs, rent and your loans.<Hint text={EXPL.savings} /></div>
            </Box>
            <Box title="What you have">
              <Field label="Cash today" value={inp.cashAvailable} min={0} max={8000000} step={50000} unit="SAR" onChange={(v) => set("cashAvailable", v)} />
              <Field label="Safety cushion to keep" value={inp.cashBuffer} min={0} max={1500000} step={25000} unit="SAR" onChange={(v) => set("cashBuffer", v)} hint="a plan that dips below it is flagged; one that goes below zero does not work" help={EXPL.recovery} />
              <Field label="Cash at move-in must be at least" value={moveLine} min={-2000000} max={3000000} step={50000} unit="SAR" onChange={(v) => set("minCashMoveIn", v)} hint="your cash, the loans and what your salary saved, less what the project cost, at move-in, no growth · 0 = never short · a plan below it ranks after plans that meet it" help={EXPL.moveIn} />
              <Field label="Property you already own — its value" value={inp.ownedValue} min={0} max={15000000} step={100000} unit="SAR" onChange={(v) => set("ownedValue", v)} hint={inp.ownedValue > 0 ? `a bank would lend up to ${fM(inp.ownedValue * inp.ownedLtv / 100)} against it (${inp.ownedLtv}%)` : "0 if none"} />
            </Box>
          </div>
          <Box title="تضامن — a joint mortgage with your spouse" style={{ marginTop: 14 }} help={EXPL.joint}>
            <Tick checked={jointOn} onChange={(v) => setJoint("on", v)} label="Take the new mortgages jointly with my spouse (تضامن)" sub="the land or purchase mortgage and the cash-out at move-in use both of your room; personal loans stay yours" />
            {jointOn && <div className="grid" style={twoCol}>
              <div>
                <Field label="Your spouse's income the bank recognises" value={+jt.income || 0} min={0} max={150000} step={500} unit="SAR/mo" onChange={(v) => setJoint("income", v)} hint="gross salary (after GOSI) with fixed allowances, plus half of other regular income shown for two years — not Citizen Account (SAMA)" />
                <Tick checked={!!jt.redf} onChange={(v) => setJoint("redf", v)} label="The mortgage is supported by the Ministry of Housing / REDF (Sakani)" sub="SAMA then allows 65% instead of 55% for an income up to 15,000" />
              </div>
              <div>
                {hj && <div className="note" style={{ marginTop: 0, lineHeight: 1.55 }}>Each of you is tested on your own income: <b>you {hj.capPctA}%</b> ({limitWhy(inp.income)}) · <b>your spouse {hj.capPctB}%</b> ({limitWhy(hj.income)}). Your spouse's loans take {fSAR(hj.existingInstB)}/mo ({hj.existingDbrB.toFixed(0)}% of their income), leaving <b className="mono">{fSAR(hj.dbrRoomB)}/mo</b> of room for a joint mortgage.</div>}
                <Field label="Your spouse's income growth" value={jt.incomeGrowth == null || jt.incomeGrowth === "" ? (inp.incomeGrowth || 0) : +jt.incomeGrowth} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => setJoint("incomeGrowth", v)} hint={jt.incomeGrowth == null || jt.incomeGrowth === "" ? "the same as yours until you change it" : "once a year; their limit follows their income"} />
              </div>
            </div>}
            {jointOn ? <div className="note">Your spouse's salary and their loans run through the household's money whether you build or not, so the comparison stays like for like. Add their loans in the next step.</div>
              : <div className="note" style={{ marginTop: 0 }}>Off: the bank tests your income alone.</div>}
          </Box>
          {!renting && inp.ownedValue > 0 && <Box title="The home you live in today — once you move" style={{ marginTop: 14 }} help="You live in a home you own today. When you move into the new one you can keep it, let it, or sell it. Letting: the rent (net of its own costs) arrives every month from the month after move-in and rises with its value. Selling: it is sold at move-in; the price less selling costs, after repaying any mortgage a plan took on it, goes into your cash — and because the not-building side still owns it, its value is taken off your side in both measures.">
            {lettingOut ? <div className="note" style={{ marginTop: 0 }}>Not used while the new home is let out — you would stay where you are.</div> : <>
              <Seg label="The home you live in today" value={inp.ownHomePlan || "keep"} onChange={(v) => set("ownHomePlan", v)} options={[["keep", "Keep it"], ["let", "Let it"], ["sell", "Sell it"]]} />
              <div style={{ marginTop: 12 }}>
                {(inp.ownHomePlan || "keep") === "keep" && <div className="note" style={{ marginTop: 0 }}>Nothing changes: you own it whether you build or not, so it doesn't move the comparison.</div>}
                {inp.ownHomePlan === "let" && <Field label="Rent you would get, net of its costs" value={inp.ownHomeYield} min={0} max={8} step={0.25} unit="% of its value a year" onChange={(v) => set("ownHomeYield", v)} hint={`≈ ${fSAR(ownedAt(prj.occupy) * inp.ownHomeYield / 100)} a year from ${fCal(prj.occupy + 1)} (it would be worth ${fM(ownedAt(prj.occupy))} then), rising with its value`} />}
                {inp.ownHomePlan === "sell" && <Field label="Selling costs" value={inp.ownHomeSellCostPct} min={0} max={10} step={0.5} unit="% of its value" onChange={(v) => set("ownHomeSellCostPct", v)} hint={`sold at move-in (${fCal(prj.occupy)}) for about ${fM(ownedAt(prj.occupy))}, less ${fM(ownedAt(prj.occupy) * inp.ownHomeSellCostPct / 100)}; broker 2.5%, add 5% if you pay the transfer tax. A mortgage a plan took on it is repaid from the sale.`} />}
              </div>
            </>}
          </Box>}
          <More title="More: growth of income and living costs, your recovery rule, dates">
            <div className="grid" style={twoCol}>
              <div>
                <Field label="Income growth" value={inp.incomeGrowth || 0} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("incomeGrowth", v)} hint={(inp.incomeGrowth || 0) > 0 ? `steps up once a year (${fSAR(inp.income * (1 + inp.incomeGrowth / 100))}/mo from ${fCal(13)}); the bank's limits follow your income` : "0 = your income stays as it is"} />
                <Field label="Living-cost growth" value={inp.livingGrowth || 0} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("livingGrowth", v)} hint="once a year, the same whether you build or not" />
              </div>
              <div>
                <Field label="Cash back at your cushion within" value={inp.recoveryMonths} min={0} max={60} step={6} unit="months after move-in" onChange={(v) => set("recoveryMonths", v)} hint="your rule: a plan that takes longer is marked slow to recover" />
                <div style={{ marginBottom: 12 }}>
                  <label className="lbl" style={{ display: "block", marginBottom: 4 }}>Month 0 of this scenario</label>
                  <input type="month" value={inp.asOf || ""} onChange={(e) => e.target.value && set("asOf", e.target.value)} />
                  <div className="note" style={{ marginTop: 3 }}>Every date counts from here. A saved scenario keeps its own month 0; changing it moves the dates only — bring your cash and loans up to date too.</div>
                </div>
              </div>
            </div>
          </More>
        </div>
      );

      /* ---------- step 2: your loans ---------- */
      // a list of existing loans (yours, or your spouse's under تضامن) as an editable table
      const loanTable = (loans, setList, spouse) => {
        const upd = (i, k, v) => setList(loans.map((l, j) => j === i ? { ...l, [k]: v } : l));
        const inst = loans.reduce((a, l) => a + (l.balance > 0 ? +l.installment || 0 : 0), 0), bal = loans.reduce((a, l) => a + (+l.balance || 0), 0);
        const word = spouse ? "Spouse's loan" : "Loan";
        return <>
              <div className="scroll-x">
                <table className="tbl">
                  <thead><tr><th>Loan</th><th>Balance</th><th>Monthly</th><th>Months left</th><th>Rate</th>{loanMore && <><th>Months since it started</th><th>Settle in month</th><th>May be paid off from cash?</th><th>May be refinanced?</th></>}<th className="no-print" style={{ width: 36 }}></th></tr></thead>
                  <tbody>
                    {loans.map((l, i) => (
                      <tr key={l.id || i}>
                        <td className="l"><input type="text" aria-label={`${word} name`} value={l.name} onChange={(e) => upd(i, "name", e.target.value)} style={{ width: "100%", minWidth: 120 }} /></td>
                        <td><NumIn v={l.balance} on={(v) => upd(i, "balance", v)} w={108} label={`${l.name}: balance`} /></td>
                        <td><NumIn v={l.installment} on={(v) => upd(i, "installment", v)} w={86} label={`${l.name}: monthly instalment`} /></td>
                        <td><NumIn v={l.monthsLeft} on={(v) => upd(i, "monthsLeft", Math.round(v))} w={56} label={`${l.name}: months left`} /><div style={{ fontSize: 12, color: K.sub }}>ends {fCal(loanEnds(l))}</div></td>
                        <td>
                          <span className="flex items-center" style={{ gap: 4, justifyContent: "flex-end" }}><NumIn v={l.rate} on={(v) => upd(i, "rate", v)} w={56} dec label={`${l.name}: rate`} /><select aria-label={`${l.name}: rate type`} value={l.rateType === "flat" ? "flat" : "apr"} onChange={(e) => upd(i, "rateType", e.target.value)} style={{ minHeight: 30, padding: "3px 4px", fontSize: 12 }}><option value="apr">APR</option><option value="flat">flat</option></select></span>
                          {l.rateType === "flat" && <div style={{ fontSize: 12, color: K.sub }}>≈ {reFlatToApr(l.rate, Math.max(1, Math.round((l.ageMonths || 0) + (l.monthsLeft || 0)))).toFixed(2)}% APR</div>}
                        </td>
                        {loanMore && <>
                          <td><NumIn v={l.ageMonths} nullable on={(v) => upd(i, "ageMonths", v == null ? null : Math.round(v))} w={56} placeholder="—" label={`${l.name}: months since it started`} /></td>
                          <td><NumIn v={l.settleAt} nullable on={(v) => upd(i, "settleAt", v == null ? null : Math.round(v))} w={56} placeholder="—" label={`${l.name}: settle in month`} />{l.settleAt != null && l.settleAt > 0 && <div style={{ fontSize: 12, color: K.sub }}>{fCal(l.settleAt)}</div>}</td>
                          <td><input type="checkbox" aria-label={`${l.name}: may be paid off from cash`} checked={l.canSettle !== false} onChange={(e) => upd(i, "canSettle", e.target.checked)} /></td>
                          <td><input type="checkbox" aria-label={`${l.name}: may be refinanced`} checked={l.canRefi !== false} onChange={(e) => upd(i, "canRefi", e.target.checked)} /></td>
                        </>}
                        <td className="no-print"><button aria-label={`Remove ${l.name}`} title="Remove" onClick={() => withUndo(`Removed ${l.name}`, () => setList(loans.filter((_, j) => j !== i)))} style={{ ...iconBtn, padding: 6 }}><Trash2 size={16} color={K.neg} /></button></td>
                      </tr>
                    ))}
                    <tr style={{ background: SOFT, fontWeight: 700 }}><td className="l">Total ({loans.length})</td><td>{fSAR(bal)}</td><td>{fSAR(inst)}</td><td></td><td></td>{loanMore && <><td></td><td></td><td></td><td></td></>}<td className="no-print"></td></tr>
                  </tbody>
                </table>
              </div>
              <div className="flex flex-wrap no-print" style={{ gap: 8, marginTop: 10 }}>
                <button className="btn small" onClick={() => setList([...loans, { id: spouse ? `s${Date.now()}` : Date.now(), name: `${word} ${loans.length + 1}`, balance: 100000, installment: 2500, monthsLeft: 48, rate: 6 }])}>+ Add a loan</button>
                {loans.length > 0 && <button className="btn small" onClick={() => withUndo(spouse ? "Removed all your spouse's loans" : "Removed all loans", () => setList([], true))}>Remove all</button>}
              </div>
        </>;
      };
      const StepLoans = () => {
        const loans = inp.existingLoans;
        const inst = loans.reduce((a, l) => a + (l.balance > 0 ? +l.installment || 0 : 0), 0);
        const instS = spouseLoans.reduce((a, l) => a + (l.balance > 0 ? +l.installment || 0 : 0), 0);
        const parsed = loanTxt.trim() ? parseLoans(loanTxt) : [];
        return (
          <div>
            <Head id="loans" title="What do you already owe?" sub={jointOn ? "The bank counts these instalments first, each against its owner's income; what is left of each of your limits decides how much it can lend (a joint mortgage may use both). Paying one off, or the bank buying one of yours out in a refinance, frees room." : `The bank counts these instalments first; what is left of your ${inp.dbrCap}% limit decides how much it can lend. Paying one off, or the bank buying it out in a refinance, frees room.`} />
            <Box title={`Your loans · ${fSAR(inst)}/mo · ${inp.income > 0 ? (inst / inp.income * 100).toFixed(0) : 0}% of ${jointOn ? "your " : ""}income`} right={<button className="lnk no-print" onClick={() => setLoanMore(!loanMore)}>{loanMore ? "Fewer columns" : "More: age, settle date, permissions"}</button>}>
              {loanTable(loans, setLoans, false)}
              {household.warnings.length > 0 && <div style={{ background: SOFT_AMB, borderRadius: 8, padding: "8px 12px", marginTop: 10, fontSize: 12.5, lineHeight: 1.5 }}>{household.warnings.map((w, k) => <div key={k} className="flex items-start" style={{ gap: 6 }}><AlertTriangle size={14} color={K.brassTx} style={{ flex: "none", marginTop: 3 }} /><span>{w}</span></div>)}</div>}
              <div className="note">"May be paid off from cash" unticked: no plan pays it off early (keep cheap debt). "May be refinanced" unticked: no bank buy-out includes it. "Settle in month": you clear it from your cash then — whether you build or not. A personal loan can be refinanced once it is {inp.refiMinMonths} months old. A flat rate is converted to the APR it amortises at, over its whole term (months since it started + months left).</div>
              <More title="Import or paste loans (Qist export, or one per line: name, balance, instalment, months, rate)">
                <textarea rows={4} value={loanTxt} onChange={(e) => setLoanTxt(e.target.value)} placeholder={'[{"name":"Personal loan","balance":350000,"installment":7900,"monthsLeft":54,"rate":6.5}]\nor\nCar finance; 95000; 2950; 36; 5'} aria-label="Loans to import" />
                {parsed.length > 0 ? <div style={{ marginTop: 8 }}>
                  <div style={{ fontSize: 12.5, marginBottom: 4 }}>Found {parsed.length} loan{parsed.length > 1 ? "s" : ""}:</div>
                  {parsed.map((l, k) => <div key={k} className="mono" style={{ fontSize: 12 }}>{l.name} · {fSAR(l.balance)} · {fSAR(l.installment)}/mo · {l.monthsLeft} months · {l.rate}%</div>)}
                  <div className="flex flex-wrap" style={{ gap: 8, marginTop: 8 }}>
                    <button className="btn gold small" onClick={() => withUndo(`Replaced your loans with ${parsed.length} imported`, () => { setLoans(parsed, true); setLoanTxt(""); })}>Replace my loans with these</button>
                    <button className="btn small" onClick={() => { setLoans([...loans, ...parsed]); setLoanTxt(""); }}>Add them to my loans</button>
                    {jointOn && <button className="btn small" onClick={() => { setJoint("loans", [...spouseLoans, ...parsed.map((l, k) => ({ ...l, id: `s${Date.now()}${k}`, canRefi: false }))]); setLoanTxt(""); }}>Add them to my spouse's loans</button>}
                  </div>
                </div> : loanTxt.trim() ? <div className="note" style={{ color: K.neg }}>Nothing recognisable yet — check the format (separate columns with tabs or semicolons if your numbers contain commas).</div> : null}
              </More>
            </Box>
            {jointOn && <Box title={`Your spouse's loans · ${fSAR(instS)}/mo · ${hj && hj.income > 0 ? (instS / hj.income * 100).toFixed(0) : 0}% of their income`} style={{ marginTop: 14 }} help={EXPL.joint}>
              {loanTable(spouseLoans, (l) => setJoint("loans", l), true)}
              <div className="note">تضامن: these count against your spouse's income only (their limit is {hj ? hj.capPctB : "—"}%). The household pays them whether you build or not; a plan may pay one off from your cash only to make room for a joint mortgage, if you allow it ("More" columns). Your spouse takes no personal loan here, so none of theirs is bought out.</div>
            </Box>}
            <Box title="When borrowing room opens up" style={{ marginTop: 14 }} help={EXPL.capacity}>
              <div className="scroll-x"><table className="tbl">
                <thead><tr>{["From", ...((inp.incomeGrowth || 0) > 0 ? [hj ? "Your income" : "Income"] : []), hj ? "Your instalments" : "Instalments running", hj ? `Your free room (${hj.capPctA}%)` : `Free room in your ${inp.dbrCap}%`, ...(hj ? [`Your spouse's free room (${hj.capPctB}%)`] : []), hj ? `Joint mortgages (each ≤ ${inp.mortgageCap}%)` : `All mortgages (≤ ${inp.mortgageCap}%)`, `One personal loan${hj ? ", yours" : ""} (≤ ${inp.perLoanCap}%)`, "Two personal loans"].map((h) => <th key={h}>{h}</th>)}</tr></thead>
                <tbody>{household.capTimeline.map((c) => <tr key={c.t}><td className="l">{capWhy(c)}</td>{(inp.incomeGrowth || 0) > 0 && <td>{fSAR(c.income)}</td>}<td>{fSAR(c.inst)} <span style={{ color: K.sub }}>({(c.inst / c.income * 100).toFixed(0)}%)</span></td><td style={{ color: c.room > 0 ? K.text : K.neg }}>{fSAR(c.room)}/mo</td>{hj && <td style={{ color: (c.roomB || 0) > 0 ? K.text : K.neg }}>{fSAR(c.roomB || 0)}/mo</td>}<td>{fM(c.maxMortgage)}</td><td>{fM(c.maxOnePl)}</td><td>{fM(c.maxTwoPl)}</td></tr>)}</tbody>
              </table></div>
              <div className="note">What the free room converts to at your Bank terms (step 4), before any loan-to-value limit. Mortgages and personal loans share the same room — alternatives, not added together. Never more than two personal loans at once (your old ones count); a plan can still borrow earlier by having the bank buy an old loan out.</div>
            </Box>
            <More title="The bank's rules: limits, loan-to-value, refinancing, settlement fee">
              <div className="grid" style={twoCol}>
                <div>
                  <Field label="All instalments together may use" value={inp.dbrCap} min={30} max={70} step={1} unit="% of income" onChange={(v) => set("dbrCap", v)} />
                  <Field label="All mortgages together may use" value={inp.mortgageCap} min={20} max={70} step={1} unit="% of income" onChange={(v) => set("mortgageCap", v)} />
                  <Field label="One personal loan may use" value={inp.perLoanCap} min={15} max={65} step={1} unit="% of income" onChange={(v) => set("perLoanCap", v)} hint="a second personal loan may use what is left" />
                  <Field label="Bank's ceiling on one personal loan" value={inp.plCap} min={100000} max={3000000} step={50000} unit="SAR" onChange={(v) => set("plCap", v)} />
                </div>
                <div>
                  <Field label="Loan-to-value when the bank finances the land" value={inp.landLtv} min={30} max={95} step={5} unit="%" onChange={(v) => set("landLtv", v)} />
                  <Field label="…against the property you own" value={inp.ownedLtv} min={30} max={90} step={5} unit="%" onChange={(v) => set("ownedLtv", v)} />
                  <Field label="…cash-out on the finished home" value={inp.cashoutLtv} min={30} max={90} step={5} unit="%" onChange={(v) => set("cashoutLtv", v)} />
                  <Field label="A personal loan can be refinanced after" value={inp.refiMinMonths} min={0} max={36} step={1} unit="months" onChange={(v) => set("refiMinMonths", v)} />
                  <Field label="Early-settlement fee" value={inp.settleFeeMonths} min={0} max={3} step={1} unit="months of profit" onChange={(v) => set("settleFeeMonths", v)} hint="SAMA cap: the next 3 months' profit on the declining balance" />
                </div>
              </div>
            </More>
          </div>
        );
      };

      /* ---------- step 3: the home ---------- */
      const costRows = build
        ? [["Land", prj.land], [`Transfer tax on the land (${inp.rettPct}%)${prj.rettExempt > 0 ? ", first-home relief applied" : ""}`, prj.rett], [`Broker's fee on the land (${inp.landBrokerPct}%)`, prj.landBroker], ["Construction", prj.hard], ["Design, permits, supervision", prj.soft], ["Contingency", prj.cont], ["Kitchen, AC, landscape", prj.finish], [`Cost overrun (${inp.overrunPct}%)`, prj.overrun], [`VAT ${inp.vatPct}%`, prj.vat]].filter(([, v], k) => v > 0.5 || ![2, 7].includes(k))
        : [["Purchase price", prj.price], [`Transfer tax (${inp.rettPct}%)${prj.rettExempt > 0 ? ", first-home relief applied" : ""}`, prj.rett], ["Broker", prj.broker], ["Finishing, furnishing", prj.finish], [`VAT ${inp.vatPct}% on finishing`, prj.vat]];
      const vw = (() => { const occ = prj.occupy - 1, landMove = prj.landValueAt(occ), end = prj.valueAt(H), landEnd = prj.landValueAt(H); return { landMove, end, landEnd, bldEnd: end - landEnd, yrs: Math.max(0, Math.round((H - occ) / 12)) }; })();
      const StepHome = () => (
        <div>
          <Head id="home" title={build ? "What will you build, and when?" : "What will you buy, and when?"} sub={build ? `All amounts in SAR. Land carries no VAT; construction and finishing do. The land grows in value with the market; the building is worth what it costs to build (plus your uplift) and loses ${dep}% of that a year from move-in.` : "All amounts in SAR. Finishing carries VAT. The home's value grows with the market from the month you buy."} />
          <div className="no-print" style={{ marginBottom: 14 }}><Seg label="Build or buy" value={inp.acquire} onChange={(v) => set("acquire", v)} options={[["build", "Buy land and build"], ["buy", "Buy a ready home"]]} /></div>
          <div className="grid" style={twoCol}>
            <Box title={build ? "Land and construction" : "The purchase"}>
              {build ? <>
                <Field label="Land area" value={inp.landArea} min={150} max={2500} step={25} unit="m²" onChange={(v) => set("landArea", v)} />
                <Field label="Land price" value={inp.landPrice} min={300} max={15000} step={100} unit="SAR/m²" onChange={(v) => set("landPrice", v)} hint={`land ${fM(prj.land)}${prj.landMonth > 0 ? ` in ${fCal(prj.landMonth)}` : ""}`} />
                <Field label="Ground floor, as % of the land" value={inp.builtPct} min={0} max={100} step={5} unit="%" onChange={(v) => set("builtPct", v)} hint={inp.builtPct > 0 ? `${Math.round(inp.landArea * inp.builtPct / 100)} m² per floor · 0 = type the total area instead` : "0 = type the total built-up area below"} />
                {inp.builtPct > 0 ? <Field label="Floors" value={inp.floors} min={1} max={4} step={0.5} unit="floors" onChange={(v) => set("floors", v)} hint={`built-up ${Math.round(prj.builtArea)} m²`} /> : <Field label="Total built-up area" value={inp.builtArea} min={100} max={2500} step={10} unit="m²" onChange={(v) => set("builtArea", v)} />}
                <Field label="Construction cost, turnkey" value={inp.buildCost} min={1000} max={7000} step={50} unit="SAR/m²" onChange={(v) => set("buildCost", v)} hint={`${fM(prj.hard)} before VAT${prj.inflate > 1 ? `, incl. ${((prj.inflate - 1) * 100).toFixed(0)}% price rises to the start` : ""}`} />
                <Field label="Construction takes" value={inp.buildMonths} min={6} max={36} step={1} unit="months" onChange={(v) => set("buildMonths", v)} />
                <More title="More: design and permits, contingency, overrun, extras, price rises, value uplift, the building's ageing, broker, VAT, transfer tax">
                  <Field label="Design, permits, supervision" value={inp.softPct} min={0} max={20} step={0.5} unit="% of construction" onChange={(v) => set("softPct", v)} />
                  <Field label="Contingency" value={inp.contPct} min={0} max={25} step={1} unit="%" onChange={(v) => set("contPct", v)} hint="overruns are the norm — keep at least 5%" />
                  <Field label="Cost overrun (a stress test)" value={inp.overrunPct || 0} min={0} max={30} step={1} unit="%" onChange={(v) => set("overrunPct", v)} hint="extra cost on construction, design, contingency and extras — it adds no value" />
                  <Field label="Kitchen, AC, landscape" value={inp.finishExtra} min={0} max={800000} step={10000} unit="SAR" onChange={(v) => set("finishExtra", v)} />
                  <Field label="Construction price rises" value={inp.costInflation} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("costInflation", v)} />
                  <Field label="Value uplift of building it yourself" value={inp.devMarginPct} min={-20} max={40} step={1} unit="%" onChange={(v) => set("devMarginPct", v)} hint={`on what you build, not the land: the building is worth ${fM(prj.buildValue)} when finished`} help={EXPL.value} />
                  <Field label="Building loses value" value={dep} min={0} max={5} step={0.25} unit="% a year" onChange={(v) => set("buildDeprPct", v)} hint={dep > 0 ? `${fM(prj.buildValue * dep / 100)} a year from move-in (straight-line); the land keeps growing ${inp.appreciation}% a year` : "0 = the building keeps its value; the land still grows"} help={EXPL.buildDepr} />
                  <Field label="Broker's fee on the land" value={inp.landBrokerPct == null ? 2.5 : inp.landBrokerPct} min={0} max={5} step={0.25} unit="%" onChange={(v) => set("landBrokerPct", v)} />
                  <Field label="VAT" value={inp.vatPct} min={0} max={20} step={1} unit="%" onChange={(v) => set("vatPct", v)} />
                  <Field label="Real-estate transfer tax" value={inp.rettPct} min={0} max={10} step={0.5} unit="%" onChange={(v) => set("rettPct", v)} />
                  <Tick checked={inp.firstHomeExempt} onChange={(v) => set("firstHomeExempt", v)} label={`First-home relief (the state pays the tax on the first ${fM(inp.rettExemptCap)})`} />
                </More>
              </> : <>
                <Field label="Price" value={inp.propertyPrice} min={300000} max={15000000} step={50000} unit="SAR" onChange={(v) => set("propertyPrice", v)} />
                <Field label="Finishing, furnishing" value={inp.finishExtra} min={0} max={800000} step={10000} unit="SAR" onChange={(v) => set("finishExtra", v)} />
                <More title="More: broker, VAT, transfer tax">
                  <Field label="Broker" value={inp.brokerPct} min={0} max={5} step={0.5} unit="%" onChange={(v) => set("brokerPct", v)} />
                  <Field label="VAT on finishing" value={inp.vatPct} min={0} max={20} step={1} unit="%" onChange={(v) => set("vatPct", v)} />
                  <Field label="Real-estate transfer tax" value={inp.rettPct} min={0} max={10} step={0.5} unit="%" onChange={(v) => set("rettPct", v)} />
                  <Tick checked={inp.firstHomeExempt} onChange={(v) => set("firstHomeExempt", v)} label={`First-home relief (the state pays the tax on the first ${fM(inp.rettExemptCap)})`} />
                </More>
              </>}
            </Box>
            <div className="grid" style={{ gap: 14, alignContent: "start" }}>
              <Box title="When">
                <MonthField label={build ? "Buy the land in" : "Buy in"} value={inp.landMonth} min={0} max={72} onChange={(v) => setInp((s) => ({ ...s, landMonth: v, buildStart: Math.max(s.buildStart, v) }))} hint={`today's price grown ${inp.appreciation}%/yr until then`} />
                {build && <MonthField label="Start building in" value={curStart} min={0} max={72} onChange={(v) => setInp((s) => ({ ...s, buildStart: Math.max(v, s.landMonth) }))} hint={`you move in ${fCal(prj.occupy)}${prj.inflate > 1 ? ` · construction ${((prj.inflate - 1) * 100).toFixed(0)}% dearer than today` : ""} · not sure? Step 5 tests every start`} />}
              </Box>
              <Box title="Living in it — or letting it" help={EXPL.rentOut}>
                <Seg label="Living in it or letting it" value={lettingOut ? "all" : (inp.partRentAnnual || 0) > 0 ? "part" : "live"} onChange={(v) => setInp((s) => v === "live" ? { ...s, partRentAnnual: 0, rentOutPct: 0, rentOutFixed: 0 } : v === "part" ? { ...s, rentOutPct: 0, rentOutFixed: 0, partRentAnnual: s.partRentAnnual > 0 ? s.partRentAnnual : 60000 } : { ...s, partRentAnnual: 0, rentOutPct: s.rentOutPct > 0 || s.rentOutFixed > 0 ? s.rentOutPct : 5 })} options={[["live", "Live in it"], ["part", "Live in it, let part"], ["all", "Let all of it"]]} />
                <div style={{ marginTop: 12 }}>
                  {!lettingOut && (inp.partRentAnnual || 0) > 0 && <Field label="Rent for the part you let (annex, floor)" value={inp.partRentAnnual} min={0} max={400000} step={5000} unit="SAR/yr" onChange={(v) => set("partRentAnnual", v)} hint={`from ${fCal(prj.occupy + 1)}, rising with rent growth (${inp.rentGrowth}%/yr) · net of its own costs`} />}
                  {lettingOut && <>
                    <Field label="Rent, as % of the all-in cost" value={inp.rentOutPct || 0} min={0} max={12} step={0.25} unit="%/yr" onChange={(v) => set("rentOutPct", v)} hint={(inp.rentOutFixed || 0) > 0 ? "not used — the fixed rent below is set" : `= ${fSAR(prj.total * (inp.rentOutPct || 0) / 100)} a year from ${fCal(prj.occupy + 1)}`} />
                    <Field label="…or a fixed rent" value={inp.rentOutFixed || 0} min={0} max={1000000} step={5000} unit="SAR/yr" onChange={(v) => set("rentOutFixed", v)} hint={(inp.rentOutFixed || 0) > 0 ? "overrides the %" : "0 = use the % above"} />
                  </>}
                  <Field label="Rent growth" value={inp.rentGrowth} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("rentGrowth", v)} hint={renting ? "also raises the rent you pay today" : null} />
                </div>
              </Box>
              <Box title="Market and the comparison">
                <Field label={build ? "Land values grow" : "Home values grow"} value={inp.appreciation} min={-5} max={12} step={0.5} unit="%/yr" onChange={(v) => set("appreciation", v)} hint={build ? `the land; the building ages instead (${dep}% a year — "Building loses value" under More, in Land and construction)` : null} help={EXPL.value} />
                <Field label="Your cash earns" value={inp.altReturn} min={0} max={15} step={0.5} unit="%/yr" onChange={(v) => set("altReturn", v)} hint="on both sides: what your cash would earn if you didn't build" />
                <Field label="Zakat on invested cash" value={inp.cashZakatPct || 0} min={0} max={2.5} step={0.5} unit="%/yr" onChange={(v) => set("cashZakatPct", v)} hint={(inp.cashZakatPct || 0) > 0 ? `cash then grows ${((1 + inp.altReturn / 100) * (1 - inp.cashZakatPct / 100) * 100 - 100).toFixed(2)}% a year, on both sides; a home you live in is exempt` : "0 = not counted"} />
                <MonthField label="Compare until" value={inp.horizon * 12} min={60} max={360} onChange={(v) => set("horizon", Math.max(5, Math.min(30, Math.round(v / 12))))} hint={`${inp.horizon} years`} />
                <More title="More: upkeep">
                  <Field label="Maintenance" value={inp.maintPct} min={0} max={3} step={0.1} unit="% of value a year" onChange={(v) => set("maintPct", v)} />
                  <Field label="Insurance and fees" value={inp.insurance} min={0} max={20000} step={500} unit="SAR/yr" onChange={(v) => set("insurance", v)} />
                </More>
              </Box>
            </div>
            <Box title="What it costs, and what it is worth" help={EXPL.cost}>
              <table className="bridge"><tbody>
                {costRows.map(([l, v]) => <tr key={l}><td>{l}</td><td className="v">{fSAR(v)}</td></tr>)}
                <tr className="tot"><td>All-in cost</td><td className="v">{fSAR(prj.total)}</td></tr>
                {build && prj.builtArea > 0 && <tr><td>Cost per m² built (without the land)</td><td className="v">{fSAR(prj.costPerSqm)}</td></tr>}
                <tr><td colSpan={2} style={{ paddingTop: 12, fontWeight: 700 }}>What it is worth<Hint text={EXPL.value} label="What it is worth" /></td></tr>
                {build ? <>
                  <tr><td>Land, grown {inp.appreciation}% a year to {fCal(prj.occupy)}</td><td className="v">{fSAR(vw.landMove)}</td></tr>
                  <tr><td>Building: (construction + design + extras) × (1 + {inp.devMarginPct}% uplift)<div className="n">contingency, overrun, VAT, tax and fees add no value</div></td><td className="v">{fSAR(prj.buildValue)}</td></tr>
                </> : null}
                <tr className="tot"><td>Value when you move in ({fCal(prj.occupy)})</td><td className="v" style={{ color: prj.value0 >= prj.total ? K.pos : K.neg }}>{fSAR(prj.value0)}</td></tr>
                <tr><td>Value in {endDate}{build ? <div className="n">land {fM(vw.landEnd)} (still growing) + building {fM(vw.bldEnd)} (after {vw.yrs} years at −{dep}% a year)</div> : <div className="n">growing {inp.appreciation}% a year</div>}</td><td className="v">{fSAR(vw.end)}</td></tr>
              </tbody></table>
              <div className="note">{build ? `The land (with tax${prj.landBroker > 0 ? " and broker" : ""}) is paid in ${fCal(prj.landMonth)}; construction${prj.overrun > 0 ? " and the overrun" : ""} evenly from ${fCal(prj.start + 1)} to ${fCal(prj.start + prj.bm)}; the extras in the last month.` : `Everything is paid in ${fCal(prj.landMonth)}.`} Your cash and the loans pay each bill as it falls due — there is no construction mortgage.</div>
            </Box>
          </div>
        </div>
      );

      /* ---------- step 4: how to pay ---------- */
      const TERM_ROWS = [["lm", build ? "Land mortgage" : "Purchase mortgage", "lmRate", "lmTenure", "lmFeesPct", 30, 12], ["eq", "Mortgage on the property you own", "eqRate", "eqTenure", "eqFeesPct", 30, 12], ["co", "Cash-out mortgage on the new home", "coRate", "coTenure", "coFeesPct", 30, 12], ["pl", "Personal loans", "plRate", "plTenure", null, 7, 15]];
      const aprOf = (rk, tk) => reEffRate(inp, inp[rk], Math.max(1, Math.round(inp[tk] * 12)));
      const TermsBox = () => {
        const showEq = inp.ownedValue > 0 || inp.plans.some((o) => o.enabled && o.eqWhen !== "none");
        return (
          <More title={`Bank terms for every plan and for the tool: ${TERM_ROWS.filter(([k]) => k !== "eq" || showEq).map(([k, , rk, tk]) => `${{ lm: build ? "land" : "purchase", eq: "own property", co: "cash-out", pl: "personal" }[k]} ${inp[rk]}%${inp.rateQuote === "flat" ? " flat" : ""}/${inp[tk]}y`).join(" · ")}`}>
            <div className="flex items-center flex-wrap" style={{ gap: 10, marginBottom: 10 }}>
              <Seg label="How your bank quotes rates" value={inp.rateQuote} onChange={(v) => set("rateQuote", v)} options={[["apr", "Rates as APR"], ["flat", "Rates as flat (hamish)"]]} />
              <Hint text={EXPL.terms} label="Bank terms" />
            </div>
            <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 230px), 1fr))", gap: "4px 20px" }}>
              {TERM_ROWS.filter(([k]) => k !== "eq" || showEq).map(([k, label, rk, tk, fk, maxT, maxR]) => { const apr = aprOf(rk, tk); return (
                <div key={k} style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, margin: "4px 0 8px" }}>{label}</div>
                  <Field label="Profit rate" value={inp[rk]} min={0} max={maxR} step={k === "pl" ? 0.25 : 0.05} unit="%" onChange={(v) => set(rk, v)} hint={`${inp.rateQuote === "flat" ? `= ${apr.toFixed(2)}% APR · ` : ""}costs ${reEffYear(apr).toFixed(2)}% a year (vs ${(+netRet.toFixed(2))}% your cash earns)`} />
                  <Field label="Years" value={inp[tk]} min={1} max={maxT} step={1} unit="yrs" onChange={(v) => set(tk, v)} />
                  {fk && <Field label="Bank fee" value={inp[fk]} min={0} max={3} step={0.25} unit="% of the loan" onChange={(v) => set(fk, v)} />}
                </div>); })}
            </div>
            {/* bridge money: only for a plan whose cash runs short until one of its loans lands, when no loan can cover the gap in time */}

      const PAY_NAME = { lm: build ? "Land mortgage" : "Purchase mortgage", eq: "Own-property mortgage", co: "Cash-out mortgage", pl: jointOn ? "Your personal loan" : "Personal loan", pl2: jointOn ? "Your personal loan at move-in" : "Personal loan at move-in", spl: "Your spouse's personal loan", spl2: "Your spouse's personal loan at move-in" };
      const PAY_EARLY = { prepaid: "Your plan pays it off", refinanced: "Bought out by your new personal loan", sold: "Repaid when you sell your home", settled: "Paid off to make room for a mortgage" };
      const PayoffPanel = ({ r }) => {
        const loans = ["lm", "eq", "co", "pl", "spl", "pl2", "spl2"].map((k) => r[k]).filter((f) => f && f.amount > 0 && f.startedAt != null);
        if (!loans.length) return <div className="note">This plan takes no new loans.</div>;
        const f = loans.find((x) => x.key === payKey) || loans[0], pr = rePayoffRows(f, r.plan.extraMo, inp.settleFeeMonths);
        if (!pr) return null;
        const e = pr.early, extra = f.key === "lm" ? Math.max(0, r.plan.extraMo || 0) : 0, lastT = r.months.length - 1;
        const tPick = Math.max(pr.start, Math.min(pr.end, payMonth != null ? payMonth : e ? e.row.t : pr.start + 12)), a = pr.at(tPick);
        const earlyTxt = !e ? null : e.kind === "prepaid" ? `Your plan pays it off early from your cash in ${fCal(e.t)}, ${r.plan.prepayAfter} months after move-in` : e.kind === "refinanced" ? `In ${fCal(e.t)} your plan's new personal loan buys it out — the bank clears it, no cash from you` : e.kind === "sold" ? `In ${fCal(e.t)} it is repaid from the sale of the home it is secured on` : `In ${fCal(e.t)} your plan pays it off from your cash to make room for a mortgage`;
        // the yearly rows, with the plan's own payoff in its place (a payoff before that month's instalment gets its own row)
        const rows = pr.rows.map((x) => ({ ...x, own: !!e && e.kind === "prepaid" && x.t === e.t }));
        if (e && e.row && !rows.some((x) => x.own)) rows.push({ ...e.row, t: e.t, own: true });
        rows.sort((x, y) => x.t - y.t || (x.own ? -1 : 1));
        return (<>
          {loans.length > 1 && <div style={{ marginBottom: 10 }}><Seg label="Loan" value={f.key} onChange={(k) => { setPayKey(k); setPayMonth(null); }} options={loans.map((x) => [x.key, PAY_NAME[x.key]])} /></div>}
          <div style={{ fontSize: 13, lineHeight: 1.55, marginBottom: 10 }}>
            <b>{f.label}</b>: {fM(f.amount)} taken {fCal(f.startedAt)}{f.split ? ` as two new loans (${fM(f.split[0])} + ${fM(f.split[1])})` : ""}{f.refi ? `, of which ${fM(f.refi.payoff)} cleared ${f.refi.names.join(" + ")}` : ""} · {f.quoted}%{inp.rateQuote === "flat" ? ` flat (≈${f.rate.toFixed(2)}% APR)` : ""} over {f.tenure} years · {fSAR(f.pmt)}/mo{extra > 0 ? ` + ${fSAR(extra)} extra` : ""} · last instalment {fCal(pr.end)} · {fM(pr.totalProfit)} profit over its life if you keep it.
          </div>
          <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 260px), 1fr))", gap: 14, alignItems: "start" }}>
            <MonthField label="Pay it off in" value={tPick} min={pr.start} max={pr.end} onChange={setPayMonth} hint={tPick === pr.start ? "the month it is taken, before any instalment" : `after that month's instalment · year ${a.year} of the loan`} help={EXPL.payoff} />
            <div style={{ background: SOFT, borderRadius: 8, padding: "10px 12px", fontSize: 13, lineHeight: 1.55 }}>
              {a.bal > 0 ? <>To pay it off in <b>{fCal(tPick)}</b>: balance <span className="mono">{fSARm(a.bal)}</span> + early-settlement fee <span className="mono">{fSARm(a.fee)}</span> = <b className="mono" style={{ fontSize: 15 }}>{fSARm(a.total)}</b>.<br />
                Keep it instead and you pay {a.monthsLeft} more instalments, {fM(pr.totalPaid - a.paid)} in all, {fM(a.profitLeft)} of it profit — paying it off then saves {fM(a.profitLeft - a.fee)} of profit after the fee (before what that cash would have earned).</> : <>Repaid by its last instalment in {fCal(pr.end)} — nothing left to pay.</>}
            </div>
          </div>
          <div className="scroll-x" style={{ marginTop: 10 }}><table className="tbl">
            <thead><tr><th>Year of the loan</th><th>Month</th><th>To pay it off</th><th>Balance</th><th>Early-settlement fee</th><th>Profit still to pay if you keep it</th><th>Paid so far</th></tr></thead>
            <tbody>{rows.map((x, k) => { const after = !!e && !x.own && (x.t > e.t || (e.kind !== "prepaid" && x.t === e.t)); return (
              <tr key={k} style={{ background: x.own ? SOFT_AMB : x.t === tPick && !after ? SOFT : "transparent", color: after ? K.sub : K.text }}>
                <td className="l">{x.own ? <b>{e.kind === "refinanced" && f.owner === "B" ? "Bought out by your spouse's new personal loan" : PAY_EARLY[e.kind]}</b> : x.bal > 0 ? `Year ${x.year}` : "Last instalment"}</td>
                <td>{fCal(x.t)}{x.t > lastT ? " †" : ""}</td>
                <td style={{ fontWeight: 700 }}>{fSAR(x.total)}</td><td>{fSAR(x.bal)}</td><td>{fSAR(x.fee)}</td><td>{fSAR(x.profitLeft)}</td><td>{fSAR(x.paid)}</td>
              </tr>); })}</tbody>
          </table></div>
          <div className="note">{earlyTxt ? <>{earlyTxt}: {fSARm(e.row.total)}, incl. {fSARm(e.row.fee)} fee (the highlighted row); the grey rows after it are what it would cost had you kept the loan. </> : null}Each row: the balance after that month's instalment plus the bank's early-settlement fee — at most the next {inp.settleFeeMonths} months of profit on what is left (SAMA cap), the same fee the tool charges when a plan pays a loan off early. "Paid so far" counts every instalment{extra > 0 ? " and extra payment" : ""} from {fCal(pr.start + 1)}.{pr.end > lastT ? ` † After ${endDate}, the end of the comparison: the bank's schedule carries on the same way.` : ""}</div>
        </>);
      };
      const StepAnswer = () => {
        if (!lead) return <div><Head id="answer" title="Your answer" /><Box>Tick at least one plan in step 4.</Box></div>;
        const r = focusRes, rc = cashReconcile(r, occOf(r), inp, prj);
        const st = whatIfFor("stress"), be = wi("breakeven"), rb = whatIfFor("ready"), lw = whatIfFor("worth");
        const beCell = (d, k) => d[k] == null ? ((k === "econ" ? r.econAdv : r.advantage) >= 0 ? "already ahead" : "not within reach") : d.key === "rent" ? `${fM(d[k])} a year` : `${(+d[k].toFixed(2))}%`;
        return (
          <div>
            {AnswerCore({ one: false })}
            {RefiBox({ r, i: focusIdx })}
            {liveIdx.length > 1 && CompareChart()}
            <div className="box" style={{ marginTop: 14, padding: "0 18px" }}>
              <div className="flex justify-between items-center flex-wrap" style={{ gap: 8, padding: "12px 0 4px" }}><b style={{ fontSize: 14 }}>Look deeper</b><PlanPicker /></div>
              <Dis id="breakeven" title="What would have to be true for building to win?" sub="break-evens" open={!!openDis.breakeven} onToggle={toggleDis}>

                  <div className="scroll-x"><table className="tbl">
                    <thead><tr><th>Assumption</th><th>Yours</th><th>Draws level — everything grows</th><th>— your rule 7</th></tr></thead>
                    <tbody>{be.data.map((d) => <tr key={d.key}><td className="l">{d.label}</td><td>{d.key === "rent" ? `${fM(d.current)} a year` : `${d.current}%`}</td><td style={{ fontWeight: 700 }}>{beCell(d, "econ")}</td><td>{beCell(d, "rule7")}</td></tr>)}</tbody>
                  </table></div>
                  {be.partial && <div className="note">Working on the rest…</div>}
                  <div className="note">Each line changes one assumption on its own until {planRef(focusIdx)} draws level with {baseLbl}. The rent line is any rent you would receive from move-in (an annex or a floor{lettingOut ? ", or the whole home" : ""}) — or what living there is worth to you. Appreciation is the land's; the building keeps losing {dep}% a year.</div>
                </>}
              </Dis>
              <Dis id="stress" title="How fragile is it?" sub="stress tests" open={!!openDis.stress} onToggle={toggleDis}>
                {!st ? <div className="note">Working it out…</div> : <>
                  <div style={{ fontSize: 13, marginBottom: 6 }}>{st[0].passes ? <>{planName(focusIdx)} survives <b>{st.filter((x) => x.key !== "base" && x.passes).length} of {st.length - 1}</b> shocks without running out of cash{st.some((x) => x.bridged && !x.feasible) ? <> ({st.filter((x) => x.key !== "base" && x.bridged && !x.feasible).length} more only with bridge money)</> : null}.</> : st[0].bridged ? <>{planName(focusIdx)} already needs bridge money as you entered it — the shocks show how much worse it gets.</> : <>{planName(focusIdx)} already runs out of cash as you entered it — the shocks show how much worse it gets.</>}</div>
                  <div className="scroll-x"><table className="tbl">
                    <thead><tr><th>If…</th><th>Works?</th><th>Lowest cash</th><th>vs {baseLbl} (everything grows)</th><th>Rule 7</th></tr></thead>
                    <tbody>{st.map((x) => <tr key={x.key} style={{ background: x.key === "base" ? SOFT : "transparent" }}><td className="l">{x.label}</td><td style={{ color: worksCol(x), fontWeight: 700 }}>{works(x) ? worksTxt(x) : "runs out"}</td><td style={{ color: x.minCash < 0 ? K.neg : K.text }}>{fCash(x.minCash)} · {fCal(x.minCashT)}</td><td style={{ color: signCol(x.econAdv) }}>{fM(x.econAdv)}</td><td>{fM(x.advantage)}</td></tr>)}</tbody>
                  </table></div>
                  <div className="note">"Loan rates +2 points" raises the APR of every new loan; your old loans keep their rates. Costs +20% add cost but no value.</div>
