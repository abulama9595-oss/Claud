                  <Slider label="LTV banks lend against your existing property" value={inp.ownedLtv} min={30} max={90} step={5} unit="%" onChange={(v) => set("ownedLtv", v)} />
                  <Slider label="Cash-out LTV on the finished home" value={inp.cashoutLtv} min={40} max={90} step={5} unit="% of value" onChange={(v) => set("cashoutLtv", v)} hint="mortgage raised against an owned, completed home" />
                  <Slider label="Bank ceiling on one personal loan" value={inp.plCap} min={100000} max={3000000} step={50000} unit="SAR" onChange={(v) => set("plCap", v)} />
                  <Slider label="A personal loan can be refinanced after" value={inp.refiMinMonths} min={0} max={36} step={1} unit="months" onChange={(v) => set("refiMinMonths", v)} hint="bank buy-out rule; mortgages are never refinanced" />
                  <Slider label="Early-settlement fee" value={inp.settleFeeMonths} min={0} max={3} step={1} unit="months' profit" onChange={(v) => set("settleFeeMonths", v)} hint="SAMA cap: the next 3 months' term cost" />
                  <Select label="Rates of NEW facilities are entered as" value={inp.rateQuote} onChange={(v) => set("rateQuote", v)} options={[["apr", "APR — reducing balance"], ["flat", "Flat 'hamish' % per year (KSA bank quotes)"]]} />
                </Adv>
              </Card>
              <Card n="B" title="Existing loans (as the bank sees them)">
                <LoanTable loans={inp.existingLoans} onChange={(l) => set("existingLoans", l)} income={inp.income} dbrCap={inp.dbrCap} />
                <Note>"Settle from cash?" unticked: no strategy pays this loan off early (good for cheap debt). "May refinance?" unticked: no bank buy-out may include it. "Settle in month" pays it off from your cash on that date, in every strategy. "Months since it started" matters for refinancing: a personal loan can only be bought out once it is {inp.refiMinMonths} months old. Mortgages are never paid off early or refinanced.</Note>
                <div className="subhead">How much the bank can lend you, and when <Hint text={EXPL.capacity} /></div>
                <div className="scroll-x"><table className="tbl" style={{ fontFamily: MONO, fontSize: 12 }}>
                  <thead><tr>{["From", "Instalments running", "Free room in the " + inp.dbrCap + "% bucket", "Mortgage (≤ " + inp.mortgageCap + "%)", "One personal loan (≤ " + inp.perLoanCap + "%)", "Two personal loans"].map((h, k) => <th key={h} style={{ ...th, textAlign: k === 0 ? "left" : "right", whiteSpace: "normal" }}>{h}</th>)}</tr></thead>
                  <tbody>{household.capTimeline.map((c) => <tr key={c.t}><td style={{ ...td, textAlign: "left", fontFamily: SANS }}>{c.t === 0 ? "today" : fCal(c.t)}</td><td style={td}>{fSAR(c.inst)} <span style={{ color: C.sub }}>({(c.inst / inp.income * 100).toFixed(0)}%)</span></td><td style={{ ...td, color: c.room > 0 ? C.text : C.neg }}>{fSAR(c.room)}/mo</td><td style={td}>{fS(c.maxMortgage)}</td><td style={td}>{fS(c.maxOnePl)}</td><td style={td}>{fS(c.maxTwoPl)}</td></tr>)}</tbody>
                </table></div>
                <Note>Principal the room converts to: mortgages at Strategy 1's land-mortgage rate and tenure, personal loans at its personal-loan rate and tenure — before any LTV limit. Mortgage and personal loans share the same bucket, so these are alternatives, not additive. Rows appear each time an existing loan is settled or ends.</Note>
              </Card>
            </> : <>
              <Card n="A" title="Letting">
                <Slider label="Rent achievable" value={inp.rentMo} min={2000} max={60000} step={500} unit="SAR/mo" onChange={(v) => set("rentMo", v)} hint={`gross yield ${pct1(inp.rentMo * 12 / prj.total * 100)} on all-in cost`} />
                <Slider label="Rent growth" value={inp.rentGrowth} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("rentGrowth", v)} />
                <Slider label="Vacancy & collection loss" value={inp.vacancyPct} min={0} max={30} step={1} unit="%" onChange={(v) => set("vacancyPct", v)} />
                <Adv title="Advanced: management, zakat">
                  <Slider label="Property management" value={inp.mgmtPct} min={0} max={15} step={0.5} unit="% of rent" onChange={(v) => set("mgmtPct", v)} />
                  <Slider label="Zakat on net rent" value={inp.zakatPct} min={0} max={2.5} step={0.5} unit="%" onChange={(v) => set("zakatPct", v)} hint="individuals: usually 0 unless held for trade" />
                </Adv>
              </Card>
              <Card n="B" title="You (for the bank's tests)">
                <Slider label="Your monthly income" value={inp.income} min={10000} max={200000} step={1000} unit="SAR" onChange={(v) => set("income", v)} hint="for the bank's debt-burden test" />
                <Slider label="Cash you can commit" value={inp.cashAvailable} min={0} max={5000000} step={50000} unit="SAR" onChange={(v) => set("cashAvailable", v)} />
                <Adv title="Advanced: debt-burden cap, rate quoting">
                  <Slider label="Debt-burden cap (bank)" value={inp.dbrCap} min={30} max={70} step={5} unit="% of income" onChange={(v) => set("dbrCap", v)} />
                  <Select label="Rates of new facilities are entered as" value={inp.rateQuote} onChange={(v) => set("rateQuote", v)} options={[["apr", "APR — reducing balance"], ["flat", "Flat 'hamish' % per year"]]} />
                </Adv>
              </Card>
            </>}
          </div>
        </div>
      );

      const StepHome = () => (
        <div>
          <SectionHeader eyebrow={`Step ${steps.findIndex((s) => s[0] === "home") + 1} · ${build ? "The home" : "The property"}`} title={build ? "Land, construction & timing" : "Property purchase"}
            sub="Defaults describe a mid-size Riyadh villa. All amounts in SAR. Taxes follow KSA rules: 15% VAT on construction & finishing (land is VAT-exempt), 5% RETT with first-home relief on the first 1M SAR — all under Advanced."
            meta={<div className="flex items-center no-print" style={{ gap: 8 }}><span style={{ fontFamily: SANS, fontSize: 11, color: C.sub, textTransform: "uppercase", letterSpacing: "0.06em" }}>Acquire</span><Toggle value={inp.acquire} onChange={(v) => set("acquire", v)} options={[["build", "Buy land & build"], ["buy", "Buy ready"]]} /></div>} />
          <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 300px), 1fr))", gap: 16 }}>
            <Card n="A" title={build ? "Land & construction" : "Purchase"}>
              {build ? <>
                <Slider label="Land area" value={inp.landArea} min={200} max={2000} step={25} unit="m²" onChange={(v) => set("landArea", v)} />
                <Slider label="Land price" value={inp.landPrice} min={500} max={12000} step={100} unit="SAR/m²" onChange={(v) => set("landPrice", v)} hint={`land ${fS(prj.land)}`} />
                <Slider label="Footprint — ground floor as % of land" value={inp.builtPct} min={0} max={100} step={5} unit="%" onChange={(v) => set("builtPct", v)} hint={inp.builtPct > 0 ? `${Math.round(inp.landArea * inp.builtPct / 100)} m² per floor · set 0 to enter the total area directly` : "0 = enter the total built-up area directly below"} />
                {inp.builtPct > 0 && <Slider label="Floors" value={inp.floors} min={1} max={4} step={0.5} unit="floors" onChange={(v) => set("floors", v)} hint={`total built-up ${Math.round(prj.builtArea)} m² × ${fSAR(inp.buildCost)} = ${fS(prj.hard)} construction${prj.inflate > 1 ? ` (incl. ${((prj.inflate - 1) * 100).toFixed(0)}% inflation to start)` : ""}`} />}
                {inp.builtPct === 0 && <Slider label="Total built-up area" value={inp.builtArea} min={150} max={2000} step={10} unit="m²" onChange={(v) => set("builtArea", v)} />}
                <Slider label="Construction cost (turnkey)" value={inp.buildCost} min={1200} max={6000} step={50} unit="SAR/m²" onChange={(v) => set("buildCost", v)} hint={`structure + finishing ${fS(prj.hard)} before VAT`} />
                <Slider label="Construction duration" value={inp.buildMonths} min={6} max={36} step={1} unit="months" onChange={(v) => set("buildMonths", v)} hint={home ? "you keep paying rent until you move in" : "no rental income until complete"} />
                <Adv title="Advanced: design & permits, contingency, extras, inflation, value uplift, VAT & RETT">
                  <Slider label="Design, permits & supervision" value={inp.softPct} min={0} max={20} step={0.5} unit="%" onChange={(v) => set("softPct", v)} />
                  <Slider label="Contingency" value={inp.contPct} min={0} max={25} step={1} unit="%" onChange={(v) => set("contPct", v)} hint="overruns are the norm — keep ≥ 5%" />
                  <Slider label="Extras: kitchen, AC, landscape" value={inp.finishExtra} min={0} max={600000} step={10000} unit="SAR" onChange={(v) => set("finishExtra", v)} />
                  <Slider label="Construction-cost inflation" value={inp.costInflation} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("costInflation", v)} />
                  <Slider label="Value uplift of self-build" value={inp.devMarginPct} min={-10} max={30} step={1} unit="%" onChange={(v) => set("devMarginPct", v)} hint="finished home's market value vs. land + construction cost" />
                  <Slider label="VAT" value={inp.vatPct} min={0} max={20} step={1} unit="%" onChange={(v) => set("vatPct", v)} />
                  <Slider label="RETT" value={inp.rettPct} min={0} max={10} step={0.5} unit="%" onChange={(v) => set("rettPct", v)} />
                  {home && <Check checked={inp.firstHomeExempt} onChange={(v) => set("firstHomeExempt", v)} label={`First-home RETT relief (state bears RETT on the first ${fS(inp.rettExemptCap)})`} />}
                </Adv>
              </> : <>
                <Slider label="Purchase price" value={inp.propertyPrice} min={500000} max={10000000} step={50000} unit="SAR" onChange={(v) => set("propertyPrice", v)} />
                <Slider label="Finishing / furnishing" value={inp.finishExtra} min={0} max={600000} step={10000} unit="SAR" onChange={(v) => set("finishExtra", v)} />
                <Slider label="Buy in month" value={inp.landMonth} min={0} max={72} step={1} unit="" onChange={(v) => { set("landMonth", v); if (inp.buildStart < v) set("buildStart", v); }} hint={`${fCal(inp.landMonth)} · price grown ${inp.appreciation}%/yr until then`} />
                <Adv title="Advanced: broker, VAT & RETT">
                  <Slider label="Broker fee" value={inp.brokerPct} min={0} max={5} step={0.5} unit="%" onChange={(v) => set("brokerPct", v)} />
                  <Slider label="VAT" value={inp.vatPct} min={0} max={20} step={1} unit="%" onChange={(v) => set("vatPct", v)} />
                  <Slider label="RETT" value={inp.rettPct} min={0} max={10} step={0.5} unit="%" onChange={(v) => set("rettPct", v)} />
                  {home && <Check checked={inp.firstHomeExempt} onChange={(v) => set("firstHomeExempt", v)} label={`First-home RETT relief (state bears RETT on the first ${fS(inp.rettExemptCap)})`} />}
                </Adv>
              </>}
            </Card>
            <div className="grid" style={{ gap: 16, alignContent: "start" }}>
              {build && <Card n="B" title="Timing">
                <Slider label="Buy the land in month" value={inp.landMonth} min={0} max={72} step={1} unit="" onChange={(v) => { set("landMonth", v); if (inp.buildStart < v) set("buildStart", v); }} hint={`${fCal(inp.landMonth)} · land priced at today's value grown ${inp.appreciation}%/yr`} />
                <Slider label="Start construction in month" value={Math.max(inp.buildStart, inp.landMonth)} min={0} max={72} step={1} unit="" onChange={(v) => set("buildStart", Math.max(v, inp.landMonth))} hint={`${fCal(Math.max(inp.buildStart, inp.landMonth))} → move in ${fCal(prj.occupy)}${prj.inflate > 1 ? ` · construction +${((prj.inflate - 1) * 100).toFixed(0)}% vs today` : ""}`} />
                {home && <Note>Not sure when? Step 5 ("When to start") tests every start date for you.</Note>}
              </Card>}
              <Card n={build ? "C" : "B"} title="Market & horizon">
                <Slider label="Property appreciation" value={inp.appreciation} min={-5} max={12} step={0.5} unit="%/yr" onChange={(v) => set("appreciation", v)} />
                {home ? <Slider label="Analysis horizon" value={inp.horizon} min={5} max={30} step={1} unit="yrs" onChange={(v) => set("horizon", v)} />
                      : <Slider label="Exit (sale) year" value={inp.exitYear} min={3} max={30} step={1} unit="yrs" onChange={(v) => set("exitYear", v)} />}
                <Adv title="Advanced: return on cash, discount rate, selling costs, upkeep">
                  <Slider label="Return your cash earns" value={inp.altReturn} min={0} max={15} step={0.5} unit="%/yr" onChange={(v) => set("altReturn", v)} hint="on cash balances (sukuk / funds / business); the renter's cash earns the same" />
                  <Slider label="Discount rate (NPV)" value={inp.discountRate} min={0} max={20} step={0.5} unit="%" onChange={(v) => set("discountRate", v)} />
                  <Slider label="Selling costs at exit" value={inp.sellCostPct} min={0} max={12} step={0.5} unit="%" onChange={(v) => set("sellCostPct", v)} hint="5% RETT (seller) + ~2.5% broker" />
                  <Slider label="Maintenance" value={inp.maintPct} min={0} max={3} step={0.1} unit="% value/yr" onChange={(v) => set("maintPct", v)} />
                  <Slider label="Insurance & fees" value={inp.insurance} min={0} max={20000} step={500} unit="SAR/yr" onChange={(v) => set("insurance", v)} />
                </Adv>
              </Card>
            </div>
            <Card n={build ? "D" : "C"} title="Cost build-up">
              <table className="tbl" style={{ fontFamily: MONO, fontSize: 12.5 }}>
                <tbody>
                  {costRows.map(([l, v]) => <tr key={l}><td style={{ ...td, textAlign: "left", fontFamily: SANS, color: C.sub, whiteSpace: "normal", paddingLeft: 0 }}>{l}</td><td style={{ ...td, paddingRight: 0 }}>{fSAR(v)}</td></tr>)}
                  <tr style={{ background: SOFT }}><td style={{ ...td, textAlign: "left", fontFamily: SANS, fontWeight: 700 }}>All-in project cost</td><td style={{ ...td, fontWeight: 700 }}>{fSAR(prj.total)}</td></tr>
                  <tr><td style={{ ...td, textAlign: "left", fontFamily: SANS, color: C.sub, paddingLeft: 0 }}>Market value at completion</td><td style={{ ...td, color: prj.value0 >= prj.total ? C.pos : C.neg, paddingRight: 0 }}>{fSAR(prj.value0)}</td></tr>
                  {build && <tr><td style={{ ...td, textAlign: "left", fontFamily: SANS, color: C.sub, paddingLeft: 0 }}>Cost per m² built (excl. land)</td><td style={{ ...td, paddingRight: 0 }}>{fSAR(prj.costPerSqm)}</td></tr>}
                </tbody>
              </table>
              <Note>Spend timing: {build ? `land + RETT in ${fCal(prj.landMonth)}, construction evenly over ${prj.bm} months from ${fCal(prj.start)}, extras at completion (${fCal(prj.occupy)}).` : `everything in ${fCal(prj.landMonth)}.`} {home ? "Your cash pays first; a construction mortgage is drawn only after your share is spent." : "The mortgage is drawn only after your cash and any personal loan are spent."}</Note>
            </Card>
          </div>
        </div>
      );

      /* ---------- optimizer: the best fill of the bucket for one start ---------- */
      const BUCKET_COLORS = { Existing: "#9A958B", "Land mortgage": "#2F6DB5", "Own-property mortgage": "#1F9A80", "Personal loan(s)": "#A24FB8", "Cash-out": "#6FA3E0", Refinance: "#D9892B" };
      const BucketChart = ({ b, height = 250 }) => {
        const last = Math.min(b.bucket.length - 1, b.occupy + 36);
        const data = b.bucket.filter((x) => x.t <= last).map((x) => ({ t: x.t, Existing: x.existing / inp.income * 100, "Land mortgage": x.lm / inp.income * 100, "Own-property mortgage": x.eq / inp.income * 100, "Personal loan(s)": x.pl / inp.income * 100, "Cash-out": x.co / inp.income * 100, Refinance: (x.rf || 0) / inp.income * 100 }));
        return (
          <Panel title={<span>Your {inp.dbrCap}% bucket, month by month · instalments as % of income <Hint text={EXPL.bucket} /></span>}>
            <ResponsiveContainer width="100%" height={height}>
              <AreaChart data={data} margin={{ top: 8, right: 12, left: 0, bottom: 0 }}>
                <CartesianGrid stroke={C.line} vertical={false} />
                <XAxis dataKey="t" ticks={data.filter((d) => d.t % 12 === 0).map((d) => d.t)} tickFormatter={fCal} tick={axisS} tickLine={false} axisLine={{ stroke: C.line }} />
                <YAxis domain={[0, Math.max(70, inp.dbrCap + 5)]} tick={axisT} tickFormatter={(v) => `${v}%`} tickLine={false} axisLine={false} width={44} />
                <Tooltip formatter={(v, n) => [`${v.toFixed(1)}%`, n]} labelFormatter={(t) => `${fMon(t)}`} contentStyle={tipStyle} />
                <Legend wrapperStyle={legendStyle} />
                <ReferenceLine y={inp.dbrCap} stroke={C.neg} strokeDasharray="4 4" label={{ value: `${inp.dbrCap}% — everything together`, fontFamily: SANS, fontSize: 11, fill: C.neg, position: "insideTopRight" }} />
                <ReferenceLine y={inp.mortgageCap} stroke={C.brass} strokeDasharray="4 4" label={{ value: `${inp.mortgageCap}% — mortgages`, fontFamily: SANS, fontSize: 11, fill: C.brass, position: "insideBottomRight" }} />
                {Object.entries(BUCKET_COLORS).map(([k, col]) => <Area key={k} type="stepAfter" stackId="b" dataKey={k} stroke={col} fill={col} fillOpacity={0.8} strokeWidth={1} isAnimationActive={false} />)}
              </AreaChart>
            </ResponsiveContainer>
            <Note>Free space under the red line is borrowing capacity you are not using that month. Shown to 3 years after move-in.</Note>
          </Panel>
        );
      };
      const OptStatus = () => optStale ? <span style={{ fontFamily: SANS, fontSize: 11, color: C.sub }}>updating…</span> : null;
      const OptPlanned = () => {
        if (!opt) return null;
        const st = opt.planned, b = st.best;
        const same = inp.plans[0] && JSON.stringify({ ...inp.plans[0], name: "", enabled: true }) === JSON.stringify({ ...(b.cleanPlan || b.plan), name: "", enabled: true });
        return (
          <div className="print-section" style={{ background: C.paper, border: `1px solid ${C.line}`, borderLeft: `6px solid ${b.ok ? C.pos : b.feasible ? C.brass : C.neg}`, borderRadius: 10, padding: "16px 18px", marginBottom: 14 }}>
            <div className="flex items-center justify-between flex-wrap" style={{ gap: 8 }}>
              <div style={{ fontFamily: SANS, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", color: C.brass }}>Best fill of your {inp.dbrCap}% bucket · start {fCal(st.delay)} <Hint text={EXPL.optimizer} /> <OptStatus /></div>
              <span style={{ fontFamily: SANS, fontSize: 11, color: C.sub }}>{opt.combos} mixes tried · {st.nOk} pass both tests · {st.nFeasible} executable</span>
            </div>
            <div style={{ fontFamily: SANS, fontSize: 16, fontWeight: 700, color: C.text, lineHeight: 1.35, marginTop: 6 }}>{b.name}</div>
            <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.sub, marginTop: 4, lineHeight: 1.5, maxWidth: 900 }}>{describePlan(b.plan, inp, prj, build)}</div>
            <div style={{ margin: "10px 0" }}><Badge ok={b.ok} text={b.flags[0] || (b.feasible ? `cash back at buffer ${b.recoveryMonths === 0 ? "at move-in" : b.recoveryMonths + " months after move-in"}` : null)} /></div>
            <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: "10px 14px" }}>
              <Stat label="Cash low point" value={fS(b.minCash)} sub={fCal(b.minCashT)} color={b.minCash < 0 ? C.neg : b.minCash < inp.cashBuffer ? C.brass : C.text} info={EXPL.cashLow} />
              <Stat label={`Cash ${inp.recoveryMonths} mo after move-in`} value={fS(b.cashAfterWindow)} sub={`buffer ${fS(inp.cashBuffer)}`} color={b.cashAfterWindow >= inp.cashBuffer ? C.pos : C.neg} info={EXPL.cashAfter} />
              <Stat label="Peak instalments" value={`${fSAR(b.peakInst)}/mo`} sub={`${b.peakDbr.toFixed(0)}% of income · cap ${inp.dbrCap}%`} color={b.peakDbr > inp.dbrCap + 0.5 ? C.neg : C.text} info={EXPL.peakInst} />
              <Stat label="New debt taken" value={fS(b.newDebt)} sub={`profit + fees ${fS(b.newDebtInterest)}`} info={EXPL.newDebt} />
              <Stat label={`Net worth Y${inp.horizon}`} value={fS(b.netWorth)} sub={`${fS(b.advantage)} vs ${baseLbl}`} color={b.advantage >= 0 ? C.pos : C.neg} info={EXPL.netWorth} />
            </div>
            <div style={{ fontFamily: MONO, fontSize: 11.5, background: SOFT, borderRadius: 7, padding: "8px 10px", margin: "12px 0 10px", lineHeight: 1.7 }}>
              <div style={{ fontFamily: SANS, fontSize: 10.5, color: C.sub, textTransform: "uppercase", letterSpacing: "0.04em" }}>Facilities · taken / bank maximum that month <Hint text={EXPL.capacity} /></div>
              {b.facilities.filter((f) => f.capacity).map((f) => <Mini key={f.key} k={`${f.label} · ${fCal(f.capacity.t)}`} v={`${fS(f.amount)}${f.split ? ` (${fS(f.split[0])} + ${fS(f.split[1])})` : ""} / ${fS(f.capacity.cap)}${f.amount > 0 ? ` · ${fSAR(f.pmt)}/mo` : ""}`} color={f.amount < 1 ? C.sub : C.text} />)}
              {b.settled > 0 && <Mini k="Old loans settled early" v={`${fS(b.settled)} + ${fS(b.settleFees)} fees`} />}
              {!b.facilities.some((f) => f.capacity) && <div style={{ color: C.sub, fontFamily: SANS }}>no new facility needed — the project is funded from cash</div>}
            </div>
            {st.refiBest && b.rf <= 0 && <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.text, lineHeight: 1.5, background: "#FBEFD9", borderRadius: 7, padding: "8px 12px", marginBottom: 10 }}>
              <b>Refinancing at completion</b> <Hint text={EXPL.refi} /> — best option: {st.refiBest.name}. It would release <b>{fS(st.refiBest.rfNet)}</b> of cash at move-in (cash then {fS(st.refiBest.cashAtCompletion)} instead of {fS(b.cashAtCompletion)}), and cost <b style={{ color: C.neg }}>{fS(Math.max(0, b.netWorth - st.refiBest.netWorth))}</b> of net worth by Y{inp.horizon}, because borrowed cash costs more than it earns. {b.ok ? "Not needed to meet your cash-recovery rule here." : "It is the way to meet your cash-recovery rule."}
            </div>}
            <div className="flex items-center flex-wrap" style={{ gap: 10 }}>
              <button className="no-print" disabled={same} onClick={() => useOptPlan(st)} style={{ ...btn(same ? "transparent" : C.brass, same ? C.sub : C.ink, same ? C.line : C.brass), fontSize: 12, padding: "6px 12px" }}>{same ? "This is Strategy 1" : "Use as Strategy 1"}</button>
              {st.alts.length > 0 && <span style={{ fontFamily: SANS, fontSize: 11.5, color: C.sub }}>Next best: {st.alts.map((a, k) => <span key={k}>{k > 0 ? " · " : ""}{a.name} ({fS(a.netWorth)}{a.ok ? "" : a.feasible ? ", slow recovery" : ", not executable"})</span>)}</span>}
            </div>
          </div>
        );
      };
      const OptStarts = () => {
        if (!opt) return null;
        const rowsS = optRows.rows;
        const e = optRows.done ? (rowsS.find((x) => x.best.ok) || null) : null;
        return (
          <div className="print-section" style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", marginBottom: 16 }}>
            <div className="flex items-center justify-between flex-wrap" style={{ gap: 8, padding: "10px 14px", borderBottom: `1px solid ${C.line}` }}>
              <span style={{ fontFamily: SANS, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", color: C.brass }}>Best mix for every start date <Hint text={EXPL.optimizer} /> <OptStatus /></span>
              <span style={{ fontFamily: SANS, fontSize: 11.5, color: C.sub }}>{!optRows.done ? `working… ${rowsS.length} of ${optRows.total} start dates` : e ? <>★ earliest start passing both tests: <b style={{ color: C.text }}>{fCal(e.delay)}</b></> : "no start passes both tests"}</span>
            </div>
            <div className="scroll-x">
              <table className="tbl" style={{ fontFamily: MONO, fontSize: 12 }}>
                <thead><tr>{["Start", "Move in", "Best mix", "Executable", `Cash back (≤ ${inp.recoveryMonths} mo)`, "Cash low", "Peak DBR", "Land mortgage", "Own-property mortgage", "Personal loan(s)", "Cash-out / refinance", "New debt", "Profit + fees", `Net worth @ Y${inp.horizon}`, ""].map((h, i) => <th key={h || "x"} style={{ ...th, textAlign: i < 3 ? "left" : "right", whiteSpace: "normal" }}>{h}</th>)}</tr></thead>
                <tbody>{rowsS.map((st) => { const b = st.best, isE = e && e.delay === st.delay, isCur = st.delay === curStart; return (
                  <tr key={st.delay} style={{ background: isE ? "#F6EFE1" : "transparent", fontWeight: isE ? 700 : 400, borderLeft: isE ? `4px solid ${C.brass}` : "4px solid transparent" }}>
                    <td style={{ ...td, textAlign: "left", fontFamily: SANS, whiteSpace: "nowrap" }}>{isE && <span style={{ color: C.brass }}>★ </span>}{fCal(st.delay)} <span style={{ color: C.sub, fontFamily: MONO, fontSize: 11 }}>M{st.delay}</span>{isCur && <span className="tag" style={{ background: SOFT, color: C.sub, marginLeft: 6 }}>planned</span>}</td>
                    <td style={{ ...td, textAlign: "left", fontFamily: SANS }}>{fCal(st.occupy)}</td>
                    <td style={{ ...td, textAlign: "left", fontFamily: SANS, whiteSpace: "normal", minWidth: 220, fontWeight: 400 }}>{b.name}</td>
                    <td style={{ ...td, color: b.feasible ? C.pos : C.neg }}>{b.feasible ? "yes" : "NO"}</td>
                    <td style={{ ...td, color: b.recoveryOk ? C.pos : C.neg }}>{b.recoveryMonths == null ? "never" : b.recoveryMonths === 0 ? "at move-in" : `${b.recoveryMonths} mo`}</td>
                    <td style={{ ...td, color: b.minCash < 0 ? C.neg : b.minCash < inp.cashBuffer ? C.brass : C.text }}>{fS(b.minCash)}</td>
                    <td style={{ ...td, color: b.peakDbr > inp.dbrCap + 0.5 ? C.neg : C.text }}>{pct1(b.peakDbr)}</td>
                    <td style={td}>{b.lm > 0 ? <>{fS(b.lm)}<span style={{ color: C.sub }}> / {fS(b.lmCap)}</span></> : "–"}</td>
                    <td style={td}>{b.eq > 0 ? <>{fS(b.eq)}<span style={{ color: C.sub }}> / {fS(b.eqCap)}</span></> : "–"}</td>
                    <td style={td}>{b.pl > 0 ? <>{fS(b.pl)}{b.plSplit ? " ×2" : ""}<span style={{ color: C.sub }}> / {fS(b.plCap)}</span></> : "–"}</td>
                    <td style={td}>{b.co > 0 ? fS(b.co) : b.rf > 0 ? <>{fS(b.rf)} <span style={{ color: C.sub }}>refi · {fS(b.rfNet)} to you</span></> : "–"}</td>
                    <td style={td}>{fS(b.newDebt)}</td>
                    <td style={{ ...td, color: C.neg }}>{fS(b.newDebtInterest)}</td>
                    <td style={td}>{fS(b.netWorth)}</td>
                    <td style={{ ...td, textAlign: "right" }} className="no-print"><button onClick={() => useOptPlan(st)} style={{ ...btn("transparent", C.brass, C.line), fontSize: 11, padding: "3px 8px" }}>Use</button></td>
                  </tr>); })}</tbody>
              </table>
            </div>
            <Note><span style={{ padding: "0 14px 10px", display: "block" }}>Each row is the best of {optRows.combos || opt.combos} mixes for that start (rates and tenures from Strategy 1). "Taken / bank max" shows how much of each facility's ceiling is used. Later starts look richer mainly because cash keeps compounding while loans run down; weigh that against the years spent in your current home. "Use" copies the row's mix into Strategy 1 and moves the start.</span></Note>
          </div>
        );
      };

      const StepFin = () => (
        <div>
          <SectionHeader eyebrow={`Step ${steps.findIndex((s) => s[0] === "fin") + 1} · Financing`} title={home ? `Fill your ${inp.dbrCap}% bucket the best way` : "Four ways to fund it"}
            sub={home ? `Your instalment capacity is one bucket — ${inp.dbrCap}% of income, with mortgages allowed up to ${inp.mortgageCap}% and each personal loan up to ${inp.perLoanCap}% inside it. Settling an old loan frees room; every new facility uses it. The optimizer below tries every way of filling the bucket for your planned start; the four strategy cards underneath are a sandbox to shape your own sequences (the optimizer borrows its rates and tenures from Strategy 1).`
                      : "Each option is a capital stack: own cash first, then a personal loan (unsecured, short, repaid from month 1), and a mortgage for the remainder — drawn in stages during construction with profit accruing in the grace period."} />
          {home && <OptPlanned />}
          {home && opt && <div style={{ marginBottom: 16 }}>{BucketChart({ b: opt.planned.best })}</div>}
          {home && <div className="subhead" style={{ fontSize: 13, margin: "18px 0 10px" }}>Or compare your own sequences</div>}
          <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 280px), 1fr))", gap: 14, alignItems: "start" }}>
            {home ? inp.plans.map((o, i) => <React.Fragment key={i}>{PlanCard({ o, i })}</React.Fragment>) : inp.options.map((o, i) => <React.Fragment key={i}>{OptionCard({ o, i })}</React.Fragment>)}
          </div>
        </div>
      );

      const rows = home ? homeRows : rentalRows;
      const visRows = allRows ? rows : rows.filter((r) => r[4]);
      const FocusPicker = () => <div className="flex flex-wrap no-print" style={{ gap: 6 }}>{liveIdx.map((i) => <button key={i} onClick={() => setFocus(i)} style={{ ...btn(focusIdx === i ? OPT_COLORS[i] : "transparent", focusIdx === i ? "#fff" : C.sub, focusIdx === i ? OPT_COLORS[i] : C.line), fontSize: 11.5, padding: "5px 10px" }}>{home ? "Strategy" : "Option"} {i + 1}</button>)}</div>;

      const StepRes = () => (
        <div>
          <SectionHeader eyebrow={`Step ${steps.findIndex((s) => s[0] === "res") + 1} · Results`} title={home ? "Which sequence works, and which leaves you wealthiest?" : "Which capital stack earns the most?"}
            sub={home ? `Ranked by net worth at year ${inp.horizon} (cash + home after selling costs − all debt) against ${renting ? "a renter with the same income who keeps the cash invested" : "not building at all: same income, same old loans, cash kept invested"} at ${inp.altReturn}%. A strategy whose cash goes negative is not executable, however good its end result looks.`
                      : "Ranked by levered IRR on the cash you actually put in. Unlevered IRR is the property's own return and is the same for every stack; the difference is what the debt adds or destroys."} />
          {/* comparison table */}
          <div className="print-section" style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", marginBottom: 16 }}>
            <div className="scroll-x">
              <table className="tbl" style={{ fontFamily: MONO, fontSize: 12.5 }}>
                <thead><tr><th style={{ ...th, textAlign: "left" }}>Metric</th>{liveIdx.map((i) => <th key={i} style={{ ...th, borderTop: `4px solid ${OPT_COLORS[i]}`, whiteSpace: "normal", minWidth: 150 }}>{nameOf(m.results[i])}{m.results[i] === lead && <span style={{ color: C.brassLt }}> ★</span>}</th>)}</tr></thead>
                <tbody>
                  {visRows.map(([label, fn, colorFn, head, , info]) => (
                    <tr key={label} style={{ background: head ? SOFT : "transparent" }}>
                      <td style={{ ...td, textAlign: "left", fontFamily: SANS, fontWeight: head ? 700 : 400, whiteSpace: "normal", maxWidth: 320, minWidth: 160 }}>{label}<Hint text={info} /></td>
                      {liveIdx.map((i) => { const r = m.results[i]; return <td key={i} style={{ ...td, fontWeight: head ? 700 : 400, color: colorFn ? colorFn(r) : C.text, whiteSpace: "normal" }}>{fn(r)}</td>; })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="flex items-center justify-between no-print" style={{ padding: "8px 14px", borderTop: `1px solid ${C.line}` }}>
              <span style={{ fontFamily: SANS, fontSize: 11.5, color: C.sub }}>{allRows ? `All ${rows.length} rows` : `${visRows.length} key rows of ${rows.length}`}</span>
              <button onClick={() => setAllRows(!allRows)} style={{ ...btn("transparent", C.brass, C.line), fontSize: 11.5, padding: "4px 10px" }}>{allRows ? "Show key rows only" : "Show all rows"}</button>
            </div>
          </div>

          {/* hero chart */}
          {home ? LineChartBox({ title: "Your cash balance · year-end · SAR", keyPrefix: "cash", height: 300,
              extra: <ReferenceLine y={inp.cashBuffer} stroke={C.brass} strokeDasharray="4 4" label={{ value: "your buffer", fontFamily: SANS, fontSize: 11, fill: C.sub, position: "insideTopRight" }} />,
              note: "The decisive chart: a line that crosses zero is a plan you cannot execute. Year-end values — the low point inside the construction year can be lower; see 'Cash low point' in the table." })
            : <Panel title="Capital stack per option · SAR">
                <ResponsiveContainer width="100%" height={260}>
                  <BarChart data={stackData} margin={{ top: 8, right: 12, left: 0, bottom: 0 }} barCategoryGap="30%">
                    <CartesianGrid stroke={C.line} vertical={false} />
                    <XAxis dataKey="name" tick={axisS} interval={0} tickLine={false} axisLine={{ stroke: C.line }} />
                    <YAxis tick={axisT} tickFormatter={fS} tickLine={false} axisLine={false} width={56} />
                    <Tooltip formatter={(v) => fSAR(v)} labelFormatter={(l, pl) => pl && pl[0] ? pl[0].payload.full : l} contentStyle={tipStyle} cursor={{ fill: SOFT }} />
                    <Legend wrapperStyle={legendStyle} />
                    <Bar dataKey="Own cash" stackId="s" fill="#1F9A80" stroke={C.paper} strokeWidth={2} maxBarSize={48} /><Bar dataKey="Personal loan" stackId="s" fill="#A24FB8" stroke={C.paper} strokeWidth={2} maxBarSize={48} /><Bar dataKey="Mortgage" stackId="s" fill="#2F6DB5" stroke={C.paper} strokeWidth={2} radius={[4, 4, 0, 0]} maxBarSize={48} />
                  </BarChart>
                </ResponsiveContainer>
              </Panel>}

          <Adv title={home ? "More charts: debt outstanding · monthly instalments · net worth" : "More charts: instalments · annual cash flow · debt outstanding"}>
            <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 340px), 1fr))", gap: 16, padding: "6px 0" }}>
              {home ? <>
                {LineChartBox({ title: "Total debt outstanding · SAR", keyPrefix: "debt", height: 240, note: "old loans + property mortgages + personal loan" })}
                {LineChartBox({ title: "Monthly instalments, all debt · SAR/mo (annual average)", keyPrefix: "inst", height: 240, extra: <ReferenceLine y={inp.income * inp.dbrCap / 100} stroke={C.neg} strokeDasharray="4 4" label={{ value: `${inp.dbrCap}% of income`, fontFamily: SANS, fontSize: 11, fill: C.sub, position: "insideTopRight" }} /> })}
                {LineChartBox({ title: `Net worth · cash + home (after selling costs) − debt`, keyPrefix: "nw", height: 240, extra: <Line dataKey="renter" name={renting ? "Keep renting" : "Don't build"} stroke={C.sub} strokeWidth={2} strokeDasharray="5 4" dot={false} /> })}
              </> : <>
                {LineChartBox({ title: "Monthly instalments + upkeep · SAR/mo (annual average)", keyPrefix: "out", height: 240 })}
                <Panel title="Annual cash flow after debt service · SAR">
                  <ResponsiveContainer width="100%" height={240}>
                    <BarChart data={yearSeries} margin={{ top: 8, right: 12, left: 0, bottom: 0 }}>
                      <CartesianGrid stroke={C.line} vertical={false} />
                      <XAxis dataKey="year" tick={axisS} tickLine={false} axisLine={{ stroke: C.line }} />
                      <YAxis tick={axisT} tickFormatter={fS} tickLine={false} axisLine={false} width={56} />
                      <Tooltip formatter={(v) => fSAR(v)} contentStyle={tipStyle} cursor={{ fill: SOFT }} />
                      <Legend wrapperStyle={legendStyle} />
                      <ReferenceLine y={0} stroke={C.sub} />
                      {liveIdx.map((i) => <Bar key={i} dataKey={`cf${i}`} name={m.results[i].opt.name} fill={OPT_COLORS[i]} maxBarSize={24} radius={[3, 3, 0, 0]} />)}
                    </BarChart>
                  </ResponsiveContainer>
                </Panel>
                {LineChartBox({ title: "Debt outstanding · SAR", keyPrefix: "bal", height: 240 })}
              </>}
            </div>
          </Adv>

          {/* timeline */}
          {focusRes && <div style={{ marginTop: 26 }}>
            <SectionHeader eyebrow="Step by step" title={`${nameOf(focusRes)} — ${home ? "what happens, in order" : "year by year"}`}
              sub={home ? "Every bank decision, settlement and milestone in order." : "Y0 is the signing month. Instalments include the personal loan. Values are cash actually moving in the year."}
              meta={<FocusPicker />} />
            {home && (
              <div className="print-section" style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 16px", marginBottom: 14 }}>
                <EvRow t="M0 · today" kind="cash">Start with <b>{fS(inp.cashAvailable)}</b> cash, income {fSAR(inp.income)}/mo, existing instalments {fSAR(household.existingInst)}/mo ({household.existingDbr.toFixed(0)}% of income).</EvRow>
                {focusRes.events.map((e, k) => <EvRow key={k} t={fMon(e.t)} kind={e.kind}>{e.text}</EvRow>)}
                <EvRow t={fMon(focusRes.minCashT)} kind="cash">Cash low point: <b style={{ color: focusRes.minCash < 0 ? C.neg : C.text }}>{fS(focusRes.minCash)}</b>{focusRes.minCash < inp.cashBuffer ? ` (below your ${fS(inp.cashBuffer)} buffer)` : ""}.</EvRow>
                {focusRes.debtFreeT != null && <EvRow t={fMon(focusRes.debtFreeT)} kind="end">Debt-free.</EvRow>}
                <EvRow t={`Y${inp.horizon}`} kind="end" last>Net worth <b>{fS(focusRes.netWorthEnd)}</b> (cash {fS(focusRes.cashEnd)} + home {fS(focusRes.endValue)} after selling costs − debt {fS(focusRes.endDebt)}) vs <b>{fS(focusRes.renterEnd)}</b> had you {renting ? "kept renting" : "not built"} → <b style={{ color: focusRes.advantage >= 0 ? C.pos : C.neg }}>{fS(focusRes.advantage)}</b>.</EvRow>
              </div>
            )}
            <Adv title="Year-by-year table" open={!home}>
              <div className="scroll-x" style={{ margin: "4px 0 6px" }}>
                <table className="tbl" style={{ fontFamily: MONO, fontSize: 12 }}>
                  <thead><tr><th style={{ ...th, textAlign: "left" }}>Line</th>{focusRes.years.map((y) => <th key={y.year} style={th}>{y.label}</th>)}</tr></thead>
                  <tbody>
                    {(home ? [
                      ["Project spend", "spend", "neg"], ["Rent paid while building", "rentPaid", "neg"],
                      ["Existing-loan instalments", "existInst", "neg"], ["Land-mortgage instalments", "lmPay", "neg"], ["Existing-property mortgage instalments", "eqPay", "neg"], ["Personal-loan instalments", "plPay", "neg"], ["Cash-out instalments", "coPay", "neg"], ["Refinance instalments", "rfPay", "neg"], ["  of which profit (all debt)", "interest", "sub"],
                      ["Maintenance & insurance", "ownerCost", "neg"],
                      ["Cash balance (year-end)", "cash", "head"], ["Debt outstanding (year-end)", "debt", "plain"], ["  land mortgage", "debtLm", "sub"], ["  existing-property mortgage", "debtEq", "sub"], ["  personal loan", "debtPl", "sub"], ["  cash-out", "debtCo", "sub"], ["  refinance", "debtRf", "sub"], ["  existing loans", "debtExisting", "sub"],
                      ["Home value", "value", "plain"], ["Net worth", "netWorth", "head"], [renting ? "Renter's net worth" : "Net worth if you don't build", "renterNW", "plain"], [`Advantage vs ${baseLbl}`, "advantage", "head"],
                    ] : [
                      ["Project spend", "spend", "neg"], ["  of which from own cash / personal loan", "eq", "sub"],
                      ["Rent collected (net of vacancy & mgmt)", "rentIn", "head"], ["Maintenance & insurance", "opex", "neg"], ["Net operating income", "noi", "head"],
                      ["Mortgage instalments", "mortgagePayment", "neg"], ["Personal-loan instalments", "plPayment", "neg"], ["  of which profit", "interest", "sub"],
                      ["Cash flow after debt", "cf", "head"], ["Equity cash flow (incl. exit)", "lev", "head"], ["Debt outstanding (year-end)", "bal", "plain"], ["Property value", "value", "plain"], ["DSCR", "dscr", "ratio"],
                    ]).map(([label, key, kind]) => (
                      <tr key={key} style={{ background: kind === "head" ? SOFT : "transparent" }}>
                        <td style={{ ...td, textAlign: "left", fontFamily: SANS, fontWeight: kind === "head" ? 700 : 400, color: kind === "sub" ? C.sub : C.text, paddingLeft: label.startsWith("  ") ? 26 : 14 }}>{label.trim()}</td>
                        {focusRes.years.map((y) => { const v = y[key]; const neg = v < 0; return <td key={y.year} style={{ ...td, fontWeight: kind === "head" ? 700 : 400, color: kind === "ratio" ? (v != null && v < 1.2 ? C.neg : C.text) : neg && (kind === "head" || kind === "plain") ? C.neg : kind === "neg" || kind === "sub" ? C.sub : C.text }}>{kind === "ratio" ? (v == null ? "—" : v.toFixed(2)) : kind === "neg" || (kind === "sub" && !["debtLm", "debtEq", "debtPl", "debtCo", "debtRf", "debtExisting"].includes(key)) ? (Math.abs(v) < 0.5 ? "–" : `(${fS(Math.abs(v))})`) : (Math.abs(v) < 0.5 && kind === "sub" ? "–" : fS(v))}</td>; })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Adv>
            <Adv title={`What moves the answer — sensitivity of ${nameOf(focusRes)}`}>
              <Note>Each driver flexed ±20% on its own. Bars show the change in {home ? `wealth advantage vs ${baseLbl} (SAR)` : "levered IRR (percentage points)"}; the longest bar is the assumption to firm up first.</Note>
              <ResponsiveContainer width="100%" height={40 * Math.max(1, tornado.length) + 30}>
                <BarChart data={tornado} layout="vertical" margin={{ top: 8, right: 24, left: 0, bottom: 0 }} stackOffset="sign">
                  <CartesianGrid stroke={C.line} horizontal={false} />
                  <XAxis type="number" tick={axisT} tickFormatter={(v) => home ? fS(v) : v.toFixed(1)} tickLine={false} axisLine={false} />
                  <YAxis type="category" dataKey="label" width={170} tick={{ fontFamily: SANS, fontSize: 11.5, fill: C.text }} tickLine={false} axisLine={false} />
                  <Tooltip formatter={(v, n) => [home ? fSAR(v) : v.toFixed(2) + " pp", n === "lo" ? "−20% / +20% (worse)" : "−20% / +20% (better)"]} contentStyle={tipStyle} cursor={{ fill: SOFT }} />
                  <ReferenceLine x={0} stroke={C.text} />
                  <Bar dataKey="lo" stackId="t" fill={C.neg} maxBarSize={18} /><Bar dataKey="hi" stackId="t" fill={C.pos} maxBarSize={18} radius={[0, 3, 3, 0]} />
                </BarChart>
              </ResponsiveContainer>
            </Adv>
          </div>}
        </div>
      );

      const StepWhen = () => {
        if (!sweep || !focusRes) return <div style={{ fontFamily: SANS, color: C.sub }}>Enable a strategy first.</div>;
        const sb = sweep.best;
        const curStart = Math.max(inp.buildStart, inp.landMonth);
        return (
          <div>
            <SectionHeader eyebrow={`Step ${steps.findIndex((s) => s[0] === "when") + 1} · When to start`} title="When can you start, and how is the bucket best used at each date?"
              sub={`Construction starting every 3 months from now to 5 years out. Waiting lets loans run down (freeing room in the bucket and cash), but land grows ${inp.appreciation}%/yr and construction ${inp.costInflation}%/yr. The first table re-optimises the financing mix for each start; the second runs one fixed strategy (${nameOf(focusRes)}). ★ marks the earliest start that is executable AND gets cash back to your ${fS(inp.cashBuffer)} buffer within ${inp.recoveryMonths} months of move-in.`}
              meta={<div className="flex items-center flex-wrap no-print" style={{ gap: 10 }}><span style={{ fontFamily: SANS, fontSize: 11, color: C.sub }}>Land</span><Toggle value={landWithBuild ? "with" : "now"} onChange={(v) => setLandWithBuild(v === "with")} options={[["now", `Buy in ${fCal(inp.landMonth)}`], ["with", "Buy when building"]]} /></div>} />
            <OptStarts />
            <div className="flex items-center justify-between flex-wrap" style={{ gap: 10, margin: "6px 0 10px" }}><div className="subhead" style={{ fontSize: 13, margin: 0 }}>Same test for one fixed strategy — {nameOf(focusRes)}</div><FocusPicker /></div>
            <div className="print-section" style={{ background: sb ? SOFT_POS : SOFT_NEG, border: `1px solid ${C.line}`, borderRadius: 10, padding: "14px 18px", marginBottom: 14, fontFamily: SANS, fontSize: 14, color: C.text, lineHeight: 1.5 }}>
              {sb ? <>
                <b>{sb.delay === curStart ? `Start as planned in ${fCal(sb.delay)}` : sb.delay < curStart ? `You could start earlier, in ${fCal(sb.delay)}` : `Earliest workable start: ${fCal(sb.delay)}`}</b> — move in {fCal(sb.occupy)}, cash never below {fS(sb.minCash)} and back at your buffer {sb.recoveryMonths === 0 ? "at move-in" : `${sb.recoveryMonths} months after move-in`}, peak instalments {fSAR(sb.peakInst)}/mo ({sb.peakDbr.toFixed(0)}% of income), project cost {fS(sb.total)}.
                {sb.delay !== curStart && <button className="no-print" onClick={() => { set("buildStart", sb.delay); if (landWithBuild) set("landMonth", sb.delay); }} style={{ ...btn(C.brass, C.ink), fontSize: 11.5, padding: "4px 10px", marginLeft: 10 }}>Use this start</button>}
              </> : <>No start date within 5 years makes this strategy executable — change the strategy (step 3), the project (step 2) or the land timing.</>}
            </div>
            <div className="print-section" style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
              <div className="scroll-x">
                <table className="tbl" style={{ fontFamily: MONO, fontSize: 12 }}>
                  <thead><tr>{["Start", "Move in", "Project cost", "Executable", `Cash back at buffer (≤ ${inp.recoveryMonths} mo)`, "Cash low point", "Peak instalments", "Peak DBR", "Land mortgage", "Existing-property mortgage", "Personal loan", "Old loans settled", "Profit + fees on new debt", `Net worth @ Y${inp.horizon}`].map((h, i) => <th key={h} style={{ ...th, textAlign: i < 2 ? "left" : "right", whiteSpace: "normal" }}>{h}</th>)}</tr></thead>
                  <tbody>{sweep.rows.map((r) => { const isB = sb && sb.delay === r.delay; const isCur = r.delay === curStart; return (
                    <tr key={r.delay} style={{ background: isB ? "#F6EFE1" : "transparent", fontWeight: isB ? 700 : 400, borderLeft: isB ? `4px solid ${C.brass}` : "4px solid transparent" }}>
                      <td style={{ ...td, textAlign: "left", fontFamily: SANS }}>{isB && <span style={{ color: C.brass }}>★ </span>}{fCal(r.delay)} <span style={{ color: C.sub, fontFamily: MONO, fontSize: 11 }}>M{r.delay}</span>{isCur && <span className="tag" style={{ background: SOFT, color: C.sub, marginLeft: 6 }}>current</span>}</td>
                      <td style={{ ...td, textAlign: "left", fontFamily: SANS }}>{fCal(r.occupy)}</td>
                      <td style={td}>{fS(r.total)}</td>
                      <td style={{ ...td, color: r.feasible ? C.pos : C.neg }}>{r.feasible ? "yes" : "NO"}</td>
                      <td style={{ ...td, color: r.recoveryOk ? C.pos : C.neg }}>{r.recoveryMonths == null ? "never" : `${r.recoveryMonths} mo`}</td>
                      <td style={{ ...td, color: r.minCash < 0 ? C.neg : r.bufferOk ? C.text : C.brass }}>{fS(r.minCash)} <span style={{ color: C.sub }}>M{r.minCashT}</span></td>
                      <td style={td}>{fSAR(r.peakInst)}</td>
                      <td style={{ ...td, color: r.peakDbr > inp.dbrCap + 0.5 ? C.neg : C.text }}>{pct1(r.peakDbr)}</td>
                      <td style={td}>{fS(r.mortgage)}</td><td style={td}>{fS(r.eq)}</td><td style={td}>{fS(r.pl)}</td><td style={td}>{fS(r.settled)}</td>
                      <td style={{ ...td, color: C.neg }}>{fS(r.newDebtInterest)}</td>
                      <td style={td}>{fS(r.netWorth)}</td>
                    </tr>); })}</tbody>
                </table>
              </div>
            </div>
          </div>
        );
      };

      const StepScen = () => (
        <div>
          <SectionHeader eyebrow={`Step ${steps.length} · Scenarios`} title="Save, reload & compare whole scenarios" sub="A scenario stores every input, your loans and all four strategies in this browser. Compare, say, a 400 m² plot in one district against a ready villa elsewhere, or today's rates against a stressed case." />
          <div className="print-section" style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 10, padding: "14px 16px" }}>
            <div className="flex items-center flex-wrap no-print" style={{ gap: 8, marginBottom: 12 }}>
              <input type="text" placeholder="Scenario name…" value={name} onChange={(e) => setName(e.target.value)} style={{ width: 220 }} />
              <button onClick={doSave} style={btn(C.brass, C.ink)}><Save size={14} /> Save current</button>
              <button onClick={resetAll} style={btn("transparent", C.sub, C.line)}><RotateCcw size={14} /> Reset to defaults</button>
              <span style={{ flex: 1 }} />
              <button onClick={doExport} style={btn("transparent", C.sub, C.line)}>Export JSON</button>
              <label style={{ ...btn("transparent", C.sub, C.line) }}><FolderOpen size={14} /> Import <input type="file" accept="application/json" onChange={doImport} style={{ display: "none" }} /></label>
            </div>
            {savedRows.length === 0 ? <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.sub }}>No saved scenarios yet.</div> : (
              <div className="scroll-x">
                <table className="tbl" style={{ fontFamily: MONO, fontSize: 12.5 }}>
                  <thead><tr><th style={{ ...th, textAlign: "left" }}>Scenario</th><th style={th}>Mode</th><th style={th}>Project cost</th><th style={{ ...th, textAlign: "left" }}>Best executable</th><th style={th}>Advantage / IRR</th><th style={th}>Peak instalments</th><th style={th}>Verdict</th><th style={th} className="no-print"></th></tr></thead>
                  <tbody>{savedRows.map((s) => (
                    <tr key={s.n}>
                      <td style={{ ...td, textAlign: "left", fontFamily: SANS, fontWeight: 600 }}>{s.n}</td>
                      <td style={{ ...td, fontFamily: SANS, color: C.sub }}>{s.mode}</td>
                      <td style={td}>{fS(s.total)}</td>
                      <td style={{ ...td, textAlign: "left", fontFamily: SANS, whiteSpace: "normal", minWidth: 200 }}>{s.best}</td>
                      <td style={td}>{s.metric}</td>
                      <td style={td}>{fSAR(s.pmt)}</td>
                      <td style={{ ...td, color: s.vColor, fontWeight: 700 }}>{s.verdict}</td>
                      <td style={{ ...td }} className="no-print"><div className="flex" style={{ gap: 4, justifyContent: "flex-end" }}><button title="Load" onClick={() => doLoad(s.n)} style={iconBtn}><FolderOpen size={15} color={C.brass} /></button><button title="Delete" onClick={() => doDelete(s.n)} style={iconBtn}><Trash2 size={15} color={C.neg} /></button></div></td>
                    </tr>))}</tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );

      const panels = { you: StepYou, home: StepHome, fin: StepFin, res: StepRes, when: StepWhen, scen: StepScen };

      return (
        <div style={{ minHeight: "100vh", background: C.bone }}>
          {/* header */}
          <div style={{ background: C.ink, padding: "22px 0 16px" }}>
            <div className="wrap">
              <div className="flex items-start justify-between flex-wrap" style={{ gap: 14 }}>
                <div style={{ minWidth: 0, flex: "1 1 320px" }}>
                  <div style={{ fontFamily: SANS, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.18em", textTransform: "uppercase", color: C.brassLt, marginBottom: 5 }}>Scenario tool · Riyadh, KSA · SAR · <a href="index.html" style={{ color: C.brassLt }}>all models</a></div>
                  <h1 style={{ fontFamily: SANS, fontSize: 22, fontWeight: 700, color: C.inv, letterSpacing: "-0.01em", margin: 0, lineHeight: 1.25 }}>{home ? "How should I finance building my home — and when should I start?" : "Residential rental investment — which capital stack earns the most?"}</h1>
                  <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.invSub, marginTop: 6, maxWidth: 760, lineHeight: 1.5 }}>
                    {home ? "Tell it about you and the home, pick up to four financing strategies, and it simulates each one month by month through the bank's debt-burden and LTV tests — then measures it against simply renting."
                          : "Compare up to four capital stacks for a buy-to-let: levered and unlevered IRR, NPV, yields, debt-service cover and the cash each option ties up."}
                  </div>
                </div>
                <div className="no-print flex flex-wrap items-center" style={{ gap: 10 }}>
                  <Toggle dark value={inp.mode} onChange={(v) => { set("mode", v); setStep(0); setFocus(-1); }} options={[["home", "My own home"], ["rental", "Rental investment"]]} />
                  <button onClick={quickSave} title="Save everything on this page under a name you can reload later" style={{ ...btn(C.brass, C.ink), fontSize: 11.5, padding: "6px 10px" }}><Save size={13} /> Save scenario</button>
                  {Object.keys(saved).length > 0 && <select value="" onChange={(e) => { if (e.target.value) { setInp(mergeRE(saved[e.target.value].inp)); setShowRestored(false); } }} style={{ fontSize: 11.5, padding: "5px 8px", maxWidth: 180 }} title="Load a saved scenario"><option value="">Load scenario…</option>{Object.keys(saved).map((k) => <option key={k} value={k}>{k}</option>)}</select>}
                  <button onClick={() => setPrintAll(true)} style={{ ...btn("transparent", C.invSub, C.lineDk), fontSize: 11.5, padding: "6px 10px" }}>Print / PDF</button>
                </div>
              </div>
            </div>
          </div>

          <div className="wrap" style={{ paddingTop: 18 }}>
            {showRestored && <div className="no-print flex items-center flex-wrap" style={{ gap: 10, background: "#F3EFE6", border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 12px", marginBottom: 12, fontFamily: SANS, fontSize: 12.5, color: C.text }}>
              <span>Restored where you left off — your inputs are kept in this browser automatically. Use <b>Save scenario</b> to keep a named copy, or <b>Export</b> in the Scenarios step to keep a file.</span>
              <span style={{ flex: 1 }} />
              <button onClick={resetAll} style={{ ...btn("transparent", C.sub, C.line), fontSize: 11.5, padding: "4px 9px" }}>Start from defaults</button>
              <button onClick={() => setShowRestored(false)} style={{ ...btn("transparent", C.sub, C.line), fontSize: 11.5, padding: "4px 9px" }}>Dismiss</button>
            </div>}
            {Answer()}
          </div>

          {/* sticky step nav */}
          <div className="stepnav" id="steps">
            <div className="wrap">
              <div className="row">
                {steps.map(([id, label], i) => <button key={id} className={"stepbtn" + (stepI === i ? " on" : "")} onClick={() => go(i)}><span className="num">{i + 1}</span>{label}</button>)}
              </div>
            </div>
          </div>

          <div className="wrap" style={{ paddingTop: 22, paddingBottom: 60 }}>
            {printAll ? steps.map(([id]) => <div key={id} style={{ marginBottom: 36 }}>{panels[id]()}</div>) : <>
              {panels[cur]()}
              {StepFooter()}
            </>}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
