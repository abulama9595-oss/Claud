                      <tr key={key} style={{ background: kind === "head" ? SOFT : "transparent" }}>
                        <td style={{ ...td, textAlign: "left", fontFamily: SANS, fontWeight: kind === "head" ? 700 : 400, color: kind === "sub" ? C.sub : C.text, paddingLeft: label.startsWith("  ") ? 26 : 14 }}>{label.trim()}</td>
                        {focusRes.years.map((y) => { const v = y[key]; const neg = v < 0; return <td key={y.year} style={{ ...td, fontWeight: kind === "head" ? 700 : 400, color: kind === "ratio" ? (v != null && v < 1.2 ? C.neg : C.text) : neg && (kind === "head" || kind === "plain") ? C.neg : kind === "neg" || kind === "sub" ? C.sub : C.text }}>{kind === "ratio" ? (v == null ? "—" : v.toFixed(2)) : kind === "neg" || (kind === "sub" && !["debtMortgage", "debtEq", "debtPL", "debtExisting"].includes(key)) ? (Math.abs(v) < 0.5 ? "–" : `(${fS(Math.abs(v))})`) : (Math.abs(v) < 0.5 && kind === "sub" ? "–" : fS(v))}</td>; })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Adv>
            <Adv title={`What moves the answer — sensitivity of ${nameOf(focusRes)}`}>
              <Note>Each driver flexed ±20% on its own. Bars show the change in {home ? `wealth advantage vs ${baseLbl} (SAR)` : "levered IRR (percentage points)"}; the longest bar is the assumption to firm up first.</Note>
              <ResponsiveContainer width="100%" height={40 * Math.max(1, tornado.length) + 30}>
                <BarChart data={tornado} layout="vertical" margin={{ top: 8, right: 24, left: 0, bottom: 0 }} stackOffset="sign">
                  <CartesianGrid stroke={C.line} horizontal={false} />
                  <XAxis type="number" tick={axisT} tickFormatter={(v) => home ? fS(v) : v.toFixed(1)} tickLine={false} axisLine={false} />
                  <YAxis type="category" dataKey="label" width={170} tick={{ fontFamily: SANS, fontSize: 11.5, fill: C.text }} tickLine={false} axisLine={false} />
                  <Tooltip formatter={(v, n) => [home ? fSAR(v) : v.toFixed(2) + " pp", n === "lo" ? "−20% / +20% (worse)" : "−20% / +20% (better)"]} contentStyle={tipStyle} cursor={{ fill: SOFT }} />
                  <ReferenceLine x={0} stroke={C.text} />
                  <Bar dataKey="lo" stackId="t" fill={C.neg} maxBarSize={18} /><Bar dataKey="hi" stackId="t" fill={C.pos} maxBarSize={18} radius={[0, 3, 3, 0]} />
                </BarChart>
              </ResponsiveContainer>
            </Adv>
          </div>}
        </div>
      );

      const StepWhen = () => {
        if (!sweep || !focusRes) return <div style={{ fontFamily: SANS, color: C.sub }}>Enable a strategy first.</div>;
        const sb = sweep.best;
        const curStart = Math.max(inp.buildStart, inp.landMonth);
        return (
          <div>
            <SectionHeader eyebrow={`Step ${steps.findIndex((s) => s[0] === "when") + 1} · When to start`} title={`Best time to build — ${nameOf(focusRes)}`}
              sub={`The same strategy run with construction starting every 3 months from now to 5 years out. Waiting lets loans run down (freeing debt-burden room and cash), but land grows ${inp.appreciation}%/yr and construction ${inp.costInflation}%/yr. ★ marks the earliest start that is executable and keeps your ${fS(inp.cashBuffer)} buffer.`}
              meta={<div className="flex items-center flex-wrap no-print" style={{ gap: 10 }}><FocusPicker /><span style={{ fontFamily: SANS, fontSize: 11, color: C.sub }}>Land</span><Toggle value={landWithBuild ? "with" : "now"} onChange={(v) => setLandWithBuild(v === "with")} options={[["now", `Buy in ${fCal(inp.landMonth)}`], ["with", "Buy when building"]]} /></div>} />
            <div className="print-section" style={{ background: sb ? SOFT_POS : SOFT_NEG, border: `1px solid ${C.line}`, borderRadius: 10, padding: "14px 18px", marginBottom: 14, fontFamily: SANS, fontSize: 14, color: C.text, lineHeight: 1.5 }}>
              {sb ? <>
                <b>{sb.delay <= curStart ? `Start as planned in ${fCal(sb.delay)}` : `Earliest workable start: ${fCal(sb.delay)}`}</b> — move in {fCal(sb.occupy)}, cash never below {fS(sb.minCash)}, peak instalments {fSAR(sb.peakInst)}/mo ({sb.peakDbr.toFixed(0)}% of income), project cost {fS(sb.total)}.
                {sb.delay !== curStart && <button className="no-print" onClick={() => { set("buildStart", sb.delay); if (landWithBuild) set("landMonth", sb.delay); }} style={{ ...btn(C.brass, C.ink), fontSize: 11.5, padding: "4px 10px", marginLeft: 10 }}>Use this start</button>}
              </> : <>No start date within 5 years makes this strategy executable — change the strategy (step 3), the project (step 2) or the land timing.</>}
            </div>
            <div className="print-section" style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
              <div className="scroll-x">
                <table className="tbl" style={{ fontFamily: MONO, fontSize: 12 }}>
                  <thead><tr>{["Start", "Move in", "Project cost", "Executable", "Cash low point", "Peak instalments", "Peak DBR", "New-home mortgage", "Existing-property mortgage", "Old loans settled", "Profit + fees on new debt", `Wealth vs ${baseLbl} @ Y${inp.horizon}`].map((h, i) => <th key={h} style={{ ...th, textAlign: i < 2 ? "left" : "right", whiteSpace: "normal" }}>{h}</th>)}</tr></thead>
                  <tbody>{sweep.rows.map((r) => { const isB = sb && sb.delay === r.delay; const isCur = r.delay === curStart; return (
                    <tr key={r.delay} style={{ background: isB ? "#F6EFE1" : "transparent", fontWeight: isB ? 700 : 400, borderLeft: isB ? `4px solid ${C.brass}` : "4px solid transparent" }}>
                      <td style={{ ...td, textAlign: "left", fontFamily: SANS }}>{isB && <span style={{ color: C.brass }}>★ </span>}{fCal(r.delay)} <span style={{ color: C.sub, fontFamily: MONO, fontSize: 11 }}>M{r.delay}</span>{isCur && <span className="tag" style={{ background: SOFT, color: C.sub, marginLeft: 6 }}>current</span>}</td>
                      <td style={{ ...td, textAlign: "left", fontFamily: SANS }}>{fCal(r.occupy)}</td>
                      <td style={td}>{fS(r.total)}</td>
                      <td style={{ ...td, color: r.feasible ? C.pos : C.neg }}>{r.feasible ? "yes" : "NO"}</td>
                      <td style={{ ...td, color: r.minCash < 0 ? C.neg : r.bufferOk ? C.text : C.brass }}>{fS(r.minCash)} <span style={{ color: C.sub }}>M{r.minCashT}</span></td>
                      <td style={td}>{fSAR(r.peakInst)}</td>
                      <td style={{ ...td, color: r.peakDbr > inp.dbrCap + 0.5 ? C.neg : C.text }}>{pct1(r.peakDbr)}</td>
                      <td style={td}>{fS(r.mortgage)}</td><td style={td}>{fS(r.eq)}</td><td style={td}>{fS(r.settled)}</td>
                      <td style={{ ...td, color: C.neg }}>{fS(r.newDebtInterest)}</td>
                      <td style={{ ...td, color: r.advantage >= 0 ? C.pos : C.neg }}>{fS(r.advantage)}</td>
                    </tr>); })}</tbody>
                </table>
              </div>
            </div>
          </div>
        );
      };

      const StepScen = () => (
        <div>
          <SectionHeader eyebrow={`Step ${steps.length} · Scenarios`} title="Save, reload & compare whole scenarios" sub="A scenario stores every input, your loans and all four strategies in this browser. Compare, say, a 400 m² plot in one district against a ready villa elsewhere, or today's rates against a stressed case." />
          <div className="print-section" style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 10, padding: "14px 16px" }}>
            <div className="flex items-center flex-wrap no-print" style={{ gap: 8, marginBottom: 12 }}>
              <input type="text" placeholder="Scenario name…" value={name} onChange={(e) => setName(e.target.value)} style={{ width: 220 }} />
              <button onClick={doSave} style={btn(C.brass, C.ink)}><Save size={14} /> Save current</button>
              <button onClick={resetAll} style={btn("transparent", C.sub, C.line)}><RotateCcw size={14} /> Reset to defaults</button>
              <span style={{ flex: 1 }} />
              <button onClick={doExport} style={btn("transparent", C.sub, C.line)}>Export JSON</button>
              <label style={{ ...btn("transparent", C.sub, C.line) }}><FolderOpen size={14} /> Import <input type="file" accept="application/json" onChange={doImport} style={{ display: "none" }} /></label>
            </div>
            {savedRows.length === 0 ? <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.sub }}>No saved scenarios yet.</div> : (
              <div className="scroll-x">
                <table className="tbl" style={{ fontFamily: MONO, fontSize: 12.5 }}>
                  <thead><tr><th style={{ ...th, textAlign: "left" }}>Scenario</th><th style={th}>Mode</th><th style={th}>Project cost</th><th style={{ ...th, textAlign: "left" }}>Best executable</th><th style={th}>Advantage / IRR</th><th style={th}>Peak instalments</th><th style={th}>Verdict</th><th style={th} className="no-print"></th></tr></thead>
                  <tbody>{savedRows.map((s) => (
                    <tr key={s.n}>
                      <td style={{ ...td, textAlign: "left", fontFamily: SANS, fontWeight: 600 }}>{s.n}</td>
                      <td style={{ ...td, fontFamily: SANS, color: C.sub }}>{s.mode}</td>
                      <td style={td}>{fS(s.total)}</td>
                      <td style={{ ...td, textAlign: "left", fontFamily: SANS, whiteSpace: "normal", minWidth: 200 }}>{s.best}</td>
                      <td style={td}>{s.metric}</td>
                      <td style={td}>{fSAR(s.pmt)}</td>
                      <td style={{ ...td, color: s.vColor, fontWeight: 700 }}>{s.verdict}</td>
                      <td style={{ ...td }} className="no-print"><div className="flex" style={{ gap: 4, justifyContent: "flex-end" }}><button title="Load" onClick={() => doLoad(s.n)} style={iconBtn}><FolderOpen size={15} color={C.brass} /></button><button title="Delete" onClick={() => doDelete(s.n)} style={iconBtn}><Trash2 size={15} color={C.neg} /></button></div></td>
                    </tr>))}</tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );

      const panels = { you: StepYou, home: StepHome, fin: StepFin, res: StepRes, when: StepWhen, scen: StepScen };

      return (
        <div style={{ minHeight: "100vh", background: C.bone }}>
          {/* header */}
          <div style={{ background: C.ink, padding: "22px 0 16px" }}>
            <div className="wrap">
              <div className="flex items-start justify-between flex-wrap" style={{ gap: 14 }}>
                <div style={{ minWidth: 0, flex: "1 1 320px" }}>
                  <div style={{ fontFamily: SANS, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.18em", textTransform: "uppercase", color: C.brassLt, marginBottom: 5 }}>Scenario tool · Riyadh, KSA · SAR · <a href="index.html" style={{ color: C.brassLt }}>all models</a></div>
                  <h1 style={{ fontFamily: SANS, fontSize: 22, fontWeight: 700, color: C.inv, letterSpacing: "-0.01em", margin: 0, lineHeight: 1.25 }}>{home ? "How should I finance building my home — and when should I start?" : "Residential rental investment — which capital stack earns the most?"}</h1>
                  <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.invSub, marginTop: 6, maxWidth: 760, lineHeight: 1.5 }}>
                    {home ? "Tell it about you and the home, pick up to four financing strategies, and it simulates each one month by month through the bank's debt-burden and LTV tests — then measures it against simply renting."
                          : "Compare up to four capital stacks for a buy-to-let: levered and unlevered IRR, NPV, yields, debt-service cover and the cash each option ties up."}
                  </div>
                </div>
                <div className="no-print flex flex-wrap items-center" style={{ gap: 10 }}>
                  <Toggle dark value={inp.mode} onChange={(v) => { set("mode", v); setStep(0); setFocus(-1); }} options={[["home", "My own home"], ["rental", "Rental investment"]]} />
                  <button onClick={quickSave} title="Save everything on this page under a name you can reload later" style={{ ...btn(C.brass, C.ink), fontSize: 11.5, padding: "6px 10px" }}><Save size={13} /> Save scenario</button>
                  {Object.keys(saved).length > 0 && <select value="" onChange={(e) => { if (e.target.value) { setInp(mergeRE(saved[e.target.value].inp)); setShowRestored(false); } }} style={{ fontSize: 11.5, padding: "5px 8px", maxWidth: 180 }} title="Load a saved scenario"><option value="">Load scenario…</option>{Object.keys(saved).map((k) => <option key={k} value={k}>{k}</option>)}</select>}
                  <button onClick={() => setPrintAll(true)} style={{ ...btn("transparent", C.invSub, C.lineDk), fontSize: 11.5, padding: "6px 10px" }}>Print / PDF</button>
                </div>
              </div>
            </div>
          </div>

          <div className="wrap" style={{ paddingTop: 18 }}>
            {showRestored && <div className="no-print flex items-center flex-wrap" style={{ gap: 10, background: "#F3EFE6", border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 12px", marginBottom: 12, fontFamily: SANS, fontSize: 12.5, color: C.text }}>
              <span>Restored where you left off — your inputs are kept in this browser automatically. Use <b>Save scenario</b> to keep a named copy, or <b>Export</b> in the Scenarios step to keep a file.</span>
              <span style={{ flex: 1 }} />
              <button onClick={resetAll} style={{ ...btn("transparent", C.sub, C.line), fontSize: 11.5, padding: "4px 9px" }}>Start from defaults</button>
              <button onClick={() => setShowRestored(false)} style={{ ...btn("transparent", C.sub, C.line), fontSize: 11.5, padding: "4px 9px" }}>Dismiss</button>
            </div>}
            {Answer()}
          </div>

          {/* sticky step nav */}
          <div className="stepnav" id="steps">
            <div className="wrap">
              <div className="row">
                {steps.map(([id, label], i) => <button key={id} className={"stepbtn" + (stepI === i ? " on" : "")} onClick={() => go(i)}><span className="num">{i + 1}</span>{label}</button>)}
              </div>
            </div>
          </div>

          <div className="wrap" style={{ paddingTop: 22, paddingBottom: 60 }}>
            {printAll ? steps.map(([id]) => <div key={id} style={{ marginBottom: 36 }}>{panels[id]()}</div>) : <>
              {panels[cur]()}
              {StepFooter()}
            </>}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
