<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home & Real-Estate Financing · Scenario Tool</title>
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script src="vendor/babel.js"></script>
  <script src="vendor/prop-types.js"></script>
  <script src="vendor/recharts.js"></script>
  <!-- shared palette / formatters / IRR from the flagship engine, then the real-estate engine -->
  <script src="engine.js"></script>
  <script src="re-engine.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #F1EDE4; overflow-x: hidden; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .items-baseline { align-items: baseline; }
    .items-start { align-items: flex-start; }
    .justify-between { justify-content: space-between; }
    .flex-wrap { flex-wrap: wrap; }
    .grid { display: grid; }
    .wrap { max-width: 1200px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: #DBD4C5; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; margin-top: -5px; background: var(--accent, #B0823A); cursor: pointer; }
    input[type=text], input[type=number], select, textarea { font-family: Inter, system-ui, sans-serif; font-size: 12.5px; padding: 6px 8px; border: 1px solid #DBD4C5; border-radius: 6px; background: #fff; color: #1B2733; max-width: 100%; }
    input[type=number] { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; text-align: right; width: 100%; padding: 4px 6px; }
    textarea { width: 100%; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 11.5px; }
    .sel { width: 100%; margin-bottom: 10px; }
    .lbl { font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #1B2733; font-weight: 500; margin-bottom: 4px; display: block; }
    .subhead { font-family: Inter, system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #B0823A; margin: 10px 0 8px; padding-top: 10px; border-top: 1px dashed #DBD4C5; }
    .subhead:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    /* progressive disclosure */
    details.adv { border: 1px dashed #DBD4C5; border-radius: 8px; padding: 0 12px; margin-top: 8px; background: #FBFAF6; }
    details.adv > summary { list-style: none; cursor: pointer; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #64707C; padding: 9px 0; display: flex; align-items: center; gap: 8px; }
    details.adv > summary::-webkit-details-marker { display: none; }
    details.adv > summary::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid #B0823A; border-bottom: 1.5px solid #B0823A; transform: rotate(-45deg); transition: transform .15s; flex: none; }
    details.adv[open] > summary::before { transform: rotate(45deg); }
    details.adv > summary:hover { color: #1B2733; }
    details.adv > .adv-body { padding: 4px 0 8px; }
    /* step nav */
    .stepnav { position: sticky; top: 0; z-index: 20; background: rgba(241,237,228,0.96); backdrop-filter: blur(6px); border-bottom: 1px solid #DBD4C5; }
    .stepnav .row { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; }
    .stepnav .row::-webkit-scrollbar { display: none; }
    .stepbtn { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent; border-radius: 999px; padding: 6px 12px 6px 6px; cursor: pointer; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; color: #64707C; white-space: nowrap; }
    .stepbtn .num { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; background: #DBD4C5; color: #1B2733; }
    .stepbtn.on { background: #0E1A2B; color: #ECE4D3; }
    .stepbtn.on .num { background: #B0823A; color: #0E1A2B; }
    .stepbtn:hover:not(.on) { background: #E7E1D3; }
    /* timeline */
    .ev { display: grid; grid-template-columns: 92px 112px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid #ECE7DA; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; line-height: 1.5; align-items: start; }
    .ev .m { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 11.5px; color: #64707C; padding-top: 2px; }
    .tag { display: inline-block; font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 7px; border-radius: 5px; white-space: nowrap; }
    @media (max-width: 640px) { .ev { grid-template-columns: 1fr; gap: 3px; } .ev .m { padding-top: 0; } }
    .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; align-items: start; }
    @media (max-width: 820px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
    .tbl { width: 100%; border-collapse: collapse; }
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    @media print {
      @page { margin: 12mm; }
      body { background: #fff !important; }
      .no-print, .stepnav { display: none !important; }
      input[type=range] { display: none !important; }
      .print-section { break-inside: avoid; }
      details.adv { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.jsx" data-presets="react"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect } = React;
    const { BarChart, LineChart, Bar, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend, ReferenceLine } = window.Recharts;

    /* strategy identity colours — fixed per slot (colour follows the strategy, never its rank); validated for CVD on the paper surface */
    const OPT_COLORS = ["#2F6DB5", "#B0823A", "#1F9A80", "#A24FB8"];
    const STORE_KEY = "re_scenarios";
    const CUR_KEY = "re_current"; // autosaved working state — restored when you come back
    const SOFT = "#F3EFE6", SOFT_NEG = "#F6E7E3", SOFT_POS = "#E6F0EC";

    /* ---------- presentation primitives ---------- */
    function SectionHeader({ eyebrow, title, sub, meta }) {
      return (
        <div className="flex items-baseline justify-between" style={{ flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
          <div style={{ minWidth: 0 }}>
            {eyebrow && <div style={{ fontFamily: SANS, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.16em", textTransform: "uppercase", color: C.brass, marginBottom: 4 }}>{eyebrow}</div>}
            <h2 style={{ fontFamily: SANS, fontSize: 19, fontWeight: 700, color: C.text, letterSpacing: "-0.01em", margin: 0 }}>{title}</h2>
            {sub && <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.sub, marginTop: 4, maxWidth: 820, lineHeight: 1.5 }}>{sub}</div>}
          </div>
          {meta && <div>{meta}</div>}
        </div>
      );
    }
    function Kpi({ label, value, sub, accent }) {
      return (
        <div className="print-section" style={{ background: C.paper, borderLeft: `1px solid ${C.line}`, borderRight: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}`, borderTop: `3px solid ${accent || C.brass}`, borderRadius: 9, padding: "12px 14px", minWidth: 0 }}>
          <div style={{ fontFamily: SANS, fontSize: 10.5, letterSpacing: "0.06em", textTransform: "uppercase", color: C.sub, marginBottom: 5 }}>{label}</div>
          <div style={{ fontFamily: MONO, fontSize: 22, fontWeight: 700, color: accent || C.text, letterSpacing: "-0.03em", lineHeight: 1, overflowWrap: "anywhere" }}>{value}</div>
          {sub && <div style={{ fontFamily: SANS, fontSize: 11, color: C.sub, marginTop: 5, lineHeight: 1.4 }}>{sub}</div>}
        </div>
      );
    }
    const Panel = ({ title, children, style, right }) => (
      <div className="print-section" style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 10, padding: "16px 14px 10px", minWidth: 0, ...style }}>
        {(title || right) && <div className="flex items-center justify-between flex-wrap" style={{ gap: 8, marginBottom: 10 }}>
          {title && <h3 style={{ fontFamily: SANS, fontSize: 11.5, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: C.text, margin: "0 0 0 4px" }}>{title}</h3>}
          {right}
        </div>}
        {children}
      </div>
    );
    const Toggle = ({ value, options, onChange, dark }) => (
      <div className="flex flex-wrap" style={{ gap: 6 }}>
        {options.map(([id, label]) => (
          <button key={id} onClick={() => onChange(id)} style={{ ...btn(value === id ? C.brass : "transparent", value === id ? C.ink : (dark ? C.invSub : C.sub), value === id ? C.brass : (dark ? C.lineDk : C.line)), fontSize: 12, padding: "6px 11px" }}>{label}</button>
        ))}
      </div>
    );
    const Check = ({ checked, onChange, label }) => (
      <label className="flex items-center" style={{ gap: 8, fontFamily: SANS, fontSize: 12.5, color: C.text, cursor: "pointer", marginTop: 4, marginBottom: 10 }}>
        <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} /> {label}
      </label>
    );
    const Select = ({ label, value, onChange, options, hint }) => (
      <div style={{ marginBottom: 10 }}>
        {label && <span className="lbl">{label}</span>}
        <select className="sel" value={value} onChange={(e) => onChange(e.target.value)} style={{ marginBottom: 0 }}>{options.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>
        {hint && <div style={{ fontFamily: SANS, fontSize: 11, color: C.sub, marginTop: 3 }}>{hint}</div>}
      </div>
    );
    /* collapsible group for secondary inputs (native <details>; open state lives in the DOM) */
    const Adv = ({ title, children, open }) => (
      <details className="adv" open={open}>
        <summary>{title}</summary>
        <div className="adv-body">{children}</div>
      </details>
    );
    const Badge = ({ ok, text }) => (
      <div style={{ background: ok ? SOFT_POS : SOFT_NEG, borderRadius: 6, padding: "6px 9px", fontFamily: SANS, fontSize: 11.5, lineHeight: 1.4, color: C.text }}>
        <span className="tag" style={{ background: ok ? C.pos : C.neg, color: "#fff", marginRight: text ? 6 : 0 }}>{ok ? "✓ Executable" : "✗ Not executable"}</span>{text}
      </div>
    );
    const Stat = ({ label, value, color, sub }) => (
      <div style={{ minWidth: 0 }}>
        <div style={{ fontFamily: SANS, fontSize: 10.5, color: C.sub, letterSpacing: "0.04em", textTransform: "uppercase" }}>{label}</div>
        <div style={{ fontFamily: MONO, fontSize: 15, fontWeight: 700, color: color || C.text, letterSpacing: "-0.02em", overflowWrap: "anywhere" }}>{value}</div>
        {sub && <div style={{ fontFamily: SANS, fontSize: 10.5, color: C.sub }}>{sub}</div>}
      </div>
    );
    const Mini = ({ k, v, color }) => <div className="flex justify-between" style={{ gap: 8 }}><span style={{ fontFamily: SANS, color: C.sub }}>{k}</span><span style={{ color: color || C.text, textAlign: "right" }}>{v}</span></div>;
    const Note = ({ children }) => <div style={{ fontFamily: SANS, fontSize: 11.5, color: C.sub, lineHeight: 1.5, marginTop: 8 }}>{children}</div>;

    /* chart hygiene: hairline solid grid, 2px lines, text in text tokens */
    const tipStyle = { fontFamily: SANS, fontSize: 12, border: `1px solid ${C.line}`, borderRadius: 6 };
    const axisT = { fontFamily: MONO, fontSize: 11, fill: C.sub };
    const axisS = { fontFamily: SANS, fontSize: 11, fill: C.sub };
    const legendStyle = { fontFamily: SANS, fontSize: 12, color: C.text };

    const fYr = (m) => m == null ? "—" : m < 12 ? `${m} mo` : `${(m / 12).toFixed(1)} yrs`;
    const T0 = new Date(); T0.setDate(1);
    const fCal = (t) => { const d = new Date(T0.getFullYear(), T0.getMonth() + Math.round(t || 0), 1); return d.toLocaleString("en-US", { month: "short", year: "numeric" }); };
    const fMon = (t) => t == null ? "—" : `M${t} · ${fCal(t)}`;
    const pct1 = (v) => v == null ? "—" : `${v.toFixed(1)}%`;
    const pct0 = (v) => v == null ? "—" : `${v.toFixed(0)}%`;

    /* timeline event kinds → label + colour */
    const EV_KIND = {
      settle:    { label: "Settle",         bg: SOFT_NEG, fg: C.neg },
      mortgage:  { label: "Mortgage",       bg: "#E4ECF6", fg: "#2F6DB5" },
      pl:        { label: "Personal loan",  bg: "#F1E6F6", fg: "#A24FB8" },
      eq:        { label: "Own property",   bg: "#E2F2EE", fg: "#1F9A80" },
      milestone: { label: "Milestone",      bg: SOFT, fg: C.sub },
      cash:      { label: "Cash",           bg: "#F6EFE1", fg: C.brass },
      end:       { label: "Horizon",        bg: SOFT_POS, fg: C.pos },
    };
    const EvRow = ({ t, kind, children, last }) => {
      const k = EV_KIND[kind] || EV_KIND.milestone;
      return <div className="ev" style={last ? { borderBottom: "none" } : null}><span className="m">{t}</span><span><span className="tag" style={{ background: k.bg, color: k.fg }}>{k.label}</span></span><span style={{ color: kind === "milestone" ? C.sub : C.text }}>{children}</span></div>;
    };

    /* ---------- plain-English description of a strategy, generated from its settings (presentation only) ---------- */
    function rateTxt(inp, rate, yrs) { return `${rate}%${inp.rateQuote === "flat" ? " flat" : ""} over ${yrs} yrs`; }
    function describePlan(o, inp, prj, build) {
      const s = [];
      const landTxt = build ? "buy the land in cash" : "pay the purchase in cash";
      if (o.mortgageWhen === "start") {
        if (build && o.mortgageScope === "construction") s.push(`Buy the land in cash, then take a construction-only mortgage at ${rateTxt(inp, o.rate, o.tenure)} (your cash covers ${o.cashInPct}% of the construction)`);
        else s.push(`Take a ${build ? "construction" : "purchase"} mortgage at the start at ${rateTxt(inp, o.rate, o.tenure)}, putting ${o.cashInPct}% of the cost from your cash`);
        if (o.subsidyCap > 0 && o.subsidyPct > 0) s[s.length - 1] += `, with REDF support on the first ${fS(o.subsidyCap)}`;
      } else if (o.mortgageWhen === "completion") {
        s.push(`${landTxt[0].toUpperCase() + landTxt.slice(1)} and ${build ? "fund the build from cash" : "pay everything from cash"}, then take a cash-out mortgage on the finished home in ${fCal(prj.occupy)} at ${rateTxt(inp, o.rate, o.tenure)}${o.cashOutTarget > 0 ? ` for ${fS(o.cashOutTarget)}` : " for the maximum the bank allows"}`);
      } else {
        s.push(`Pay for everything from cash — no mortgage on the new home`);
      }
      if (o.eqWhen !== "none") {
        const when = o.eqWhen === "start" ? "at the start" : o.eqWhen === "completion" ? `at completion (${fCal(prj.occupy)})` : `in ${fCal(o.eqMonth)}`;
        s.push(`mortgage the property you already own ${when} for ${o.eqAmount > 0 ? fS(o.eqAmount) : "the maximum"} at ${rateTxt(inp, o.eqRate, o.eqTenure)}`);
      }
      if (o.plWhen !== "none" && o.plAmount > 0) {
        const when = o.plWhen === "start" ? "at the start" : o.plWhen === "completion" ? `at completion (${fCal(prj.occupy)})` : `in ${fCal(o.plMonth)}`;
        s.push(`take a ${fS(o.plAmount)} personal loan ${when} at ${rateTxt(inp, o.plRate, o.plTenure)}`);
      }
      const planned = (inp.existingLoans || []).filter((l) => l.balance > 0 && l.settleAt != null && l.settleAt > 0).map((l) => `settle ${l.name} in ${fCal(l.settleAt)}`);
      if (planned.length) s.push(planned.join(", "));
      s.push(o.settlePolicy === "all" ? "clear all existing loans before the first new facility" : o.settlePolicy === "asNeeded" ? "settle existing loans only when a bank test requires it" : "keep all existing loans running");
      return s.join("; ") + ".";
    }
    function describeOption(o, inp, prj) {
      const cash = prj.total * o.cashPct / 100, pl = Math.max(0, Math.min(o.plAmount, prj.total - cash)), mg = Math.max(0, prj.total - cash - pl);
      const s = [`${o.cashPct}% of the cost (${fS(cash)}) from your own cash`];
      if (pl > 0) s.push(`a ${fS(pl)} personal loan at ${rateTxt(inp, o.plRate, o.plTenure)}`);
      if (mg > 0) s.push(`a ${fS(mg)} mortgage at ${rateTxt(inp, o.rate, o.tenure)} with ${o.graceMonths} months' grace (${o.graceMode === "capitalize" ? "profit added to the loan" : "profit paid monthly"})${o.subsidyCap > 0 && o.subsidyPct > 0 ? `, REDF support on the first ${fS(o.subsidyCap)}` : ""}`);
      return s.join(", then ") + ".";
    }
    const newDebtOf = (r) => (r.mortgage.commit || 0) + (r.eq.amount || 0) + (r.pl.amount || 0);

    /* ---------- scenarios (localStorage) ---------- */
    const loadStore = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { return {}; } };
    const saveStore = (o) => { try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch (e) {} };

    /* ---------- existing-loan import: JSON array (any sensible keys) or CSV "name, balance, instalment, months, rate" ---------- */
    function parseLoans(text) {
      const pick = (o, keys, d) => { for (const k of keys) { const hit = Object.keys(o).find((x) => x.toLowerCase().replace(/[^a-z]/g, "") === k); if (hit != null && o[hit] !== "" && o[hit] != null) return o[hit]; } return d; };
      const num = (v) => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isNaN(n) ? 0 : n; };
      let arr = null;
      try { const j = JSON.parse(text); arr = Array.isArray(j) ? j : (j.loans || j.items || j.data || null); } catch (e) {}
      if (arr) return arr.map((o, i) => ({ id: Date.now() + i, name: String(pick(o, ["name", "lender", "bank", "title", "loan"], `Loan ${i + 1}`)), balance: num(pick(o, ["balance", "remaining", "remainingbalance", "outstanding", "principal", "amount"], 0)), installment: num(pick(o, ["installment", "instalment", "monthly", "monthlypayment", "payment", "emi"], 0)), monthsLeft: Math.round(num(pick(o, ["monthsleft", "months", "remainingmonths", "term", "tenure"], 0))), rate: num(pick(o, ["rate", "apr", "interest", "profitrate"], 6)) }));
      return text.split(/\n+/).map((l) => l.trim()).filter((l) => l && !/^name/i.test(l)).map((l, i) => { const c = l.split(/[,;\t]/).map((s) => s.trim()); return { id: Date.now() + i, name: c[0] || `Loan ${i + 1}`, balance: num(c[1]), installment: num(c[2]), monthsLeft: Math.round(num(c[3])), rate: c[4] != null && c[4] !== "" ? num(c[4]) : 6 }; }).filter((l) => l.balance > 0 || l.installment > 0);
    }

    function LoanTable({ loans, onChange, income, dbrCap }) {
      const [txt, setTxt] = useState("");
      const upd = (i, k, v) => onChange(loans.map((l, j) => j === i ? { ...l, [k]: v } : l));
      const inst = loans.reduce((a, l) => a + (l.balance > 0 ? +l.installment || 0 : 0), 0);
      const bal = loans.reduce((a, l) => a + (+l.balance || 0), 0);
      const dbr = income > 0 ? inst / income * 100 : 0;
      const room = Math.max(0, income * dbrCap / 100 - inst);
      const cols = [["name", "Loan", "text"], ["balance", "Balance SAR", "number"], ["installment", "Instalment / mo", "number"], ["monthsLeft", "Months left", "number"], ["rate", "APR %", "number"], ["settleAt", "Settle in month", "number"], ["canSettle", "May settle?", "check"]];
      return (
        <div>
          <div className="scroll-x">
            <table className="tbl" style={{ fontFamily: MONO, fontSize: 12 }}>
              <thead><tr>{cols.map(([k, l]) => <th key={k} style={{ ...th, textAlign: k === "name" ? "left" : "right", padding: "7px 8px", whiteSpace: "normal" }}>{l}</th>)}<th style={{ ...th, padding: "7px 8px" }} className="no-print"></th></tr></thead>
              <tbody>
                {loans.map((l, i) => (
                  <tr key={l.id || i}>
                    {cols.map(([k, , type]) => <td key={k} style={{ ...td, padding: "4px 6px", textAlign: k === "name" ? "left" : "right" }}>
                      {type === "text" ? <input type="text" value={l[k]} onChange={(e) => upd(i, k, e.target.value)} style={{ width: "100%", minWidth: 150 }} />
                                       : type === "check" ? <input type="checkbox" checked={l.canSettle !== false} onChange={(e) => upd(i, k, e.target.checked)} title="untick to keep this loan whatever the strategy (e.g. cheap debt)" />
                                       : <input type="number" value={l[k] == null ? "" : l[k]} placeholder={k === "settleAt" ? "—" : ""} title={k === "settleAt" ? "month in which you plan to clear this loan from cash (blank = no plan)" : ""} step={k === "rate" ? 0.25 : k === "monthsLeft" || k === "settleAt" ? 1 : 1000} min={0} onChange={(e) => upd(i, k, e.target.value === "" ? (k === "settleAt" ? null : 0) : parseFloat(e.target.value) || 0)} style={{ minWidth: k === "settleAt" ? 70 : 90 }} />}
                    </td>)}
                    <td style={{ ...td, padding: "4px 6px" }} className="no-print"><button title="Remove" onClick={() => onChange(loans.filter((_, j) => j !== i))} style={iconBtn}><Trash2 size={15} color={C.neg} /></button></td>
                  </tr>
                ))}
                <tr style={{ background: SOFT, fontWeight: 700 }}>
                  <td style={{ ...td, textAlign: "left", fontFamily: SANS }}>Total ({loans.length})</td><td style={td}>{fSAR(bal)}</td><td style={td}>{fSAR(inst)}</td><td style={td}></td><td style={td}></td><td style={td}></td><td style={td}></td><td style={td} className="no-print"></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div className="flex items-center flex-wrap" style={{ gap: 8, marginTop: 10 }}>
            <button className="no-print" onClick={() => onChange([...loans, { id: Date.now(), name: `Loan ${loans.length + 1}`, balance: 100000, installment: 2500, monthsLeft: 48, rate: 6 }])} style={{ ...btn("transparent", C.sub, C.line), fontSize: 11.5, padding: "5px 10px" }}>+ Add loan</button>
            <button className="no-print" onClick={() => onChange([])} style={{ ...btn("transparent", C.sub, C.line), fontSize: 11.5, padding: "5px 10px" }}>Clear all</button>
            <span style={{ flex: 1 }} />
            <span style={{ fontFamily: SANS, fontSize: 12, color: dbr > dbrCap ? C.neg : C.text }}>Instalments use <b>{dbr.toFixed(0)}%</b> of income · room under the {dbrCap}% cap: <b style={{ fontFamily: MONO }}>{fSAR(room)}/mo</b></span>
          </div>
          <Adv title="Import / paste loans (Qist export JSON, or one per line: name, balance, instalment, months, rate)">
            <textarea rows={4} value={txt} onChange={(e) => setTxt(e.target.value)} placeholder={'[{"name":"Al Rajhi personal","balance":350000,"installment":7900,"monthsLeft":54,"rate":6.5}]\nor\nCar finance, 95000, 2950, 36, 5'} />
            <div className="flex flex-wrap" style={{ gap: 8, marginTop: 6 }}>
              <button onClick={() => { const l = parseLoans(txt); if (l.length) { onChange(l); setTxt(""); } else alert("Nothing recognisable — check the format."); }} style={{ ...btn(C.brass, C.ink), fontSize: 11.5, padding: "5px 10px" }}>Replace with these</button>
              <button onClick={() => { const l = parseLoans(txt); if (l.length) { onChange([...loans, ...l]); setTxt(""); } else alert("Nothing recognisable — check the format."); }} style={{ ...btn("transparent", C.sub, C.line), fontSize: 11.5, padding: "5px 10px" }}>Append</button>
            </div>
          </Adv>
        </div>
      );
    }

    /* ---------- the app ---------- */
    function App() {
      const [restored] = useState(() => { try { const j = JSON.parse(localStorage.getItem(CUR_KEY) || "null"); return j && typeof j === "object" ? j : null; } catch (e) { return null; } });
      const [inp, setInp] = useState(() => mergeRE(restored || {}));
      const [showRestored, setShowRestored] = useState(!!restored);
      useEffect(() => { const id = setTimeout(() => { try { localStorage.setItem(CUR_KEY, JSON.stringify(inp)); } catch (e) {} }, 400); return () => clearTimeout(id); }, [inp]);
      const [step, setStep] = useState(0);
      const [focus, setFocus] = useState(-1);          // -1 = follow the recommendation
      const [editing, setEditing] = useState({});      // strategy/option cards in edit mode
      const [allRows, setAllRows] = useState(false);
      const [landWithBuild, setLandWithBuild] = useState(false);
      const [printAll, setPrintAll] = useState(false);
      const [saved, setSaved] = useState(loadStore);
      const [name, setName] = useState("");
      const set = (k, v) => setInp((s) => ({ ...s, [k]: v }));
      const setOpt = (i, k, v) => setInp((s) => ({ ...s, options: s.options.map((o, j) => j === i ? { ...o, [k]: v } : o) }));
      const setPlan = (i, k, v) => setInp((s) => ({ ...s, plans: s.plans.map((o, j) => j === i ? { ...o, [k]: v } : o) }));
      const applyPreset = (i, key) => setInp((s) => ({ ...s, options: s.options.map((o, j) => j === i ? { enabled: true, ...RE_OPTION_PRESETS[key] } : o) }));
      const applyPlanPreset = (i, key) => setInp((s) => ({ ...s, plans: s.plans.map((o, j) => j === i ? { enabled: true, ...RE_PLAN_PRESETS[key] } : o) }));

      const m = useMemo(() => computeRE(inp), [inp]);
      const home = inp.mode === "home", build = inp.acquire === "build";
      const { prj, household } = m;
      const liveIdx = m.results.map((r, i) => r ? i : -1).filter((i) => i >= 0);
      const bestF = m.bestFeasible, best = m.best, lead = bestF || best;
      const recIdx = lead ? m.results.indexOf(lead) : -1;
      const focusIdx = focus >= 0 && m.results[focus] ? focus : recIdx;
      const focusRes = focusIdx >= 0 ? m.results[focusIdx] : null;
      const tornado = useMemo(() => focusIdx >= 0 ? tornadoRE(inp, focusIdx) : [], [inp, focusIdx]);
      const sweepRec = useMemo(() => home && recIdx >= 0 ? timingSweepRE(inp, recIdx, 60, 3, landWithBuild) : null, [inp, recIdx, home, landWithBuild]);
      const sweep = useMemo(() => home && focusIdx >= 0 ? (focusIdx === recIdx ? null : timingSweepRE(inp, focusIdx, 60, 3, landWithBuild)) : null, [inp, focusIdx, recIdx, home, landWithBuild]) || sweepRec;
      const nameOf = (r) => home ? r.plan.name : r.opt.name;
      const renting = inp.rentNow > 0; // baseline: keep renting the same home, or (no rent) stay put and keep the cash invested
      const baseLbl = renting ? "renting" : "not building";

      /* steps */
      const steps = home
        ? [["you", "You"], ["home", build ? "The home" : "The property"], ["fin", "Financing"], ["res", "Results"], ["when", "When to start"], ["scen", "Scenarios"]]
        : [["home", "The property"], ["you", "Letting & you"], ["fin", "Financing"], ["res", "Results"], ["scen", "Scenarios"]];
      const stepI = Math.min(step, steps.length - 1);
      const cur = steps[stepI][0];
      const go = (i) => { setStep(Math.max(0, Math.min(steps.length - 1, i))); const el = document.getElementById("steps"); if (el) window.scrollTo({ top: el.offsetTop - 8, behavior: "smooth" }); };
      useEffect(() => { if (!printAll) return; const t = setTimeout(() => { window.print(); setPrintAll(false); }, 150); return () => clearTimeout(t); }, [printAll]);
      const show = (id) => printAll || cur === id;

      /* chart data */
      const nY = focusRes ? focusRes.years.length : 0;
      const yearSeries = Array.from({ length: nY }, (_, y) => {
        const row = { year: y === 0 ? "Y0" : `Y${y}` };
        liveIdx.forEach((i) => {
          const yr = m.results[i].years[y];
          if (home) { row[`cash${i}`] = Math.round(yr.cash); row[`debt${i}`] = Math.round(yr.debt); row[`inst${i}`] = Math.round(yr.instMo); row[`nw${i}`] = Math.round(yr.netWorth); }
          else { row[`nw${i}`] = Math.round(yr.ownerEquity); row[`bal${i}`] = Math.round(yr.bal); row[`out${i}`] = Math.round((yr.payment + yr.rentPaid + yr.ownerCost) / (y === 0 ? 1 : 12)); row[`cf${i}`] = Math.round(yr.cf); }
        });
        if (focusRes) { const yr = focusRes.years[y]; row.renter = Math.round(home ? yr.renterNW : yr.portfolio); }
        return row;
      });
      const stackData = !home ? liveIdx.map((i) => { const r = m.results[i]; return { name: `Option ${i + 1}`, full: r.opt.name, "Own cash": Math.round(r.cash), "Personal loan": Math.round(r.pl), "Mortgage": Math.round(r.loanCommit) }; }) : [];
      const costRows = build
        ? [["Land", prj.land], ["RETT on land" + (prj.rettExempt > 0 ? " (first-home relief applied)" : ""), prj.rett], ["Construction (hard)", prj.hard], ["Design, permits, supervision", prj.soft], ["Contingency", prj.cont], ["Finishing / kitchen / AC / landscape", prj.finish], ["VAT 15% on construction & finishing", prj.vat]]
        : [["Purchase price", prj.price], ["RETT" + (prj.rettExempt > 0 ? " (first-home relief applied)" : ""), prj.rett], ["Broker", prj.broker], ["Finishing / furnishing", prj.finish], ["VAT on finishing", prj.vat]];

      /* scenario ops */
      const persist = (o) => { setSaved(o); saveStore(o); };
      const doSave = () => { const n = name.trim() || `Scenario ${Object.keys(saved).length + 1}`; persist({ ...saved, [n]: { inp, savedAt: new Date().toISOString() } }); setName(""); };
      const quickSave = () => { const n = window.prompt("Name this scenario", Object.keys(saved).find((k) => JSON.stringify(saved[k].inp) === JSON.stringify(inp)) || "My scenario"); if (!n) return; persist({ ...saved, [n.trim()]: { inp, savedAt: new Date().toISOString() } }); };
      const resetAll = () => { try { localStorage.removeItem(CUR_KEY); } catch (e) {} setInp(mergeRE({})); setShowRestored(false); };
      const doLoad = (n) => setInp(mergeRE(saved[n].inp));
      const doDelete = (n) => { const o = { ...saved }; delete o[n]; persist(o); };
      const doExport = () => { const blob = new Blob([JSON.stringify({ scenarios: saved, current: inp }, null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "realestate-scenarios.json"; a.click(); };
      const doImport = (e) => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const j = JSON.parse(rd.result); const inc = j.scenarios || (j.inp ? { [f.name]: j } : { [f.name]: { inp: j } }); persist({ ...saved, ...inc }); } catch (err) { alert("Could not read file"); } }; rd.readAsText(f); e.target.value = ""; };
      const savedRows = Object.entries(saved).map(([n, s]) => { const r = computeRE(s.inp); const b = r.bestFeasible || r.best; return { n, mode: r.p.mode, total: r.prj.total, best: b ? (r.p.mode === "home" ? b.plan.name : b.opt.name) : "—", metric: b ? (r.p.mode === "home" ? fS(b.advantage) : pct1(b.irr == null ? null : b.irr * 100)) : "—", pmt: b ? (r.p.mode === "home" ? b.peakInst : b.monthlyPayment) : 0, verdict: r.verdict, vColor: r.vColor }; });

      /* comparison rows — `key` rows show by default */
      const homeRows = [
        ["Executable?", (r) => r.feasible ? "yes" : "NO", (r) => r.feasible ? C.pos : C.neg, true, true],
        ["Mortgage on the new home", (r) => r.mortgage.type ? `${fS(r.mortgage.commit)} ${r.mortgage.type === "construction" ? "at start" : "cash-out " + fMon(r.mortgage.startedAt)}` : "none", null, false, true],
        ["Mortgage instalment", (r) => r.mortgage.type ? fSAR(r.mortgage.instalment) + "/mo" : "—"],
        ["Bank DBR at mortgage approval", (r) => r.mortgage.type ? pct1(r.mortgage.dbrAt) : "—", (r) => r.mortgage.dbrAt > inp.dbrCap + 0.5 ? C.neg : C.text],
        ["Mortgage on existing property", (r) => r.eq.startedAt !== null && r.eq.amount > 0 ? `${fS(r.eq.amount)} ${fMon(r.eq.startedAt)} · ${fSAR(r.eq.pmt)}/mo${r.eq.amount < r.eq.requested - 1 ? ` (asked ${fS(r.eq.requested)})` : ""}` : (r.plan.eqWhen !== "none" ? "refused (DBR)" : "none"), (r) => r.plan.eqWhen !== "none" && r.eq.amount < r.eq.requested - 1 ? C.neg : C.text],
        ["Personal loan taken", (r) => r.pl.startedAt !== null ? `${fS(r.pl.amount)} ${fMon(r.pl.startedAt)}${r.pl.amount < r.pl.requested - 1 ? ` (asked ${fS(r.pl.requested)})` : ""}` : (r.pl.requested > 0 ? "refused (DBR)" : "none"), (r) => r.pl.requested > 0 && r.pl.amount < r.pl.requested - 1 ? C.neg : C.text],
        ["Old loans settled early", (r) => r.settledTotal > 0 ? `${fS(r.settledTotal)} (+${fS(r.settleFees)} fees)` : "none"],
        ["Cash low point", (r) => `${fS(r.minCash)} ${fMon(r.minCashT)}`, (r) => r.minCash < 0 ? C.neg : r.minCash < inp.cashBuffer ? C.brass : C.text, true, true],
        ["Cash when you move in", (r) => fS(r.cashAtCompletion)],
        ["Cash recovered (net of settlements & fees)", (r) => r.recovered != null ? `${fS(r.recovered)} ${fMon(r.recoveredT)}` : "—", () => C.pos],
        ["Months below your cash buffer", (r) => r.belowBufferMonths ? `${r.belowBufferMonths}` : "0", (r) => r.belowBufferMonths ? C.brass : C.text],
        ["Peak monthly instalments (all debt)", (r) => `${fSAR(r.peakInst)}/mo`, null, false, true],
        ["Peak debt burden (instalments ÷ income)", (r) => pct1(r.peakDbr), (r) => r.peakDbr > inp.dbrCap + 0.5 ? C.neg : C.text, false, true],
        ["Profit paid on new debt + settlement fees", (r) => fS(r.newDebtInterest), () => C.neg, true, true],
        ["Total profit paid (incl. existing loans)", (r) => fS(r.totalInterest), () => C.neg],
        [`Debt still owed at Y${inp.horizon}`, (r) => fS(r.endDebt)],
        [`Cash at Y${inp.horizon}`, (r) => fS(r.cashEnd)],
        [`Net worth at Y${inp.horizon} (cash + home after selling costs − debt)`, (r) => fS(r.netWorthEnd), () => C.text, true],
        [renting ? "Renter's net worth (same income, kept renting)" : "Net worth if you don't build (same income, cash invested)", (r) => fS(r.renterEnd)],
        [`Wealth advantage vs ${baseLbl}`, (r) => fS(r.advantage), (r) => r.advantage >= 0 ? C.pos : C.neg, true, true],
        [`Break-even vs ${baseLbl}`, (r) => r.breakEvenMonth != null ? fYr(r.breakEvenMonth) : `> ${inp.horizon} yrs`],
        ["Debt-free", (r) => r.debtFreeT != null ? fMon(r.debtFreeT) : `> Y${inp.horizon}`, null, false, true],
      ];
      const rentalRows = [
        ["Own cash in", (r) => fS(r.cash), null, false, true], ["Personal loan", (r) => fS(r.pl)], ["Mortgage", (r) => fS(r.loanCommit), null, false, true],
        ["Peak equity committed", (r) => fS(r.invested), (r) => r.cashOk ? C.text : C.neg],
        ["Levered IRR", (r) => pct1(r.irr == null ? null : r.irr * 100), (r) => r.irr != null && r.irr * 100 >= inp.discountRate ? C.pos : C.neg, true, true],
        ["Unlevered (property) IRR", (r) => pct1(r.irrUnlev == null ? null : r.irrUnlev * 100)],
        [`NPV @ ${inp.discountRate}%`, (r) => fS(r.npv), (r) => r.npv >= 0 ? C.pos : C.neg, true, true],
        ["Equity multiple", (r) => r.moic == null ? "—" : r.moic.toFixed(2) + "×", null, false, true],
        ["Cash-on-cash (first full year)", (r) => pct1(r.cashOnCash), (r) => r.cashOnCash != null && r.cashOnCash >= 0 ? C.text : C.neg],
        ["Gross yield on cost", (r) => pct1(r.grossYield)], ["Net yield (NOI) on cost", (r) => pct1(r.netYield)],
        ["Min. debt-service cover (DSCR)", (r) => r.dscrMin == null ? "no debt" : r.dscrMin.toFixed(2) + "×", (r) => r.dscrMin == null || r.dscrMin >= 1.2 ? C.text : C.neg, false, true],
        ["Monthly instalment (post-grace)", (r) => fSAR(r.monthlyPayment), null, false, true],
        ["Instalment ÷ income (bank DBR)", (r) => pct1(r.dbr), (r) => r.affordable ? C.text : C.neg, false, true],
        ["Total profit paid to banks", (r) => fS(r.totalInterest), () => C.neg],
        ["Cumulative cash flow after debt", (r) => fS(r.totalCf)],
        ["Net sale proceeds at exit", (r) => fS(r.exitProceeds)],
        ["Payback (equity recovered)", (r) => r.payback ? `Y${r.payback}` : `> Y${inp.exitYear}`],
      ];

      /* ---------- charts (called as functions, not mounted as components) ---------- */
      const LineChartBox = ({ title, keyPrefix, extra, height = 260, note, right }) => (
        <Panel title={title} right={right}>
          <ResponsiveContainer width="100%" height={height}>
            <LineChart data={yearSeries} margin={{ top: 8, right: 12, left: 0, bottom: 0 }}>
              <CartesianGrid stroke={C.line} vertical={false} />
              <XAxis dataKey="year" tick={axisS} tickLine={false} axisLine={{ stroke: C.line }} />
              <YAxis tick={axisT} tickFormatter={fS} tickLine={false} axisLine={false} width={56} />
              <Tooltip formatter={(v) => fSAR(v)} contentStyle={tipStyle} />
              <Legend wrapperStyle={legendStyle} iconType="plainline" />
              <ReferenceLine y={0} stroke={C.sub} />
              {extra}
              {liveIdx.map((i) => <Line key={i} dataKey={`${keyPrefix}${i}`} name={nameOf(m.results[i])} stroke={OPT_COLORS[i]} strokeWidth={2} dot={false} activeDot={{ r: 4, strokeWidth: 2, stroke: C.paper }} />)}
            </LineChart>
          </ResponsiveContainer>
          {note && <Note>{note}</Note>}
        </Panel>
      );

      /* ---------- strategy card (home) ---------- */
      const PlanCard = ({ o, i }) => {
        const r = m.results[i], col = OPT_COLORS[i], edit = !!editing[i];
        const mgW = o.mortgageWhen, plW = o.plWhen;
        const isRec = r && r === lead;
        return (
          <div className="print-section" style={{ background: C.paper, borderLeft: `1px solid ${o.enabled ? col : C.line}`, borderRight: `1px solid ${o.enabled ? col : C.line}`, borderBottom: `1px solid ${o.enabled ? col : C.line}`, borderTop: `4px solid ${col}`, borderRadius: 10, padding: "14px 16px", opacity: o.enabled ? 1 : 0.6, minWidth: 0 }}>
            <div className="flex items-center justify-between" style={{ gap: 8, marginBottom: 8 }}>
              <label className="flex items-center flex-wrap" style={{ gap: 6, cursor: "pointer" }}>
                <input type="checkbox" checked={o.enabled} onChange={(e) => setPlan(i, "enabled", e.target.checked)} />
                <span style={{ fontFamily: MONO, fontSize: 11, color: col, fontWeight: 700, whiteSpace: "nowrap" }}>STRATEGY {i + 1}</span>
                {isRec && <span className="tag" style={{ background: C.ink, color: C.brassLt }}>★ Recommended</span>}
              </label>
              <select className="no-print" value="" onChange={(e) => e.target.value && applyPlanPreset(i, e.target.value)} style={{ fontSize: 11, padding: "3px 6px", maxWidth: 140 }}>
                <option value="">Preset…</option>
                {Object.entries(RE_PLAN_PRESETS).map(([k, pr]) => <option key={k} value={k}>{pr.name}</option>)}
              </select>
            </div>
            <input type="text" value={o.name} onChange={(e) => setPlan(i, "name", e.target.value)} style={{ width: "100%", fontWeight: 700, marginBottom: 8 }} />
            <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.text, lineHeight: 1.5, marginBottom: 10 }}>{describePlan(o, inp, prj, build)}</div>
            {r && <>
              <div style={{ marginBottom: 10 }}><Badge ok={r.feasible} text={r.flags[0] ? r.flags[0].replace(/ — this plan cannot be executed as set\./, "") : null} /></div>
              <div className="grid" style={{ gridTemplateColumns: "1fr 1fr", gap: "10px 12px", marginBottom: 12 }}>
                <Stat label="Cash low point" value={fS(r.minCash)} sub={fCal(r.minCashT)} color={r.minCash < 0 ? C.neg : r.minCash < inp.cashBuffer ? C.brass : C.text} />
                <Stat label="Peak instalments" value={`${fSAR(r.peakInst)}/mo`} sub={`${r.peakDbr.toFixed(0)}% of income`} color={r.peakDbr > inp.dbrCap + 0.5 ? C.neg : C.text} />
                <Stat label="New debt taken" value={fS(newDebtOf(r))} sub={`profit + fees ${fS(r.newDebtInterest)}`} />
                <Stat label={`Wealth vs ${baseLbl}`} value={fS(r.advantage)} sub={`at year ${inp.horizon}`} color={r.advantage >= 0 ? C.pos : C.neg} />
              </div>
            </>}
            <button className="no-print" onClick={() => setEditing((s) => ({ ...s, [i]: !s[i] }))} style={{ ...btn(edit ? C.ink : "transparent", edit ? C.inv : C.sub, edit ? C.ink : C.line), fontSize: 11.5, padding: "5px 10px", width: "100%", justifyContent: "center" }}>{edit ? "Done editing" : "Edit strategy"}</button>
            {edit && <div style={{ marginTop: 12 }}>
              {r && (
                <div style={{ fontFamily: MONO, fontSize: 11.5, background: SOFT, borderRadius: 7, padding: "8px 10px", marginBottom: 12, lineHeight: 1.7 }}>
                  {r.mortgage.type && <Mini k={r.mortgage.type === "construction" ? "Mortgage at start" : `Cash-out mortgage ${fMon(r.mortgage.startedAt)}`} v={`${fS(r.mortgage.commit)} · ${fSAR(r.mortgage.instalment)}/mo`} />}
                  {r.mortgage.type && <Mini k="Bank DBR at approval" v={pct1(r.mortgage.dbrAt)} color={r.mortgage.dbrAt > inp.dbrCap + 0.5 ? C.neg : C.text} />}
                  {r.eq.startedAt !== null && r.eq.amount > 0 && <Mini k={`Existing-property mortgage ${fMon(r.eq.startedAt)}`} v={`${fS(r.eq.amount)} · ${fSAR(r.eq.pmt)}/mo`} />}
                  {r.pl.startedAt !== null && <Mini k={`Personal loan ${fMon(r.pl.startedAt)}`} v={`${fS(r.pl.amount)} · ${fSAR(r.pl.pmt)}/mo`} />}
                  {r.settledTotal > 0 && <Mini k="Old loans settled" v={`${fS(r.settledTotal)} + ${fS(r.settleFees)} fees`} />}
                  {r.recovered != null && <Mini k={`Cash recovered ${fMon(r.recoveredT)}`} v={`${fS(r.recovered)} net`} color={C.pos} />}
                  {r.flags.slice(1).map((f, k) => <div key={k} style={{ color: C.brass, fontFamily: SANS, fontSize: 11, lineHeight: 1.4, marginTop: 4 }}>▲ {f}</div>)}
                </div>
              )}
              <div className="subhead">New-home mortgage</div>
              <Select value={mgW} onChange={(v) => setPlan(i, "mortgageWhen", v)} options={[["none", "No mortgage"], ["start", "At start — construction / purchase mortgage"], ["completion", "At completion — cash-out against the finished home"]]} />
              {mgW === "start" && <>
                {build && <Select value={o.mortgageScope} onChange={(v) => setPlan(i, "mortgageScope", v)} options={[["all", "Finances land + construction"], ["construction", "Finances construction only — land from my cash"]]} />}
                <Slider label={o.mortgageScope === "construction" && build ? "Your cash into the construction" : "Your cash into the project"} value={o.cashInPct} min={0} max={100} step={1} unit="%" onChange={(v) => setPlan(i, "cashInPct", v)} hint={o.mortgageScope === "construction" && build ? `= ${fS((prj.total - prj.land - prj.rett) * o.cashInPct / 100)} on top of the land ${fS(prj.land + prj.rett)}` : `= ${fS(prj.total * o.cashInPct / 100)} · bank requires ≥ ${100 - o.maxLtvPct}%`} />
              </>}
              {mgW === "completion" && <Slider label="Cash-out amount wanted" value={o.cashOutTarget} min={0} max={5000000} step={50000} unit="SAR" onChange={(v) => setPlan(i, "cashOutTarget", v)} hint={o.cashOutTarget === 0 ? `0 = maximum (${inp.cashoutLtv}% of value ≈ ${fS(prj.value0 * Math.pow(1 + inp.appreciation / 100, prj.occupy / 12) * inp.cashoutLtv / 100)})` : `capped at ${inp.cashoutLtv}% of the home's value`} />}

                <Slider label="Mortgage profit rate" value={o.rate} min={0} max={12} step={0.05} unit="%" onChange={(v) => setPlan(i, "rate", v)} hint={(inp.rateQuote === "flat" ? `flat → ≈${reFlatToApr(o.rate, o.tenure * 12).toFixed(2)}% APR · ` : "") + (mgW === "completion" ? "cash-out / owned-property finance usually prices higher" : "fixed for the term")} />
                <Slider label="Mortgage tenure" value={o.tenure} min={1} max={30} step={1} unit="yrs" onChange={(v) => setPlan(i, "tenure", v)} />
                <Adv title="Mortgage details: LTV, grace, REDF subsidy, fees, prepayment">
                  {mgW === "start" && <Slider label="Bank's max LTV" value={o.maxLtvPct} min={50} max={100} step={5} unit="%" onChange={(v) => setPlan(i, "maxLtvPct", v)} hint="90% first home (SAMA)" />}
                  {mgW === "start" && build && <Select label="Profit during construction grace" value={o.graceMode} onChange={(v) => setPlan(i, "graceMode", v)} options={[["capitalize", "added to the loan"], ["interestOnly", "paid monthly"]]} />}
                  <Slider label="REDF-subsidised portion" value={o.subsidyCap} min={0} max={1000000} step={50000} unit="SAR" onChange={(v) => setPlan(i, "subsidyCap", v)} hint={mgW === "completion" ? "Sakani support does not apply to cash-out finance — keep 0 unless confirmed" : "Sakani bears the profit on the first 500K for eligible citizens"} />
                  {o.subsidyCap > 0 && <Slider label="Subsidy on that portion" value={o.subsidyPct} min={0} max={100} step={5} unit="%" onChange={(v) => setPlan(i, "subsidyPct", v)} />}
                  <Slider label="Bank fees (upfront)" value={o.feesPct} min={0} max={3} step={0.25} unit="% of loan" onChange={(v) => setPlan(i, "feesPct", v)} />
                  <Slider label="Extra prepayment" value={o.extraMo} min={0} max={30000} step={500} unit="SAR/mo" onChange={(v) => setPlan(i, "extraMo", v)} />
                </Adv>
              </>}
              <div className="subhead">Existing property (equity release)</div>
              <Select value={o.eqWhen} onChange={(v) => setPlan(i, "eqWhen", v)} options={[["none", "Not used"], ["start", "At start — fund the build / clear old loans"], ["completion", "At completion — recover cash"], ["month", "At a month I choose"]]} hint={inp.ownedValue > 0 ? `you own a ${fS(inp.ownedValue)} property (set in step 1)` : "set the property's value in step 1 first"} />
              {o.eqWhen === "month" && <Slider label="Month" value={o.eqMonth} min={0} max={inp.horizon * 12} step={1} unit="" onChange={(v) => setPlan(i, "eqMonth", v)} hint={`${fCal(o.eqMonth)} · construction completes ${fCal(prj.occupy)}`} />}
              {o.eqWhen !== "none" && <>
                <Slider label="Amount wanted" value={o.eqAmount} min={0} max={6000000} step={50000} unit="SAR" onChange={(v) => setPlan(i, "eqAmount", v)} hint={o.eqAmount === 0 ? `0 = maximum (${inp.ownedLtv}% of ${fS(inp.ownedValue)} = ${fS(inp.ownedValue * inp.ownedLtv / 100)})` : `capped at ${inp.ownedLtv}% of value and by the debt-burden test`} />
                <Slider label="Rate" value={o.eqRate} min={0} max={12} step={0.05} unit="%" onChange={(v) => setPlan(i, "eqRate", v)} hint={(inp.rateQuote === "flat" ? `flat → ≈${reFlatToApr(o.eqRate, o.eqTenure * 12).toFixed(2)}% APR · ` : "") + "finance against an owned property; no REDF support"} />
                <Slider label="Tenure" value={o.eqTenure} min={1} max={30} step={1} unit="yrs" onChange={(v) => setPlan(i, "eqTenure", v)} />
                <Slider label="Bank fees (upfront)" value={o.eqFeesPct} min={0} max={3} step={0.25} unit="% of loan" onChange={(v) => setPlan(i, "eqFeesPct", v)} />
              </>}
              <div className="subhead">Personal loan</div>
              <Select value={plW} onChange={(v) => setPlan(i, "plWhen", v)} options={[["none", "No personal loan"], ["start", "At start — to fund the build"], ["completion", "At completion — to recover cash"], ["month", "At a month I choose"]]} />
              {plW === "month" && <Slider label="Month" value={o.plMonth} min={0} max={inp.horizon * 12} step={1} unit="" onChange={(v) => setPlan(i, "plMonth", v)} hint={`${fCal(o.plMonth)} · construction completes ${fCal(prj.occupy)}`} />}
              {plW !== "none" && <>
                <Slider label="Amount wanted" value={o.plAmount} min={0} max={1500000} step={25000} unit="SAR" onChange={(v) => setPlan(i, "plAmount", v)} hint="sized down to what the debt-burden cap allows" />
                <Slider label="Rate" value={o.plRate} min={0} max={15} step={0.25} unit="%" onChange={(v) => setPlan(i, "plRate", v)} hint={inp.rateQuote === "flat" ? `flat → ≈${reFlatToApr(o.plRate, o.plTenure * 12).toFixed(2)}% APR` : ""} />
                <Slider label="Tenure" value={o.plTenure} min={1} max={7} step={1} unit="yrs" onChange={(v) => setPlan(i, "plTenure", v)} />
              </>}
              <div className="subhead">Existing loans</div>
              <Select value={o.settlePolicy} onChange={(v) => setPlan(i, "settlePolicy", v)} options={[["none", "Keep them all (new debt sized to what's left)"], ["asNeeded", "Settle just enough to pass each bank test"], ["all", "Settle everything before the first new facility"]]} hint="the loans themselves are edited in step 1" />
            </div>}
          </div>
        );
      };

      /* ---------- option card (rental) ---------- */
      const OptionCard = ({ o, i }) => {
        const r = m.results[i], col = OPT_COLORS[i], edit = !!editing[i];
        const ok = r && r.affordable && r.cashOk && r.ltvOk;
        const flag = r ? (!r.ltvOk ? `${fS(r.fundingGap)} above the ${o.maxLtvPct}% LTV ceiling` : !r.cashOk ? `needs ${fS(r.cashNeeded)} cash, you have ${fS(inp.cashAvailable)}` : !r.affordable ? `instalment is ${r.dbr.toFixed(0)}% of income (cap ${inp.dbrCap}%)` : null) : null;
        return (
          <div className="print-section" style={{ background: C.paper, borderLeft: `1px solid ${o.enabled ? col : C.line}`, borderRight: `1px solid ${o.enabled ? col : C.line}`, borderBottom: `1px solid ${o.enabled ? col : C.line}`, borderTop: `4px solid ${col}`, borderRadius: 10, padding: "14px 16px", opacity: o.enabled ? 1 : 0.6, minWidth: 0 }}>
            <div className="flex items-center justify-between" style={{ gap: 8, marginBottom: 8 }}>
              <label className="flex items-center" style={{ gap: 6, cursor: "pointer" }}>
                <input type="checkbox" checked={o.enabled} onChange={(e) => setOpt(i, "enabled", e.target.checked)} />
                <span style={{ fontFamily: MONO, fontSize: 11, color: col, fontWeight: 700 }}>OPTION {i + 1}</span>
                {r && r === lead && <span className="tag" style={{ background: C.ink, color: C.brassLt }}>★ Best</span>}
              </label>
              <select className="no-print" value="" onChange={(e) => e.target.value && applyPreset(i, e.target.value)} style={{ fontSize: 11, padding: "3px 6px", maxWidth: 140 }}>
                <option value="">Preset…</option>
                {Object.entries(RE_OPTION_PRESETS).map(([k, pr]) => <option key={k} value={k}>{pr.name}</option>)}
              </select>
            </div>
            <input type="text" value={o.name} onChange={(e) => setOpt(i, "name", e.target.value)} style={{ width: "100%", fontWeight: 700, marginBottom: 8 }} />
            <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.text, lineHeight: 1.5, marginBottom: 10 }}>{describeOption(o, inp, prj)}</div>
            {r && <>
              <div style={{ marginBottom: 10 }}><Badge ok={ok} text={flag} /></div>
              <div className="grid" style={{ gridTemplateColumns: "1fr 1fr", gap: "10px 12px", marginBottom: 12 }}>
                <Stat label="Levered IRR" value={pct1(r.irr == null ? null : r.irr * 100)} sub={`unlevered ${pct1(r.irrUnlev == null ? null : r.irrUnlev * 100)}`} color={r.irr != null && r.irr * 100 >= inp.discountRate ? C.pos : C.neg} />
                <Stat label={`NPV @ ${inp.discountRate}%`} value={fS(r.npv)} sub={`equity multiple ${r.moic ? r.moic.toFixed(2) + "×" : "—"}`} color={r.npv >= 0 ? C.pos : C.neg} />
                <Stat label="Cash you must bring" value={fS(r.cashNeeded)} sub={`you have ${fS(inp.cashAvailable)}`} color={r.cashOk ? C.text : C.neg} />
                <Stat label="Instalment" value={`${fSAR(r.monthlyPayment)}/mo`} sub={`${r.dbr.toFixed(0)}% of income`} color={r.affordable ? C.text : C.neg} />
              </div>
            </>}
            <button className="no-print" onClick={() => setEditing((s) => ({ ...s, [i]: !s[i] }))} style={{ ...btn(edit ? C.ink : "transparent", edit ? C.inv : C.sub, edit ? C.ink : C.line), fontSize: 11.5, padding: "5px 10px", width: "100%", justifyContent: "center" }}>{edit ? "Done editing" : "Edit option"}</button>
            {edit && <div style={{ marginTop: 12 }}>
              <div className="subhead">Capital stack</div>
              <Slider label="Own cash" value={o.cashPct} min={0} max={100} step={1} unit="% of cost" onChange={(v) => setOpt(i, "cashPct", v)} hint={`= ${fS(prj.total * o.cashPct / 100)}`} />
              <Slider label="Personal loan" value={o.plAmount} min={0} max={1500000} step={25000} unit="SAR" onChange={(v) => setOpt(i, "plAmount", v)} />
              {o.plAmount > 0 && <><Slider label="Personal-loan rate" value={o.plRate} min={0} max={15} step={0.25} unit="%" onChange={(v) => setOpt(i, "plRate", v)} /><Slider label="Personal-loan tenure" value={o.plTenure} min={1} max={7} step={1} unit="yrs" onChange={(v) => setOpt(i, "plTenure", v)} /></>}
              <div className="subhead">Mortgage</div>
              <Slider label="Mortgage profit rate" value={o.rate} min={0} max={12} step={0.05} unit="%" onChange={(v) => setOpt(i, "rate", v)} />
              <Slider label="Mortgage tenure" value={o.tenure} min={1} max={30} step={1} unit="yrs" onChange={(v) => setOpt(i, "tenure", v)} />
              <Slider label="Grace period" value={o.graceMonths} min={0} max={36} step={1} unit="months" onChange={(v) => setOpt(i, "graceMonths", v)} hint={build ? `at least the ${prj.bm}-month build` : "0 for a ready property"} />
              <Adv title="Mortgage details: grace profit, REDF subsidy, fees, prepayment, LTV">
                <Select label="Profit during grace" value={o.graceMode} onChange={(v) => setOpt(i, "graceMode", v)} options={[["capitalize", "added to the loan"], ["interestOnly", "paid monthly"]]} />
                <Slider label="Subsidised portion (REDF)" value={o.subsidyCap} min={0} max={1000000} step={50000} unit="SAR" onChange={(v) => setOpt(i, "subsidyCap", v)} />
                {o.subsidyCap > 0 && <Slider label="Subsidy on that portion" value={o.subsidyPct} min={0} max={100} step={5} unit="%" onChange={(v) => setOpt(i, "subsidyPct", v)} />}
                <Slider label="Bank fees (upfront)" value={o.feesPct} min={0} max={3} step={0.25} unit="% of loan" onChange={(v) => setOpt(i, "feesPct", v)} />
                <Slider label="Extra prepayment" value={o.extraMo} min={0} max={30000} step={500} unit="SAR/mo" onChange={(v) => setOpt(i, "extraMo", v)} />
                <Slider label="Bank's max LTV" value={o.maxLtvPct} min={50} max={100} step={5} unit="%" onChange={(v) => setOpt(i, "maxLtvPct", v)} />
              </Adv>
            </div>}
          </div>
        );
      };

      /* ---------- step footer ---------- */
      const StepFooter = () => (
        <div className="flex items-center justify-between no-print" style={{ gap: 10, marginTop: 22, paddingTop: 14, borderTop: `1px solid ${C.line}` }}>
          <button onClick={() => go(stepI - 1)} disabled={stepI === 0} style={{ ...btn("transparent", stepI === 0 ? C.line : C.sub, C.line), opacity: stepI === 0 ? 0.5 : 1 }}>← {stepI > 0 ? steps[stepI - 1][1] : "Previous"}</button>
          <span style={{ fontFamily: SANS, fontSize: 11.5, color: C.sub }}>Step {stepI + 1} of {steps.length}</span>
          <button onClick={() => go(stepI + 1)} disabled={stepI === steps.length - 1} style={{ ...btn(C.brass, C.ink), opacity: stepI === steps.length - 1 ? 0.5 : 1 }}>{stepI < steps.length - 1 ? steps[stepI + 1][1] : "Done"} →</button>
        </div>
      );

      /* ---------- answer card ---------- */
      const blockers = [];
      if (home) {
        if (bestF) { bestF.flags.forEach((f) => blockers.push({ warn: true, text: f })); if (best && best !== bestF) blockers.push({ warn: false, text: `${best.plan.name} would leave you ${fS(best.advantage - bestF.advantage)} richer but cannot be executed: ${best.flags[0]}` }); }
        else liveIdx.forEach((i) => { const r = m.results[i]; blockers.push({ warn: true, text: `Strategy ${i + 1} (${r.plan.name}): ${r.flags[0] || "not executable"}` }); });
        if (household.dbrRoom <= 0) blockers.push({ warn: true, text: `Your existing instalments (${fSAR(household.existingInst)}/mo) already exceed the bank's ${inp.dbrCap}% debt-burden cap — no new facility is possible without settling loans.` });
        if (household.savings < 0) blockers.push({ warn: true, text: `You spend ${fSAR(-household.savings)}/mo more than you earn (income − living − rent − instalments).` });
        if (sweepRec && !sweepRec.best) blockers.push({ warn: true, text: "No construction start within the next 5 years makes the recommended strategy executable." });
      } else if (lead) {
        if (!lead.ltvOk) blockers.push({ warn: true, text: `${fS(lead.fundingGap)} of the mortgage sits above the bank's ${lead.opt.maxLtvPct}% LTV ceiling.` });
        if (!lead.cashOk) blockers.push({ warn: true, text: `Needs ${fS(lead.cashNeeded)} cash; you can commit ${fS(inp.cashAvailable)}.` });
        if (!lead.affordable) blockers.push({ warn: true, text: `Instalment is ${lead.dbr.toFixed(0)}% of income (cap ${inp.dbrCap}%).` });
        if (bestF && bestF !== best) blockers.push({ warn: false, text: `${best.opt.name} ranks higher by IRR but fails your cash, LTV or debt-burden limits.` });
      }
      const startBest = sweepRec && sweepRec.best;
      const startNow = startBest && startBest.delay <= Math.max(inp.buildStart, inp.landMonth);

      const Answer = () => (
        <div className="print-section" style={{ background: C.paper, borderTop: `1px solid ${C.line}`, borderRight: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}`, borderLeft: `6px solid ${m.vColor}`, borderRadius: 10, padding: "18px 20px", marginBottom: 14 }}>
          <div style={{ fontFamily: SANS, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.16em", textTransform: "uppercase", color: C.brass, marginBottom: 6 }}>The answer · <span style={{ color: m.vColor }}>{m.verdict}</span></div>
          {!lead ? <div style={{ fontFamily: SANS, fontSize: 15, color: C.text }}>Enable at least one {home ? "strategy" : "option"} in step 3.</div> : home ? <>
            <div style={{ fontFamily: SANS, fontSize: 17, fontWeight: 700, color: C.text, lineHeight: 1.35, letterSpacing: "-0.01em" }}>
              {bestF ? <>Finance it with <span style={{ borderBottom: `3px solid ${OPT_COLORS[recIdx]}` }}>{bestF.plan.name}</span>{startBest ? <>, and {startNow ? <>start as planned in <b>{fCal(Math.max(inp.buildStart, inp.landMonth))}</b></> : <>wait until <b>{fCal(startBest.delay)}</b> to start building</>}</> : null}.</>
                   : <>None of the enabled strategies works with {fS(inp.cashAvailable)} of cash and {fSAR(household.dbrRoom)}/mo of debt-burden room.</>}
            </div>
            {bestF && <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.sub, marginTop: 6, lineHeight: 1.5, maxWidth: 900 }}>{describePlan(bestF.plan, inp, prj, build)} Over {inp.horizon} years this leaves you <b style={{ color: bestF.advantage >= 0 ? C.pos : C.neg }}>{fS(Math.abs(bestF.advantage))} {bestF.advantage >= 0 ? "better" : "worse"} off than {baseLbl}</b>{renting ? " the same home" : " (staying where you live now, cash kept invested)"}.{startBest && !startNow ? ` Starting ${fCal(startBest.delay)} means moving in ${fCal(startBest.occupy)}.` : ""}</div>}
            {bestF && <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginTop: 14 }}>
              <Kpi label="Cash low point" value={fS(bestF.minCash)} sub={`${fCal(bestF.minCashT)} · buffer ${fS(inp.cashBuffer)}`} accent={bestF.minCash < 0 ? C.neg : bestF.minCash < inp.cashBuffer ? C.brass : C.pos} />
              <Kpi label="Peak monthly instalments" value={`${fSAR(bestF.peakInst)}`} sub={`${bestF.peakDbr.toFixed(0)}% of income · bank cap ${inp.dbrCap}%`} accent={bestF.peakDbr > inp.dbrCap + 0.5 ? C.neg : C.text} />
              <Kpi label="New debt taken" value={fS(newDebtOf(bestF))} sub={`costs ${fS(bestF.newDebtInterest)} in profit & fees`} accent={C.text} />
              <Kpi label={`Wealth vs ${baseLbl}`} value={fS(bestF.advantage)} sub={`at year ${inp.horizon} · break-even ${bestF.breakEvenMonth != null ? fYr(bestF.breakEvenMonth) : `> ${inp.horizon} yrs`}`} accent={bestF.advantage >= 0 ? C.pos : C.neg} />
              {startBest && <Kpi label="Earliest workable start" value={fCal(startBest.delay)} sub={`move in ${fCal(startBest.occupy)} · cost ${fS(startBest.total)}`} accent={C.brass} />}
            </div>}
          </> : <>
            <div style={{ fontFamily: SANS, fontSize: 17, fontWeight: 700, color: C.text, lineHeight: 1.35 }}>Best capital stack: <span style={{ borderBottom: `3px solid ${OPT_COLORS[recIdx]}` }}>{lead.opt.name}</span> — {pct1(lead.irr == null ? null : lead.irr * 100)} levered IRR vs {pct1(lead.irrUnlev == null ? null : lead.irrUnlev * 100)} unlevered.</div>
            <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.sub, marginTop: 6, lineHeight: 1.5 }}>{describeOption(lead.opt, inp, prj)}</div>
            <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginTop: 14 }}>
              <Kpi label="Cash you must bring" value={fS(lead.cashNeeded)} sub={`you have ${fS(inp.cashAvailable)}`} accent={lead.cashOk ? C.pos : C.neg} />
              <Kpi label="Monthly instalment" value={fSAR(lead.monthlyPayment)} sub={`${lead.dbr.toFixed(0)}% of income · cap ${inp.dbrCap}%`} accent={lead.affordable ? C.text : C.neg} />
              <Kpi label="Total profit paid to banks" value={fS(lead.totalInterest)} sub={`${fS(lead.mortgageInterest)} mortgage + ${fS(lead.plInterestTotal)} personal loan`} />
              <Kpi label={`NPV @ ${inp.discountRate}%`} value={fS(lead.npv)} sub={`equity multiple ${lead.moic ? lead.moic.toFixed(2) + "×" : "—"}`} accent={lead.npv >= 0 ? C.pos : C.neg} />
            </div>
          </>}
          {blockers.length > 0 && <div style={{ marginTop: 14, borderTop: `1px dashed ${C.line}`, paddingTop: 10 }}>
            <div style={{ fontFamily: SANS, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: C.sub, marginBottom: 6 }}>Watch out for</div>
            {blockers.map((b, k) => <div key={k} className="flex items-start" style={{ gap: 8, fontFamily: SANS, fontSize: 12.5, color: C.text, lineHeight: 1.5, marginBottom: 4 }}><AlertTriangle size={14} color={b.warn ? C.neg : C.brass} style={{ flex: "none", marginTop: 3 }} /><span>{b.text}</span></div>)}
          </div>}
          <div className="flex flex-wrap" style={{ gap: 14, marginTop: 12, fontFamily: SANS, fontSize: 11.5, color: C.sub }}>
            <span>All-in cost <b style={{ fontFamily: MONO, color: C.text }}>{fS(prj.total)}</b></span>
            <span>Value at completion <b style={{ fontFamily: MONO, color: C.text }}>{fS(prj.value0)}</b></span>
            {home && <span>Debt-burden room today <b style={{ fontFamily: MONO, color: household.dbrRoom > 0 ? C.text : C.neg }}>{fSAR(household.dbrRoom)}/mo</b></span>}
            {home && <span>Monthly savings today <b style={{ fontFamily: MONO, color: household.savings >= 0 ? C.text : C.neg }}>{fSAR(household.savings)}</b></span>}
          </div>
        </div>
      );

      /* ---------- step panels ---------- */
      const StepYou = () => (
        <div>
          <SectionHeader eyebrow={`Step ${steps.findIndex((s) => s[0] === "you") + 1} · ${home ? "You" : "Letting & you"}`} title={home ? "Income, spending, cash — and the loans you already carry" : "What the property earns, and what the bank sees"}
            sub={home ? "Every new facility passes one test: all monthly instalments (old loans + new) ÷ income must stay under the bank's cap. Existing loans therefore decide how much you can borrow. The two loans below are examples — replace them with yours." : "Rent, vacancy and management set the property's income; your income and cash set what the bank will lend."} />
          <div className={home ? "two-col" : "grid"} style={home ? null : { gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 300px), 1fr))", gap: 16 }}>
            {home ? <>
              <Card n="A" title="Household">
                <Slider label="Monthly income (bank-recognised)" value={inp.income} min={10000} max={200000} step={1000} unit="SAR" onChange={(v) => set("income", v)} />
                <Slider label="Living expenses (excl. rent & loans)" value={inp.livingExpenses} min={3000} max={80000} step={500} unit="SAR/mo" onChange={(v) => set("livingExpenses", v)} />
                <Slider label="Rent you pay today" value={inp.rentNow} min={0} max={40000} step={500} unit="SAR/mo" onChange={(v) => set("rentNow", v)} hint="paid while building. Set 0 if you live in your own home — the comparison then becomes 'don't build'" />
                <Slider label="Cash you have today" value={inp.cashAvailable} min={0} max={6000000} step={50000} unit="SAR" onChange={(v) => set("cashAvailable", v)} />
                <Slider label="Cash buffer you want to keep" value={inp.cashBuffer} min={0} max={1000000} step={25000} unit="SAR" onChange={(v) => set("cashBuffer", v)} hint="dipping below is flagged; going negative makes a strategy non-executable" />
                <Slider label="Property you already own — market value" value={inp.ownedValue} min={0} max={15000000} step={100000} unit="SAR" onChange={(v) => set("ownedValue", v)} hint={inp.ownedValue > 0 ? `banks would lend up to ${fS(inp.ownedValue * inp.ownedLtv / 100)} against it` : "0 if none"} />
                <Adv title="Advanced: bank rules, rent growth, rate quoting">
                  <Slider label="Debt-burden cap (bank)" value={inp.dbrCap} min={30} max={70} step={5} unit="% of income" onChange={(v) => set("dbrCap", v)} hint="SAMA responsible-lending norm: 55% (65% for higher incomes)" />
                  <Slider label="Rent growth" value={inp.rentGrowth} min={0} max={10} step={0.5} unit="%/yr" onChange={(v) => set("rentGrowth", v)} />
                  <Slider label="LTV banks lend against your existing property" value={inp.ownedLtv} min={30} max={90} step={5} unit="%" onChange={(v) => set("ownedLtv", v)} />
                  <Slider label="Cash-out LTV on the finished home" value={inp.cashoutLtv} min={40} max={90} step={5} unit="% of value" onChange={(v) => set("cashoutLtv", v)} hint="mortgage raised against an owned, completed home" />
                  <Slider label="Bank ceiling on one personal loan" value={inp.plCap} min={100000} max={3000000} step={50000} unit="SAR" onChange={(v) => set("plCap", v)} />
                  <Slider label="Early-settlement fee" value={inp.settleFeeMonths} min={0} max={3} step={1} unit="months' profit" onChange={(v) => set("settleFeeMonths", v)} hint="SAMA cap: the next 3 months' term cost" />
                  <Select label="Rates of NEW facilities are entered as" value={inp.rateQuote} onChange={(v) => set("rateQuote", v)} options={[["apr", "APR — reducing balance"], ["flat", "Flat 'hamish' % per year (KSA bank quotes)"]]} />
                </Adv>
              </Card>
              <Card n="B" title="Existing loans (as the bank sees them)">
                <LoanTable loans={inp.existingLoans} onChange={(l) => set("existingLoans", l)} income={inp.income} dbrCap={inp.dbrCap} />
                <Note>Untick "May settle?" to protect cheap debt from early settlement. "Settle in month" plans a settlement from cash on a date you choose, in every strategy.</Note>
              </Card>
            </> : <>
              <Card n="A" title="Letting">

                      ["Cash flow after debt", "cf", "head"], ["Equity cash flow (incl. exit)", "lev", "head"], ["Debt outstanding (year-end)", "bal", "plain"], ["Property value", "value", "plain"], ["DSCR", "dscr", "ratio"],
